const SZ=D.sizing;
function szFill(cls,pct){return `<div class="szfill ${cls}" style="width:${Math.max(1.5,Math.min(100,pct))}%"></div>`;}
function szBar(kind,field,val,band,ceil){
  const b=SZ.bands[kind][field==='desc'?'desc_c':'body_c'];
  const scaleMax=ceil?ceil.lim:Math.max(b.hi*1.15,val*1.05);
  let cls=band, pct=val/scaleMax*100;
  if(ceil&&ceil.pct>=95) cls='crit';
  const marks=[];
  if(ceil) marks.push(`<span class="szmark" style="left:100%" data-l="${ceil.lim.toLocaleString()} spec"></span>`);
  else marks.push(`<span class="szmark" style="left:${Math.min(99,b.hi/scaleMax*100)}%" data-l="peer ${b.hi.toLocaleString()}"></span>`);
  const label=ceil?`${val.toLocaleString()} · ${ceil.pct}%`:val.toLocaleString()+" ch";
  return `<div class="szrow"><span class="szlab">${field}</span>
    <div class="szbar">${szFill(cls,pct)}${marks.join("")}</div>
    <span class="szval">${label}</span><span class="szchip ${cls}">${cls==='crit'?'at ceiling':cls}</span></div>`;
}
function sizeBlock(r,kind){
  if(!r.m) return "";
  const m=r.m, ce=m.ceil||{};
  let rows=szBar(kind,'desc',m.desc,m.dband,ce.desc)+szBar(kind,'body',m.body,m.bband,ce.body);
  const notes=[];
  if(ce.body) notes.push(`Spec ceiling ${ce.body.lim.toLocaleString()} characters on an agent prompt body (agent-roster). This one uses <b>${ce.body.pct}%</b>.`);
  if(ce.desc) notes.push(`Spec ceiling ${ce.desc.lim.toLocaleString()} characters on a skill description. This one uses <b>${ce.desc.pct}%</b>.`);
  notes.push(`<b>Peer band</b> is this library's own distribution, Tukey 1.5&times;IQR: ${kind} bodies sit between ${SZ.bands[kind].body_c.lo.toLocaleString()} and ${SZ.bands[kind].body_c.hi.toLocaleString()} characters, median ${SZ.bands[kind].body_c.med.toLocaleString()}. Outside that is flagged, not wrong.`);
  if(kind==='skills') notes.push(`The description is <b>always loaded</b> — both harnesses list every skill's name and description in the system prompt. The body is read only when the skill is invoked.`);
  return `<div class="section"><h3>Size</h3>${rows}<div class="sznote">${notes.join("<br>")}</div></div>`;
}
function renderSizes(){
  const T=SZ.totals;
  const all=[];
  [['skills',S],['agents',A],['commands',C]].forEach(([k,src])=>Object.keys(src).forEach(s=>{
    const r=src[s]; if(r.m) all.push({kind:k,slug:s,r});}));
  const flagged=all.filter(x=>x.r.m.bband!=='optimal'||x.r.m.dband!=='optimal');
  const ceilPress=all.filter(x=>x.r.m.ceil&&x.r.m.ceil.body).sort((a,b)=>b.r.m.ceil.body.pct-a.r.m.ceil.body.pct);
  const dmax=Math.max(0,...Object.values(S).map(x=>x.m&&x.m.ceil&&x.m.ceil.desc?x.m.ceil.desc.pct:0));
  const route=k=>k==='skills'?'skill':k==='agents'?'agent':'command';
  const item=x=>{const m=x.r.m,ce=m.ceil||{},b=SZ.bands[x.kind].body_c;
    const scaleMax=ce.body?ce.body.lim:Math.max(b.hi*1.15,m.body*1.05);
    let cls=m.bband; if(ce.body&&ce.body.pct>=95)cls='crit';
    return `<div class="szitem"><a href="#/${route(x.kind)}/${x.slug}">${esc(x.slug)}</a>
      <div class="szbar">${szFill(cls,m.body/scaleMax*100)}${ce.body?`<span class="szmark" style="left:100%"></span>`:`<span class="szmark" style="left:${Math.min(99,b.hi/scaleMax*100)}%"></span>`}</div>
      <span class="szval">${m.body.toLocaleString()} ch</span><span class="szchip ${cls}">${cls==='crit'?'at ceiling':cls}</span></div>`;};
  $("#main").innerHTML=`<section class="page"><div class="wrap">
   <div class="kick"><span class="badge">measured from disk</span></div>
   <h1>Size &amp; budget</h1>
   <p class="desc">What every artefact costs, against two yardsticks: the hard ceilings the specs state, and the peer band this library's own distribution implies.</p>
   <div class="szhead">
     <div class="szcard"><b>${T.always_loaded.toLocaleString()}</b><span>always-loaded chars</span></div>
     <div class="szcard"><b>~${T.always_loaded_tokens.toLocaleString()}</b><span>tokens every session</span></div>
     <div class="szcard"><b>${T.skill_bodies.toLocaleString()}</b><span>skill bodies, on demand</span></div>
     <div class="szcard"><b>${T.agent_bodies.toLocaleString()}</b><span>agent prompts</span></div>
     <div class="szcard"><b>${T.command_bodies.toLocaleString()}</b><span>command wrappers</span></div>
   </div>
   <div class="section"><h3>Hard ceilings under pressure</h3>
     ${ceilPress.slice(0,4).map(item).join("")}
     <div class="sznote">Agent prompt bodies carry a spec ceiling — ${SZ.ceilings.agents.body.toLocaleString()} characters, <b>agent-roster</b>. The marker sits at the limit, so a full bar is a violation. Skill descriptions carry one too — ${SZ.ceilings.skills.desc.toLocaleString()} characters, <b>skill-library</b> — and the worst uses <b>${dmax}%</b> of it; names are capped at ${SZ.ceilings.skills.name.toLocaleString()} and are nowhere near.</div></div>
   <div class="section"><h3>${flagged.length} outside the peer band</h3>
     <div class="sznote" style="margin:0 0 10px">Flagged against this library's own distribution, not an external ideal. <b>Over</b> is fatter than 1.5&times;IQR above the third quartile; <b>under</b> is thinner than the same distance below the first.</div>
     ${flagged.sort((a,b)=>b.r.m.body-a.r.m.body).map(item).join("")}</div>
   <div class="section"><h3>Everything, by body size</h3>
     <div class="sztabs">${['all','skills','agents','commands'].map(k=>`<button type=button data-k="${k}" onclick="szTab('${k}')" class="${k==='all'?'on':''}">${k}</button>`).join("")}</div>
     <div class="szlist" id="szall">${all.sort((a,b)=>b.r.m.body-a.r.m.body).map(x=>`<div data-kind="${x.kind}">${item(x)}</div>`).join("")}</div></div>
  </div></section>`;
  setCrumbs([["Overview",""],["Size & budget",null]]);
}
function szTab(k){
  document.querySelectorAll('.sztabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  document.querySelectorAll('#szall > div').forEach(d=>{d.style.display=(k==='all'||d.dataset.kind===k)?'':'none';});
}
function render404(){$("#main").innerHTML=`<section class="page"><div class="wrap"><h1>Not found</h1><p class="desc"><a href="#">Back to the map</a></p></div></section>`;}
const clip=(s,n)=>{s=s||"";return s.length>n?s.slice(0,n).replace(/\s+\S*$/,"")+"…":s;};

/* ---------- search ---------- */
const INDEX=[
 ...Object.values(A).map(a=>({t:"agent",slug:a.slug,name:a.name,sub:PILL[a.pillar].label+" · agent",desc:a.description,hash:"/agent/"+a.slug,accent:a.accent})),
 ...Object.values(S).map(s=>({t:"skill",slug:s.slug,name:s.slug,sub:F[s.family].label+(s.ported?" · ported":" · authored"),desc:s.description,hash:"/skill/"+s.slug,accent:F[s.family].accent})),
 ...Object.values(F).map(f=>({t:"family",slug:f.key,name:f.label,sub:f.members.length+" skills",desc:f.blurb,hash:"/family/"+f.key,accent:f.accent})),
 ...Object.values(C).map(c=>({t:"command",slug:c.slug,name:"/"+c.slug,sub:"command",desc:c.description,hash:"/command/"+c.slug,accent:"var(--mut)"})),
];
function hl(txt,q){if(!q)return esc(clip(txt,90));const i=txt.toLowerCase().indexOf(q);if(i<0)return esc(clip(txt,90));
 const a=Math.max(0,i-24);return (a>0?"…":"")+esc(txt.slice(a,i))+"<mark>"+esc(txt.slice(i,i+q.length))+"</mark>"+esc(clip(txt.slice(i+q.length),50));}
function runSearch(q){q=q.trim().toLowerCase();
 if(!q){if(location.hash==="#/search")go("");return;}
 const hits=INDEX.map(x=>{const hay=(x.name+" "+x.slug+" "+x.sub+" "+x.desc).toLowerCase();
   let sc=-1; if(x.slug.toLowerCase()===q)sc=100; else if(x.name.toLowerCase().includes(q))sc=60; else if(x.slug.toLowerCase().includes(q))sc=55; else if(hay.includes(q))sc=20;
   return {x,sc};}).filter(h=>h.sc>0).sort((a,b)=>b.sc-a.sc);
 const groups={agent:[],skill:[],family:[],command:[]};hits.forEach(h=>groups[h.x.t].push(h.x));
 const LBL={agent:"Agents",skill:"Skills",family:"Families",command:"Commands"};
 let html=`<div class="results"><div class="wrap"><div class="eyebrow">${hits.length} result${hits.length==1?'':'s'} for “${esc(q)}”</div>`;
 for(const t of ["agent","skill","family","command"]){if(!groups[t].length)continue;
   html+=`<div class="rg"><div class="eyebrow" style="margin-bottom:6px">${LBL[t]} · ${groups[t].length}</div>`;
   html+=groups[t].map(x=>`<a class="rc" href="#${x.hash}"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${x.accent};flex:none"></span><span class="nm ${t=='skill'||t=='command'?'mono':''}">${esc(x.name)}</span><span class="rd">${hl(x.desc,q)}</span></a>`).join("");
   html+=`</div>`;}
 if(!hits.length)html+=`<p class="empty" style="padding:20px 0">No matches. Try an agent name, a skill slug, or a technique keyword.</p>`;
 $("#main").innerHTML=html+`</div></div>`;
 setCrumbs([["Overview",""],["Search",null]]);
}

/* ---------- crumbs + nav + router ---------- */
function setCrumbs(items){$("#crumbs").innerHTML=items.map((it,i)=>{
  const [label,h]=it;const last=i===items.length-1;
  const link=h===null?`<span>${esc(label)}</span>`:`<a href="#${h}">${esc(label)}</a>`;
  return (i?`<span class="sep">/</span>`:"")+link;}).join("");}
function buildNav(){
 const g=(t)=>`<div class="grp">${t}</div>`;
 let h=`<a href="#" data-h="">◆ Overview — the map</a>`;
 for(const pk of Object.keys(D.pillars)){ const P=D.pillars[pk]; h+=g(`${P.label} · ${P.tagline}`); h+=P.order.map(s=>navA(s)).join(""); }
 h+=g("Skill families");
 h+=D.family_order.map(k=>{const f=F[k];return `<a href="#/family/${k}" data-h="/family/${k}"><span class="dot" style="background:${f.accent}"></span>${esc(f.label)}<span class="cnt">${f.members.length}</span></a>`;}).join("");
 h+=g("Browse");
 h+=`<a href="#/skills" data-h="/skills">▤ All skills<span class="cnt">${D.stats.skills}</span></a>`;
 h+=`<a href="#/commands" data-h="/commands">▤ All commands<span class="cnt">${D.stats.commands}</span></a>`;
 h+=`<a href="#/sizes" data-h="/sizes">▤ Size &amp; budget</a>`;
 $("#nav").innerHTML=h;
}
function navA(s){const a=A[s];return `<a href="#/agent/${s}" data-h="/agent/${s}"><span class="dot" style="background:${a.accent}"></span>${esc(a.name)}<span class="des">${a.designator}</span></a>`;}
function markNav(hash){document.querySelectorAll("#nav a").forEach(el=>el.classList.toggle("on",el.getAttribute("data-h")===hash));}

function router(){const h=location.hash.replace(/^#/,"")||"";
 const parts=h.split("/").filter(Boolean);
 window.scrollTo(0,0);
 if(!parts.length){renderOverview();markNav("");}
 else if(parts[0]==="agent"){renderAgent(parts[1]);markNav("/agent/"+parts[1]);}
 else if(parts[0]==="skill"){renderSkill(parts[1]);markNav("");}
 else if(parts[0]==="family"){renderFamily(parts[1]);markNav("/family/"+parts[1]);}
 else if(parts[0]==="command"){renderCommand(parts[1]);markNav("");}
 else if(parts[0]==="pillar"){renderPillar(parts[1]);markNav("");}
 else if(parts[0]==="skills"){renderSkillsIndex();markNav("/skills");}
 else if(parts[0]==="commands"){renderCommandsIndex();markNav("/commands");}
 else if(parts[0]==="sizes"){renderSizes();markNav("/sizes");}
 else if(parts[0]==="search"){runSearch($("#q").value);markNav("");}
 else render404();
}
addEventListener("hashchange",router);
addEventListener("DOMContentLoaded",()=>{
 buildNav();
 const q=$("#q");
 q.addEventListener("input",()=>{if(q.value.trim()){if(location.hash!=="#/search")location.hash="#/search";else runSearch(q.value);}else if(location.hash==="#/search")go("");});
 addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus();}
   if(e.key==="Escape"&&document.activeElement===q){q.value="";q.blur();if(location.hash==="#/search")go("");}});
 router();
});
</script></body></html>
