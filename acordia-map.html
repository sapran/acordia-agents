the sources before joining: enumerate each input with <code>ls</code>/<code>find</code>/<code>glob</code>, type it, and record its expected record count, so the pipeline reconciles against a known denominator rather than absorbing a truncated feed silently.</li><li>Ingest and normalise over exhaustive coverage: parse each source in full into a common schema — standardising identities, timestamps, IPs, and hosts — and assert the ingested row count against the inventory, never sampling the head of a large export as a stand-in for the whole.</li><li>Choose the join model — relational, graph, or time-series — that fits the question; graph for relationships, time-series for sequence and cadence.</li><li>Correlate at scale: link entities across datasets, deduplicate, and enrich with reference data to turn raw records into resolved objects.</li><li>Query for the analytic question, not the data — build repeatable queries/pipelines that answer &quot;who touched what, when, from where.&quot;</li><li>Guard data integrity: track provenance so every resolved object carries its source rows as <code>&lt;source-path&gt;:&lt;offset&gt;</code> or <code>&lt;source&gt;@L&lt;line&gt;</code>, preserve originals, and keep transformations reversible so a conclusion can be audited back to source.</li><li>Degradation: if a source cannot be parsed into the schema, hold it out of the join explicitly and report the coverage gap and its effect on any conclusion, rather than joining the parseable remainder and presenting it as complete.</li></ul>","n":1418},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A normalised, correlatable dataset with entities resolved across sources.</li><li>Repeatable queries/pipelines that answer recurring fusion questions at scale.</li><li>Provenance trail linking every derived link back to its raw records.</li></ul>","n":226}],"m":{"name":24,"desc":358,"body":2146,"file":2747,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":35.0},"name":{"lim":64,"pct":37.5}}}},"deception-detection":{"slug":"deception-detection","pillar":"analysts","name":"deception-detection","description":"Test whether the picture you are acting on has been planted, denied or shaped to steer your decision, reading denial and deception as paired tells and weighting channels the target does not know you hold over what was merely made observable to you, when the evidence is suspiciously convenient, one-sided or confirms your favoured hypothesis too neatly.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md#L71","summary":"Judge whether the intelligence you are acting on has been planted, denied, or shaped to manipulate your decision, so the operation is not steered into a honeypot, a burn, or a wasted effect.","file":"acordia-analysts/skills/deception-detection/SKILL.md","used_by":[],"intro":"<p># Deception Detection / Anti-Manipulation</p>","secs":[{"t":"Objective","h":"<p>Judge whether the intelligence you are acting on has been planted, denied, or shaped to manipulate your decision, so the operation is not steered into a honeypot, a burn, or a wasted effect.</p>","n":190},{"t":"When to use","h":"<ul class=\"ml\"><li>Evidence is unusually convenient, one-sided, or perfectly confirms your working hypothesis.</li><li>The target has motive and capability to feed you a false picture (mature defender, deception program, prior contact).</li></ul>","n":213},{"t":"Method","h":"<ul class=\"ml\"><li>Assume adversary agency: ask what the defender would want you to believe and whether the current picture matches it too well.</li><li>Separate what you observed directly from what was made observable to you; weight channels the target does not know you hold.</li><li>Check for denial (things that should be visible and aren't) and deception (things visible that shouldn't be) as paired tells.</li><li>Look for manipulation of the analyst: urgency, flattery of your hypothesis, single-source pivots, bait that rewards a specific action.</li><li>Seek confirmation through an independent access path the target cannot see or shape; withhold commitment until it corroborates.</li></ul>","n":649},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A judgement: picture is trustworthy / possibly shaped / likely planted.</li><li>The specific tells and the channels most and least susceptible to manipulation.</li><li>A recommendation to corroborate, probe, or back off — and what not to act on yet.</li></ul>","n":239}],"m":{"name":19,"desc":353,"body":1400,"file":1988,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":34.5},"name":{"lim":64,"pct":29.7}}}},"detection-capability-analysis":{"slug":"detection-capability-analysis","pillar":"analysts","name":"detection-capability-analysis","description":"Model the defender's detection surface from first principles before you act, separating what their sensors and log sources can collect from what is actually collected and what is analysed into an alert, then score each candidate technique for residual risk and flag the canaries and honeytokens that are no-go without mitigation.","family":"defender-reading","ported":false,"source":"docs/roles/operational-analyst.md#L90","summary":"Model the defender's detection surface in principle — sensors, log sources, coverage, and analytic maturity — so each planned action can be scored for how likely it is to generate an alert before it is taken.","file":"acordia-analysts/skills/detection-capability-analysis/SKILL.md","used_by":[],"intro":"<p># Detection-Capability Analysis</p>","secs":[{"t":"Objective","h":"<p>Model the defender's detection surface in principle — sensors, log sources, coverage, and analytic maturity — so each planned action can be scored for how likely it is to generate an alert before it is taken.</p>","n":208},{"t":"When to use","h":"<ul class=\"ml\"><li>Pre-op planning of a technique or kill-chain step, when you need to predict detectability rather than react to it.</li><li>Anytime new environment recon reveals a security product, log pipeline, or SOC capability you had not accounted for.</li></ul>","n":235},{"t":"Method","h":"<ul class=\"ml\"><li>Enumerate the defender's likely sensor and log sources (EDR, network, identity, cloud, SIEM) from recon, vendor fingerprints, and environment class.</li><li>Map each planned technique to the data source that would witness it, then to whether an analytic plausibly exists for it (MITRE ATT&amp;CK data-source and detection coverage as a baseline).</li><li>Separate &quot;can be collected&quot; from &quot;is collected&quot; from &quot;is analyzed/alerted&quot; — coverage gaps live between those layers.</li><li>Rank techniques by residual detection risk; prefer actions witnessed only by sources the target does not collect or correlate.</li><li>Flag high-confidence tripwires (canaries, honeytokens, signatured behaviors) as no-go without mitigation.</li></ul>","n":695},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A per-technique detectability score with the specific log/sensor that would catch it.</li><li>A ranked list of low-visibility paths and an explicit list of tripwires to avoid.</li><li>Assumptions and unknowns that Overwatch and recon should resolve.</li></ul>","n":239}],"m":{"name":29,"desc":329,"body":1476,"file":2060,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":32.1},"name":{"lim":64,"pct":45.3}}}},"disk-memory-forensics":{"slug":"disk-memory-forensics","pillar":"analysts","name":"disk-memory-forensics","description":"Read a host's disk and memory the way a responder would, driving Volatility process, injection and hook walks and parsing filesystem timelines, prefetch, amcache and shimcache, registry hives, event logs and deletion traces, either to confirm what your own on-host actions left behind and whether cleanup held, or to reconstruct a target's history, defences and stored secrets.","family":"evidence-forensics","ported":false,"source":"docs/roles/operational-analyst.md#L98","summary":"Apply forensic technique to disk and memory to see a host the way a responder would — either as a self-detection check on the evidence your own activity left behind, or to understand a target's state, history, and defensive posture.","file":"acordia-analysts/skills/disk-memory-forensics/SKILL.md","used_by":[],"intro":"<p># Disk &amp; Memory Forensics</p>","secs":[{"t":"Objective","h":"<p>Apply forensic technique to disk and memory to see a host the way a responder would — either as a self-detection check on the evidence your own activity left behind, or to understand a target's state, history, and defensive posture.</p>","n":232},{"t":"When to use","h":"<ul class=\"ml\"><li>Self-detection: verifying what artifacts your on-host actions actually left, and whether cleanup succeeded, before you rely on stealth.</li><li>Target understanding: reconstructing a compromised or accessed host's history, defenses, and stored secrets.</li></ul>","n":248},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the collected evidence with <code>ls</code> / <code>find</code> / <code>glob</code> — enumerate memory dumps, disk images, hive files, event-log exports, browser profile folders — before opening any single artefact.</li><li>Memory: enumerate processes, injected regions, hooks, network connections, and in-memory artifacts to confirm what a live-response capture would reveal about you. Drive the walk with Volatility 3 plugin output (e.g. <code>windows.pslist</code>, <code>windows.malfind</code>, <code>linux.pslist</code>) rather than reading raw dumps wholesale; scope any <code>strings</code> sweeps to known offsets or plugin-flagged regions.</li><li>Disk: examine filesystem timelines, prefetch/amcache/shimcache, event logs, registry, browser and shell history, and deletion/recovery traces. Read structured artefacts through their parsers (registry hives via <code>impacket-secretsdump</code> or <code>regripper</code>, event logs via <code>evtx_dump</code>) and bound raw image reads to the byte-range the parser flagged; do not slurp full images into a viewer.</li><li>Build a timeline and diff it against your own action log to find residual indicators you did not expect to remain.</li><li>For target work, mine the same sources for credentials, defensive tooling, prior-incident traces, and pivot opportunities.</li><li>Cite every finding by <code>&lt;image-or-dump&gt;:&lt;byte-offset&gt;</code> or <code>&lt;parsed-artefact&gt;@L&lt;line&gt;</code> (event-log record number, registry key path treated as line-shaped) so a peer can re-open the exact locus.</li><li>Judge what a responder arriving now would reconstruct, and prioritize cleanup or avoidance of the highest-fidelity remnants.</li><li>If pypykatz, Volatility, impacket, <code>regripper</code>, or a similar named parser is unavailable, either substitute a documented offline equivalent (Mimikatz <code>sekurlsa</code> on trusted material, <code>hivex</code>, <code>python-registry</code>) or flag the gap and stop — never eyeball a hex dump in lieu of a parser.</li></ul>","n":1809},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A forensic timeline of the host with your operation's residual artifacts flagged.</li><li>A self-detection verdict: what cleanup missed and what a responder would find.</li><li>For targets, extracted secrets, defensive-posture intel, and pivot leads.</li></ul>","n":240},{"t":"Credential extraction","h":"<p>Post-collection extraction from disk images and memory captures. All work is passive: parse artefacts already collected, never validate live.</p><p><strong>Memory captures</strong></p><ul class=\"ml\"><li>LSASS process dump — parse with <code>pypykatz lsa minidump &lt;dump&gt;</code> or Mimikatz <code>sekurlsa::minidump / sekurlsa::logonpasswords</code>. Yields NTLM hashes, Kerberos tickets, cleartext (WDigest, tspkg, DPAPI master keys) if present.</li><li>Full-system memory (raw/AFF4/VMEM) — Volatility 3: <code>windows.hashdump</code>, <code>windows.lsadump</code>, <code>windows.cachedump</code>, <code>windows.mimikatz</code>. Linux: <code>linux.pslist</code> + <code>strings</code>-hunt for <code>/etc/shadow</code>-shaped lines.</li><li>String-scan patterns for un-parsed dumps: <code>\\$NT\\$</code>, <code>krbtgt</code>, <code>-----BEGIN</code>, <code>AKIA[0-9A-Z]{16}</code>, <code>eyJ</code> (JWT), <code>Bearer </code>, <code>password=</code>.</li></ul><p><strong>Disk images</strong></p><ul class=\"ml\"><li>Registry hives — <code>impacket-secretsdump -sam SAM -security SECURITY -system SYSTEM LOCAL</code>. Yields local SAM hashes, LSA secrets (cached machine account, service credentials), DPAPI master key pointers.</li><li>Cached logon (MSCache/MSCache2) — <code>impacket-secretsdump</code> from <code>SYSTEM</code> + <code>SECURITY</code>; brute-forceable offline, do not attempt.</li><li>Filesystem sweep — carve for <code>%APPDATA%\\Microsoft\\Credentials\\</code>, <code>%LOCALAPPDATA%\\Microsoft\\Credentials\\</code>, <code>NTUSER.DAT</code>, browser profile dirs (<code>Login Data</code> SQLite), SSH <code>known_hosts</code>/<code>config</code>, <code>.aws/credentials</code>, <code>.docker/config.json</code>.</li><li>Prefetch / amcache / shimcache — evidence of credential-tool execution (mimikatz.exe, procdump.exe, <code>comsvcs.dll</code>), not credentials themselves; feed to <code>overwatch-analyst</code>.</li></ul><p><strong>Cross-cutting</strong></p><ul class=\"ml\"><li>Every extraction is classified and reported via <a href=\"../credential-harvest-triage/SKILL.md\" target=\"_blank\" rel=\"noopener\"><code>credential-harvest-triage</code></a>; this skill never emits raw values.</li></ul>","n":1657}],"m":{"name":21,"desc":377,"body":4307,"file":4926,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":36.8},"name":{"lim":64,"pct":32.8}}}},"endpoint-telemetry-edr":{"slug":"endpoint-telemetry-edr","pillar":"analysts","name":"endpoint-telemetry-edr","description":"Reason about what a host sensor genuinely captures and by which mechanism — kernel callbacks, ETW providers, user-mode hooks, minifilters, AMSI, the deployed Sysmon configuration — and where that instrumentation goes blind, so you can choose between execution, injection or persistence primitives when one writes far richer endpoint telemetry than another.","family":"defender-reading","ported":false,"source":"docs/roles/operational-analyst.md#L91","summary":"Reason about what endpoint and EDR sensors actually capture — process, thread, image-load, registry, file, and network events — how they capture it, and where the instrumentation goes blind, so on-host actions are chosen to minimize recorded evidence.","file":"acordia-analysts/skills/endpoint-telemetry-edr/SKILL.md","used_by":[],"intro":"<p># Endpoint Telemetry &amp; EDR Internals</p>","secs":[{"t":"Objective","h":"<p>Reason about what endpoint and EDR sensors actually capture — process, thread, image-load, registry, file, and network events — how they capture it, and where the instrumentation goes blind, so on-host actions are chosen to minimize recorded evidence.</p>","n":251},{"t":"When to use","h":"<ul class=\"ml\"><li>Planning or executing any on-host action (execution, injection, persistence, credential access) on an endpoint that runs an EDR or host sensor.</li><li>Deciding between execution primitives when one leaves richer telemetry than another.</li></ul>","n":232},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the collected endpoint evidence with <code>ls</code> / <code>find</code> / <code>glob</code> — sensor config exports, ETW provider manifests, EDR agent driver binaries, Sysmon config, exported event archives, and any SIEM extract for the host — and record sensor product + version per artefact.</li><li>Identify the sensor and its collection mechanism (kernel callbacks, ETW providers, user-mode hooks, minifilter, AMSI) and enumerate the event types each produces. Read with bounded context, exhaustive coverage: <code>grep</code>/<code>rg</code> provider GUIDs and hooked-syscall lists across the whole driver/manifest slice; filter event archives with time-window or event-id queries (<code>Get-WinEvent -FilterHashtable</code>, targeted <code>evtx</code> queries) rather than dumping full channels into context — scope the query to the analytic question, then process every event it matches, not the first screenful.</li><li>Trace your planned action through those hooks: which callbacks fire, what fields are populated, what gets shipped to the SIEM vs. held locally.</li><li>Locate blind spots — unhooked syscalls, ETW providers that can be tampered/disabled, direct/indirect syscall paths, sensor coverage gaps for a given OS or agent version.</li><li>Prefer primitives that touch the fewest high-fidelity providers; treat tamper actions themselves as loud events that may be watched.</li><li>Account for local buffering and delayed upload — evidence can surface after the fact even if no real-time alert fired. Cite each finding as <code>&lt;artefact&gt;@L&lt;line&gt;</code> for text/config/manifest evidence or <code>&lt;evtx-or-archive&gt;:&lt;record-id&gt;</code> (or <code>:&lt;offset&gt;</code>) for event-log evidence.</li><li>Degradation: if the sensor's driver/manifest is opaque or unavailable, fall back to observed telemetry (event archives, SIEM extracts) and public provider documentation; if event archives are unavailable, restrict to config-only reasoning and flag the reduced confidence; if neither is available for the specific agent version in play, flag the gap and stop.</li></ul>","n":1936},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>An event-by-event forecast of the telemetry a planned action emits, per provider.</li><li>A shortlist of lower-telemetry execution paths and the blind spots they exploit.</li><li>Notes on tamper-detection risk and post-hoc evidence that Overwatch must monitor.</li></ul>","n":250}],"m":{"name":22,"desc":356,"body":2773,"file":3371,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":34.8},"name":{"lim":64,"pct":34.4}}}},"evasion-antianalysis":{"slug":"evasion-antianalysis","pillar":"analysts","name":"evasion-antianalysis","description":"Shape a planned action against an already-established visibility model, taking each forecast signal and buying the cheapest reduction for it — blending in with LOLBins, legitimate tooling and normal hours, suppression, timing, obfuscation, anti-forensic handling — without the evasion itself becoming the loudest signal on the wire or the host.","family":"defender-reading","ported":false,"source":"docs/roles/operational-analyst.md#L93","summary":"Given a model of the defender's visibility, reason about how to shape actions so they evade real-time detection and impede after-the-fact analysis — without the evasion itself becoming the loudest signal.","file":"acordia-analysts/skills/evasion-antianalysis/SKILL.md","used_by":[],"intro":"<p># Evasion &amp; Anti-Analysis Reasoning</p>","secs":[{"t":"Objective","h":"<p>Given a model of the defender's visibility, reason about how to shape actions so they evade real-time detection and impede after-the-fact analysis — without the evasion itself becoming the loudest signal.</p>","n":204},{"t":"When to use","h":"<ul class=\"ml\"><li>After detection-capability, EDR, or cloud-log analysis has told you what would be seen and you need a concrete evasion plan.</li><li>When an action cannot be made invisible and you must trade fidelity of evidence against operational cost.</li></ul>","n":234},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the defender-visibility inputs feeding this decision with <code>glob</code> / <code>find</code> / <code>list</code>: the detection-capability write-up, EDR telemetry samples, cloud log excerpts, and any own-footprint ledger already produced.</li><li>Read in bounded, context-scoped slices — the specific rule, the specific event window, the specific artefact — rather than loading whole detection catalogues into context; drive coverage with an exhaustive <code>grep</code>/parser pass over the whole catalogue to locate every relevant signal, then read the scoped line range around each — every hit, not just the first.</li><li>Take the forecasted signals as input and choose the cheapest reduction per signal: blend-in (LOLBins, legit tooling, normal hours), suppression (unhook, log-tamper), or avoidance (different primitive).</li><li>Weigh anti-analysis tactics (obfuscation, packing, in-memory-only, encrypted staging) against the meta-signal they create — many tamper/evasion actions are themselves high-confidence detections.</li><li>Time and pace actions to defeat correlation and baselining; avoid bursty or novel sequences that stand out from environment norms.</li><li>Plan the forensic aftermath: what artifacts remain, what can be minimized, and what a responder would reconstruct if they arrive later; cite each expected-signal-to-mitigation pairing by <code>&lt;path&gt;:&lt;offset&gt;</code> (byte) or <code>&lt;path&gt;@L&lt;line&gt;</code> (line) back to the detection or telemetry line that predicts it.</li><li>Keep every evasion reversible/deniable where possible; never trade a quiet action for a loud cover-up.</li><li>If a detection-rule parser or EDR-log decoder is unavailable, fall back to raw-string <code>grep</code> over the exports; if the visibility model itself is absent, flag the gap and stop rather than plan evasion against assumed sensors.</li></ul>","n":1747},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A per-action evasion plan mapping each expected signal to a mitigation and its residual risk.</li><li>Explicit call-outs where evasion is louder than the action and should be dropped.</li><li>Forensic-footprint notes for own-footprint and disk/memory self-checks.</li></ul>","n":253}],"m":{"name":20,"desc":344,"body":2541,"file":3123,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":33.6},"name":{"lim":64,"pct":31.2}}}},"exhaustive-data-processing":{"slug":"exhaustive-data-processing","pillar":"analysts","name":"exhaustive-data-processing","description":"Prove complete coverage of a bulk corpus by putting a script-first tool pass across 100% of it, reading only the located regions into context and reconciling a coverage ledger, so no conclusion rests on the opening portion of an artefact — the reading discipline every evidence skill follows when a dump, image, archive or dataset outgrows a single read.","family":"take-handling","ported":false,"source":"openspec/changes/archive/2026-07-22-exhaustive-data-processing/proposal.md","summary":"This skill is **procedural and cross-cutting**. It does not correspond to a row in the competency-grid appendix of `docs/roles/operational-analyst.md` — it names a *workflow* that composes competencies, not a competency of its own. It builds on `analytic-tooling-scripting` (the scripting baseline) and drives the three legs' evidence reads; it lands under the same procedural-skill exception that `credential-harvest-triage` and `analyst-loop` use. It is **not** one of the fifteen evidence-reading skills bound by the `## Method` contract — it *defines* the reading discipline those skills follow.","file":"acordia-analysts/skills/exhaustive-data-processing/SKILL.md","used_by":["cyber-analyst","overwatch-analyst","fusion-analyst","target-analyst"],"intro":"<p># Exhaustive Data Processing</p>","secs":[{"t":"Cross-cutting notice","h":"<p>This skill is <strong>procedural and cross-cutting</strong>. It does not correspond to a row in the competency-grid appendix of <code>docs/roles/operational-analyst.md</code> — it names a <em>workflow</em> that composes competencies, not a competency of its own. It builds on <code>analytic-tooling-scripting</code> (the scripting baseline) and drives the three legs' evidence reads; it lands under the same procedural-skill exception that <code>credential-harvest-triage</code> and <code>analyst-loop</code> use. It is <strong>not</strong> one of the fifteen evidence-reading skills bound by the <code>## Method</code> contract — it <em>defines</em> the reading discipline those skills follow.</p>","n":599},{"t":"Objective","h":"<p>Turn a pile of collected material into answers derived from <strong>all</strong> of it. Sampling the opening portion of an artefact and concluding from it manufactures false negatives — the credential on line 5,000 of a 20,000-line export, the one anomalous record in the tail — and reports &quot;clean&quot; on data that was never read. Exhaustion is the default; a partial pass is a named, justified exception, never a silent one.</p>","n":409},{"t":"When to use","h":"<ul class=\"ml\"><li>Bulk material lands: a file dump, disk/memory image, archive, log bundle, cloud-state export, config directory, or dataset.</li><li>Any artefact large enough that a single <code>read</code> captures only part of it.</li><li>Any time a conclusion would otherwise rest on the first screenful of a file.</li></ul>","n":279},{"t":"The sampling trap","h":"<p>Head-and-stop is a mechanical default, not a choice — name it so you catch it:</p><ul class=\"ml\"><li><strong>The read window is bounded.</strong> <code>read</code> (and <code>head</code>/<code>cat</code> into a fixed context) returns the opening slice of a large file. Read it, conclude, and everything past the window is invisible.</li><li><strong>Tool hits get eyeballed partial.</strong> <code>grep</code> returns 500 matches; reading the first ten and generalising (&quot;looks like all the same&quot;) is sampling by another name.</li><li><strong>Fan-out alone does not fix it.</strong> Splitting the material across subagents only <em>distributes</em> the sampling if each leaf still reads a head. Exhaustion has to hold at the leaf, or it does not hold at all.</li></ul>","n":636},{"t":"Method — script-first exhaustion","h":"<p>Completeness comes from the tool, not from loading raw bytes into a context window that cannot hold them.</p><ol class=\"ml\"><li><strong>Do not read bulk material into context.</strong> Run a tool over 100% of the bytes or records — <code>rg</code> / <code>grep -c</code> for counts and located hits, <code>awk</code> / <code>sort</code> / <code>uniq -c</code> for aggregates, a real parser (<code>jq</code>, <code>csv</code>, <code>sqlite</code>, Python) for structured or nested formats. Iterate <em>every</em> record, not a page.</li><li><strong>Consume results, not raw.</strong> The model reads the tool's aggregates and located hits (<code>path:line</code>), then reads into context only the specific located regions that need judgement — bounded by the hits, never the head.</li><li><strong>Validate the pass.</strong> Confirm the tool covered the whole input (line / record / byte counts reconcile — see the ledger) and that a parsing bug is not silently dropping records. Validate transforms against a known-good sample before trusting their output.</li><li><strong>Fan out only for judgement a script cannot make.</strong> When the question needs the model to <em>read</em> content a pattern cannot classify, partition into bounded slices (orchestrator only) and dispatch each for full reading. The script pass still runs first, so fan-out is the exception, not the engine.</li></ol>","n":1184},{"t":"Coverage ledger","h":"<p>Completeness is proven, not asserted.</p><ul class=\"ml\"><li><strong>Declare the input scope up front</strong> — the denominator: number of files × total bytes, or record / line counts. Enumerate with <code>find</code> / <code>glob</code> / <code>ls</code>, <code>wc -l</code>, or the parser's record count.</li><li><strong>Account for every step</strong> against that denominator: N scanned / N parsed / N deferred-with-reason. A numerator that does not reconcile to the denominator is a sampled result.</li><li><strong>Emit a coverage receipt</strong> per unit of work: <code>{scope declared, scope covered, method, deferred + why}</code>. The <em>method</em> field is load-bearing — a receipt whose method is &quot;read the file&quot; over a multi-megabyte artefact is self-evidently a sample.</li><li><strong>Reconcile before compiling.</strong> The orchestrator checks each leg's receipt against the slice it dispatched; a receipt that does not cover its slice is rejected and re-dispatched or sub-partitioned. Compile only from reconciled receipts.</li><li><strong>State total coverage in the output</strong> — &quot;X of X files, Y of Y records processed, 0 deferred&quot; — or name the deferred remainder explicitly. No silent short returns.</li></ul>","n":1058},{"t":"Fan-out contract","h":"<ul class=\"ml\"><li><strong>Only the orchestrator fans out.</strong> Legs are <code>task: deny</code> leaf specialists; they cannot dispatch.</li><li><strong>Slices are disjoint and bounded</strong> to full-processability, each dispatched with only its slice.</li><li><strong>A leg that overflows surfaces back.</strong> If a slice still exceeds full processing, the leg script-exhausts what it can and surfaces the un-processable remainder back to the orchestrator for sub-partition — it does not sample the remainder, and it does not fan out. (Mirrors <code>analyst-loop</code>: a leg surfaces the need back rather than assuming the orchestrator's role.)</li><li><strong>The orchestrator sub-partitions deterministically</strong> — by file, then by byte / line range — so each round strictly shrinks the slice and overflow cannot ping-pong.</li></ul>","n":732},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A reconciled coverage ledger: declared scope = covered scope, or a named deferred remainder.</li><li>Answers traceable to located source (<code>path:line</code> or <code>path:offset</code>), derived from a pass over the whole input.</li><li>For fan-out work: one coverage receipt per slice, reconciled by the orchestrator before compilation.</li></ul>","n":309},{"t":"Guardrails","h":"<ul class=\"ml\"><li><strong>Passive posture.</strong> Read, model, judge — no file edits, no payloads, no credential validation. Execution belongs to the operators the analyst advises.</li><li><strong>No raw credential values</strong> in output — classifications, sources, and priorities only (see <code>credential-harvest-triage</code>).</li><li><strong>No silent truncation.</strong> Any bound on coverage (a deferred slice, an unparseable artefact) is named in the output, never dropped.</li></ul>","n":410}],"m":{"name":26,"desc":354,"body":5855,"file":6439,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":34.6},"name":{"lim":64,"pct":40.6}}}},"gain-loss-calculus":{"slug":"gain-loss-calculus","pillar":"analysts","name":"gain-loss-calculus","description":"Weigh a move's concrete gain against its full losses — exposure, burnt access, attribution, the paths it forecloses — and against the null option of waiting, then convert the balance into a go, scale, switch or stop edit to the plan, when the obvious next step buys progress but spends something scarce.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md#L75","summary":"Weigh an option's expected gain against its losses — exposure, burned access, attribution, opportunity cost — and turn that balance into a concrete adjustment to the plan rather than a gut call to press on.","file":"acordia-analysts/skills/gain-loss-calculus/SKILL.md","used_by":[],"intro":"<p># Gain/Loss Calculus &amp; Re-Planning</p>","secs":[{"t":"Objective","h":"<p>Weigh an option's expected gain against its losses — exposure, burned access, attribution, opportunity cost — and turn that balance into a concrete adjustment to the plan rather than a gut call to press on.</p>","n":206},{"t":"When to use","h":"<ul class=\"ml\"><li>Deciding whether to escalate, persist, or stop after a partial result or a scare.</li><li>The obvious next step buys progress but spends something scarce (access, stealth, tooling).</li></ul>","n":177},{"t":"Method","h":"<ul class=\"ml\"><li>Name the gain concretely: what the move advances toward the objective, and how much closer it gets you.</li><li>Name the losses fully — not just failure, but exposure, burned capability, attribution, and the moves it forecloses.</li><li>Account for the sunk cost you must ignore and the opportunity cost of the paths this choice closes.</li><li>Compare against doing nothing / waiting; a positive move must beat the null option, not just look active.</li><li>Feed the verdict back into the plan: proceed, scale down, switch method, or re-scope the objective.</li></ul>","n":536},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A gain-vs-loss balance for the option, including what it forecloses.</li><li>A go / scale / switch / stop recommendation with its threshold.</li><li>The specific re-plan edit the calculus drives.</li></ul>","n":185}],"m":{"name":18,"desc":303,"body":1206,"file":1737,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":29.6},"name":{"lim":64,"pct":28.1}}}},"human-automation-teaming":{"slug":"human-automation-teaming","pillar":"analysts","name":"human-automation-teaming","description":"Divide a workflow between analyst judgement and automation, setting an autonomy level per task from surface-only through recommend-and-confirm to automate-and-act, and designing against automation bias and the failure modes tooling hides, when a filter decides what the analyst ever sees or automation may drive a targeting or effect decision.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md#L77","summary":"Divide the work between analyst judgement and automation so machines carry scale, speed, and recall while the analyst owns the judgement calls, keeping the operation both fast and accountable.","file":"acordia-analysts/skills/human-automation-teaming/SKILL.md","used_by":[],"intro":"<p># Human–Automation Teaming</p>","secs":[{"t":"Objective","h":"<p>Divide the work between analyst judgement and automation so machines carry scale, speed, and recall while the analyst owns the judgement calls, keeping the operation both fast and accountable.</p>","n":192},{"t":"When to use","h":"<ul class=\"ml\"><li>Standing up or tuning a workflow where tooling triages, scores, or filters what the analyst sees.</li><li>Deciding whether to let automation act, recommend, or merely surface.</li></ul>","n":171},{"t":"Method","h":"<ul class=\"ml\"><li>Split by strength: give automation volume, correlation, and monitoring; keep intent, ambiguity, deception, and irreversible calls with the human.</li><li>Set the autonomy level per task — automate-and-act, recommend-and-confirm, or surface-only — matched to the cost of a wrong move.</li><li>Design against automation bias: the analyst must be able to see the evidence and overrule the machine, not rubber-stamp it.</li><li>Watch for the failure modes automation hides — silent misses, stale models, adversary gaming the filter — and sample its output by hand.</li><li>Keep a human in the loop for any effect or targeting decision that is irreversible or attributable.</li></ul>","n":646},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A task split with an autonomy level assigned to each step.</li><li>The override points and evidence the analyst must retain visibility of.</li><li>A list of automation failure modes to sample against.</li></ul>","n":190}],"m":{"name":24,"desc":343,"body":1293,"file":1876,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":33.5},"name":{"lim":64,"pct":37.5}}}},"hypothesis-testing":{"slug":"hypothesis-testing","pillar":"analysts","name":"hypothesis-testing","description":"Hold every plausible explanation at once and score the evidence against each in a matrix, weighting the items that discriminate between them and hunting the observation that would kill the leader, when the picture admits several readings of attribution, target function, intent or detection status and you are tempted to lock onto the first.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md#L69","summary":"Hold every plausible explanation of the target situation at once and test each against the evidence together, so the surviving judgement is the one least contradicted rather than the one you liked first.","file":"acordia-analysts/skills/hypothesis-testing/SKILL.md","used_by":[],"intro":"<p># Hypothesis Testing (Competing Hypotheses)</p>","secs":[{"t":"Objective","h":"<p>Hold every plausible explanation of the target situation at once and test each against the evidence together, so the surviving judgement is the one least contradicted rather than the one you liked first.</p>","n":203},{"t":"When to use","h":"<ul class=\"ml\"><li>The evidence admits several readings (attribution, target function, detection status, intent).</li><li>You notice yourself building a case for a single explanation instead of comparing.</li></ul>","n":181},{"t":"Method","h":"<ul class=\"ml\"><li>Enumerate the full set of hypotheses up front, including the uncomfortable ones (you are burned; the target is a decoy/honeypot).</li><li>Build an evidence-by-hypothesis matrix; score each item for consistency with each hypothesis, not just the favoured one.</li><li>Weight diagnostic evidence — items that discriminate between hypotheses — and discount evidence consistent with all of them.</li><li>Try to disconfirm: seek the observation that would kill the leading hypothesis, and task collection for it.</li><li>Rank by fewest inconsistencies; carry the runner-up forward rather than discarding it.</li></ul>","n":580},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A ranked set of hypotheses with the evidence that supports and undercuts each.</li><li>The most diagnostic missing observation, handed to collection.</li><li>A lead judgement plus the surviving alternative you keep watching.</li></ul>","n":214}],"m":{"name":18,"desc":341,"body":1289,"file":1861,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":33.3},"name":{"lim":64,"pct":28.1}}}},"identity-directory-trust":{"slug":"identity-directory-trust","pillar":"analysts","name":"identity-directory-trust","description":"Map the target's identity fabric from directory artefacts such as BloodHound exports, LDAP dumps and NTDS extractions — privileged principals, constrained, unconstrained and resource-based delegation, ADCS, LAPS and gMSA material, domain and tenant trust — to find the shortest identity path from a foothold to control of a Windows AD or Entra-backed enterprise.","family":"target-modelling","ported":false,"source":"docs/roles/operational-analyst.md#L87","summary":"Map the target's identity fabric — Active Directory / Entra ID structure, privileged principals, and domain/tenant trust — to find the shortest identity path to control of the environment.","file":"acordia-analysts/skills/identity-directory-trust/SKILL.md","used_by":[],"intro":"<p># Identity &amp; Directory (AD/Entra) &amp; Trust</p>","secs":[{"t":"Objective","h":"<p>Map the target's identity fabric — Active Directory / Entra ID structure, privileged principals, and domain/tenant trust — to find the shortest identity path to control of the environment.</p>","n":188},{"t":"When to use","h":"<ul class=\"ml\"><li>When the target is a Windows/AD or Entra-backed enterprise and identity is the real terrain.</li><li>When you need to convert a foothold into domain/tenant dominance via identity, not exploits.</li></ul>","n":189},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the collected directory artefacts with <code>ls</code> / <code>find</code> / <code>glob</code> — SharpHound / BloodHound JSON exports, ADExplorer snapshots, NTDS.dit + SYSTEM hive dumps, LDAP dumps, ticket caches, LAPS/gMSA/ADCS material — and record what each covers (domain, tenant, time window).</li><li>Enumerate the directory from those artefacts, bounded: query BloodHound JSON via <code>jq</code>; grep LDIF / CSV exports for privileged group memberships, delegation attributes (<code>msDS-AllowedToActOnBehalfOfOtherIdentity</code>, <code>TrustedForDelegation</code>), and trust records rather than reading multi-megabyte dumps wholesale. For NTDS, use <code>impacket-secretsdump</code> targeted extractions, not raw hive reads.</li><li>Map privilege: who is effectively Domain/Enterprise/Global Admin, delegation (constrained/unconstrained/RBCD), and shadow-admin paths.</li><li>Analyze trust relationships — inter-forest/domain trusts, hybrid sync (AD&lt;-&gt;Entra), federation, and where trust is transitive or over-broad.</li><li>Trace identity attack paths (Kerberos abuse, ACL/ADCS misconfig, token/PRT theft, sync-account leverage) toward tier-0 assets.</li><li>Identify the crown-jewel identities and choke points whose control equals control of the mission. Cite each finding as <code>&lt;artefact&gt;@L&lt;line&gt;</code> for text/LDIF exports or <code>&lt;artefact&gt;:&lt;offset&gt;</code> for binary hive/database evidence; reference the BloodHound node/edge id when routing through graph data.</li><li>Degradation: if BloodHound / SharpHound output is unavailable, fall back to raw LDAP dump grep + hand-drawn privilege map and flag reduced completeness; if <code>impacket-secretsdump</code> / <code>impacket-dpapi</code> are unavailable for hive/DPAPI parsing, flag the gap and stop — do not improvise credential extraction from unfamiliar formats.</li></ul>","n":1697},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>Directory and privilege map with tier-0 principals identified.</li><li>Trust and hybrid-sync edges, including transitive and over-broad grants.</li><li>Shortest identity attack paths from foothold to domain/tenant control.</li></ul>","n":212},{"t":"Credential extraction","h":"<p>Passive extraction from directory-service artefacts already in hand (NTDS dumps, ticket caches, LAPS exports, ADCS material). Never queries the live directory to validate.</p><p><strong>Active Directory database</strong></p><ul class=\"ml\"><li><code>NTDS.dit</code> + <code>SYSTEM</code> hive — <code>impacket-secretsdump -ntds NTDS.dit -system SYSTEM LOCAL</code>. Yields all domain account NTLM hashes plus <code>krbtgt</code> (golden-ticket material — highest scope, flag P0 automatically). Kerberos AES keys are extracted with <code>-just-dc</code> mode.</li><li><code>DPAPI_SYSTEM</code> LSA secret + user DPAPI master keys — chained decrypt with <code>impacket-dpapi</code> yields service account plaintexts, scheduled-task credentials, saved browser passwords.</li></ul><p><strong>Kerberos tickets</strong></p><ul class=\"ml\"><li>Windows <code>.kirbi</code> files — parse with <code>KrbRelay</code>, <code>Rubeus describe /ticket:&lt;file&gt;</code> (analysis only, not renewal). Yields service, client, renew-till, encryption type, target SPN. TGTs (<code>krbtgt/&lt;domain&gt;</code>) mark broadest scope.</li><li>MIT <code>.ccache</code> files (<code>/tmp/krb5cc_*</code>, <code>KRB5CCNAME</code> env var target) — parse with <code>klist -c</code> or <code>impacket-ticketConverter</code>. Same fields.</li></ul><p><strong>LAPS / gMSA / ADCS</strong></p><ul class=\"ml\"><li>Legacy LAPS (<code>ms-Mcs-AdmPwd</code>) and Windows LAPS (<code>msLAPS-Password</code>, <code>msLAPS-EncryptedPassword</code>) — plaintext or encrypted local-admin passwords. When collected from AD replication metadata or an LDAP dump, decode per attribute type.</li><li>gMSA (<code>msDS-ManagedPassword</code>) — 240-byte blob; parse with <code>gMSADumper.py</code>-style logic against the raw blob you already collected. Yields NTLM + Kerberos keys for the gMSA identity.</li><li>ADCS artefacts — <code>.pfx</code>/<code>.p12</code> (private key + cert; may be passphrase-protected — dictionary attack offline only, not online), <code>.pem</code> with <code>-----BEGIN</code> headers, template-vulnerable enrolments identifiable in AD-DUMP JSON exports.</li></ul><p><strong>Cross-cutting</strong></p><ul class=\"ml\"><li>Directory-derived credentials classify as <code>scope: domain</code> or higher; <code>krbtgt</code>, tier-0 accounts, and enterprise-CA private keys always mark <code>priority: P0</code>. All output flows through <a href=\"../credential-harvest-triage/SKILL.md\" target=\"_blank\" rel=\"noopener\"><code>credential-harvest-triage</code></a>; no raw hashes or keys in reports.</li></ul>","n":2005}],"m":{"name":24,"desc":362,"body":4428,"file":5036,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":35.4},"name":{"lim":64,"pct":37.5}}}},"implant-payload-re":{"slug":"implant-payload-re","pillar":"analysts","name":"implant-payload-re","description":"Reverse-engineer an implant or payload binary to ground-truth what it really does on a host and over the wire, triaging statically through headers, named sections, entropy and strings before instrumented dynamic runs in isolation against its anti-analysis, whether to validate your own tooling's footprint before deployment or to read a captured third-party sample's capability and indicators.","family":"evidence-forensics","ported":false,"source":"docs/roles/operational-analyst.md#L97","summary":"Reverse-engineer implant/payload behavior to ground-truth what it actually does on a host and over the wire. This is a CROSS-CUTTING deep skill: it attaches to whichever leg needs it — Target & Network (understanding a target's malware or a tool you'll deploy) or Defender & Detection (predicting the artifacts and signatures a payload emits) — for a given operation.","file":"acordia-analysts/skills/implant-payload-re/SKILL.md","used_by":[],"intro":"<p># Implant/Payload Behaviour &amp; Reverse-Engineering</p>","secs":[{"t":"Objective","h":"<p>Reverse-engineer implant/payload behavior to ground-truth what it actually does on a host and over the wire. This is a CROSS-CUTTING deep skill: it attaches to whichever leg needs it — Target &amp; Network (understanding a target's malware or a tool you'll deploy) or Defender &amp; Detection (predicting the artifacts and signatures a payload emits) — for a given operation.</p>","n":367},{"t":"When to use","h":"<ul class=\"ml\"><li>Validating your own tooling's real footprint before deployment, or triaging unexpected behavior in the field.</li><li>Analyzing a captured, third-party, or competitor sample to understand capability, indicators, and attribution.</li></ul>","n":224},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the sample set with <code>ls</code> / <code>find</code> / <code>glob</code> (candidate binaries, dropped stages, embedded resources); record file type, size, and hash before any read.</li><li>Triage statically first, bounded: <code>file</code>, entropy scan, <code>strings -a -n 8</code> (and <code>-e l</code> for UTF-16) piped through <code>grep</code>/<code>rg</code> for pattern hits; read PE/ELF headers and named sections (<code>.rsrc</code>, <code>.rdata</code>, <code>__cstring</code>) by section offset, not the whole image. For .NET, decompile targeted classes rather than the full assembly.</li><li>Analyze safely in an isolated, instrumented environment; assume anti-analysis and sandbox-evasion and account for it. Recover behavior dynamically from bounded windows of the run (process/thread activity, injection, persistence, file/registry changes, network/C2), citing event indexes rather than dumping the full trace.</li><li>Extract config and IOCs — keys, domains, mutexes, campaign markers — and map behavior to ATT&amp;CK techniques and the telemetry each would produce. Cite each finding as <code>&lt;sample&gt;:&lt;offset&gt;</code> for binary evidence or <code>&lt;trace&gt;@L&lt;line&gt;</code> for sandbox log lines; never quote decrypted credential values raw.</li><li>Feed findings to the leg that needs them: detection-signature prediction for blue-side reasoning, or capability/attribution for target work.</li><li>Degradation: if a family-specific config parser (CAPE / malwareconfig) is unavailable, fall back to locating the decryptor stub and extracting algorithm + key manually; if the sandbox/instrumentation environment is unavailable, restrict to static analysis and flag the gap; if a decompiler (<code>ILSpy</code>, <code>dnSpyEx</code>, <code>Ghidra</code>) is unavailable and only stripped native code remains, flag the gap and stop.</li></ul>","n":1650},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A behavior profile: what it does on host and network, plus its anti-analysis tricks.</li><li>Extracted config, IOCs, and an emitted-signature map tied to detection sources.</li><li>Attribution and capability notes routed to the relevant operational leg.</li></ul>","n":243},{"t":"Credential extraction","h":"<p>Credential material embedded in payloads — hardcoded strings, encrypted config blocks, keys embedded for C2 auth or lateral movement. Extraction is static or sandboxed-dynamic; never runs the sample against a live target to prove reuse.</p><p><strong>Static extraction from binaries</strong></p><ul class=\"ml\"><li><code>strings -a -n 8</code> (and <code>strings -e l</code> for UTF-16 on Windows PE), then pattern-library grep from <a href=\"../credential-harvest-triage/references/credential-patterns.md\" target=\"_blank\" rel=\"noopener\"><code>credential-harvest-triage/references/credential-patterns.md</code></a>. Hits often surface C2 auth keys, hardcoded RDP/SMB credentials, hardcoded API tokens for stagers pulling from paste sites.</li><li><code>.rsrc</code> (PE resources) — embedded config blobs, sometimes XOR- or RC4-obfuscated with a key also present in the binary. Extract with <code>pefile</code> / <code>pyresource</code> + a short deobfuscator.</li><li><code>.rdata</code> / <code>.data</code> — hardcoded strings the compiler could not deduplicate; C2 URLs and hex-encoded key material.</li><li>.NET assemblies — decompile with <code>ILSpy</code> / <code>dnSpyEx</code>; hardcoded credentials often live as string literals in obfuscated fields. <code>de4dot</code> normalises common obfuscators.</li><li>ELF and Mach-O — <code>objdump -s -j .rodata</code>, <code>otool -s __TEXT __cstring</code>.</li></ul><p><strong>Configuration blocks</strong></p><ul class=\"ml\"><li>Malware families with known config formats — dedicated parsers (<code>malwareconfig.com</code> / <code>CAPE</code> community parsers). Feeds directly into <code>type</code>/<code>subtype</code> schema fields.</li><li>Custom/unknown configs — locate the decryptor stub statically; extract the algorithm and key; decrypt offline in a scratch buffer; record the plaintext structure without storing the raw config file.</li></ul><p><strong>Packed payloads</strong></p><ul class=\"ml\"><li>Recognise packer (UPX, Themida, VMProtect, Enigma) from entropy + section names. Unpack in an isolated instrumented environment (Cuckoo/CAPE/x64dbg script), dump the unpacked image, then apply static extraction to the dump.</li><li>Loader → shellcode → payload chains: extract each stage's embedded material separately; correlate keys reused across stages (common attribution signal).</li></ul><p><strong>Cross-cutting</strong></p><ul class=\"ml\"><li>Payload-embedded credentials frequently have <em>very</em> broad <code>reuse-potential</code> inside their intended deployment scope (all bots authenticating to the same C2, all sample instances sharing an XOR key) but classifying reuse against the target requires input from <code>target-analyst</code>. Classification and reporting via <a href=\"../credential-harvest-triage/SKILL.md\" target=\"_blank\" rel=\"noopener\"><code>credential-harvest-triage</code></a>; the report cites offset within the binary and a decryption-method identifier, never the raw credential.</li></ul>","n":2464}],"m":{"name":18,"desc":393,"body":5093,"file":5722,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":38.4},"name":{"lim":64,"pct":28.1}}}},"key-assumptions-check":{"slug":"key-assumptions-check","pillar":"analysts","name":"key-assumptions-check","description":"Surface the assumptions a plan silently rests on, mark which of them are load-bearing, stress each for supporting evidence and freshness, and name the analyst biases in play — confirmation, anchoring on first access, mirror-imaging the defender, sunk cost — when success depends on the target or defender behaving as expected, or the team converged fast on one read.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md#L70","summary":"Surface the assumptions the operational judgement silently rests on, mark which ones are load-bearing, and stress them — while countering the analyst's own biases — so the plan does not collapse when an unexamined premise turns out wrong.","file":"acordia-analysts/skills/key-assumptions-check/SKILL.md","used_by":[],"intro":"<p># Key-Assumptions Check &amp; Debiasing</p>","secs":[{"t":"Objective","h":"<p>Surface the assumptions the operational judgement silently rests on, mark which ones are load-bearing, and stress them — while countering the analyst's own biases — so the plan does not collapse when an unexamined premise turns out wrong.</p>","n":238},{"t":"When to use","h":"<ul class=\"ml\"><li>Before acting on a plan whose success depends on the target or defender behaving &quot;as expected&quot;.</li><li>When the team has converged fast and confidently on one read.</li></ul>","n":161},{"t":"Method","h":"<ul class=\"ml\"><li>List every assumption behind the judgement, including the ones stated as fact (&quot;this box is internet-reachable&quot;, &quot;no EDR here&quot;).</li><li>Tag each as load-bearing or minor: would the plan break if it were false?</li><li>For each load-bearing assumption, ask what evidence supports it, how recent it is, and what would falsify it.</li><li>Name the biases in play — confirmation, anchoring on first access, mirror-imaging the defender, sunk-cost on burned effort — and correct for each.</li><li>Convert fragile assumptions into gaps to collect against or contingencies to pre-plan.</li></ul>","n":556},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A list of load-bearing assumptions, each rated supported / stale / unfounded.</li><li>The named biases and the specific correction applied.</li><li>Assumptions promoted to collection gaps or branch-plan triggers.</li></ul>","n":202}],"m":{"name":21,"desc":366,"body":1260,"file":1860,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":35.7},"name":{"lim":64,"pct":32.8}}}},"log-artefact-interpretation":{"slug":"log-artefact-interpretation","pillar":"analysts","name":"log-artefact-interpretation","description":"Reconstruct an ordered account of events from raw logs and artefacts across host, network and cloud, establishing first what each source actually records and its fidelity, retention and blind spots, then correlating the matched line ranges into one timeline, to answer what happened, what the environment contains, and what marks your own activity wrote.","family":"evidence-forensics","ported":false,"source":"docs/roles/operational-analyst.md#L106","summary":"Read logs and artefacts across host, network, and cloud to reconstruct events, understand the environment, and see the target — and your own footprint — the way a defender's telemetry would.","file":"acordia-analysts/skills/log-artefact-interpretation/SKILL.md","used_by":[],"intro":"<p># Log / Artefact Interpretation</p>","secs":[{"t":"Objective","h":"<p>Read logs and artefacts across host, network, and cloud to reconstruct events, understand the environment, and see the target — and your own footprint — the way a defender's telemetry would.</p>","n":190},{"t":"When to use","h":"<ul class=\"ml\"><li>When on-box or collected logs and artefacts hold the answer to what happened, what exists, or who did it.</li><li>When assessing your own detectability — what evidence your actions wrote, and where it lives.</li></ul>","n":203},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the log corpus with <code>ls</code> / <code>find</code> / <code>glob</code> first — list every collected log source (path, size, first/last timestamp) before opening any single file.</li><li>Identify the artefact and its semantics: know what each log/event actually records, its fidelity, retention, and blind spots before trusting it.</li><li>Read with bounded context, exhaustive coverage: drive an exhaustive <code>grep</code>/<code>rg</code>/<code>jq</code> pass over the whole file for known indicators or timestamps, then open only the matched line-ranges — every match, not just the first — with a few lines of context. Never slurp gigabyte-scale JSON or <code>.evtx</code> files whole into context — use the parser's native pagination or offset-limited reads, and confirm the pass covered the whole file (record counts reconcile).</li><li>Reconstruct timelines by correlating artefacts across host, network, and cloud into one ordered account of events.</li><li>Read the environment from its exhaust — installed tooling, agents, logging config, and coverage gaps revealed by what is and isn't recorded.</li><li>Turn the lens on yourself: locate the artefacts your own operation generated and judge what a hunter reading them would conclude.</li><li>Distinguish signal from routine noise, and flag artefacts that have been cleared, tampered, or are conspicuously absent.</li><li>Cite every claim by <code>&lt;log-path&gt;@L&lt;line&gt;</code> (or <code>&lt;log-path&gt;:&lt;byte-offset&gt;</code> for binary event-log formats after parser conversion) so the corroborating record is re-openable.</li><li>If a named parser (<code>evtx_dump</code>, <code>jq</code>, <code>zeek-cut</code>, cloud-provider log CLIs) is unavailable, either substitute a documented equivalent or flag the gap and stop — never reason from a truncated <code>head</code>/<code>tail</code> alone.</li></ul>","n":1661},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A reconstructed timeline of events from correlated artefacts.</li><li>A map of the environment's logging coverage, fidelity, and blind spots.</li><li>Own-footprint assessment: what you left behind, where, and how visible it is.</li></ul>","n":217},{"t":"Credential extraction","h":"<p>Credentials leak into logs constantly. Extraction here is grep-shaped across collected log corpora; no live log-source polling.</p><p><strong>Application / debug logs</strong></p><ul class=\"ml\"><li>Stack traces printing config objects — search for <code>password=</code>, <code>token=</code>, <code>secret=</code>, <code>apiKey=</code>, <code>Authorization: </code>. Case-insensitive; multi-line context (<code>grep -B2 -A10</code>).</li><li>Request logs with URLs — query-string tokens (<code>?api_key=</code>, <code>?access_token=</code>, <code>?sig=</code>); reverse-proxy access logs (<code>nginx</code>, <code>apache</code>, <code>envoy</code>) commonly hold JWTs in the query string when clients ignore the header contract.</li><li>Debug/verbose modes (Rails logger, Django DEBUG, Spring Boot <code>logging.level.root=DEBUG</code>) — HTTP request bodies including <code>password</code> fields, session cookies, OIDC id_tokens.</li></ul><p><strong>CI/CD and build logs</strong></p><ul class=\"ml\"><li>GitHub Actions/GitLab CI/Jenkins output — masked secrets <em>sometimes</em> fail to mask (env vars printed by <code>env</code> step, secrets echoed via <code>set -x</code>, base64-encoded before mask). Search for the <a href=\"../credential-harvest-triage/references/credential-patterns.md\" target=\"_blank\" rel=\"noopener\">pattern-library</a> prefixes (<code>ghp_</code>, <code>AKIA</code>, <code>xox</code>, <code>eyJ</code>) even in logs marked &quot;secrets masked&quot;.</li><li>Docker build logs — <code>ARG</code> credentials leaked into image layers or build output.</li><li>Terraform apply/plan output — resource creation surfaces secrets in <code>sensitive = false</code> outputs.</li></ul><p><strong>Connection strings and config leaks</strong></p><ul class=\"ml\"><li>Full DSN patterns (<code>postgres://user:pass@host</code>, <code>mongodb+srv://</code>, <code>Server=...;Password=...;</code>) appear in ORM debug logs, migration output, health-check probes.</li><li>Kubernetes event logs and <code>describe pod</code> output — image-pull-secret refs (safe) vs env-var secret values printed when a container crashloops (unsafe).</li></ul><p><strong>System / audit logs</strong></p><ul class=\"ml\"><li>Windows Security event 4688 (process creation) with command-line auditing on — full command lines including <code>-Password</code>, <code>-Credential</code>, <code>net use ... /user:...</code>.</li><li>Linux <code>auth.log</code> / <code>secure</code> — pam_ldap or <code>sudo</code> reads that logged the wrong field; <code>bash_history</code> shipped via syslog.</li></ul><p><strong>Cross-cutting</strong></p><ul class=\"ml\"><li>Log-sourced credentials often have unknown freshness (log retention window) and unknown revocation status. Mark <code>freshness: unknown</code> unless the log line carries a timestamp inside the retention SLA. Classification and reporting via <a href=\"../credential-harvest-triage/SKILL.md\" target=\"_blank\" rel=\"noopener\"><code>credential-harvest-triage</code></a>; source path in the report references the log file, not the credential value.</li></ul>","n":2349}],"m":{"name":27,"desc":354,"body":4747,"file":5367,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":34.6},"name":{"lim":64,"pct":42.2}}}},"maintaining-operating-picture":{"slug":"maintaining-operating-picture","pillar":"analysts","name":"maintaining-operating-picture","description":"Stop an already-fused picture from rotting while the operation runs, timestamping every update, tracking the deltas since the last read and what each implies, setting decay on perishable facts and re-verifying them before reliance, retiring stale entries against fresh observation and pushing the live state to whoever is steering on it.","family":"take-handling","ported":false,"source":"docs/roles/operational-analyst.md#L102","summary":"Keep the fused operating picture current and trustworthy as the operation runs and the target changes, so decisions are made against reality rather than a stale snapshot.","file":"acordia-analysts/skills/maintaining-operating-picture/SKILL.md","used_by":[],"intro":"<p># Maintaining the Operating Picture</p>","secs":[{"t":"Objective","h":"<p>Keep the fused operating picture current and trustworthy as the operation runs and the target changes, so decisions are made against reality rather than a stale snapshot.</p>","n":170},{"t":"When to use","h":"<ul class=\"ml\"><li>During any live operation where access, infrastructure, defenders, or the environment drift over time.</li><li>When a plan or judgement rests on facts collected earlier that may no longer hold.</li></ul>","n":189},{"t":"Method","h":"<ul class=\"ml\"><li>Treat the picture as a living state, not a one-off product: every new observation updates it, and every update is timestamped.</li><li>Track deltas explicitly — what changed since last read (new hosts, revoked access, patched paths, a hunt starting) and what that change implies.</li><li>Set decay on facts: mark which elements are durable and which are perishable, and re-verify perishable ones before relying on them.</li><li>Reconcile new take against the standing picture; when they conflict, trust fresh observation and retire the stale entry.</li><li>Push the current picture to whoever acts on it, so operators are never steering on a picture the analyst already knows is dead.</li></ul>","n":662},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A continuously updated operating picture with change-log of deltas.</li><li>Freshness/decay markers separating durable facts from perishable ones.</li><li>Early-warning flags where the environment has shifted enough to invalidate a plan.</li></ul>","n":227}],"m":{"name":29,"desc":337,"body":1351,"file":1941,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":32.9},"name":{"lim":64,"pct":45.3}}}},"method-timing-risk-decision":{"slug":"method-timing-risk-decision","pillar":"analysts","name":"method-timing-risk-decision","description":"Choose which method to use, the moment to move and the exposure to accept, by pricing each live option's gain, detection risk and reversibility against the operation's stated risk appetite and then naming the execute-trigger and the fallback, when several viable routes to the objective trade off differently or a window is opening or closing.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md#L73","summary":"Choose the method to use, the moment to move, and the exposure to accept, by comparing the live options against the objective and the operation's risk tolerance rather than defaulting to the most familiar tool.","file":"acordia-analysts/skills/method-timing-risk-decision/SKILL.md","used_by":[],"intro":"<p># Method / Timing / Risk Decision</p>","secs":[{"t":"Objective","h":"<p>Choose the method to use, the moment to move, and the exposure to accept, by comparing the live options against the objective and the operation's risk tolerance rather than defaulting to the most familiar tool.</p>","n":210},{"t":"When to use","h":"<ul class=\"ml\"><li>Multiple viable methods exist and they trade off effect, stealth, and reversibility differently.</li><li>Timing matters — a window is opening or closing on the target.</li></ul>","n":163},{"t":"Method","h":"<ul class=\"ml\"><li>Restate the objective and the hard constraints (stealth required, deadline, no-go effects) the choice must respect.</li><li>Lay out each option's expected gain, its exposure/detection risk, and its reversibility side by side.</li><li>Price timing explicitly: what a window opening or closing does to each option's risk and payoff.</li><li>Weigh options against the operation's stated risk appetite, not the analyst's; flag any option that exceeds it.</li><li>Recommend one course with its trigger to execute, and keep a named fallback if the window or the picture shifts.</li></ul>","n":549},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A recommended method, timing, and accepted risk level, with the reasoning.</li><li>A comparison of the rejected options and why they lost.</li><li>The execute-trigger and the fallback branch.</li></ul>","n":181}],"m":{"name":27,"desc":343,"body":1204,"file":1808,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":33.5},"name":{"lim":64,"pct":42.2}}}},"multi-source-fusion":{"slug":"multi-source-fusion","pillar":"analysts","name":"multi-source-fusion","description":"Consolidate disconnected strands — your own on-box take, passive collection, open sources, prior operations and human or business context — into one coherent target picture by resolving entities across sources, correlating on shared keys, and naming convergence and contradiction while weighting genuinely independent corroboration over volume from one echoing feed.","family":"take-handling","ported":false,"source":"docs/roles/operational-analyst.md#L100","summary":"Consolidate every strand of intelligence — your own take, collection feeds, open sources, and non-technical context — into a single coherent picture of the target that is greater than the sum of its sources.","file":"acordia-analysts/skills/multi-source-fusion/SKILL.md","used_by":[],"intro":"<p># Multi-Source Fusion &amp; Correlation</p>","secs":[{"t":"Objective","h":"<p>Consolidate every strand of intelligence — your own take, collection feeds, open sources, and non-technical context — into a single coherent picture of the target that is greater than the sum of its sources.</p>","n":207},{"t":"When to use","h":"<ul class=\"ml\"><li>When multiple sources touch the same target and no single one gives you the full answer, so the truth lives in the correlation.</li><li>Before a decision that depends on a unified read (where to move, what to trust, when to act) rather than on any one feed.</li></ul>","n":253},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory every strand: on-box take, passive/network collection, OSINT, prior operations, and human/business context — tag each with source, reliability, and timestamp.</li><li>Resolve entities across sources — reconcile hostnames, IPs, identities, and accounts so the same object is one object, not several.</li><li>Correlate on shared keys (identity, host, time, infrastructure) and look for convergence (independent sources agreeing) and contradiction (sources that cannot both be true).</li><li>Weight by source reliability and independence; corroboration from genuinely independent sources beats volume from one echoing feed.</li><li>State the fused picture as a judgement, not a data dump: what is known, what is inferred, what remains a gap.</li></ul>","n":726},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A single fused target picture with entities resolved and sources cross-referenced.</li><li>Convergence points (high-confidence facts) and contradictions flagged for resolution.</li><li>A source-reliability trail so any conclusion can be walked back to its evidence.</li></ul>","n":255}],"m":{"name":19,"desc":366,"body":1544,"file":2143,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":35.7},"name":{"lim":64,"pct":29.7}}}},"naming-the-gaps":{"slug":"naming-the-gaps","pillar":"analysts","name":"naming-the-gaps","description":"Convert a vague sense of knowing too little into a ranked list of intelligence gaps, each phrased as an answerable question with a collection route and an owner, plus a decide-anyway line for the gaps you will carry as open risk, when a picture feels good enough to act on or collection is running with nobody able to say what it should answer.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md#L68","summary":"Convert a vague sense of \"we don't know enough\" into an explicit, prioritised list of intelligence gaps, each tied to a way to close it, so collection is aimed instead of opportunistic.","file":"acordia-analysts/skills/naming-the-gaps/SKILL.md","used_by":[],"intro":"<p># Naming the Gaps</p>","secs":[{"t":"Objective","h":"<p>Convert a vague sense of &quot;we don't know enough&quot; into an explicit, prioritised list of intelligence gaps, each tied to a way to close it, so collection is aimed instead of opportunistic.</p>","n":185},{"t":"When to use","h":"<ul class=\"ml\"><li>Before committing a method, timing, or targeting decision that rests on assumed facts.</li><li>When collection is running but nobody can say what it is actually meant to answer.</li></ul>","n":173},{"t":"Method","h":"<ul class=\"ml\"><li>Restate the decision the picture must support; every gap is judged by whether it changes that decision.</li><li>Walk the target model deliberately (access, structure, defences, people, timing) and mark each element as observed, inferred, or blank.</li><li>For each blank, name the specific question in answerable form, not a topic (&quot;does host X reboot nightly?&quot; not &quot;patching&quot;).</li><li>Rank gaps by leverage over the decision times feasibility of closing them; drop the merely-interesting.</li><li>Assign each priority gap a collection route (existing access, new access needed, or open-source) and an owner.</li></ul>","n":587},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A ranked gap list, each item phrased as an answerable question.</li><li>A collection tasking: what to look at, through which access, and by when.</li><li>A &quot;decide anyway&quot; line marking which gaps you will accept as open risk.</li></ul>","n":215}],"m":{"name":15,"desc":344,"body":1245,"file":1814,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":33.6},"name":{"lim":64,"pct":23.4}}}},"nontechnical-context-integration":{"slug":"nontechnical-context-integration","pillar":"analysts","name":"nontechnical-context-integration","description":"Fold the non-technical world into the picture — reporting lines and who truly holds access rather than the title, fiscal calendar, deals, funding and vendor dependencies, geopolitical and regulatory pressure, workload and morale — binding each item to a technical consequence, when behaviour is only explicable through a quarter-end freeze, a merger or a layoff, or when choosing timing and pretext.","family":"take-handling","ported":false,"source":"docs/roles/operational-analyst.md#L101","summary":"Fold the non-technical world — finance, geopolitics, organisational structure, and the human context of the target — into the operational picture so technical observations gain meaning and intent.","file":"acordia-analysts/skills/nontechnical-context-integration/SKILL.md","used_by":[],"intro":"<p># Non-Technical Context Integration</p>","secs":[{"t":"Objective","h":"<p>Fold the non-technical world — finance, geopolitics, organisational structure, and the human context of the target — into the operational picture so technical observations gain meaning and intent.</p>","n":196},{"t":"When to use","h":"<ul class=\"ml\"><li>When network behaviour is only explicable through business, political, or human drivers (a quarter-end freeze, a merger, a layoff, a holiday).</li><li>When choosing targets, timing, or pretext, where the human and organisational context is the real terrain.</li></ul>","n":253},{"t":"Method","h":"<ul class=\"ml\"><li>Map the organisation: reporting lines, key personnel, decision-makers, admins, and who actually holds access versus who holds a title.</li><li>Pull financial and business context — fiscal calendar, funding, deals, dependencies, vendors — that shapes attention, budget, and change windows.</li><li>Read geopolitical and regulatory context that raises or lowers the target's defensive posture, alert level, and tolerance for risk.</li><li>Profile the human factors — workload, morale, turnover, blame culture — that predict where mistakes, shortcuts, and unlocked doors appear.</li><li>Bind each context item to a technical consequence: what it makes more likely, more visible, or more forgivable on the wire.</li></ul>","n":685},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>An org and human map annotated with access, influence, and exploitable pressure points.</li><li>Business/geopolitical calendar of windows that change defender attention and target behaviour.</li><li>Context-to-technical links that turn raw activity into intent and opportunity.</li></ul>","n":267}],"m":{"name":32,"desc":399,"body":1504,"file":2158,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":1024,"pct":39.0},"name":{"lim":64,"pct":50.0}}}},"os-host-internals":{"slug":"os-host-internals","pillar":"analysts","name":"os-host-internals","description":"Read one specific host's true state from collected process, service, autorun and scheduled-task material, and work its platform-native mechanisms — token and privilege abuse, SUID and sudo, service, DLL and dylib hijacks, driver exposure, integrity controls — when you must escalate, persist or pivot from that host and predict how it will log and police the attempt.","family":"target-modelling","ported":false,"source":"docs/roles/operational-analyst.md#L84","summary":"Apply deep operating-system knowledge to a target host so you can read its true state, find privilege and persistence footholds, and operate within its native mechanisms rather than against them.","file":"acordia-analysts/skills/os-host-internals/SKILL.md","used_by":[],"intro":"<p># OS &amp; Host Internals</p>","secs":[{"t":"Objective","h":"<p>Apply deep operating-system knowledge to a target host so you can read its true state, find privilege and persistence footholds, and operate within its native mechanisms rather than against them.</p>","n":195},{"t":"When to use","h":"<ul class=\"ml\"><li>When you have a foothold and must escalate, persist, or pivot from a specific host.</li><li>When you need to predict how a host will respond to an action — logging, EDR, integrity controls, isolation.</li></ul>","n":196},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the collected host material with <code>ls</code> / <code>find</code> / <code>glob</code> — mounted image trees, process listings, autoruns exports, service manifests, scheduled-task dumps, <code>.plist</code> bundles — before opening any single file.</li><li>Establish host context: OS/version, patch level, privilege model, running processes/services, scheduled tasks/daemons, and installed security tooling. Drive reads with <code>grep</code>/<code>rg</code> against structured exports (<code>Get-CimInstance</code> / WMI output, <code>systemctl list-unit-files</code>, <code>launchctl list</code>, autoruns CSV); open only the matched entries by line range, not the full multi-megabyte export wholesale.</li><li>Identify escalation vectors native to the platform — token/privilege abuse, SUID/sudo, service and DLL/dylib hijacks, misconfigured ACLs, kernel/driver exposure.</li><li>Locate credential and secret material at rest and in memory (LSASS/keyring/keychain, tokens, caches, config).</li><li>Choose persistence that matches the platform's legitimate mechanisms and survives reboot without standing out.</li><li>Model the host's observation surface: what is logged, what EDR sees, and how to act inside normal process behaviour.</li><li>Cite every finding by <code>&lt;image-path&gt;@L&lt;line&gt;</code> for text-like exports (autoruns CSV, <code>.reg</code> dumps, <code>plist</code> XML, shell histories) or <code>&lt;image-path&gt;:&lt;byte-offset&gt;</code> for binary registry hives, raw memory, and keychain files so a peer can re-open the exact key, service, or scheduled task.</li><li>If <code>impacket-secretsdump</code>, <code>regripper</code>, <code>evtx_dump</code>, <code>plutil</code>, <code>chainbreaker</code>, or a similar named parser is unavailable, either substitute a documented equivalent (<code>hivex</code>, <code>python-registry</code>, <code>plistutil</code>) or flag the gap and stop — never infer registry or keychain contents from a hex dump alone.</li></ul>","n":1703},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>Host state and privilege map with concrete escalation candidates.</li><li>Credential/secret locations and access method.</li><li>Persistence options ranked by durability vs detectability, plus the host's logging/EDR blind spots.</li></ul>","n":218},{"t":"Credential extraction","h":"<p>Per-OS map of on-disk and in-memory credential stores. Extraction is passive analysis of already-collected material (disk image, memory dump, exfiltrated profile) — never touches the live host beyond collection.</p><p><strong>Windows</strong></p><ul class=\"ml\"><li><code>SAM</code> / <code>SECURITY</code> / <code>SYSTEM</code> hives (<code>%SYSTEMROOT%\\System32\\config\\</code>) — local NTLM hashes, LSA secrets (machine account, service credentials, cached DPAPI key). Extract with <code>impacket-secretsdump -sam SAM -security SECURITY -system SYSTEM LOCAL</code>.</li><li>DPAPI — user master keys at <code>%APPDATA%\\Microsoft\\Protect\\&lt;SID&gt;\\</code>; system master keys at <code>%SYSTEMROOT%\\System32\\Microsoft\\Protect\\S-1-5-18\\</code>. Decrypt chain: LSA <code>DPAPI_SYSTEM</code> → system master key → user master key → credential blob. Tool: <code>impacket-dpapi</code>.</li><li>Credential Manager — <code>%APPDATA%\\Microsoft\\Credentials\\</code> (user) and <code>%SYSTEMROOT%\\System32\\config\\systemprofile\\AppData\\Local\\Microsoft\\Credentials\\</code> (system) blobs; unwrap through DPAPI.</li><li>Browser saved passwords — Chrome/Edge <code>Login Data</code> SQLite in the profile dir; <code>password_value</code> column is DPAPI-encrypted (per-user). Firefox <code>logins.json</code> + <code>key4.db</code> (NSS-encrypted; primary password may be empty).</li><li>Wi-Fi / VPN / RDP creds — <code>netsh wlan export profile key=clear</code> output if pre-collected; <code>.rdp</code> files with <code>password 51:b:</
