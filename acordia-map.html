The cheapest pivot in Aleph, and often the one that finds the connection.</li><li><code>similar_entities</code> / <code>match_entity</code> — identity resolution. <code>match_entity</code> takes an FtM fragment you supply, so it is the way to check a name obtained elsewhere in the operation against the whole index.</li><li><code>get_profile</code> / <code>profile_tags</code> / <code>profile_similar</code> / <code>expand_profile</code> — <strong>the identity question already answered.</strong> When a search hit or expansion result carries a <code>profile_id</code>, an investigator has recorded that several entities are one actor; <code>get_profile</code> returns those constituents plus a <code>merged</code> pseudo-entity combining their properties. Prefer the profile-scoped pivot over the entity-scoped one whenever a profile exists: the entity you happened to find is one fragment of the actor, so an ownership edge or phone number recorded on a different fragment is invisible from where you are standing. <code>get_entityset</code> reads a curated set's own record — its type, label and curator — where <code>entityset_items</code> reads its contents.</li><li><code>list_entitysets</code> / <code>entityset_items</code> — lists, network diagrams and timelines curated by human investigators. Read them before re-deriving the same structure yourself.</li><li><code>xref_results</code> — matches already computed between this collection and other datasets (sanctions lists, registries). Empty means no cross-reference has been run, not that there are no matches.</li></ul><li><strong>Read text last, and bounded.</strong> <code>get_entity_text</code> with <code>offset</code>/<code>limit</code>; check <code>total_chars</code> and <code>truncated</code> before asking for more. A search with <code>highlight</code> usually settles whether a term occurs; only read the body when you need the surrounding argument.</li><li><strong>Script the repetitive part.</strong> Per <code>analytic-tooling-scripting</code>: when the same pivot must run over dozens of entities, write the loop and aggregate the results, rather than issuing dozens of interactive calls and reading each one.</li></ol>","n":6079},{"t":"Limits that change the method","h":"<p>These are Aleph's, not the tool's, and no amount of paging works around them:</p><ul class=\"ml\"><li><strong><code>limit + offset</code> may never exceed 9999</strong> on entity search — Elasticsearch's result window. Deep pagination is therefore <em>not</em> a way to read a whole collection. If a result set is larger, it must be split by facet (per schema, per collection, per country, per date range) or narrowed. A tool that clamps this silently would let you believe you reached the end; treat any total above 9999 as &quot;unenumerated&quot;.</li><li><strong>Graph expansion has a separate, much lower ceiling</strong> — 200 entities per property by default. A <code>count</code> above that means you saw a sample of that edge, and you must say so.</li><li><strong>A reported total is a floor, not a count.</strong> Aleph caps the number it reports at 10,000. <code>total: 10000</code> means &quot;at least 10,000&quot;, so never quote it as a population figure — facet instead, because facet buckets carry true counts.</li><li><strong><code>caption</code> is derived, not guaranteed.</strong> Many instances return no caption at all. Under the tools one is derived for you from the instance's own per-schema property ordering, so <code>caption</code> is populated even where Aleph sent none. Under <code>curl</code> it is your problem: fall back to <code>properties.name</code>, <code>properties.fileName</code> or <code>properties.title</code>, and never conclude an entity is unnamed because the caption came back empty.</li><li><strong>Bulk export needs a write-scoped key.</strong> <code>GET /api/2/collections/&lt;id&gt;/_stream</code> requires WRITE on the collection; the global stream requires admin. An analyst holding a read-only key cannot stream a collection out, by design. If a full local copy is genuinely required, that is a human-run <code>aleph-coldbackup</code> job, not something to attempt from the session.</li><li><strong>Rate limiting</strong> is around 30 requests/minute for unprivileged callers. Prefer one faceted query over twenty narrow ones.</li></ul>","n":1798},{"t":"Assessing the take","h":"<p>Feed what you find into <code>assessing-take-value</code> rather than treating an Aleph hit as fact:</p><ul class=\"ml\"><li><strong>Provenance is per collection, not per instance.</strong> A <code>Person</code> from a leaked archive and a <code>Person</code> from a sanctions list carry entirely different weight. Always carry <code>collection_id</code> with a claim — and check it against the collection you scoped to, because an unscoped or wrongly-scoped search returns rows that are well-formed, ranked and plausible while belonging to a dataset you never meant to read. A hit whose own <code>collection_id</code> is not the one you asked for is the only symptom that failure has.</li><li><strong>Entities are derived, not observed.</strong> Most were generated by extraction or by a mapping over a source table. An <code>Ownership</code> edge is only as good as the registry row behind it.</li><li><strong>Cross-reference matches are candidates; a profile is a decision.</strong> <code>xref_results</code> and <code>similar_entities</code> return scores, and a match without a human <code>judgement</code> is a hypothesis — route it through <code>hypothesis-testing</code>, not into the picture. A <code>profile_id</code> is the other side of that: someone already judged those entities to be one actor, which upgrades a candidate to a recorded decision. Treat it as evidence of a human decision, not as ground truth — it is scoped to a collection, it can be wrong, and <code>profile_similar</code> shows you what that decision left unresolved.</li><li><strong>Currency matters.</strong> Registry-derived collections go stale; check the collection's <code>updated_at</code> before asserting a present-tense relationship.</li><li><strong>Absence proves little.</strong> Not finding a name may mean the corpus never covered that jurisdiction. Say which collections you actually searched, and name the gap through <code>naming-the-gaps</code>.</li></ul>","n":1682},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A named set of entities with ids and collection provenance, not a list of documents.</li><li>The relationship paths that were actually walked, with the property names traversed and any edge whose <code>count</code> exceeded the expansion cap flagged as partial.</li><li>Identity-resolution decisions made explicit: which entities you treated as the same actor, and on what evidence.</li><li>A coverage statement: which collections were searched, which queries were run, and which result sets exceeded the 9999 ceiling and were therefore only sampled.</li></ul>","n":523},{"t":"Guardrails","h":"<ul class=\"ml\"><li><strong>Read only.</strong> This skill searches, expands and reads. It never ingests, writes, tags, cross-references on demand, or deletes — those change another team's investigation. If a write is genuinely needed, hand it to the operator or the human, do not attempt it.</li><li>The API key is expected to be READ-scoped; if a call fails with 403 mentioning WRITE or admin, that is the boundary working, not an obstacle to route around.</li><li>Never place raw credential values, personal identifiers beyond what the judgement requires, or bulk document text into a report. Report classifications, entity ids and provenance.</li></ul>","n":603}],"summary":"This skill is **procedural and non-grid**. It corresponds to no row of the competency grid in `docs/roles/operational-analyst.md`; it composes existing rows — `multi-source-fusion`, `data-integration-tooling`, `exhaustive-data-processing`, `assessing-take-valu","used_by":["collection-analyst","cyber-analyst","mission-analyst","overwatch-analyst","terrain-analyst"],"m":{"name":18,"desc":175,"body":16465,"file":17018,"dband":"optimal","bband":"over","ceil":{"desc":{"lim":200,"pct":87.5},"name":{"lim":64,"pct":28.1}}}},"analyst-loop":{"slug":"analyst-loop","pillar":"analysts","name":"analyst-loop","description":"Run one full analytic round over a live operation — mission, terrain, defender and take reads, then judgement and next move — when fresh material lands or a decision point is reached.","family":"analytic-spine","ported":false,"source":"openspec/changes/archive/2026-07-22-analyst-loop-skill/proposal.md","file":"acordia-analysts/skills/analyst-loop/SKILL.md","intro":"<h2 class=\"mh\">Analyst Loop</h2>","secs":[{"t":"Cross-cutting notice","h":"<p>This skill is <strong>procedural and cross-cutting</strong>. It does not correspond to a row in the competency-grid appendix of <code>docs/roles/operational-analyst.md</code> — it names the <em>workflow</em> that composes the grid's competencies, not a competency of its own. It reuses the analytic-spine skills (<code>reasoning-under-uncertainty</code>, <code>hypothesis-testing</code>, <code>key-assumptions-check</code>, <code>calibrated-confidence</code>, <code>naming-the-gaps</code>, <code>outcome-judgement</code>, <code>gain-loss-calculus</code>) and the four legs' specialist reads. Adding it as a grid row would inflate the competency map with a loop, not a competency; it lands under the same procedural-skill exception that <code>credential-harvest-triage</code> uses.</p>","n":661},{"t":"Objective","h":"<p>Turn the current state of an operation into a recommended course of action by running one full analytic round — mission read, terrain read, defender read, take read, judgement, next move — and closing the loop on whichever of the operation's three ends is in play: an <strong>effect</strong> (break, deny, manipulate), <strong>intelligence</strong> (collect), or <strong>access</strong> held because it may become useful later. The same access often serves more than one, so the loop is end-neutral; it is not end-agnostic, because collection and effect compete for that access and pull in opposite directions.</p>","n":571},{"t":"When to use","h":"<ul class=\"ml\"><li>New material has landed (collection, a completed action, fresh defender signal) and the picture needs a fresh pass.</li><li>The operation is between decision points and the operator wants a full round rather than a single narrow read.</li><li>An action has just been taken and the question is <em>did we get there, and what now?</em></li></ul>","n":316},{"t":"Loop shape","h":"<p>Six steps. Four dispatch to the leg that owns them; the last two are the orchestrator's own.</p><ol class=\"ml\"><li><strong>Mission read</strong> — through <code>mission-analyst</code>: what the target is for, what it depends on, how it behaves, when it will change, how much friction it would absorb — and, after an action, whether the <em>organisation</em> changed.</li><li><strong>Terrain read</strong> — through <code>terrain-analyst</code>: what the estate is made of, where movement opens and closes, what the trust between systems allows — and, after an action, whether the <em>system</em> changed, as distinct from whether the payload ran.</li><li><strong>Defender read</strong> — through <code>overwatch-analyst</code>: will this be seen, is it being seen right now, is the operation still clean, and what does our own footprint reveal (the are-we-seen half of &quot;did it land&quot;).</li><li><strong>Take read</strong> — through <code>collection-analyst</code>: is the material real, what does it say in its own domain and language, is it worth what it cost, and what does the operation already know (the value-of-the-take half of &quot;did it land&quot;).</li><li><strong>Judgement</strong> — the orchestrator's own, and <strong>not delegated</strong>: hold the fused picture and reach one calibrated call using the analytic spine (<code>reasoning-under-uncertainty</code>, <code>hypothesis-testing</code>, <code>key-assumptions-check</code>, <code>outcome-judgement</code>, <code>gain-loss-calculus</code>), attributing each hypothesis to the leg that raised it. There is no fusion step in this loop because fusing is the orchestrator's work: a picture assembled in a leg and passed back arrives stripped of the detail that made it a judgement.</li><li><strong>Next move</strong> — name the recommended action and the end it serves: continue, pivot, go quiet, move, or pull out. End-neutral across all three ends — effect, intelligence, or access held for later use — say which was in play, whether it was met, and what follows. Because the analyst does not execute, the move is a recommendation handed to a human operator.</li></ol>","n":1869},{"t":"Loop invariants","h":"<ul class=\"ml\"><li><strong>End-neutral closure.</strong> Every pass reaches a judgement <em>and</em> a next move. &quot;Insufficient information&quot; is not a stopping point — it is a gap to name and a collection task to hand back.</li><li><strong>Gap-naming on every judgement.</strong> Run <code>naming-the-gaps</code>: state the specific reads you do not yet have and what would close them. The loop's output includes the gaps that bound it.</li><li><strong>Calibrated confidence on every judgement.</strong> Run <code>calibrated-confidence</code>: attach a confidence band to each claim; where the legs disagree, surface the disagreement rather than averaging it away.</li><li><strong>Passive posture.</strong> The loop reads, models, and judges. It never acts — no file edits, no payloads, no credential validation. Execution belongs to the human operator the analyst advises, so the loop's outcome judgement rests on evidence reported back rather than observed first-hand; say which is which.</li><li><strong>Handoff discipline.</strong> Each dispatch carries the objective, the operating logic, the stage, the tempo, the risk tolerance, what is already established, and what must not be touched; each return carries what was done, what was learned, its confidence, the exposure it incurred, and what was deliberately not done. The boundary between units is where mistakes enter, and this is what keeps them out.</li></ul>","n":1274},{"t":"Where this runs","h":"<p>This is the <strong>orchestrator's</strong> loop — <code>cyber-analyst</code> runs it, dispatching the four legs and fusing their reads into one judgement itself. A leg subagent is a leaf specialist that answers its own scoped question; if a leg session matches this skill, it should <strong>surface the need for a full pass back to the orchestrator</strong> rather than attempt the loop itself (a leg cannot dispatch other legs). A future pillar — Research is the ACORDIA-aligned next one — can model its own end-neutral loop on this one, or define a <code>&lt;pillar&gt;-loop</code> sibling and cite this skill as prior art.</p>","n":572},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A single recommended course of action tied to the end in play — effect, intelligence, or access held for later use — addressed to the human operator who will act on it.</li><li>Per-hypothesis attribution to the leg that raised it, each with a calibrated-confidence band.</li><li>The named gaps that bound the judgement and the next collection or method that would close each.</li><li>A next-move call: continue / pivot / go quiet / move / pull out.</li></ul>","n":432}],"summary":"This skill is **procedural and cross-cutting**. It does not correspond to a row in the competency-grid appendix of `docs/roles/operational-analyst.md` — it names the *workflow* that composes the grid's competencies, not a competency of its own. It reuses the a","used_by":["cyber-analyst"],"m":{"name":12,"desc":183,"body":5855,"file":6248,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":91.5},"name":{"lim":64,"pct":18.8}}}},"analytic-tooling-scripting":{"slug":"analytic-tooling-scripting","pillar":"analysts","name":"analytic-tooling-scripting","description":"Script your own parser or transform for the take's format, reconciling output records against an inventory denominator so a silent parse failure cannot hide, when no tool fits.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/analytic-tooling-scripting/SKILL.md","intro":"<h2 class=\"mh\">Analytic Tooling &amp; Scripting</h2>","secs":[{"t":"Objective","h":"<p>Build and wield your own scripts and tools to process, transform, and interrogate collected data — the cross-cutting baseline that lets an analyst move faster than the take piles up.</p>","n":182},{"t":"When to use","h":"<ul class=\"ml\"><li>When analysis is repetitive, large, or format-specific enough that a script beats manual work.</li><li>When no off-the-shelf tool fits the data or the question, and you must make one.</li></ul>","n":179},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the take before writing anything: enumerate the inputs with <code>ls</code>/<code>find</code>/<code>glob</code> and a file-typing pass, and record the record or byte count each input should yield, so the tool has a denominator to reconcile against.</li><li>Reach for the right tool: shell and pipes for quick triage, a scripting language (Python) for structured parsing, transformation, and joins.</li><li>Write parsers/extractors for the take's real format — decode, deserialise, and flatten proprietary or nested structures into something queryable — and run them over 100% of the records, never against the opening sample alone: a parser validated on the first rows and let loose on the rest is how a head sample masquerades as full coverage.</li><li>Reconcile coverage explicitly: assert the output record count against the inventory denominator and account for every dropped or unparsed record, so a silent parse failure cannot shrink the dataset unnoticed.</li><li>Automate the repeatable: encode recurring correlation, enrichment, and filtering as reusable scripts, not one-off keystrokes, and carry each derived row's provenance (<code>&lt;source-path&gt;:&lt;offset&gt;</code> or <code>&lt;source&gt;@L&lt;line&gt;</code>) so a conclusion can be traced back to the source record.</li><li>Validate your tooling against known-good samples so a parsing bug doesn't silently manufacture a false conclusion.</li><li>Keep tradecraft on the tools themselves — mind where they run, what they touch, and what traces the analysis environment leaves.</li><li>Degradation: if no parser exists for a format and one cannot be written in the time available, process what is parseable, quarantine the remainder, and report the uncovered fraction rather than treating the parsed subset as the whole.</li></ul>","n":1682},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>Reusable scripts/tools that convert raw take into structured, queryable answers.</li><li>Automated pipelines for recurring parse-enrich-correlate work.</li><li>Validated transforms with confidence that outputs reflect the source, not a bug.</li></ul>","n":230}],"summary":"Build and wield your own scripts and tools to process, transform, and interrogate collected data — the cross-cutting baseline that lets an analyst move faster than the take piles up.","used_by":[],"m":{"name":26,"desc":176,"body":2374,"file":2854,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":88.0},"name":{"lim":64,"pct":40.6}}}},"assessing-take-value":{"slug":"assessing-take-value","pillar":"analysts","name":"assessing-take-value","description":"Judge whether collected take is genuine, complete, current and worth having rather than truncated, corrupted or a planted deception feed, before anything is built on it.","family":"take-handling","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/assessing-take-value/SKILL.md","intro":"<h2 class=\"mh\">Assessing Value/Quality of the Collected Take</h2>","secs":[{"t":"Objective","h":"<p>Judge whether the collected take is real, reliable, and operationally valuable — the collection half of &quot;did it land&quot; — so downstream analysis is not built on noise, decoys, or worthless data.</p>","n":192},{"t":"When to use","h":"<ul class=\"ml\"><li>Right after a collection action, before the take is fused or acted on.</li><li>When deciding whether a source or feed is earning its risk and effort, or should be dropped.</li></ul>","n":167},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the delivered take before judging it: enumerate the files, records, or streams with <code>ls</code>/<code>find</code>/<code>glob</code> and a file-typing pass, and record the expected size or record count so completeness can be measured against a denominator rather than a feeling.</li><li>Verify authenticity first, over exhaustive coverage: is this the real thing, or truncated, corrupted, decrypted-wrong, or a deception feed placed for you to find? Run a tool pass (<code>grep</code>/<code>rg</code>/a parser) across 100% of the bytes or records — a truncation or corruption verdict read off the opening portion is exactly the failure this discipline exists to prevent — and read only the located anomalies into context.</li><li>Assess completeness and freshness — how much of the intended target did you actually get against the inventory count, and is it current or already superseded.</li><li>Test relevance against the requirement: does this take answer a real question, or is it volume that merely feels like progress; cite the evidence behind each verdict as <code>&lt;path&gt;:&lt;offset&gt;</code> or <code>&lt;path&gt;@L&lt;line&gt;</code>.</li><li>Estimate value against cost and exposure: what the take is worth versus the risk, time, and access burned to obtain it.</li><li>Grade the source's track record — does this feed reliably produce, and does its output corroborate against independent strands.</li><li>Degradation: if a parser for the take's format is unavailable, fall back to <code>strings</code> and structural sampling for an authenticity read and flag that completeness is unverified; if the take is encrypted and no key is at hand, record what can and cannot be judged rather than passing it as sound.</li></ul>","n":1595},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A take-quality verdict: authentic/complete/fresh/relevant, with each dimension scored.</li><li>Value-versus-cost judgement on whether to keep, re-collect, or abandon the source.</li><li>Flags for suspected deception, staleness, or partial collection that must caveat any downstream use.</li></ul>","n":276}],"summary":"Judge whether the collected take is real, reliable, and operationally valuable — the collection half of \"did it land\" — so downstream analysis is not built on noise, decoys, or worthless data.","used_by":[],"m":{"name":20,"desc":169,"body":2348,"file":2779,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":84.5},"name":{"lim":64,"pct":31.2}}}},"briefing-reporting":{"slug":"briefing-reporting","pillar":"analysts","name":"briefing-reporting","description":"Compose a bottom-line-up-front product — judgement, action, confidence, gaps, a dated ask — when a read must be handed to a decision-maker and acted on directly.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/briefing-reporting/SKILL.md","intro":"<h2 class=\"mh\">Briefing &amp; Written Reporting</h2>","secs":[{"t":"Objective","h":"<p>Communicate the operational picture and the recommended course of action crisply, so the recipient can decide and act without reconstructing your analysis or misreading your confidence.</p>","n":185},{"t":"When to use","h":"<ul class=\"ml\"><li>Handing off a judgement, a target read, or a recommended move to a decision-maker or the next operator.</li><li>Producing a written product (spot report, target package, after-action) others will act on.</li></ul>","n":199},{"t":"Method","h":"<ul class=\"ml\"><li>Lead with the bottom line: the judgement and the recommended action, before any supporting detail.</li><li>Separate fact from inference from recommendation, and mark the confidence on each (see calibrated-confidence).</li><li>Give only the evidence that changes the decision; push the rest to an annex, and name the key gaps and risks plainly.</li><li>Match depth to the audience and the clock — a two-line spot report and a full target package are different products.</li><li>State what you need from the reader: a decision, a resource, or an acknowledgement, with the deadline.</li><li><strong>Render with a parser, never a regex.</strong> When the product must also exist in a second format — HTML, PDF, a deck — convert the source with a real parser for that format rather than a hand-written line-prefix pass. Inline emphasis, code spans, tables and inline links are exactly what a regex converter drops, and it drops them without erroring. Probe for an available parser, and say which one you used. Render only your own prose as markup: turn the parser's raw-HTML passthrough off and escape any markup inside quoted evidence, because the product carries verbatim material from the corpus and a real parser will render what a regex pass left inert — into the browser of the person you are briefing.</li><li><strong>Cite identifiers in full.</strong> A shortened hash or a truncated id reads as a citation and cannot be looked up. Carry the whole identifier into the product however long it is, and let the rendering shorten what is <em>displayed</em> rather than what is recorded. This governs identifiers that exist to be resolved — an entity or document id, a content hash, a case or ticket reference. It is never a licence to reproduce a secret or a subject's personal data: a credential, token or key is not cited at all, whatever its length, and a personal identifier is carried only as far as the judgement requires. Those are cited by classification and fingerprint, per <code>credential-harvest-triage</code>.</li></ul>","n":1944},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A bottom-line-up-front judgement and recommendation.</li><li>Confidence, key assumptions, and gaps flagged inline.</li><li>An explicit ask: the decision or action required, by when.</li><li>When the product is written to disk it lands in <code>.acordia/reports/</code>, the convention every analyst follows; returning it in-message instead is equally correct when the caller only needs the judgement.</li><li>A rendered product verified twice over: no source-format tokens survive in the output, and a sample of its evidence references has been resolved against the system that issued them — the instance, casefile or store you already read from, using the same read call that produced the reference. Resolve nothing else: not a URL that appears inside the material you are citing, and nothing target-owned or third-party, which would turn writing the report into an active touch. A reference that renders is not a reference that works — a truncated identifier produces a well-formed link to nothing, and counting links detects neither failure.</li></ul>","n":1011}],"summary":"Communicate the operational picture and the recommended course of action crisply, so the recipient can decide and act without reconstructing your analysis or misreading your confidence.","used_by":[],"m":{"name":18,"desc":161,"body":3440,"file":3881,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":80.5},"name":{"lim":64,"pct":28.1}}}},"c2-beacon-exfil-analysis":{"slug":"c2-beacon-exfil-analysis","pillar":"analysts","name":"c2-beacon-exfil-analysis","description":"Examine your own C2 and exfil traffic as a defender would — JA3, JARM, SNI, beacon interval and jitter — and tune it below their thresholds, when NDR or TLS inspection is up.","family":"defender-reading","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/c2-beacon-exfil-analysis/SKILL.md","intro":"<h2 class=\"mh\">C2 / Beacon / Exfil-Signal Analysis</h2>","secs":[{"t":"Objective","h":"<p>Examine the operation's own C2, beacon, and exfiltration behavior from the network defender's viewpoint to identify detectable signatures — protocol, timing, volume, and reputation — and tune the channel to stay below their thresholds.</p>","n":235},{"t":"When to use","h":"<ul class=\"ml\"><li>When standing up, tuning, or migrating a C2 channel or exfil path.</li><li>After a network-detection capability (NDR, proxy, DNS analytics, NetFlow, TLS inspection) is discovered in the environment.</li></ul>","n":194},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the channel-evidence set with <code>ls</code> / <code>find</code> / <code>glob</code> — own-side pcap of the beacon, Zeek/flow exports of the exfil path, profile files (malleable C2, redirector config), proxy/DNS logs from the environment — and note capture point, timespan, and byte size per artefact before opening.</li><li>Characterize the channel's observable fingerprint from bounded reads: JA3/JARM via <code>tshark -Y tls.handshake.type==1 -T fields ...</code> or <code>zeek -r</code>'s <code>ssl.log</code>; TLS cert and SNI, domain/IP reputation, HTTP headers/URIs, DNS query patterns, protocol anomalies — pulled per conversation, not per full capture.</li><li>Analyze beacon behavior a defender baselines against from Zeek <code>conn.log</code> aggregates: interval regularity, jitter, packet sizing, connection frequency, and long-lived or off-hours sessions.</li><li>Model exfil detectability: volume vs. baseline (flow aggregates), destination reputation, timing, and DLP content triggers; prefer low-and-slow or blend-with-normal egress.</li><li>Map each signature to the specific network sensor that would catch it and estimate alert likelihood. Cite each finding as <code>&lt;pcap&gt;:&lt;packet-number&gt;</code> for packet-level evidence, <code>&lt;log&gt;@L&lt;line&gt;</code> for Zeek / proxy / DNS log lines, and <code>&lt;profile&gt;@L&lt;line&gt;</code> for malleable / redirector config anchors.</li><li>Recommend tuning — domain fronting/redirectors, malleable profiles, jitter, protocol choice, chunking — weighed against the cost and the risk the tuning itself is anomalous.</li><li>Degradation: if <code>tshark</code>/Wireshark is unavailable, fall back to Zeek logs (or <code>tcpdump -r ... -nn</code>) and flag reduced fingerprint fidelity (JA3/JARM may be missing); if Zeek is unavailable, drive from <code>tshark -T fields</code> extraction and flag missing typed-log aggregation; if only netflow is on hand, flag the gap for any payload-dependent signature (JA3, SNI, URI) and constrain analysis to volume/timing.</li></ul>","n":1844},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A signature inventory of the current C2/exfil channel with per-signature detection risk.</li><li>Concrete tuning recommendations and the residual risk after each.</li><li>Egress and beacon indicators handed to Overwatch and the own-footprint ledger.</li></ul>","n":239}],"summary":"Examine the operation's own C2, beacon, and exfiltration behavior from the network defender's viewpoint to identify detectable signatures — protocol, timing, volume, and reputation — and tune the channel to stay below their thresholds.","used_by":[],"m":{"name":24,"desc":174,"body":2620,"file":3070,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":87.0},"name":{"lim":64,"pct":37.5}}}},"calibrated-confidence":{"slug":"calibrated-confidence","pillar":"analysts","name":"calibrated-confidence","description":"Attach a confidence level to a judgement on a stable scale, separating the estimate from its strength and resolvable uncertainty from irreducible, when someone will act on it.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/calibrated-confidence/SKILL.md","intro":"<h2 class=\"mh\">Calibrated Confidence</h2>","secs":[{"t":"Objective","h":"<p>Attach an honest, well-calibrated confidence level to each operational judgement, so the decision-maker knows how much weight it will bear and how much risk they are buying by acting on it.</p>","n":189},{"t":"When to use","h":"<ul class=\"ml\"><li>Whenever a judgement leaves your hands and someone will act on it (target it, time on it, risk on it).</li><li>When &quot;high confidence&quot; is being used as a rhetorical flourish rather than a measured claim.</li></ul>","n":198},{"t":"Method","h":"<ul class=\"ml\"><li>Separate the estimate from its confidence: state what you believe, then separately how strongly and why.</li><li>Base confidence on evidence quality, source independence, and consistency — not on how much you want it to be true.</li><li>Use a consistent scale (e.g. low / moderate / high, or a probability band) and keep its meaning stable across judgements.</li><li>Distinguish resolvable uncertainty (close it with collection) from irreducible uncertainty (structural, accept it).</li><li>Track your hits and misses over the operation and pull your calibration back toward reality.</li></ul>","n":561},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>Each judgement paired with an explicit confidence level and the drivers behind it.</li><li>A note on what would raise or lower that confidence.</li><li>A calibration record that flags chronic over- or under-confidence.</li></ul>","n":208}],"summary":"Attach an honest, well-calibrated confidence level to each operational judgement, so the decision-maker knows how much weight it will bear and how much risk they are buying by acting on it.","used_by":[],"m":{"name":21,"desc":175,"body":1250,"file":1714,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":87.5},"name":{"lim":64,"pct":32.8}}}},"change-cycle-forecasting":{"slug":"change-cycle-forecasting","pillar":"analysts","name":"change-cycle-forecasting","description":"Forecast when the target will patch, upgrade, migrate, rotate credentials or decommission, reading vendor cadence and EOL dates, when an access depends on a config that may vanish.","family":"target-modelling","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/change-cycle-forecasting/SKILL.md","intro":"<h2 class=\"mh\">Change-Cycle Forecasting</h2>","secs":[{"t":"Objective","h":"<p>Predict the timing of target-side change — patches, version upgrades, migrations, credential/key rotation, decommissions — to answer &quot;if and when will the target change?&quot; and set the operational clock accordingly.</p>","n":213},{"t":"When to use","h":"<ul class=\"ml\"><li>When an access or exploit depends on a version/config that may soon disappear (or appear).</li><li>When deciding whether to move now or wait for change-induced exposure (migration windows, fresh deployments, transition states).</li></ul>","n":223},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the change evidence before forecasting: enumerate the sources you hold — changelogs, version banners, cert transparency records, tender notices, job postings, DNS/host snapshots — with <code>ls</code>/<code>find</code>/<code>glob</code> or a saved-query list, and record each with its capture date, since a forecast is only as fresh as its stalest input.</li><li>Identify the target's change drivers: vendor patch cadence, compliance deadlines, contract/renewal cycles, fiscal timing, EOL/support dates.</li><li>Read observable change signals over exhaustive coverage — scan the full changelog or cert history rather than the latest entry, process every version string and host record a query returns, and read only the located deltas into context; a rotation cadence inferred from the most recent entry alone is a head sample.</li><li>Model the maintenance rhythm: change windows, freeze periods, who approves, how slow they historically are to patch.</li><li>Forecast the specific transition and its exposure: what is briefly weaker during a migration or rollout, and for how long, citing the evidence behind each predicted date as <code>&lt;source&gt;:&lt;offset&gt;</code> or <code>&lt;source&gt;@L&lt;line&gt;</code> (or source-plus-capture-date for a live-queried signal).</li><li>Convert to an operational timeline — act-before-close vs exploit-the-churn — with confidence and refresh triggers.</li><li>Degradation: if a changelog or release feed is unavailable, fall back to observable drift (banners, cert dates, host churn) and lower the forecast's confidence explicitly; if no change evidence is obtainable at all, say the timing is unknown rather than anchoring on cadence priors.</li></ul>","n":1589},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>Forecast of likely patch/upgrade/rotation dates with confidence and the evidence behind each.</li><li>Named exposure windows created by transitions.</li><li>Go/wait recommendation tied to the closing or opening of the window.</li></ul>","n":215}],"summary":"Predict the timing of target-side change — patches, version upgrades, migrations, credential/key rotation, decommissions — to answer \"if and when will the target change?\" and set the operational clock accordingly.","used_by":[],"m":{"name":24,"desc":180,"body":2337,"file":2800,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":90.0},"name":{"lim":64,"pct":37.5}}}},"cloud-controlplane-analysis":{"slug":"cloud-controlplane-analysis","pillar":"analysts","name":"cloud-controlplane-analysis","description":"Model a target's AWS, Azure or GCP estate at the control plane from collected exports — IAM policies, service principals, federation — when administration lives in the API.","family":"target-modelling","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/cloud-controlplane-analysis/SKILL.md","intro":"<h2 class=\"mh\">Cloud Control-Plane &amp; Service Analysis</h2>","secs":[{"t":"Objective","h":"<p>Model a target's cloud estate at the control-plane level — services, identities, roles, and inter-service trust — to find where an API call or a misconfigured grant converts into meaningful control or data.</p>","n":206},{"t":"When to use","h":"<ul class=\"ml\"><li>When the target's assets and administration live in a cloud provider rather than (or alongside) on-prem.</li><li>When the real attack surface is IAM policy, service config, and metadata — not network ports.</li></ul>","n":202},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the estate with <code>ls</code> / <code>find</code> / <code>glob</code> across the collected control-plane exports — account/subscription/project rosters, IAM dumps, Terraform state files, CloudTrail/Audit log bundles, <code>aws iam list-*</code> / <code>gcloud * list</code> / <code>az * list</code> snapshots — before opening any single document. Do not call the live control plane.</li><li>Map identity and trust: IAM roles/policies, service principals, workload identities, assume-role/federation chains, and cross-account trust. Drive reads with <code>grep</code>/<code>jq</code> for role ARNs, principal IDs, and trust-policy <code>sts:AssumeRole</code> clauses; open only the matched policy documents by line range, never the full state file.</li><li>Hunt control-plane misconfiguration — over-permissive policies, public resources, exposed secrets/keys, metadata/SSRF paths, logging gaps.</li><li>Trace privilege-escalation and pivot chains through the control plane (role chaining, service-to-service trust, CI/CD and infra-as-code paths).</li><li>Tie control-plane access to mission effect: which grant reaches the crown-jewel data, key vault, or production workload.</li><li>Cite every finding by <code>&lt;export-path&gt;@L&lt;line&gt;</code> for JSON/HCL/YAML exports or <code>&lt;export-path&gt;:&lt;byte-offset&gt;</code> for binary state so a peer can re-open the exact policy statement or state resource.</li><li>If provider CLIs, <code>jq</code>, <code>terraform show</code>, or a similar named parser is unavailable, either substitute a documented equivalent (<code>yq</code>, <code>hcl2json</code>) or flag the gap and stop — never infer trust chains from truncated console screenshots.</li></ul>","n":1493},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>Estate and identity/trust map with cross-account and federation edges.</li><li>Misconfiguration and exposed-credential findings.</li><li>Control-plane escalation/pivot chains reaching high-value assets.</li></ul>","n":192},{"t":"Credential extraction","h":"<p>Passive extraction from cloud artefacts already collected — instance-metadata snapshots, state files, exported configuration, service-account key files. No live cloud API calls to validate; no probing of IMDS endpoints on running targets.</p><p><strong>Instance metadata (IMDS captures)</strong></p><ul class=\"ml\"><li>AWS IMDSv1/v2 capture — parse <code>iam/security-credentials/&lt;role&gt;/</code> JSON for <code>AccessKeyId</code>, <code>SecretAccessKey</code>, <code>Token</code>, <code>Expiration</code>. Session tokens are short-lived; check <code>Expiration</code> before ranking priority.</li><li>GCP metadata capture — <code>computeMetadata/v1/instance/service-accounts/default/token</code> yields an OAuth2 bearer with scope list; <code>identity</code> endpoint yields a signed JWT.</li><li>Azure IMDS — <code>metadata/identity/oauth2/token?resource=...</code> yields a JWT bound to a system- or user-assigned managed identity.</li></ul><p><strong>Service-account key files</strong></p><ul class=\"ml\"><li>GCP <code>type: service_account</code> JSON — contains <code>private_key</code> PEM + <code>client_email</code>; scope inferred from IAM bindings collected separately. <code>-----BEGIN PRIVATE KEY-----</code> is the anchor.</li><li>AWS <code>~/.aws/credentials</code> / <code>~/.aws/config</code> INI — <code>aws_access_key_id</code>, <code>aws_secret_access_key</code>, <code>aws_session_token</code>, plus role-assumption chains via <code>source_profile</code> / <code>role_arn</code>.</li><li>Azure Service Principal JSON — <code>appId</code>, <code>password</code> (or <code>clientSecret</code>), <code>tenant</code>. Certificate-based SPs carry a PFX reference.</li></ul><p><strong>Infrastructure-as-code state</strong></p><ul class=\"ml\"><li>Terraform state (<code>terraform.tfstate</code>, <code>terraform.tfstate.d/</code>, S3-backend copies) — resources of type <code>aws_iam_access_key</code>, <code>aws_db_instance</code> (master_password), <code>random_password</code>, <code>vault_generic_secret</code> write plaintext to state. Search: <code>&quot;sensitive&quot;: true</code> blocks and any <code>password</code>/<code>secret</code>/<code>key</code> attribute.</li><li>CloudFormation exported templates — <code>NoEcho: true</code> parameters land in state but not stack outputs; drift detection can surface them.</li><li>Pulumi state — encrypted by default with a passphrase or KMS key; if the passphrase is in the environment (<code>PULUMI_CONFIG_PASSPHRASE</code>) collected alongside state, extraction becomes a passive offline decrypt.</li></ul><p><strong>Cloud secret stores (exported)</strong></p><ul class=\"ml\"><li>AWS Secrets Manager / Systems Manager Parameter Store — exports typically JSON with <code>Name</code>, <code>Value</code>, <code>Version</code>. Value is plaintext.</li><li>Azure Key Vault secret/certificate exports — <code>.pem</code> / <code>.pfx</code>; certificate exports include private key if the vault permission included it.</li><li>GCP Secret Manager exports — plaintext payload after <code>gcloud secrets versions access</code>.</li></ul><p><strong>Cross-cutting</strong></p><ul class=\"ml\"><li>Cloud-plane credentials frequently have session/time bounds — record <code>Expiration</code> in <code>freshness</code>; expired credentials still classify for correlation but priority drops to P3. Root/organisation-level keys (<code>arn:aws:iam::*:root</code>, GCP <code>roles/owner</code>, Azure <code>Global Administrator</code>) always mark P0. Reporting via <a href=\"../credential-harvest-triage/SKILL.md\"><code>credential-harvest-triage</code></a>; IAM path or ARN identifies the credential, never the secret value.</li></ul>","n":2864}],"summary":"Model a target's cloud estate at the control-plane level — services, identities, roles, and inter-service trust — to find where an API call or a misconfigured grant converts into meaningful control or data.","used_by":[],"m":{"name":27,"desc":172,"body":5096,"file":5562,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":86.0},"name":{"lim":64,"pct":42.2}}}},"cloud-identity-log-analysis":{"slug":"cloud-identity-log-analysis","pillar":"analysts","name":"cloud-identity-log-analysis","description":"Predict what cloud control-plane and identity providers will log about a planned action, preferring the thinner trail, when working a tenant with stolen or federated tokens.","family":"defender-reading","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/cloud-identity-log-analysis/SKILL.md","intro":"<h2 class=\"mh\">Cloud &amp; Identity Log Analysis</h2>","secs":[{"t":"Objective","h":"<p>Reason about what cloud control-plane and identity providers log about activity — sign-ins, token issuance, consent, API/audit events, and their conditional-access signals — so identity and cloud actions are taken in ways that blend with legitimate activity.</p>","n":258},{"t":"When to use","h":"<ul class=\"ml\"><li>Operating against cloud tenants (Entra ID/Azure, AWS, GCP, Okta, Workspace) or using stolen tokens, service principals, or federated identities.</li><li>Planning cloud persistence, privilege escalation, or data access where control-plane logging is the primary witness.</li></ul>","n":265},{"t":"Method","h":"<ul class=\"ml\"><li>Enumerate the relevant log sources (sign-in and audit logs, CloudTrail, Admin/Workspace logs, unified audit) and what fields each captures — IP, device, UA, MFA method, token type, risk score.</li><li>Map each planned action to the events it generates and to the risk/anomaly signals it trips (impossible travel, new device, unusual client, MFA anomalies, consent grants).</li><li>Distinguish control-plane events (usually logged) from data-plane access (often unlogged or off by default) and prefer paths that leave the thinner trail.</li><li>Shape identity context to match the victim's baseline — source geography/ASN, device compliance, client app — to avoid risk-based detection.</li><li>Note logs that are delayed, sampled, or not retained, and events that survive session teardown (token/refresh, app registrations).</li></ul>","n":801},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A per-action forecast of cloud/identity log events and the risk signals each triggers.</li><li>Recommended identity-context shaping to stay under anomaly thresholds.</li><li>A list of low-logging access paths and persistence artifacts Overwatch should track.</li></ul>","n":248}],"summary":"Reason about what cloud control-plane and identity providers log about activity — sign-ins, token issuance, consent, API/audit events, and their conditional-access signals — so identity and cloud actions are taken in ways that blend with legitimate activity.","used_by":[],"m":{"name":27,"desc":173,"body":1674,"file":2141,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":86.5},"name":{"lim":64,"pct":42.2}}}},"credential-harvest-triage":{"slug":"credential-harvest-triage","pillar":"analysts","name":"credential-harvest-triage","description":"Inventory and rank credential material inside collected data — an LSASS dump, disk image, browser profile — by type, scope, freshness and reuse, so the best is acted on first.","family":"take-handling","ported":false,"source":"openspec/changes/archive/2026-07-22-credential-harvest-capability/proposal.md","file":"acordia-analysts/skills/credential-harvest-triage/SKILL.md","intro":"<h2 class=\"mh\">Credential Harvest Triage</h2>","secs":[{"t":"Cross-cutting notice","h":"<p>This skill is <strong>procedural and cross-cutting</strong>. It does not correspond to a row in the competency-grid appendix of <code>docs/roles/operational-analyst.md</code>. It reuses the credential-extraction procedures embedded in seven grid-row skills (<code>disk-memory-forensics</code>, <code>identity-directory-trust</code>, <code>log-artefact-interpretation</code>, <code>cloud-controlplane-analysis</code>, <code>web-api-authflow-analysis</code>, <code>os-host-internals</code>, <code>implant-payload-re</code>) and imposes one shared triage flow across them. Adding it as a grid row would inflate the competency map with a workflow, not a competency.</p>","n":560},{"t":"Objective","h":"<p>Turn a pile of collected material into a ranked, classified inventory of credential findings — with source, scope, reuse potential, and priority attached to each — so the operation can act on the best material first and set the rest aside without losing it.</p>","n":257},{"t":"When to use","h":"<ul class=\"ml\"><li>A collection archive arrives (LSASS dump, disk image, cloud state export, log bundle, config directory, backup, browser profile) and no one has looked inside yet.</li><li>Multiple specialist analysts have surfaced credential candidates and someone needs to fuse them into one prioritised list without double-counting.</li><li>The operation is deciding whether to move on a specific credential and needs a defensible read on its type, scope, and freshness first.</li></ul>","n":451},{"t":"Classification schema","h":"<p>Every credential finding SHALL be classified along these axes. Analysts record the classification, never the raw value.</p><div class=\"tw\"><table><thead><tr><th>Field</th><th>Values (examples)</th></tr></thead><tbody><tr><td><code>type</code></td><td>password, hash, key, token, certificate, cookie, ticket, seed</td></tr><tr><td><code>subtype</code></td><td>NTLM, Kerberos TGT, AWS access key, JWT (HS256), OAuth refresh, SSH RSA-2048, DPAPI blob, browser saved password</td></tr><tr><td><code>status</code></td><td>plaintext, hashed, encrypted-at-rest, encrypted-in-transit, revoked-suspected</td></tr><tr><td><code>scope</code></td><td>account, service, host, tenant, domain, cross-tenant</td></tr><tr><td><code>source</code></td><td>absolute path or artefact identifier (redact home dir / user)</td></tr><tr><td><code>provenance</code></td><td>in-memory, file-on-disk, log-line, config-value, network-capture</td></tr><tr><td><code>reuse-potential</code></td><td>high (broad scope, likely valid), medium (narrow scope or unknown freshness), low (revoked-likely, single-use), unknown</td></tr><tr><td><code>freshness</code></td><td>timestamp of the source artefact or &quot;unknown&quot;</td></tr><tr><td><code>priority</code></td><td>P0/P1/P2/P3 — derived from scope × reuse-potential × freshness</td></tr><tr><td><code>next-action</code></td><td>who owns follow-up (specialist name), or &quot;hold&quot;</td></tr></tbody></table></div>","n":1061},{"t":"Triage procedure","h":"<ol class=\"ml\"><li><strong>Inventory</strong> the archive: list every file, size, mtime, MIME/file-type. Note directory shape (single dump vs. multi-user backup vs. cloud state export). Output: an inventory table.</li><li><strong>Bucket partition</strong>: split the inventory by material class into leg-owned buckets, so that the per-category scan and deep-pass below run in parallel — the orchestrator dispatches each slice to its handling leg with <strong>only that slice</strong>, not the whole archive. Current mapping:</li><ul class=\"sub\"><li><strong>Bucket A — identity / directory / cloud control-plane</strong> (AD exports, NTDS, Kerberos, LAPS/gMSA, ADCS, IMDS captures, service-account keys, IaC state) → <code>terrain-analyst</code></li><li><strong>Bucket B — host-forensic</strong> (memory captures, SAM/SECURITY hives, DPAPI, Keychain, <code>shadow</code>, SSH agent) → whichever leg holds the host under analysis</li><li><strong>Bucket C — web / API auth</strong> (JWTs, OAuth tokens, session cookies, provider API keys) → <code>terrain-analyst</code></li><li><strong>Bucket D — log-artefact</strong> (application / CI / system logs, connection strings leaked in logs) → <code>overwatch-analyst</code></li><li><strong>Bucket E — implant / payload RE</strong> (malware configs, embedded keys in binaries) → cross-cutting via <code>implant-payload-re</code>, findings reported to <code>cyber-analyst</code>, which holds the fused picture itself</li></ul></ol><p>Buckets route to legs, not to skills. Each leg then runs steps 3–5 (first-pass scan, deep-pass, classify) on its own slice, applying its own specialist skills; the legs work in parallel, and step 6 re-merges their classifications. Each leg returns a <strong>coverage receipt</strong> for its bucket — declared scope reconciled to covered scope — per <code>exhaustive-data-processing</code>; the orchestrator rejects any bucket whose scan did not cover its whole slice and re-dispatches it. The mapping is fixed by domain — reclassify a bucket only through an openspec change, not an in-file edit.</p><ol class=\"ml\"><li><strong>First-pass scan</strong>: run the pattern library (see <code>references/credential-patterns.md</code>) across text-decodable artefacts (<code>grep -rHnE</code>, <code>rg</code>, or equivalent). The scan SHALL cover 100% of each bucket's text-decodable bytes and record <em>every</em> hit — never a sample — with path + line, not the matched string (see <code>exhaustive-data-processing</code>). Flag binary artefacts for deep-pass.</li><li><strong>Deep-pass per category</strong>: dispatch to the matching specialist skill:</li><ul class=\"sub\"><li>Memory / disk images → <code>disk-memory-forensics</code></li><li>AD / NTDS / Kerberos / LAPS / ADCS → <code>identity-directory-trust</code></li><li>Debug / application / CI logs → <code>log-artefact-interpretation</code></li><li>Cloud state / metadata / service-account keys → <code>cloud-controlplane-analysis</code></li><li>JWT / OAuth / API keys / session cookies → <code>web-api-authflow-analysis</code></li><li>OS credential stores (SAM, DPAPI, Keychain, shadow, SSH agent) → <code>os-host-internals</code></li><li>Malware / binary configs → <code>implant-payload-re</code></li></ul><li><strong>Classify</strong> each finding into the schema. Redact source paths that reveal analyst home dirs or workstation identity.</li><li><strong>Correlate</strong> across findings: same account across sources, same key in multiple archives, one credential unlocking another (e.g. DPAPI master key → browser passwords). Because the buckets were analysed by different legs, this is where their classifications re-merge — hand the per-leg findings to <code>cyber-analyst</code>, which holds <code>multi-source-fusion</code> itself and resolves cross-leg linkages there. Merge duplicates; note the correlation in <code>provenance</code>.</li><li><strong>Prioritise</strong>: rank by scope × reuse-potential × freshness. Break ties by ease-of-use (plaintext &gt; hash &gt; encrypted). Assign P0/P1/P2/P3.</li><li><strong>Report</strong>: emit the classified inventory. State total coverage — buckets scanned, artefacts parsed, any deferred remainder named — so a sampled pass cannot masquerade as a complete one. Do not include raw credential values. For each P0/P1, name the specialist owner and the reuse hypothesis to validate operationally.</li></ol>","n":3793},{"t":"Pattern library","h":"<p>The pattern library lives in <a href=\"references/credential-patterns.md\"><code>references/credential-patterns.md</code></a> alongside this skill — provider API-key prefixes, auth-material shapes, password-hash markers, connection-string DSNs, private-key PEM markers, and cloud/k8s secret-file patterns, grouped by class. It is the single source of truth for detection patterns: add a new provider prefix there once and every consumer (this skill's first-pass scan, and the pattern-citing <code>## Credential extraction</code> sections in <code>log-artefact-interpretation</code>, <code>web-api-authflow-analysis</code>, and <code>implant-payload-re</code>) inherits it. Anchor detection on the prefix; verify the current format at the provider's docs before acting.</p>","n":700},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A classified inventory table (findings × schema fields), no raw values.</li><li>Ranked P0/P1/P2/P3 buckets with the reuse hypothesis attached to each P0 and P1.</li><li>A named specialist owner for every finding that requires deep analysis.</li><li>An audit trail: source path (redacted), pattern that matched, timestamp, and analyst confidence.</li></ul>","n":329},{"t":"Guardrails","h":"<ul class=\"ml\"><li><strong>Passive only.</strong> Never attempt to validate a credential (no login attempt, no API probe, no key-fingerprint lookup against the live provider).</li><li><strong>No raw values in output.</strong> Report classification, source path, and hash-of-value if disambiguation is needed — never the credential itself.</li><li><strong>Redact analyst-identifying paths</strong> (<code>/Users/&lt;name&gt;/</code>, workstation hostnames) from the source field.</li><li><strong>Do not persist raw values</strong> in analyst working files. If deep-pass requires holding the value in memory (e.g. to compute a fingerprint), discard after use and record only the fingerprint.</li><li><strong>Escalate on discovery of high-scope material</strong> (domain admin hash, root cloud key, signing keys) — do not sit on it in the inventory.</li></ul>","n":723}],"summary":"This skill is **procedural and cross-cutting**. It does not correspond to a row in the competency-grid appendix of `docs/roles/operational-analyst.md`. It reuses the credential-extraction procedures embedded in seven grid-row skills (`disk-memory-forensics`, `","used_by":["collection-analyst","cyber-analyst","mission-analyst","overwatch-analyst","terrain-analyst"],"m":{"name":25,"desc":175,"body":8076,"file":8484,"dband":"optimal","bband":"over","ceil":{"desc":{"lim":200,"pct":87.5},"name":{"lim":64,"pct":39.1}}}},"data-integration-tooling":{"slug":"data-integration-tooling","pillar":"analysts","name":"data-integration-tooling","description":"Join heterogeneous take into one queryable corpus, normalising identities, timestamps, IPs and hosts and resolving entities across it, when correlation repeats on the same keys.","family":"take-handling","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/data-integration-tooling/SKILL.md","intro":"<h2 class=\"mh\">Data Integration &amp; Correlation Tooling</h2>","secs":[{"t":"Objective","h":"<p>Provide the data-handling muscle behind fusion: ingest, normalise, and correlate large, mixed datasets so that patterns and links surface which no manual review would find.</p>","n":172},{"t":"When to use","h":"<ul class=\"ml\"><li>When the collected take exceeds what you can read by hand, or spans formats (logs, dumps, captures, exports) that must be joined.</li><li>When repeated correlation on the same keys justifies a pipeline over one-off inspection.</li></ul>","n":222},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the sources before joining: enumerate each input with <code>ls</code>/<code>find</code>/<code>glob</code>, type it, and record its expected record count, so the pipeline reconciles against a known denominator rather than absorbing a truncated feed silently.</li><li>Ingest and normalise over exhaustive coverage: parse each source in full into a common schema — standardising identities, timestamps, IPs, and hosts — and assert the ingested row count against the inventory, never sampling the head of a large export as a stand-in for the whole.</li><li>Choose the join model — relational, graph, or time-series — that fits the question; graph for relationships, time-series for sequence and cadence.</li><li>Correlate at scale: link entities across datasets, deduplicate, and enrich with reference data to turn raw records into resolved objects.</li><li>Query for the analytic question, not the data — build repeatable queries/pipelines that answer &quot;who touched what, when, from where.&quot;</li><li>Guard data integrity: track provenance so every resolved object carries its source rows as <code>&lt;source-path&gt;:&lt;offset&gt;</code> or <code>&lt;source&gt;@L&lt;line&gt;</code>, preserve originals, and keep transformations reversible so a conclusion can be audited back to source.</li><li>Degradation: if a source cannot be parsed into the schema, hold it out of the join explicitly and report the coverage gap and its effect on any conclusion, rather than joining the parseable remainder and presenting it as complete.</li></ul>","n":1418},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A normalised, correlatable dataset with entities resolved across sources.</li><li>Repeatable queries/pipelines that answer recurring fusion questions at scale.</li><li>Provenance trail linking every derived link back to its raw records.</li></ul>","n":226}],"summary":"Provide the data-handling muscle behind fusion: ingest, normalise, and correlate large, mixed datasets so that patterns and links surface which no manual review would find.","used_by":[],"m":{"name":24,"desc":177,"body":2149,"file":2600,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":88.5},"name":{"lim":64,"pct":37.5}}}},"deception-detection":{"slug":"deception-detection","pillar":"analysts","name":"deception-detection","description":"Test whether the picture you act on was planted, denied or shaped to steer you, weighting channels the target does not know you hold, when evidence is too convenient.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/deception-detection/SKILL.md","intro":"<h2 class=\"mh\">Deception Detection / Anti-Manipulation</h2>","secs":[{"t":"Objective","h":"<p>Judge whether the intelligence you are acting on has been planted, denied, or shaped to manipulate your decision, so the operation is not steered into a honeypot, a burn, or a wasted effect.</p>","n":190},{"t":"When to use","h":"<ul class=\"ml\"><li>Evidence is unusually convenient, one-sided, or perfectly confirms your working hypothesis.</li><li>The target has motive and capability to feed you a false picture (mature defender, deception program, prior contact).</li></ul>","n":213},{"t":"Method","h":"<ul class=\"ml\"><li>Assume adversary agency: ask what the defender would want you to believe and whether the current picture matches it too well.</li><li>Separate what you observed directly from what was made observable to you; weight channels the target does not know you hold.</li><li>Check for denial (things that should be visible and aren't) and deception (things visible that shouldn't be) as paired tells.</li><li>Look for manipulation of the analyst: urgency, flattery of your hypothesis, single-source pivots, bait that rewards a specific action.</li><li>Seek confirmation through an independent access path the target cannot see or shape; withhold commitment until it corroborates.</li></ul>","n":649},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A judgement: picture is trustworthy / possibly shaped / likely planted.</li><li>The specific tells and the channels most and least susceptible to manipulation.</li><li>A recommendation to corroborate, probe, or back off — and what not to act on yet.</li></ul>","n":239}],"summary":"Judge whether the intelligence you are acting on has been planted, denied, or shaped to manipulate your decision, so the operation is not steered into a honeypot, a burn, or a wasted effect.","used_by":[],"m":{"name":19,"desc":166,"body":1403,"file":1852,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":83.0},"name":{"lim":64,"pct":29.7}}}},"detection-capability-analysis":{"slug":"detection-capability-analysis","pillar":"analysts","name":"detection-capability-analysis","description":"Model the defender's detection surface before you act, separating what their sensors can collect from what is collected and what is analysed into an alert, then score each one.","family":"defender-reading","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/detection-capability-analysis/SKILL.md","intro":"<h2 class=\"mh\">Detection-Capability Analysis</h2>","secs":[{"t":"Objective","h":"<p>Model the defender's detection surface in principle — sensors, log sources, coverage, and analytic maturity — so each planned action can be scored for how likely it is to generate an alert before it is taken.</p>","n":208},{"t":"When to use","h":"<ul class=\"ml\"><li>Pre-op planning of a technique or kill-chain step, when you need to predict detectability rather than react to it.</li><li>Anytime new environment recon reveals a security product, log pipeline, or SOC capability you had not accounted for.</li></ul>","n":235},{"t":"Method","h":"<ul class=\"ml\"><li>Enumerate the defender's likely sensor and log sources (EDR, network, identity, cloud, SIEM) from recon, vendor fingerprints, and environment class.</li><li>Map each planned technique to the data source that would witness it, then to whether an analytic plausibly exists for it (MITRE ATT&amp;CK data-source and detection coverage as a baseline).</li><li>Separate &quot;can be collected&quot; from &quot;is collected&quot; from &quot;is analyzed/alerted&quot; — coverage gaps live between those layers.</li><li>Rank techniques by residual detection risk; prefer actions witnessed only by sources the target does not collect or correlate.</li><li>Flag high-confidence tripwires (canaries, honeytokens, signatured behaviors) as no-go without mitigation.</li></ul>","n":695},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A per-technique detectability score with the specific log/sensor that would catch it.</li><li>A ranked list of low-visibility paths and an explicit list of tripwires to avoid.</li><li>Assumptions and unknowns that Overwatch and recon should resolve.</li></ul>","n":239}],"summary":"Model the defender's detection surface in principle — sensors, log sources, coverage, and analytic maturity — so each planned action can be scored for how likely it is to generate an alert before it is taken.","used_by":[],"m":{"name":29,"desc":176,"body":1479,"file":1946,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":88.0},"name":{"lim":64,"pct":45.3}}}},"disk-memory-forensics":{"slug":"disk-memory-forensics","pillar":"analysts","name":"disk-memory-forensics","description":"Read a host's disk and memory as a responder would, driving Volatility walks and parsing filesystem timelines, registry and event logs, when checking what you left.","family":"evidence-forensics","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/disk-memory-forensics/SKILL.md","intro":"<h2 class=\"mh\">Disk &amp; Memory Forensics</h2>","secs":[{"t":"Objective","h":"<p>Apply forensic technique to disk and memory to see a host the way a responder would — either as a self-detection check on the evidence your own activity left behind, or to understand a target's state, history, and defensive posture.</p>","n":232},{"t":"When to use","h":"<ul class=\"ml\"><li>Self-detection: verifying what artifacts your on-host actions actually left, and whether cleanup succeeded, before you rely on stealth.</li><li>Target understanding: reconstructing a compromised or accessed host's history, defenses, and stored secrets.</li></ul>","n":248},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the collected evidence with <code>ls</code> / <code>find</code> / <code>glob</code> — enumerate memory dumps, disk images, hive files, event-log exports, browser profile folders — before opening any single artefact.</li><li>Memory: enumerate processes, injected regions, hooks, network connections, and in-memory artifacts to confirm what a live-response capture would reveal about you. Drive the walk with Volatility 3 plugin output (e.g. <code>windows.pslist</code>, <code>windows.malfind</code>, <code>linux.pslist</code>) rather than reading raw dumps wholesale; scope any <code>strings</code> sweeps to known offsets or plugin-flagged regions.</li><li>Disk: examine filesystem timelines, prefetch/amcache/shimcache, event logs, registry, browser and shell history, and deletion/recovery traces. Read structured artefacts through their parsers (registry hives via <code>impacket-secretsdump</code> or <code>regripper</code>, event logs via <code>evtx_dump</code>) and bound raw image reads to the byte-range the parser flagged; do not slurp full images into a viewer.</li><li>Build a timeline and diff it against your own action log to find residual indicators you did not expect to remain.</li><li>For target work, mine the same sources for credentials, defensive tooling, prior-incident traces, and pivot opportunities.</li><li>Cite every finding by <code>&lt;image-or-dump&gt;:&lt;byte-offset&gt;</code> or <code>&lt;parsed-artefact&gt;@L&lt;line&gt;</code> (event-log record number, registry key path treated as line-shaped) so a peer can re-open the exact locus.</li><li>Judge what a responder arriving now would reconstruct, and prioritize cleanup or avoidance of the highest-fidelity remnants.</li><li>If pypykatz, Volatility, impacket, <code>regripper</code>, or a similar named parser is unavailable, either substitute a documented offline equivalent (Mimikatz <code>sekurlsa</code> on trusted material, <code>hivex</code>, <code>python-registry</code>) or flag the gap and stop — never eyeball a hex dump in lieu of a parser.</li></ul>","n":1809},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A forensic timeline of the host with your operation's residual artifacts flagged.</li><li>A self-detection verdict: what cleanup missed and what a responder would find.</li><li>For targets, extracted secrets, defensive-posture intel, and pivot leads.</li></ul>","n":240},{"t":"Credential extraction","h":"<p>Post-collection extraction from disk images and memory captures. All work is passive: parse artefacts already collected, never validate live.</p><p><strong>Memory captures</strong></p><ul class=\"ml\"><li>LSASS process dump — parse with <code>pypykatz lsa minidump &lt;dump&gt;</code> or Mimikatz <code>sekurlsa::minidump / sekurlsa::logonpasswords</code>. Yields NTLM hashes, Kerberos tickets, cleartext (WDigest, tspkg, DPAPI master keys) if present.</li><li>Full-system memory (raw/AFF4/VMEM) — Volatility 3: <code>windows.hashdump</code>, <code>windows.lsadump</code>, <code>windows.cachedump</code>, <code>windows.mimikatz</code>. Linux: <code>linux.pslist</code> + <code>strings</code>-hunt for <code>/etc/shadow</code>-shaped lines.</li><li>String-scan patterns for un-parsed dumps: <code>\\$NT\\$</code>, <code>krbtgt</code>, <code>-----BEGIN</code>, <code>AKIA[0-9A-Z]{16}</code>, <code>eyJ</code> (JWT), <code>Bearer </code>, <code>password=</code>.</li></ul><p><strong>Disk images</strong></p><ul class=\"ml\"><li>Registry hives — <code>impacket-secretsdump -sam SAM -security SECURITY -system SYSTEM LOCAL</code>. Yields local SAM hashes, LSA secrets (cached machine account, service credentials), DPAPI master key pointers.</li><li>Cached logon (MSCache/MSCache2) — <code>impacket-secretsdump</code> from <code>SYSTEM</code> + <code>SECURITY</code>; brute-forceable offline, do not attempt.</li><li>Filesystem sweep — carve for <code>%APPDATA%\\Microsoft\\Credentials\\</code>, <code>%LOCALAPPDATA%\\Microsoft\\Credentials\\</code>, <code>NTUSER.DAT</code>, browser profile dirs (<code>Login Data</code> SQLite), SSH <code>known_hosts</code>/<code>config</code>, <code>.aws/credentials</code>, <code>.docker/config.json</code>.</li><li>Prefetch / amcache / shimcache — evidence of credential-tool execution (mimikatz.exe, procdump.exe, <code>comsvcs.dll</code>), not credentials themselves; feed to <code>overwatch-analyst</code>.</li></ul><p><strong>Cross-cutting</strong></p><ul class=\"ml\"><li>Every extraction is classified and reported via <a href=\"../credential-harvest-triage/SKILL.md\"><code>credential-harvest-triage</code></a>; this skill never emits raw values.</li></ul>","n":1660}],"summary":"Apply forensic technique to disk and memory to see a host the way a responder would — either as a self-detection check on the evidence your own activity left behind, or to understand a target's state, history, and defensive posture.","used_by":[],"m":{"name":21,"desc":164,"body":4313,"file":4749,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":82.0},"name":{"lim":64,"pct":32.8}}}},"endpoint-telemetry-edr":{"slug":"endpoint-telemetry-edr","pillar":"analysts","name":"endpoint-telemetry-edr","description":"Reason about what a host sensor captures and by which mechanism — kernel callbacks, ETW, hooks, AMSI, Sysmon — and where it goes blind, when choosing an execution primitive.","family":"defender-reading","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/endpoint-telemetry-edr/SKILL.md","intro":"<h2 class=\"mh\">Endpoint Telemetry &amp; EDR Internals</h2>","secs":[{"t":"Objective","h":"<p>Reason about what endpoint and EDR sensors actually capture — process, thread, image-load, registry, file, and network events — how they capture it, and where the instrumentation goes blind, so on-host actions are chosen to minimize recorded evidence.</p>","n":251},{"t":"When to use","h":"<ul class=\"ml\"><li>Planning or executing any on-host action (execution, injection, persistence, credential access) on an endpoint that runs an EDR or host sensor.</li><li>Deciding between execution primitives when one leaves richer telemetry than another.</li></ul>","n":232},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the collected endpoint evidence with <code>ls</code> / <code>find</code> / <code>glob</code> — sensor config exports, ETW provider manifests, EDR agent driver binaries, Sysmon config, exported event archives, and any SIEM extract for the host — and record sensor product + version per artefact.</li><li>Identify the sensor and its collection mechanism (kernel callbacks, ETW providers, user-mode hooks, minifilter, AMSI) and enumerate the event types each produces. Read with bounded context, exhaustive coverage: <code>grep</code>/<code>rg</code> provider GUIDs and hooked-syscall lists across the whole driver/manifest slice; filter event archives with time-window or event-id queries (<code>Get-WinEvent -FilterHashtable</code>, targeted <code>evtx</code> queries) rather than dumping full channels into context — scope the query to the analytic question, then process every event it matches, not the first screenful.</li><li>Trace your planned action through those hooks: which callbacks fire, what fields are populated, what gets shipped to the SIEM vs. held locally.</li><li>Locate blind spots — unhooked syscalls, ETW providers that can be tampered/disabled, direct/indirect syscall paths, sensor coverage gaps for a given OS or agent version.</li><li>Prefer primitives that touch the fewest high-fidelity providers; treat tamper actions themselves as loud events that may be watched.</li><li>Account for local buffering and delayed upload — evidence can surface after the fact even if no real-time alert fired. Cite each finding as <code>&lt;artefact&gt;@L&lt;line&gt;</code> for text/config/manifest evidence or <code>&lt;evtx-or-archive&gt;:&lt;record-id&gt;</code> (or <code>:&lt;offset&gt;</code>) for event-log evidence.</li><li>Degradation: if the sensor's driver/manifest is opaque or unavailable, fall back to observed telemetry (event archives, SIEM extracts) and public provider documentation; if event archives are unavailable, restrict to config-only reasoning and flag the reduced confidence; if neither is available for the specific agent version in play, flag the gap and stop.</li></ul>","n":1936},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>An event-by-event forecast of the telemetry a planned action emits, per provider.</li><li>A shortlist of lower-telemetry execution paths and the blind spots they exploit.</li><li>Notes on tamper-detection risk and post-hoc evidence that Overwatch must monitor.</li></ul>","n":250}],"summary":"Reason about what endpoint and EDR sensors actually capture — process, thread, image-load, registry, file, and network events — how they capture it, and where the instrumentation goes blind, so on-host actions are chosen to minimize recorded evidence.","used_by":[],"m":{"name":22,"desc":173,"body":2776,"file":3222,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":86.5},"name":{"lim":64,"pct":34.4}}}},"evasion-antianalysis":{"slug":"evasion-antianalysis","pillar":"analysts","name":"evasion-antianalysis","description":"Shape a planned action against an established visibility model, buying the cheapest reduction per signal — LOLBins, timing, obfuscation — when a technique is too loud to run unchanged.","family":"defender-reading","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/evasion-antianalysis/SKILL.md","intro":"<h2 class=\"mh\">Evasion &amp; Anti-Analysis Reasoning</h2>","secs":[{"t":"Objective","h":"<p>Given a model of the defender's visibility, reason about how to shape actions so they evade real-time detection and impede after-the-fact analysis — without the evasion itself becoming the loudest signal.</p>","n":204},{"t":"When to use","h":"<ul class=\"ml\"><li>After detection-capability, EDR, or cloud-log analysis has told you what would be seen and you need a concrete evasion plan.</li><li>When an action cannot be made invisible and you must trade fidelity of evidence against operational cost.</li></ul>","n":234},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the defender-visibility inputs feeding this decision with <code>glob</code> / <code>find</code> / <code>list</code>: the detection-capability write-up, EDR telemetry samples, cloud log excerpts, and any own-footprint ledger already produced.</li><li>Read in bounded, context-scoped slices — the specific rule, the specific event window, the specific artefact — rather than loading whole detection catalogues into context; drive coverage with an exhaustive <code>grep</code>/parser pass over the whole catalogue to locate every relevant signal, then read the scoped line range around each — every hit, not just the first.</li><li>Take the forecasted signals as input and choose the cheapest reduction per signal: blend-in (LOLBins, legit tooling, normal hours), suppression (unhook, log-tamper), or avoidance (different primitive).</li><li>Weigh anti-analysis tactics (obfuscation, packing, in-memory-only, encrypted staging) against the meta-signal they create — many tamper/evasion actions are themselves high-confidence detections.</li><li>Time and pace actions to defeat correlation and baselining; avoid bursty or novel sequences that stand out from environment norms.</li><li>Plan the forensic aftermath: what artifacts remain, what can be minimized, and what a responder would reconstruct if they arrive later; cite each expected-signal-to-mitigation pairing by <code>&lt;path&gt;:&lt;offset&gt;</code> (byte) or <code>&lt;path&gt;@L&lt;line&gt;</code> (line) back to the detection or telemetry line that predicts it.</li><li>Keep every evasion reversible/deniable where possible; never trade a quiet action for a loud cover-up.</li><li>If a detection-rule parser or EDR-log decoder is unavailable, fall back to raw-string <code>grep</code> over the exports; if the visibility model itself is absent, flag the gap and stop rather than plan evasion against assumed sensors.</li></ul>","n":1747},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A per-action evasion plan mapping each expected signal to a mitigation and its residual risk.</li><li>Expli
