cit call-outs where evasion is louder than the action and should be dropped.</li><li>Forensic-footprint notes for own-footprint and disk/memory self-checks.</li></ul>","n":253}],"summary":"Given a model of the defender's visibility, reason about how to shape actions so they evade real-time detection and impede after-the-fact analysis — without the evasion itself becoming the loudest signal.","used_by":[],"m":{"name":20,"desc":184,"body":2544,"file":2995,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":92.0},"name":{"lim":64,"pct":31.2}}}},"exhaustive-data-processing":{"slug":"exhaustive-data-processing","pillar":"analysts","name":"exhaustive-data-processing","description":"Prove complete coverage of a bulk corpus with a script-first pass across all of it, reading only the located regions into context, when an artefact outgrows a single read.","family":"take-handling","ported":false,"source":"openspec/changes/archive/2026-07-22-exhaustive-data-processing/proposal.md","file":"acordia-analysts/skills/exhaustive-data-processing/SKILL.md","intro":"<h2 class=\"mh\">Exhaustive Data Processing</h2>","secs":[{"t":"Cross-cutting notice","h":"<p>This skill is <strong>procedural and cross-cutting</strong>. It does not correspond to a row in the competency-grid appendix of <code>docs/roles/operational-analyst.md</code> — it names a <em>workflow</em> that composes competencies, not a competency of its own. It builds on <code>analytic-tooling-scripting</code> (the scripting baseline) and drives the three legs' evidence reads; it lands under the same procedural-skill exception that <code>credential-harvest-triage</code> and <code>analyst-loop</code> use. It is <strong>not</strong> one of the fifteen evidence-reading skills bound by the <code>## Method</code> contract — it <em>defines</em> the reading discipline those skills follow.</p>","n":599},{"t":"Objective","h":"<p>Turn a pile of collected material into answers derived from <strong>all</strong> of it. Sampling the opening portion of an artefact and concluding from it manufactures false negatives — the credential on line 5,000 of a 20,000-line export, the one anomalous record in the tail — and reports &quot;clean&quot; on data that was never read. Exhaustion is the default; a partial pass is a named, justified exception, never a silent one.</p>","n":409},{"t":"When to use","h":"<ul class=\"ml\"><li>Bulk material lands: a file dump, disk/memory image, archive, log bundle, cloud-state export, config directory, or dataset.</li><li>Any artefact large enough that a single <code>read</code> captures only part of it.</li><li>Any time a conclusion would otherwise rest on the first screenful of a file.</li></ul>","n":279},{"t":"The sampling trap","h":"<p>Head-and-stop is a mechanical default, not a choice — name it so you catch it:</p><ul class=\"ml\"><li><strong>The read window is bounded.</strong> <code>read</code> (and <code>head</code>/<code>cat</code> into a fixed context) returns the opening slice of a large file. Read it, conclude, and everything past the window is invisible.</li><li><strong>Tool hits get eyeballed partial.</strong> <code>grep</code> returns 500 matches; reading the first ten and generalising (&quot;looks like all the same&quot;) is sampling by another name.</li><li><strong>Fan-out alone does not fix it.</strong> Splitting the material across subagents only <em>distributes</em> the sampling if each leaf still reads a head. Exhaustion has to hold at the leaf, or it does not hold at all.</li></ul>","n":636},{"t":"Method — script-first exhaustion","h":"<p>Completeness comes from the tool, not from loading raw bytes into a context window that cannot hold them.</p><ol class=\"ml\"><li><strong>Do not read bulk material into context.</strong> Run a tool over 100% of the bytes or records — <code>rg</code> / <code>grep -c</code> for counts and located hits, <code>awk</code> / <code>sort</code> / <code>uniq -c</code> for aggregates, a real parser (<code>jq</code>, <code>csv</code>, <code>sqlite</code>, Python) for structured or nested formats. Iterate <em>every</em> record, not a page.</li><li><strong>Consume results, not raw.</strong> The model reads the tool's aggregates and located hits (<code>path:line</code>), then reads into context only the specific located regions that need judgement — bounded by the hits, never the head.</li><li><strong>Validate the pass.</strong> Confirm the tool covered the whole input (line / record / byte counts reconcile — see the ledger) and that a parsing bug is not silently dropping records. Validate transforms against a known-good sample before trusting their output.</li><li><strong>Fan out only for judgement a script cannot make.</strong> When the question needs the model to <em>read</em> content a pattern cannot classify, partition into bounded slices (orchestrator only) and dispatch each for full reading. The script pass still runs first, so fan-out is the exception, not the engine.</li></ol>","n":1184},{"t":"Coverage ledger","h":"<p>Completeness is proven, not asserted.</p><ul class=\"ml\"><li><strong>Declare the input scope up front</strong> — the denominator: number of files × total bytes, or record / line counts. Enumerate with <code>find</code> / <code>glob</code> / <code>ls</code>, <code>wc -l</code>, or the parser's record count.</li><li><strong>Account for every step</strong> against that denominator: N scanned / N parsed / N deferred-with-reason. A numerator that does not reconcile to the denominator is a sampled result.</li><li><strong>Emit a coverage receipt</strong> per unit of work: <code>{scope declared, scope covered, method, deferred + why}</code>. The <em>method</em> field is load-bearing — a receipt whose method is &quot;read the file&quot; over a multi-megabyte artefact is self-evidently a sample.</li><li><strong>Reconcile before compiling.</strong> The orchestrator checks each leg's receipt against the slice it dispatched; a receipt that does not cover its slice is rejected and re-dispatched or sub-partitioned. Compile only from reconciled receipts.</li><li><strong>State total coverage in the output</strong> — &quot;X of X files, Y of Y records processed, 0 deferred&quot; — or name the deferred remainder explicitly. No silent short returns.</li></ul>","n":1058},{"t":"Fan-out contract","h":"<ul class=\"ml\"><li><strong>Only the orchestrator fans out.</strong> Legs are <code>task: deny</code> leaf specialists; they cannot dispatch.</li><li><strong>Slices are disjoint and bounded</strong> to full-processability, each dispatched with only its slice.</li><li><strong>A leg that overflows surfaces back.</strong> If a slice still exceeds full processing, the leg script-exhausts what it can and surfaces the un-processable remainder back to the orchestrator for sub-partition — it does not sample the remainder, and it does not fan out. (Mirrors <code>analyst-loop</code>: a leg surfaces the need back rather than assuming the orchestrator's role.)</li><li><strong>The orchestrator sub-partitions deterministically</strong> — by file, then by byte / line range — so each round strictly shrinks the slice and overflow cannot ping-pong.</li></ul>","n":732},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A reconciled coverage ledger: declared scope = covered scope, or a named deferred remainder.</li><li>Answers traceable to located source (<code>path:line</code> or <code>path:offset</code>), derived from a pass over the whole input.</li><li>For fan-out work: one coverage receipt per slice, reconciled by the orchestrator before compilation.</li></ul>","n":309},{"t":"Guardrails","h":"<ul class=\"ml\"><li><strong>Passive posture.</strong> Read, model, judge — no file edits, no payloads, no credential validation. Execution belongs to the operators the analyst advises.</li><li><strong>No raw credential values</strong> in output — classifications, sources, and priorities only (see <code>credential-harvest-triage</code>).</li><li><strong>No silent truncation.</strong> Any bound on coverage (a deferred slice, an unparseable artefact) is named in the output, never dropped.</li></ul>","n":410}],"summary":"This skill is **procedural and cross-cutting**. It does not correspond to a row in the competency-grid appendix of `docs/roles/operational-analyst.md` — it names a *workflow* that composes competencies, not a competency of its own. It builds on `analytic-tooli","used_by":["collection-analyst","cyber-analyst","mission-analyst","overwatch-analyst","terrain-analyst"],"m":{"name":26,"desc":171,"body":5854,"file":6256,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":85.5},"name":{"lim":64,"pct":40.6}}}},"gain-loss-calculus":{"slug":"gain-loss-calculus","pillar":"analysts","name":"gain-loss-calculus","description":"Weigh a move's gain against its full cost — exposure, burnt access, attribution, foreclosed paths — and against waiting, when progress would spend something scarce.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/gain-loss-calculus/SKILL.md","intro":"<h2 class=\"mh\">Gain/Loss Calculus &amp; Re-Planning</h2>","secs":[{"t":"Objective","h":"<p>Weigh an option's expected gain against its losses — exposure, burned access, attribution, opportunity cost — and turn that balance into a concrete adjustment to the plan rather than a gut call to press on.</p>","n":206},{"t":"When to use","h":"<ul class=\"ml\"><li>Deciding whether to escalate, persist, or stop after a partial result or a scare.</li><li>The obvious next step buys progress but spends something scarce (access, stealth, tooling).</li></ul>","n":177},{"t":"Method","h":"<ul class=\"ml\"><li>Name the gain concretely: what the move advances toward the objective, and how much closer it gets you.</li><li>Name the losses fully — not just failure, but exposure, burned capability, attribution, and the moves it forecloses.</li><li>Account for the sunk cost you must ignore and the opportunity cost of the paths this choice closes.</li><li>Compare against doing nothing / waiting; a positive move must beat the null option, not just look active.</li><li>Feed the verdict back into the plan: proceed, scale down, switch method, or re-scope the objective.</li></ul>","n":536},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A gain-vs-loss balance for the option, including what it forecloses.</li><li>A go / scale / switch / stop recommendation with its threshold.</li><li>The specific re-plan edit the calculus drives.</li></ul>","n":185}],"summary":"Weigh an option's expected gain against its losses — exposure, burned access, attribution, opportunity cost — and turn that balance into a concrete adjustment to the plan rather than a gut call to press on.","used_by":[],"m":{"name":18,"desc":164,"body":1209,"file":1653,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":82.0},"name":{"lim":64,"pct":28.1}}}},"human-automation-teaming":{"slug":"human-automation-teaming","pillar":"analysts","name":"human-automation-teaming","description":"Divide a workflow between analyst judgement and automation, setting an autonomy level per task and designing against automation bias, when a filter decides what the analyst ever sees.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/human-automation-teaming/SKILL.md","intro":"<h2 class=\"mh\">Human–Automation Teaming</h2>","secs":[{"t":"Objective","h":"<p>Divide the work between analyst judgement and automation so machines carry scale, speed, and recall while the analyst owns the judgement calls, keeping the operation both fast and accountable.</p>","n":192},{"t":"When to use","h":"<ul class=\"ml\"><li>Standing up or tuning a workflow where tooling triages, scores, or filters what the analyst sees.</li><li>Deciding whether to let automation act, recommend, or merely surface.</li></ul>","n":171},{"t":"Method","h":"<ul class=\"ml\"><li>Split by strength: give automation volume, correlation, and monitoring; keep intent, ambiguity, deception, and irreversible calls with the human.</li><li>Set the autonomy level per task — automate-and-act, recommend-and-confirm, or surface-only — matched to the cost of a wrong move.</li><li>Design against automation bias: the analyst must be able to see the evidence and overrule the machine, not rubber-stamp it.</li><li>Watch for the failure modes automation hides — silent misses, stale models, adversary gaming the filter — and sample its output by hand.</li><li>Keep a human in the loop for any effect or targeting decision that is irreversible or attributable.</li></ul>","n":646},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A task split with an autonomy level assigned to each step.</li><li>The override points and evidence the analyst must retain visibility of.</li><li>A list of automation failure modes to sample against.</li></ul>","n":190}],"summary":"Divide the work between analyst judgement and automation so machines carry scale, speed, and recall while the analyst owns the judgement calls, keeping the operation both fast and accountable.","used_by":[],"m":{"name":24,"desc":183,"body":1296,"file":1777,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":91.5},"name":{"lim":64,"pct":37.5}}}},"hypothesis-testing":{"slug":"hypothesis-testing","pillar":"analysts","name":"hypothesis-testing","description":"Hold every plausible explanation at once and score evidence against each, weighting what discriminates and hunting what would kill the leader, when several readings fit.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/hypothesis-testing/SKILL.md","intro":"<h2 class=\"mh\">Hypothesis Testing (Competing Hypotheses)</h2>","secs":[{"t":"Objective","h":"<p>Hold every plausible explanation of the target situation at once and test each against the evidence together, so the surviving judgement is the one least contradicted rather than the one you liked first.</p>","n":203},{"t":"When to use","h":"<ul class=\"ml\"><li>The evidence admits several readings (attribution, target function, detection status, intent).</li><li>You notice yourself building a case for a single explanation instead of comparing.</li></ul>","n":181},{"t":"Method","h":"<ul class=\"ml\"><li>Enumerate the full set of hypotheses up front, including the uncomfortable ones (you are burned; the target is a decoy/honeypot).</li><li>Build an evidence-by-hypothesis matrix; score each item for consistency with each hypothesis, not just the favoured one.</li><li>Weight diagnostic evidence — items that discriminate between hypotheses — and discount evidence consistent with all of them.</li><li>Try to disconfirm: seek the observation that would kill the leading hypothesis, and task collection for it.</li><li>Rank by fewest inconsistencies; carry the runner-up forward rather than discarding it.</li></ul>","n":580},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A ranked set of hypotheses with the evidence that supports and undercuts each.</li><li>The most diagnostic missing observation, handed to collection.</li><li>A lead judgement plus the surviving alternative you keep watching.</li></ul>","n":214}],"summary":"Hold every plausible explanation of the target situation at once and test each against the evidence together, so the surviving judgement is the one least contradicted rather than the one you liked first.","used_by":[],"m":{"name":18,"desc":169,"body":1292,"file":1741,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":84.5},"name":{"lim":64,"pct":28.1}}}},"identity-directory-trust":{"slug":"identity-directory-trust","pillar":"analysts","name":"identity-directory-trust","description":"Map the target's identity fabric from BloodHound, LDAP or NTDS artefacts — principals, delegation, ADCS, LAPS — when a foothold must become AD or Entra domain control.","family":"target-modelling","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/identity-directory-trust/SKILL.md","intro":"<h2 class=\"mh\">Identity &amp; Directory (AD/Entra) &amp; Trust</h2>","secs":[{"t":"Objective","h":"<p>Map the target's identity fabric — Active Directory / Entra ID structure, privileged principals, and domain/tenant trust — to find the shortest identity path to control of the environment.</p>","n":188},{"t":"When to use","h":"<ul class=\"ml\"><li>When the target is a Windows/AD or Entra-backed enterprise and identity is the real terrain.</li><li>When you need to convert a foothold into domain/tenant dominance via identity, not exploits.</li></ul>","n":189},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the collected directory artefacts with <code>ls</code> / <code>find</code> / <code>glob</code> — SharpHound / BloodHound JSON exports, ADExplorer snapshots, NTDS.dit + SYSTEM hive dumps, LDAP dumps, ticket caches, LAPS/gMSA/ADCS material — and record what each covers (domain, tenant, time window).</li><li>Enumerate the directory from those artefacts, bounded: query BloodHound JSON via <code>jq</code>; grep LDIF / CSV exports for privileged group memberships, delegation attributes (<code>msDS-AllowedToActOnBehalfOfOtherIdentity</code>, <code>TrustedForDelegation</code>), and trust records rather than reading multi-megabyte dumps wholesale. For NTDS, use <code>impacket-secretsdump</code> targeted extractions, not raw hive reads.</li><li>Map privilege: who is effectively Domain/Enterprise/Global Admin, delegation (constrained/unconstrained/RBCD), and shadow-admin paths.</li><li>Analyze trust relationships — inter-forest/domain trusts, hybrid sync (AD&lt;-&gt;Entra), federation, and where trust is transitive or over-broad.</li><li>Trace identity attack paths (Kerberos abuse, ACL/ADCS misconfig, token/PRT theft, sync-account leverage) toward tier-0 assets.</li><li>Identify the crown-jewel identities and choke points whose control equals control of the mission. Cite each finding as <code>&lt;artefact&gt;@L&lt;line&gt;</code> for text/LDIF exports or <code>&lt;artefact&gt;:&lt;offset&gt;</code> for binary hive/database evidence; reference the BloodHound node/edge id when routing through graph data.</li><li>Degradation: if BloodHound / SharpHound output is unavailable, fall back to raw LDAP dump grep + hand-drawn privilege map and flag reduced completeness; if <code>impacket-secretsdump</code> / <code>impacket-dpapi</code> are unavailable for hive/DPAPI parsing, flag the gap and stop — do not improvise credential extraction from unfamiliar formats.</li></ul>","n":1697},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>Directory and privilege map with tier-0 principals identified.</li><li>Trust and hybrid-sync edges, including transitive and over-broad grants.</li><li>Shortest identity attack paths from foothold to domain/tenant control.</li></ul>","n":212},{"t":"Credential extraction","h":"<p>Passive extraction from directory-service artefacts already in hand (NTDS dumps, ticket caches, LAPS exports, ADCS material). Never queries the live directory to validate.</p><p><strong>Active Directory database</strong></p><ul class=\"ml\"><li><code>NTDS.dit</code> + <code>SYSTEM</code> hive — <code>impacket-secretsdump -ntds NTDS.dit -system SYSTEM LOCAL</code>. Yields all domain account NTLM hashes plus <code>krbtgt</code> (golden-ticket material — highest scope, flag P0 automatically). Kerberos AES keys are extracted with <code>-just-dc</code> mode.</li><li><code>DPAPI_SYSTEM</code> LSA secret + user DPAPI master keys — chained decrypt with <code>impacket-dpapi</code> yields service account plaintexts, scheduled-task credentials, saved browser passwords.</li></ul><p><strong>Kerberos tickets</strong></p><ul class=\"ml\"><li>Windows <code>.kirbi</code> files — parse with <code>KrbRelay</code>, <code>Rubeus describe /ticket:&lt;file&gt;</code> (analysis only, not renewal). Yields service, client, renew-till, encryption type, target SPN. TGTs (<code>krbtgt/&lt;domain&gt;</code>) mark broadest scope.</li><li>MIT <code>.ccache</code> files (<code>/tmp/krb5cc_*</code>, <code>KRB5CCNAME</code> env var target) — parse with <code>klist -c</code> or <code>impacket-ticketConverter</code>. Same fields.</li></ul><p><strong>LAPS / gMSA / ADCS</strong></p><ul class=\"ml\"><li>Legacy LAPS (<code>ms-Mcs-AdmPwd</code>) and Windows LAPS (<code>msLAPS-Password</code>, <code>msLAPS-EncryptedPassword</code>) — plaintext or encrypted local-admin passwords. When collected from AD replication metadata or an LDAP dump, decode per attribute type.</li><li>gMSA (<code>msDS-ManagedPassword</code>) — 240-byte blob; parse with <code>gMSADumper.py</code>-style logic against the raw blob you already collected. Yields NTLM + Kerberos keys for the gMSA identity.</li><li>ADCS artefacts — <code>.pfx</code>/<code>.p12</code> (private key + cert; may be passphrase-protected — dictionary attack offline only, not online), <code>.pem</code> with <code>-----BEGIN</code> headers, template-vulnerable enrolments identifiable in AD-DUMP JSON exports.</li></ul><p><strong>Cross-cutting</strong></p><ul class=\"ml\"><li>Directory-derived credentials classify as <code>scope: domain</code> or higher; <code>krbtgt</code>, tier-0 accounts, and enterprise-CA private keys always mark <code>priority: P0</code>. All output flows through <a href=\"../credential-harvest-triage/SKILL.md\"><code>credential-harvest-triage</code></a>; no raw hashes or keys in reports.</li></ul>","n":2009}],"summary":"Map the target's identity fabric — Active Directory / Entra ID structure, privileged principals, and domain/tenant trust — to find the shortest identity path to control of the environment.","used_by":[],"m":{"name":24,"desc":167,"body":4435,"file":4881,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":83.5},"name":{"lim":64,"pct":37.5}}}},"implant-payload-re":{"slug":"implant-payload-re","pillar":"analysts","name":"implant-payload-re","description":"Reverse-engineer an implant or payload binary to ground-truth what it does on a host and over the wire, when validating your own tooling or reading a captured sample.","family":"evidence-forensics","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/implant-payload-re/SKILL.md","intro":"<h2 class=\"mh\">Implant/Payload Behaviour &amp; Reverse-Engineering</h2>","secs":[{"t":"Objective","h":"<p>Reverse-engineer implant/payload behavior to ground-truth what it actually does on a host and over the wire. This is a CROSS-CUTTING deep skill: it attaches to whichever leg needs it — Target &amp; Network (understanding a target's malware or a tool you'll deploy) or Defender &amp; Detection (predicting the artifacts and signatures a payload emits) — for a given operation.</p>","n":367},{"t":"When to use","h":"<ul class=\"ml\"><li>Validating your own tooling's real footprint before deployment, or triaging unexpected behavior in the field.</li><li>Analyzing a captured, third-party, or competitor sample to understand capability, indicators, and attribution.</li></ul>","n":224},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the sample set with <code>ls</code> / <code>find</code> / <code>glob</code> (candidate binaries, dropped stages, embedded resources); record file type, size, and hash before any read.</li><li>Triage statically first, bounded: <code>file</code>, entropy scan, <code>strings -a -n 8</code> (and <code>-e l</code> for UTF-16) piped through <code>grep</code>/<code>rg</code> for pattern hits; read PE/ELF headers and named sections (<code>.rsrc</code>, <code>.rdata</code>, <code>__cstring</code>) by section offset, not the whole image. For .NET, decompile targeted classes rather than the full assembly.</li><li>Analyze safely in an isolated, instrumented environment; assume anti-analysis and sandbox-evasion and account for it. Recover behavior dynamically from bounded windows of the run (process/thread activity, injection, persistence, file/registry changes, network/C2), citing event indexes rather than dumping the full trace.</li><li>Extract config and IOCs — keys, domains, mutexes, campaign markers — and map behavior to ATT&amp;CK techniques and the telemetry each would produce. Cite each finding as <code>&lt;sample&gt;:&lt;offset&gt;</code> for binary evidence or <code>&lt;trace&gt;@L&lt;line&gt;</code> for sandbox log lines; never quote decrypted credential values raw.</li><li>Feed findings to the leg that needs them: detection-signature prediction for blue-side reasoning, or capability/attribution for target work.</li><li>Degradation: if a family-specific config parser (CAPE / malwareconfig) is unavailable, fall back to locating the decryptor stub and extracting algorithm + key manually; if the sandbox/instrumentation environment is unavailable, restrict to static analysis and flag the gap; if a decompiler (<code>ILSpy</code>, <code>dnSpyEx</code>, <code>Ghidra</code>) is unavailable and only stripped native code remains, flag the gap and stop.</li></ul>","n":1650},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A behavior profile: what it does on host and network, plus its anti-analysis tricks.</li><li>Extracted config, IOCs, and an emitted-signature map tied to detection sources.</li><li>Attribution and capability notes routed to the relevant operational leg.</li></ul>","n":243},{"t":"Credential extraction","h":"<p>Credential material embedded in payloads — hardcoded strings, encrypted config blocks, keys embedded for C2 auth or lateral movement. Extraction is static or sandboxed-dynamic; never runs the sample against a live target to prove reuse.</p><p><strong>Static extraction from binaries</strong></p><ul class=\"ml\"><li><code>strings -a -n 8</code> (and <code>strings -e l</code> for UTF-16 on Windows PE), then pattern-library grep from <a href=\"../credential-harvest-triage/references/credential-patterns.md\"><code>credential-harvest-triage/references/credential-patterns.md</code></a>. Hits often surface C2 auth keys, hardcoded RDP/SMB credentials, hardcoded API tokens for stagers pulling from paste sites.</li><li><code>.rsrc</code> (PE resources) — embedded config blobs, sometimes XOR- or RC4-obfuscated with a key also present in the binary. Extract with <code>pefile</code> / <code>pyresource</code> + a short deobfuscator.</li><li><code>.rdata</code> / <code>.data</code> — hardcoded strings the compiler could not deduplicate; C2 URLs and hex-encoded key material.</li><li>.NET assemblies — decompile with <code>ILSpy</code> / <code>dnSpyEx</code>; hardcoded credentials often live as string literals in obfuscated fields. <code>de4dot</code> normalises common obfuscators.</li><li>ELF and Mach-O — <code>objdump -s -j .rodata</code>, <code>otool -s __TEXT __cstring</code>.</li></ul><p><strong>Configuration blocks</strong></p><ul class=\"ml\"><li>Malware families with known config formats — dedicated parsers (<code>malwareconfig.com</code> / <code>CAPE</code> community parsers). Feeds directly into <code>type</code>/<code>subtype</code> schema fields.</li><li>Custom/unknown configs — locate the decryptor stub statically; extract the algorithm and key; decrypt offline in a scratch buffer; record the plaintext structure without storing the raw config file.</li></ul><p><strong>Packed payloads</strong></p><ul class=\"ml\"><li>Recognise packer (UPX, Themida, VMProtect, Enigma) from entropy + section names. Unpack in an isolated instrumented environment (Cuckoo/CAPE/x64dbg script), dump the unpacked image, then apply static extraction to the dump.</li><li>Loader → shellcode → payload chains: extract each stage's embedded material separately; correlate keys reused across stages (common attribution signal).</li></ul><p><strong>Cross-cutting</strong></p><ul class=\"ml\"><li>Payload-embedded credentials frequently have <em>very</em> broad <code>reuse-potential</code> inside their intended deployment scope (all bots authenticating to the same C2, all sample instances sharing an XOR key) but classifying reuse against the target requires input from <code>terrain-analyst</code>. Classification and reporting via <a href=\"../credential-harvest-triage/SKILL.md\"><code>credential-harvest-triage</code></a>; the report cites offset within the binary and a decryption-method identifier, never the raw credential.</li></ul>","n":2469}],"summary":"Reverse-engineer implant/payload behavior to ground-truth what it actually does on a host and over the wire. This is a CROSS-CUTTING deep skill: it attaches to whichever leg needs it — Target & Network (understanding a target's malware or a tool you'll deploy)","used_by":[],"m":{"name":18,"desc":166,"body":5101,"file":5530,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":83.0},"name":{"lim":64,"pct":28.1}}}},"key-assumptions-check":{"slug":"key-assumptions-check","pillar":"analysts","name":"key-assumptions-check","description":"Surface the assumptions a plan silently rests on, mark the load-bearing ones and stress each for evidence and freshness, when success depends on expected behaviour.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/key-assumptions-check/SKILL.md","intro":"<h2 class=\"mh\">Key-Assumptions Check &amp; Debiasing</h2>","secs":[{"t":"Objective","h":"<p>Surface the assumptions the operational judgement silently rests on, mark which ones are load-bearing, and stress them — while countering the analyst's own biases — so the plan does not collapse when an unexamined premise turns out wrong.</p>","n":238},{"t":"When to use","h":"<ul class=\"ml\"><li>Before acting on a plan whose success depends on the target or defender behaving &quot;as expected&quot;.</li><li>When the team has converged fast and confidently on one read.</li></ul>","n":161},{"t":"Method","h":"<ul class=\"ml\"><li>List every assumption behind the judgement, including the ones stated as fact (&quot;this box is internet-reachable&quot;, &quot;no EDR here&quot;).</li><li>Tag each as load-bearing or minor: would the plan break if it were false?</li><li>For each load-bearing assumption, ask what evidence supports it, how recent it is, and what would falsify it.</li><li>Name the biases in play — confirmation, anchoring on first access, mirror-imaging the defender, sunk-cost on burned effort — and correct for each.</li><li>Convert fragile assumptions into gaps to collect against or contingencies to pre-plan.</li></ul>","n":556},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A list of load-bearing assumptions, each rated supported / stale / unfounded.</li><li>The named biases and the specific correction applied.</li><li>Assumptions promoted to collection gaps or branch-plan triggers.</li></ul>","n":202}],"summary":"Surface the assumptions the operational judgement silently rests on, mark which ones are load-bearing, and stress them — while countering the analyst's own biases — so the plan does not collapse when an unexamined premise turns out wrong.","used_by":[],"m":{"name":21,"desc":164,"body":1263,"file":1716,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":82.0},"name":{"lim":64,"pct":32.8}}}},"log-artefact-interpretation":{"slug":"log-artefact-interpretation","pillar":"analysts","name":"log-artefact-interpretation","description":"Reconstruct an ordered account of events from raw host, network and cloud logs, establishing what each source records and its blind spots, when answering what actually happened.","family":"evidence-forensics","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/log-artefact-interpretation/SKILL.md","intro":"<h2 class=\"mh\">Log / Artefact Interpretation</h2>","secs":[{"t":"Objective","h":"<p>Read logs and artefacts across host, network, and cloud to reconstruct events, understand the environment, and see the target — and your own footprint — the way a defender's telemetry would.</p>","n":190},{"t":"When to use","h":"<ul class=\"ml\"><li>When on-box or collected logs and artefacts hold the answer to what happened, what exists, or who did it.</li><li>When assessing your own detectability — what evidence your actions wrote, and where it lives.</li></ul>","n":203},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the log corpus with <code>ls</code> / <code>find</code> / <code>glob</code> first — list every collected log source (path, size, first/last timestamp) before opening any single file.</li><li>Identify the artefact and its semantics: know what each log/event actually records, its fidelity, retention, and blind spots before trusting it.</li><li>Read with bounded context, exhaustive coverage: drive an exhaustive <code>grep</code>/<code>rg</code>/<code>jq</code> pass over the whole file for known indicators or timestamps, then open only the matched line-ranges — every match, not just the first — with a few lines of context. Never slurp gigabyte-scale JSON or <code>.evtx</code> files whole into context — use the parser's native pagination or offset-limited reads, and confirm the pass covered the whole file (record counts reconcile).</li><li>Reconstruct timelines by correlating artefacts across host, network, and cloud into one ordered account of events.</li><li>Read the environment from its exhaust — installed tooling, agents, logging config, and coverage gaps revealed by what is and isn't recorded.</li><li>Turn the lens on yourself: locate the artefacts your own operation generated and judge what a hunter reading them would conclude.</li><li>Distinguish signal from routine noise, and flag artefacts that have been cleared, tampered, or are conspicuously absent.</li><li>Cite every claim by <code>&lt;log-path&gt;@L&lt;line&gt;</code> (or <code>&lt;log-path&gt;:&lt;byte-offset&gt;</code> for binary event-log formats after parser conversion) so the corroborating record is re-openable.</li><li>If a named parser (<code>evtx_dump</code>, <code>jq</code>, <code>zeek-cut</code>, cloud-provider log CLIs) is unavailable, either substitute a documented equivalent or flag the gap and stop — never reason from a truncated <code>head</code>/<code>tail</code> alone.</li></ul>","n":1661},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A reconstructed timeline of events from correlated artefacts.</li><li>A map of the environment's logging coverage, fidelity, and blind spots.</li><li>Own-footprint assessment: what you left behind, where, and how visible it is.</li></ul>","n":217},{"t":"Credential extraction","h":"<p>Credentials leak into logs constantly. Extraction here is grep-shaped across collected log corpora; no live log-source polling.</p><p><strong>Application / debug logs</strong></p><ul class=\"ml\"><li>Stack traces printing config objects — search for <code>password=</code>, <code>token=</code>, <code>secret=</code>, <code>apiKey=</code>, <code>Authorization: </code>. Case-insensitive; multi-line context (<code>grep -B2 -A10</code>).</li><li>Request logs with URLs — query-string tokens (<code>?api_key=</code>, <code>?access_token=</code>, <code>?sig=</code>); reverse-proxy access logs (<code>nginx</code>, <code>apache</code>, <code>envoy</code>) commonly hold JWTs in the query string when clients ignore the header contract.</li><li>Debug/verbose modes (Rails logger, Django DEBUG, Spring Boot <code>logging.level.root=DEBUG</code>) — HTTP request bodies including <code>password</code> fields, session cookies, OIDC id_tokens.</li></ul><p><strong>CI/CD and build logs</strong></p><ul class=\"ml\"><li>GitHub Actions/GitLab CI/Jenkins output — masked secrets <em>sometimes</em> fail to mask (env vars printed by <code>env</code> step, secrets echoed via <code>set -x</code>, base64-encoded before mask). Search for the <a href=\"../credential-harvest-triage/references/credential-patterns.md\">pattern-library</a> prefixes (<code>ghp_</code>, <code>AKIA</code>, <code>xox</code>, <code>eyJ</code>) even in logs marked &quot;secrets masked&quot;.</li><li>Docker build logs — <code>ARG</code> credentials leaked into image layers or build output.</li><li>Terraform apply/plan output — resource creation surfaces secrets in <code>sensitive = false</code> outputs.</li></ul><p><strong>Connection strings and config leaks</strong></p><ul class=\"ml\"><li>Full DSN patterns (<code>postgres://user:pass@host</code>, <code>mongodb+srv://</code>, <code>Server=...;Password=...;</code>) appear in ORM debug logs, migration output, health-check probes.</li><li>Kubernetes event logs and <code>describe pod</code> output — image-pull-secret refs (safe) vs env-var secret values printed when a container crashloops (unsafe).</li></ul><p><strong>System / audit logs</strong></p><ul class=\"ml\"><li>Windows Security event 4688 (process creation) with command-line auditing on — full command lines including <code>-Password</code>, <code>-Credential</code>, <code>net use ... /user:...</code>.</li><li>Linux <code>auth.log</code> / <code>secure</code> — pam_ldap or <code>sudo</code> reads that logged the wrong field; <code>bash_history</code> shipped via syslog.</li></ul><p><strong>Cross-cutting</strong></p><ul class=\"ml\"><li>Log-sourced credentials often have unknown freshness (log retention window) and unknown revocation status. Mark <code>freshness: unknown</code> unless the log line carries a timestamp inside the retention SLA. Classification and reporting via <a href=\"../credential-harvest-triage/SKILL.md\"><code>credential-harvest-triage</code></a>; source path in the report references the log file, not the credential value.</li></ul>","n":2354}],"summary":"Read logs and artefacts across host, network, and cloud to reconstruct events, understand the environment, and see the target — and your own footprint — the way a defender's telemetry would.","used_by":[],"m":{"name":27,"desc":177,"body":4755,"file":5243,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":88.5},"name":{"lim":64,"pct":42.2}}}},"maintaining-operating-picture":{"slug":"maintaining-operating-picture","pillar":"analysts","name":"maintaining-operating-picture","description":"Stop an already-fused picture from rotting while the operation runs — timestamping updates, setting decay on perishable facts and re-verifying them before reliance.","family":"take-handling","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/maintaining-operating-picture/SKILL.md","intro":"<h2 class=\"mh\">Maintaining the Operating Picture</h2>","secs":[{"t":"Objective","h":"<p>Keep the fused operating picture current and trustworthy as the operation runs and the target changes, so decisions are made against reality rather than a stale snapshot.</p>","n":170},{"t":"When to use","h":"<ul class=\"ml\"><li>During any live operation where access, infrastructure, defenders, or the environment drift over time.</li><li>When a plan or judgement rests on facts collected earlier that may no longer hold.</li></ul>","n":189},{"t":"Method","h":"<ul class=\"ml\"><li>Treat the picture as a living state, not a one-off product: every new observation updates it, and every update is timestamped.</li><li>Track deltas explicitly — what changed since last read (new hosts, revoked access, patched paths, a hunt starting) and what that change implies.</li><li>Set decay on facts: mark which elements are durable and which are perishable, and re-verify perishable ones before relying on them.</li><li>Reconcile new take against the standing picture; when they conflict, trust fresh observation and retire the stale entry.</li><li>Push the current picture to whoever acts on it, so operators are never steering on a picture the analyst already knows is dead.</li></ul>","n":662},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A continuously updated operating picture with change-log of deltas.</li><li>Freshness/decay markers separating durable facts from perishable ones.</li><li>Early-warning flags where the environment has shifted enough to invalidate a plan.</li></ul>","n":227}],"summary":"Keep the fused operating picture current and trustworthy as the operation runs and the target changes, so decisions are made against reality rather than a stale snapshot.","used_by":["collection-analyst"],"m":{"name":29,"desc":164,"body":1354,"file":1807,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":82.0},"name":{"lim":64,"pct":45.3}}}},"method-timing-risk-decision":{"slug":"method-timing-risk-decision","pillar":"analysts","name":"method-timing-risk-decision","description":"Choose the method, the moment and the exposure by pricing each option's gain, detection risk and reversibility against stated risk appetite, when a window is closing.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/method-timing-risk-decision/SKILL.md","intro":"<h2 class=\"mh\">Method / Timing / Risk Decision</h2>","secs":[{"t":"Objective","h":"<p>Choose the method to use, the moment to move, and the exposure to accept, by comparing the live options against the objective and the operation's risk tolerance rather than defaulting to the most familiar tool.</p>","n":210},{"t":"When to use","h":"<ul class=\"ml\"><li>Multiple viable methods exist and they trade off effect, stealth, and reversibility differently.</li><li>Timing matters — a window is opening or closing on the target.</li></ul>","n":163},{"t":"Method","h":"<ul class=\"ml\"><li>Restate the objective and the hard constraints (stealth required, deadline, no-go effects) the choice must respect.</li><li>Lay out each option's expected gain, its exposure/detection risk, and its reversibility side by side.</li><li>Price timing explicitly: what a window opening or closing does to each option's risk and payoff.</li><li>Weigh options against the operation's stated risk appetite, not the analyst's; flag any option that exceeds it.</li><li>Recommend one course with its trigger to execute, and keep a named fallback if the window or the picture shifts.</li></ul>","n":549},{"t":"When an exploit is the right method","h":"<p>An exploit is one method among several, chosen on the same terms as any other and not because it is the most familiar instrument. Used selectively, not reflexively.</p><p><strong>Reach for one</strong> against a hardened perimeter with no alternative, under time pressure, or to escalate on a well-configured system.</p><p><strong>Leave it</strong> when detection risk exceeds its value, when stability matters, when a zero-day is worth preserving, or when a credential, an administrative tool or a native protocol would do the same work. Most of what sustains access after entry is not exploitation at all, so price the quiet path before the loud one and say plainly when the quiet path wins.</p>","n":657},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A recommended method, timing, and accepted risk level, with the reasoning.</li><li>A comparison of the rejected options and why they lost.</li><li>The execute-trigger and the fallback branch.</li></ul>","n":181}],"summary":"Choose the method to use, the moment to move, and the exposure to accept, by comparing the live options against the objective and the operation's risk tolerance rather than defaulting to the most familiar tool.","used_by":["cyber-analyst"],"m":{"name":27,"desc":166,"body":1906,"file":2430,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":83.0},"name":{"lim":64,"pct":42.2}}}},"multi-source-fusion":{"slug":"multi-source-fusion","pillar":"analysts","name":"multi-source-fusion","description":"Consolidate disconnected strands — on-box take, passive collection, open sources, prior operations — into one target picture, when partial reads must become one and weighted for independence.","family":"take-handling","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/multi-source-fusion/SKILL.md","intro":"<h2 class=\"mh\">Multi-Source Fusion &amp; Correlation</h2>","secs":[{"t":"Objective","h":"<p>Consolidate every strand of intelligence — your own take, collection feeds, open sources, and non-technical context — into a single coherent picture of the target that is greater than the sum of its sources.</p>","n":207},{"t":"When to use","h":"<ul class=\"ml\"><li>When multiple sources touch the same target and no single one gives you the full answer, so the truth lives in the correlation.</li><li>Before a decision that depends on a unified read (where to move, what to trust, when to act) rather than on any one feed.</li></ul>","n":253},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory every strand: on-box take, passive/network collection, OSINT, prior operations, and human/business context — tag each with source, reliability, and timestamp.</li><li>Resolve entities across sources — reconcile hostnames, IPs, identities, and accounts so the same object is one object, not several.</li><li>Correlate on shared keys (identity, host, time, infrastructure) and look for convergence (independent sources agreeing) and contradiction (sources that cannot both be true).</li><li>Weight by source reliability and independence; corroboration from genuinely independent sources beats volume from one echoing feed.</li><li>State the fused picture as a judgement, not a data dump: what is known, what is inferred, what remains a gap.</li></ul>","n":726},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A single fused target picture with entities resolved and sources cross-referenced.</li><li>Convergence points (high-confidence facts) and contradictions flagged for resolution.</li><li>A source-reliability trail so any conclusion can be walked back to its evidence.</li></ul>","n":255}],"summary":"Consolidate every strand of intelligence — your own take, collection feeds, open sources, and non-technical context — into a single coherent picture of the target that is greater than the sum of its sources.","used_by":["collection-analyst"],"m":{"name":19,"desc":191,"body":1547,"file":1997,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":95.5},"name":{"lim":64,"pct":29.7}}}},"naming-the-gaps":{"slug":"naming-the-gaps","pillar":"analysts","name":"naming-the-gaps","description":"Convert a vague sense of knowing too little into ranked intelligence gaps, each an answerable question with a route and an owner, when collection has no stated question.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/naming-the-gaps/SKILL.md","intro":"<h2 class=\"mh\">Naming the Gaps</h2>","secs":[{"t":"Objective","h":"<p>Convert a vague sense of &quot;we don't know enough&quot; into an explicit, prioritised list of intelligence gaps, each tied to a way to close it, so collection is aimed instead of opportunistic.</p>","n":185},{"t":"When to use","h":"<ul class=\"ml\"><li>Before committing a method, timing, or targeting decision that rests on assumed facts.</li><li>When collection is running but nobody can say what it is actually meant to answer.</li></ul>","n":173},{"t":"Method","h":"<ul class=\"ml\"><li>Restate the decision the picture must support; every gap is judged by whether it changes that decision.</li><li>Walk the target model deliberately (access, structure, defences, people, timing) and mark each element as observed, inferred, or blank.</li><li>For each blank, name the specific question in answerable form, not a topic (&quot;does host X reboot nightly?&quot; not &quot;patching&quot;).</li><li>Rank gaps by leverage over the decision times feasibility of closing them; drop the merely-interesting.</li><li>Assign each priority gap a collection route (existing access, new access needed, or open-source) and an owner.</li></ul>","n":587},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A ranked gap list, each item phrased as an answerable question.</li><li>A collection tasking: what to look at, through which access, and by when.</li><li>A &quot;decide anyway&quot; line marking which gaps you will accept as open risk.</li></ul>","n":215}],"summary":"Convert a vague sense of \"we don't know enough\" into an explicit, prioritised list of intelligence gaps, each tied to a way to close it, so collection is aimed instead of opportunistic.","used_by":[],"m":{"name":15,"desc":169,"body":1248,"file":1688,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":84.5},"name":{"lim":64,"pct":23.4}}}},"nontechnical-context-integration":{"slug":"nontechnical-context-integration","pillar":"analysts","name":"nontechnical-context-integration","description":"Fold the non-technical world into the picture — who truly holds access, fiscal calendar, deals, morale — when behaviour is only explicable through a merger, freeze or layoff.","family":"take-handling","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/nontechnical-context-integration/SKILL.md","intro":"<h2 class=\"mh\">Non-Technical Context Integration</h2>","secs":[{"t":"Objective","h":"<p>Fold the non-technical world — finance, geopolitics, organisational structure, and the human context of the target — into the operational picture so technical observations gain meaning and intent.</p>","n":196},{"t":"When to use","h":"<ul class=\"ml\"><li>When network behaviour is only explicable through business, political, or human drivers (a quarter-end freeze, a merger, a layoff, a holiday).</li><li>When choosing targets, timing, or pretext, where the human and organisational context is the real terrain.</li></ul>","n":253},{"t":"Method","h":"<ul class=\"ml\"><li>Map the organisation: reporting lines, key personnel, decision-makers, admins, and who actually holds access versus who holds a title.</li><li>Pull financial and business context — fiscal calendar, funding, deals, dependencies, vendors — that shapes attention, budget, and change windows.</li><li>Read geopolitical and regulatory context that raises or lowers the target's defensive posture, alert level, and tolerance for risk.</li><li>Profile the human factors — workload, morale, turnover, blame culture — that predict where mistakes, shortcuts, and unlocked doors appear.</li><li>Bind each context item to a technical consequence: what it makes more likely, more visible, or more forgivable on the wire.</li></ul>","n":685},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>An org and human map annotated with access, influence, and exploitable pressure points.</li><li>Business/geopolitical calendar of windows that change defender attention and target behaviour.</li><li>Context-to-technical links that turn raw activity into intent and opportunity.</li></ul>","n":267}],"summary":"Fold the non-technical world — finance, geopolitics, organisational structure, and the human context of the target — into the operational picture so technical observations gain meaning and intent.","used_by":[],"m":{"name":32,"desc":174,"body":1507,"file":1978,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":87.0},"name":{"lim":64,"pct":50.0}}}},"operational-memory":{"slug":"operational-memory","pillar":"analysts","name":"operational-memory","description":"Carry what the operation established across sessions — findings, discarded hypotheses, source reliability, the reasoning — when a specialist returns or work outlasts one context.","family":"take-handling","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/operational-memory/SKILL.md","intro":"<h2 class=\"mh\">Operational Memory</h2>","secs":[{"t":"Objective","h":"<p>Keep the operation's accumulated understanding available to whoever needs it next. Analysis that has to be re-derived every session is not analysis, it is repetition — and the second derivation frequently disagrees with the first without anyone noticing.</p>","n":254},{"t":"When to use","h":"<ul class=\"ml\"><li>Whenever a dispatched specialist returns and its context is about to be discarded.</li><li>At the end of any session, before the working context is lost.</li><li>When a claim in the operating picture is old enough that nobody now remembers what it rested on.</li><li>When two strands of the operation appear to contradict each other.</li></ul>","n":317},{"t":"Method","h":"<ul class=\"ml\"><li>Write findings <strong>with their basis attached</strong>, not as bare conclusions. A recorded conclusion whose</li></ul><p>evidence is gone cannot be re-examined when it is later contradicted, and becomes an assumption nobody can audit.</p><ul class=\"ml\"><li>Record the <strong>rejected</strong> hypotheses and why they were rejected. This is the half most often skipped</li></ul><p>and the half that stops a later analyst spending a day re-walking a path already closed — or, worse, reopening it and reaching the opposite answer with no record of the disagreement.</p><ul class=\"ml\"><li>Keep <strong>source reliability as a running record</strong> rather than a per-item judgement: which feeds have</li></ul><p>produced, which have misled, which have gone quiet. Reliability is a track record and only exists if someone keeps it.</p><ul class=\"ml\"><li>Timestamp what is <strong>perishable</strong> and mark what it depends on. A target's posture, a credential's</li></ul><p>validity and a defender's tooling all decay, and a fact recorded without its decay assumption will be read as current long after it stopped being true.</p><ul class=\"ml\"><li><strong>Never write a secret into the memory.</strong> The record is durable and is read by everyone who comes</li></ul><p>next, which is exactly what makes it the wrong place for a credential value. Carry the <code>credential-harvest-triage</code> classification — type, scope, source, priority, reuse potential — and a pointer to where the value lives, never the value. A memory entry is the longest-lived artefact the operation produces; treat anything written into it as permanently disclosed to every later reader.</p><ul class=\"ml\"><li>Treat the <strong>return from a dispatch as the memory event</strong>: the specialist's context is destroyed on</li></ul><p>return, so anything not written at that moment is lost. Capture what was done, what was learned, the confidence, what was deliberately not done, and what the specialist would look at next.</p><ul class=\"ml\"><li>Reconcile rather than append when a new finding contradicts a recorded one. Supersede the old entry</li></ul><p>explicitly, keeping it visible with its reason for retirement, so the contradiction is resolved once in the record rather than repeatedly in argument.</p><ul class=\"ml\"><li>Keep it <strong>readable by the next analyst, not only by its author</strong> — the test is whether someone</li></ul><p>arriving cold can act on it without asking a question only the author could answer.</p><ul class=\"ml\"><li>Degradation: where a full record cannot be written, prefer a short entry with the evidence pointer</li></ul><p>over a long one without it. A pointer survives; a summary without provenance does not.</p>","n":2403},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A durable record of findings, each with its evidence and its confidence.</li><li>The closed-off hypotheses, with the reasoning that closed them.</li><li>A running source-reliability ledger.</li><li>Explicit supersession entries where later work overturned earlier work.</li><li>Perishability markers on anything time-bound, with the assumption it depends on.</li></ul>","n":336}],"summary":"Keep the operation's accumulated understanding available to whoever needs it next. Analysis that has to be re-derived every session is not analysis, it is repetition — and the second derivation frequently disagrees with the first without anyone noticing.","used_by":["collection-analyst"],"m":{"name":18,"desc":178,"body":3401,"file":3891,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":89.0},"name":{"lim":64,"pct":28.1}}}},"os-host-internals":{"slug":"os-host-internals","pillar":"analysts","name":"os-host-internals","description":"Read one host's true state from collected process, service and autorun material and work its native mechanisms — token abuse, SUID, DLL hijacks — when escalating from it.","family":"target-modelling","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/os-host-internals/SKILL.md","intro":"<h2 class=\"mh\">OS &amp; Host Internals</h2>","secs":[{"t":"Objective","h":"<p>Apply deep operating-system knowledge to a target host so you can read its true state, find privilege and persistence footholds, and operate within its native mechanisms rather than against them.</p>","n":195},{"t":"When to use","h":"<ul class=\"ml\"><li>When you have a foothold and must escalate, persist, or pivot from a specific host.</li><li>When you need to predict how a host will respond to an action — logging, EDR, integrity controls, isolation.</li></ul>","n":196},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the collected host material with <code>ls</code> / <code>find</code> / <code>glob</code> — mounted image trees, process listings, autoruns exports, service manifests, scheduled-task dumps, <code>.plist</code> bundles — before opening any single file.</li><li>Establish host context: OS/version, patch level, privilege model, running processes/services, scheduled tasks/daemons, and installed security tooling. Drive reads with <code>grep</code>/<code>rg</code> against structured exports (<code>Get-CimInstance</code> / WMI output, <code>systemctl list-unit-files</code>, <code>launchctl list</code>, autoruns CSV); open only the matched entries by line range, not the full multi-megabyte export wholesale.</li><li>Identify escalation vectors native to the platform — token/privilege abuse, SUID/sudo, service and DLL/dylib hijacks, misconfigured ACLs, kernel/driver exposure.</li><li>Locate credential and secret material at rest and in memory (LSASS/keyring/keychain, tokens, caches, config).</li><li>Choose persistence that matches the platform's legitimate mechanisms and survives reboot without standing out.</li><li>Model the host's observation surface: what is logged, what EDR sees, and how to act inside normal process behaviour.</li><li>Cite every finding by <code>&lt;image-path&gt;@L&lt;line&gt;</code> for text-like exports (autoruns CSV, <code>.reg</code> dumps, <code>plist</code> XML, shell histories) or <code>&lt;image-path&gt;:&lt;byte-offset&gt;</code> for binary registry hives, raw memory, and keychain files so a peer can re-open the exact key, service, or scheduled task.</li><li>If <code>impacket-secretsdump</code>, <code>regripper</code>, <code>evtx_dump</code>, <code>plutil</code>, <code>chainbreaker</code>, or a similar named parser is unavailable, either substitute a documented equivalent (<code>hivex</code>, <code>python-registry</code>, <code>plistutil</code>) or flag the gap and stop — never infer registry or keychain contents from a hex dump alone.</li></ul>","n":1703},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>Host state and privilege map with concrete escalation candidates.</li><li>Credential/secret locations and access method.</li><li>Persistence options ranked by durability vs detectability, plus the host's logging/EDR blind spots.</li></ul>","n":218},{"t":"Credential extraction","h":"<p>Per-OS map of on-disk and in-memory credential stores. Extraction is passive analysis of already-collected material (disk image, memory dump, exfiltrated profile) — never touches the live host beyond collection.</p><p><strong>Windows</strong></p><ul class=\"ml\"><li><code>SAM</code> / <code>SECURITY</code> / <code>SYSTEM</code> hives (<code>%SYSTEMROOT%\\System32\\config\\</code>) — local NTLM hashes, LSA secrets (machine account, service credentials, cached DPAPI key). Extract with <code>impacket-secretsdump -sam SAM -security SECURITY -system SYSTEM LOCAL</code>.</li><li>DPAPI — user master keys at <code>%APPDATA%\\Microsoft\\Protect\\&lt;SID&gt;\\</code>; system master keys at <code>%SYSTEMROOT%\\System32\\Microsoft\\Protect\\S-1-5-18\\</code>. Decrypt chain: LSA <code>DPAPI_SYSTEM</code> → system master key → user master key → credential blob. Tool: <code>impacket-dpapi</code>.</li><li>Credential Manager — <code>%APPDATA%\\Microsoft\\Credentials\\</code> (user) and <code>%SYSTEMROOT%\\System32\\config\\systemprofile\\AppData\\Local\\Microsoft\\Credentials\\</code> (system) blobs; unwrap through DPAPI.</li><li>Browser saved passwords — Chrome/Edge <code>Login Data</code> SQLite in the profile dir; <code>password_value</code> column is DPAPI-encrypted (per-user). Firefox <code>logins.json</code> + <code>key4.db</code> (NSS-encrypted; primary password may be empty).</li><li>Wi-Fi / VPN / RDP creds — <code>netsh wlan export profile key=clear</code> output if pre-collected; <code>.rdp</code> files with <code>password 51:b:</code> (DPAPI); PuTTY sessions in registry export (<code>HKCU\\Software\\SimonTatham\\PuTTY\\Sessions</code>).</li><li>Powershell history — <code>%APPDATA%\\Microsoft\\Windows\\PowerShell\\PSReadLine\\ConsoleHost_history.txt</code>. Search <code>ConvertTo-SecureString -AsPlainText</code>, <code>-Credential</code>, connection-string patterns.</li></ul><p><strong>Linux</strong></p><ul class=\"ml\"><li><code>/etc/shadow</code> — password hashes (<code>$6$</code> SHA-512, <code>$y$</code> yescrypt on newer distros). Requires root at collection time.</li><li>SSH — <code>~/.ssh/id_*</code> (private keys; passphrase-protected if the file begins with <code>-----BEGIN OPENSSH PRIVATE KEY-----</code> and the next block includes <code>bcrypt</code>), <code>~/.ssh/authorized_keys</code> (target-side identity map, not a credential per se), <code>~/.ssh/known_hosts</code> (lateral-move targets).</li><li>GNOME Keyring — <code>~/.local/share/keyrings/*.keyring</code>; encrypted with the login password. KDE <code>kwallet</code> files under <code>~/.local/share/kwalletd/</code>.</li><li>Shell history — <code>~/.bash_history</code>, <code>~/.zsh_history</code>, <code>~/.psql_history</code>, <code>~/.mysql_history</code>, <code>~/.python_history</code>. Search for <code>curl -u</code>, <code>git clone https://.*:.*@</code>, <code>export ..._TOKEN=</code>, <code>mysql -p...</code>.</li><li>App config — <code>~/.aws/credentials</code>, <code>~/.config/gcloud/</code>, <code>~/.kube/config</code> (client certs and bearer tokens), <code>~/.docker/config.json</code> (base64 basic-auth), <code>~/.netrc</code>.</li><li>Systemd credentials cache — <code>/etc/credstore/</code>, <code>/etc/credstore.encrypted/</code>.</li></ul><p><strong>macOS</strong></p><ul class=\"ml\"><li>Keychain — <code>~/Library/Keychains/login.keychain-db</code> (user) and <code>/Library/Keychains/System.keychain</code> (system). Encrypted with the user's login password (or the system key stored under SIP). Offline extraction: <code>chainbreaker</code> against a collected keychain file + known password.</li><li>iCloud Keychain sync data — <code>~/Library/Application Support/com.apple.sbd/</code>; requires SEP-derived key material, generally not extractable from a plain disk image.</li><li>SSH agent — no on-disk state; capture is memory-only via <code>disk-memory-forensics</code>.</li><li>Shell history + app config as Linux.</li><li>Chrome/Safari saved passwords — protected by keychain; requires keychain extraction first.</li></ul><p><strong>Cross-cutting</strong></p><ul class=\"ml\"><li>OS-store credentials classify by user scope (<code>scope: account</code> or <code>host</code>), except LSA/machine-account material which is <code>scope: host</code>+ (can pivot to domain via silver-ticket-style analysis — flag for <code>identity-directory-trust</code>). Reporting via <a href=\"../credential-harvest-triage/SKILL.md\"><code>credential-harvest-triage</code></a>; source cites path within the collected image, redacting the analyst's own home directory.</li></ul>","n":3636}],"summary":"Apply deep operating-system knowledge to a target host so you can read its true state, find privilege and persistence footholds, and operate within its native mechanisms rather than against them.","used_by":[],"m":{"name":17,"desc":170,"body":6068,"file":6502,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":85.0},"name":{"lim":64,"pct":26.6}}}},"ot-embedded":{"slug":"ot-embedded","pillar":"analysts","name":"ot-embedded","description":"Analyse an industrial or embedded target on its own terms — controllers, buses, Modbus, DNP3, S7 — where downtime is physical, when the target crosses from IT into ICS or SCADA.","family":"target-modelling","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/ot-embedded/SKILL.md","intro":"<h2 class=\"mh\">Operational-Technology / Embedded</h2>","secs":[{"t":"Objective","h":"<p>Analyse operational-technology and embedded environments — ICS/SCADA, PLCs, controllers, and firmware — on their own terms. This is a cross-cutting deep skill that attaches to whichever analytic leg (targeting, mapping, effects, verification) the operation puts against an OT/embedded target.</p>","n":292},{"t":"When to use","h":"<ul class=\"ml\"><li>When the target crosses from IT into OT/embedded: industrial control, building systems, medical, automotive, or bespoke hardware.</li><li>When IT assumptions break — where downtime is physical, protocols are proprietary, and a wrong move has kinetic consequences.</li></ul>","n":259},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the collected OT evidence first with <code>ls</code>/<code>find</code>/<code>glob</code> and a file-typing pass — firmware images, HMI project files, ladder-logic exports, historian dumps, PCAPs of industrial protocols — recording device, vendor, and firmware version per artefact before any read.</li><li>Learn the specific environment: identify controllers, buses, and industrial protocols (Modbus, DNP3, S7, EtherNet/IP) and how the process actually maps to the equipment.</li><li>Analyse firmware and embedded logic with bounded reads over exhaustive coverage: carve and enumerate the image with <code>binwalk</code>/<code>strings</code> across 100% of its bytes, then read only the located regions (offsets, function bounds) into context rather than loading a multi-megabyte image; reason about memory and I/O without the safety net of a normal OS.</li><li>Respect the physics: model the process the OT controls, so effects and side-effects are understood before, not after, they manifest in the real world.</li><li>Read OT-specific engineering artefacts (HMI projects, ladder logic, historian data) for state, intent, and safety interlocks, processing every located hit rather than the first, and cite each finding as <code>&lt;artefact&gt;:&lt;offset&gt;</code> for binary evidence or <code>&lt;artefact&gt;@L&lt;line&gt;</code> for text/project exports.</li><li>Weight fragility and consequence heavily — legacy, unpatched, safety-critical systems fail hard, and detection and damage both differ from IT.</li><li>Degradation: if a firmware image is encrypted or a proprietary project format has no available parser, fall back to protocol capture and observable process behaviour and flag the reduced confidence; if a vendor's format is entirely opaque with no tool to read it, flag the gap and stop rather than guessing.</li></ul>","n":1703},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A model of the OT/embedded target: devices, protocols, process, and controlling logic.</li><li>Firmware/embedded behaviour analysis with I/O and memory understanding.</li><li>Consequence and safety assessment tying any action to its physical effect.</li></ul>","n":239}],"summary":"Analyse operational-technology and embedded environments — ICS/SCADA, PLCs, controllers, and firmware — on their own terms. This is a cross-cutting deep skill that attaches to whichever analytic leg (targeting, mapping, effects, verification) the operation put","used_by":[],"m":{"name":11,"desc":177,"body":2599,"file":3018,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":88.5},"name":{"lim":64,"pct":17.2}}}},"outcome-judgement":{"slug":"outcome-judgement","pillar":"analysts","name":"outcome-judgement","description":"Call whether an action achieved its end by inventorying first-party against independent channels, separating the payload ran from the system changed, when indicators lie.","family":"analytic-spine","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/outcome-judgement/SKILL.md","intro":"<h2 class=\"mh\">Outcome Judgement (End Achieved)</h2>","secs":[{"t":"Objective","h":"<p>After an action, judge whether the operation's intended end was actually achieved — the effect (break / deny / manipulate) took hold, or the intelligence was genuinely collected — and decide what happens next. This includes verifying that the target system genuinely changed in the intended way, separating &quot;the payload ran&quot; from &quot;the effect occurred,&quot; and both from what the target may be showing you deliberately.</p>","n":415},{"t":"When to use","h":"<ul class=\"ml\"><li>An action has fired and you must call success or failure against the objective.</li><li>The technique &quot;worked&quot; but it is unclear whether it produced the intended operational end.</li><li>Immediately after any action intended to produce an effect (access gained, service disrupted, data altered, persistence set), especially when success indicators are ambiguous, delayed, or could be spoofed by the defender.</li></ul>","n":398},{"t":"Method","h":"<ul class=\"ml\"><li>Restate the intended end in observable terms before acting: what state must be true on the target if it worked. Judge against that — not against &quot;did the tool run&quot;.</li><li><strong>Inventory the observable channels before reading them</strong> — command return, target-side logs, downstream service signals, out-of-band indicators — and record which are <strong>first-party</strong> (the tool's own report) and which are <strong>independent</strong>, because the split decides how much each is worth. Never rest a verdict on the tool's own success return alone.</li><li>Gather independent observables with bounded, exhaustive reads: scope each source to the action's time window, but process every matching record in that window rather than the first hit, so a delayed or buffered effect is not missed.</li><li><strong>Distinguish delivery from effect from persistence</strong>: code executed vs objective achieved vs objective held under the target's response and not silently reverted or contained. Cite each supporting observable as <code>&lt;log&gt;:&lt;offset&gt;</code> or <code>&lt;log&gt;@L&lt;line&gt;</code>, capturing any transient downstream or out-of-band signal to a file first so the verdict stays auditable back to evidence.</li><li>For collection specifically: confirm the data is genuine, complete enough, and not planted or partial (see <code>deception-detection</code>).</li><li><strong>Watch for deception and honeypot tells</strong> — effects that are too clean, mirrored responses, or verification channels the defender controls; treat a channel the defender may control as untrusted and flag the gap.</li><li>Weigh cost paid: what the action cost in exposure, access, or attribution, and whether that changes the win.</li><li>Classify: end achieved / partial / failed / unknown-pending-confirmation, and derive the next move — exploit, re-attempt, collect more, or withdraw.</li><li><strong>Degradation</strong>: if only the first-party return is available and no independent channel can be read, cap the verdict at &quot;delivered, effect unconfirmed&quot; and say so rather than reporting success.</li></ul>","n":1932},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A verdict on whether the operational end was met, with the confirming independent observation, and the explicit separation of delivery vs effect vs persistence.</li><li>The residual cost/exposure the action incurred, and a deception-risk note.</li><li>A next-move recommendation: exploit, re-attack, collect more, or disengage.</li></ul>","n":317}],"summary":"After an action, judge whether the operation's intended end was actually achieved — the effect (break / deny / manipulate) took hold, or the intelligence was genuinely collected — and decide what happens next. This includes verifying that the target system gen","used_by":[],"m":{"name":17,"desc":170,"body":3167,"file":3614,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":85.0},"name":{"lim":64,"pct":26.6}}}},"overwatch":{"slug":"overwatch","pillar":"analysts","name":"overwatch","description":"Hold a live read on whether the defender has noticed, working your reach into their SIEM, EDR and SOAR queues, whenever an operation is live and a go-quiet call may be due.","family":"defender-reading","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/overwatch/SKILL.md","intro":"<h2 class=\"mh\">Overwatch (Live &quot;Are We Detected?&quot;)</h2>","secs":[{"t":"Objective","h":"<p>Maintain a live read on whether the defender has detected the operation by fusing data pulled from their own security operations with external signals, and convert that read into a timely go-quiet / move / pull-out call.</p>","n":220},{"t":"When to use","h":"<ul class=\"ml\"><li>Continuously throughout an active engagement, especially after any action flagged as detectable.</li><li>The moment any anomaly on the blue side or in your own channels suggests attention.</li></ul>","n":184},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory your reach into the defender's surfaces first — which SIEM/EDR consoles, alert queues, ticketing/SOAR boards, analyst chat channels, and mailboxes you can actually see — and export what you rely on to files, enumerating those captures with <code>ls</code>/<code>glob</code> so coverage is known rather than assumed.</li><li>Collect from inside with bounded, exhaustive queries: scope each console read to a time window or a rule/host filter rather than scrolling the whole feed, but process every alert and ticket that window returns, not just the first screenful — a missed alert in the tail is the one that ends the operation.</li><li>Fuse with external signals: sudden credential/token invalidation, blocked C2, sinkholed domains, new EDR pushes, threat-intel or vendor chatter, staff behavior changes.</li><li>Correlate blue activity to your own timeline — did an alert or investigation follow a specific action of yours? — to gauge whether they are onto the operation vs. routine noise, and cite each corroborating observation against its capture as <code>&lt;export&gt;:&lt;alert-id&gt;</code> or <code>&lt;export&gt;@L&lt;line&gt;</code>, so a live view that has since scrolled away stays reproducible evidence.</li><li>Track dwell indicators: is the response widening, targeting your artifacts, or preparing containment (isolation, resets, forensics collection).</li><li>Produce a standing detection-likelihood estimate and a trigger threshold for each response option; never let the estimate go stale.</li><li>Degradation: if a console or queue is unreachable, fall back to the external signals and say plainly which internal source is dark and how much that widens the uncertainty; if you have no blue-side visibility at all, flag the blind spot rather than reporting a false all-clear.</li></ul>","n":1704},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A live detection-likelihood read with the evidence behind it and its confidence.</li><li>A recommended posture — continue / go quiet / relocate infrastructure / exit — with the trigger that would change it.</li><li>Early-warning indicators queued for continuous monitoring and handoff.</li></ul>","n":275}],"summary":"Maintain a live read on whether the defender has detected the operation by fusing data pulled from their own security operations with external signals, and convert that read into a timely go-quiet / move / pull-out call.","used_by":[],"m":{"name":9,"desc":172,"body":2491,"file":2894,"dband":"optimal","bband":"optimal","ceil":{"desc":{"lim":200,"pct":86.0},"name":{"lim":64,"pct":14.1}}}},"own-footprint-analysis":{"slug":"own-footprint-analysis","pillar":"analysts","name":"own-footprint-analysis","description":"Enumerate and ledger every indicator the operation emits — dropped files, host logs, C2 domains, TLS certificates, VPS records — so you know what a responder could recover.","family":"defender-reading","ported":false,"source":"docs/roles/operational-analyst.md","file":"acordia-analysts/skills/own-footprint-analysis/SKILL.md","intro":"<h2 class=\"mh\">Own-Footprint / Emitted-Indicator Analysis</h2>","secs":[{"t":"Objective","h":"<p>Systematically enumerate the indicators the operation itself generates across every layer, producing the attacker's-eye inventory of &quot;what we leave behind&quot; that feeds evasion, Overwatch, and cleanup decisions.</p>","n":209},{"t":"When to use","h":"<ul class=\"ml\"><li>Before, during, and after any phase, to keep a running ledger of emitted indicators.</li><li>When preparing to go quiet, hand off, or exit, and you need to know what remains for a responder to find.</li></ul>","n":194},{"t":"Method","h":"<ul class=\"ml\"><li>Inventory the operation's own emitted-artefact set with <code>glob</code> / <code>find</code> / <code>list</code>: staging logs, C2 configs, tooling manifests, redirector/VPS records, and any collection our own dry-runs produced.</li><li>Read in bounded, context-scoped slices — a single log day, a single host's exported registry hive, a single beacon PCAP window — rather than dumping the entire operation's ledger into context at once; drive coverage with an exhaustive <code>grep</code>/parser pass over the whole source to isolate every indicator, then read the scoped line range around each — every hit, not just the first.</li><li>Walk each layer and list artifacts: host (files, registry, services, prefetch, logs), network (C2 domains/IPs, JA3/JARM, TLS certs, User-Agents), identity (accounts, tokens, consent), and infrastructure (redirectors, VPS, registrant/OSINT leakage).</li><li>For each indicator, record its fidelity (how uniquely it points to us), persistence (how long it survives), and observability (who can see it); cite each ledger entry by <code>&lt;path&gt;:&lt;offset&gt;</code> (byte) or <code>&lt;path&gt;@L&lt;line&gt;</code> (line) back to the source artefact so the ledger stays auditable.</li><li>Distinguish transient indicators (in-memory, session-scoped) from durable ones (on-disk, logged, registered) and flag the durable, high-fidelity ones as priority risk.</li><li>Cross-check against the defender's known collection to see which emitted indicators are actually within their reach.</li><li>Maintain the ledger as a living artifact; update it every time a new tool, host, or channel is introduced.</li><li>If a specialised triage helper (e.g. <code>KAPE</code>-style timelining, JA3/JARM extractor, prefetch parser) is unavailable, fall back to manual <code>grep</code>-driven reads of the raw exports; if the operational logs themselves were never collected, flag the gap and mark the ledger incomplete rather than infer emissions from memory.</li></ul>","n":1832},{"t":"Signals / outputs","h":"<ul class=\"ml\"><li>A layered indicator ledger with fidelity/persistence/observability per item.</li><li>A prioritized list of durable, attributable artifacts requiring cleanup or avoidance.</li><li>Inputs for Overwatch (what to watch for on the blue side) and for exit/cleanup planning.</li></ul>","n":257}],"summary":"Systematically enumerate the indicators the operation itself generates across every layer, producing the attacker's-eye inventory of \"what we leave behind\" that feeds evasion, Overwatc
