name: check

# The plugin trees under `plugins/` are generated build output that is
# committed, because a marketplace install clones this repository and performs
# no build on the installing machine. Committed generated output drifts unless
# something regenerates and compares it, so this workflow is the gate the
# `plugin-packaging` capability names. It fails on drift rather than
# auto-committing a rebuild: the generated diff is part of the reviewed change,
# and a bad source edit should show up as a visible blast radius.

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `tools/build-plugins.py` is a uv script — its shebang resolves its own
      # pinned interpreter and dependencies from the inline metadata block, so
      # there is no requirements file to install.
      - uses: astral-sh/setup-uv@v5

      - name: Plugin trees match their sources
        run: tools/build-plugins.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Specs validate
        run: npx -y @fission-ai/openspec@1 validate --all --strict

      # The three shell files carry the whole opencode install path and have no
      # tests. Linting them is the only automated check they get.
      - name: Shell lint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x install.sh uninstall.sh tools/*.sh
