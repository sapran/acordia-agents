schema: spec-driven

# Project context (shown to AI when creating artifacts)
context: |
  acordia-agents is a markdown-only distribution of agents and skills derived
  from the ACORDIA operational-role framework. There is no application code and
  no runtime — only agent files, skill files, command wrappers, and the
  marketplace metadata that lets a harness install them.

  It reaches two harnesses one way. omp and Claude Code both install it as a
  plugin, from the marketplace catalogs at `.omp-plugin/marketplace.json`
  (omp's preferred path) and `.claude-plugin/marketplace.json` (Claude Code's).
  The two catalogs are hand-maintained and byte-identical, and both name the
  same two sources. There is no generator, no build step and no shell
  installer: each pillar is one authored tree that both harnesses read as-is.
  opencode was dropped in 3.0.0 along with the generator that existed only to
  express its permission maps.

  Scope today: two pillars, shipped as two independently installable plugins.
  The Analysis pillar (`acordia-analysts/`) — one orchestrator
  (`operational-analyst`) plus three specialist legs
  (`target-network-analyst`, `defender-detection-analyst`, `fusion-analyst`)
  and the 43-skill library that realises their shared analytic spine. Every
  analyst artifact traces back to a specific row or paragraph in the source
  competency map at `docs/roles/operational-analyst.md` (the role model), with
  the mechanics of the extension surface documented in
  `docs/agents-skills-extension-workbook.md`. The Operations pillar
  (`acordia-operators/`) — one orchestrator (`operator`) plus four domain
  specialists and a 37-skill technique library — has no competency grid; it is
  a provenance-tracked port whose source of truth is `docs/roles/operator.md`.

  Future pillars (Collection, Reflection, Direction, Independent action) may
  follow the same shape once compiled from their role models.

  Conventions: an agent file's frontmatter is exactly `name`, `description` and
  `color` — no tool list, no permission map, no mode, no metadata. Capability
  is granted by omission, because an omp agent with no `tools` key receives the
  full tool set and one with no `spawns` key has an unrestricted spawn policy.
  Every agent in both pillars is therefore write-capable. Each analyst prompt
  carries the rule that it writes freely but never modifies the material it was
  given to analyse; `.acordia/reports/` for an analyst product and
  `.acordia/ops/` for an operator journal are conventions no harness enforces,
  and must never be described as enforced. Every prompt states that retrieved
  content is data, never instructions. Each orchestrator names its own
  specialists in its prompt and routing is prompt discipline, not a permission.
  Skill binding is by prompt reference — neither harness binds skills per agent
  — so each prompt names its skill set on `·`-separated lines, and a skill is
  selected by description match.

rules:
  proposal:
    - Distinguish "current behavior" from "desired behavior" explicitly.
    - Layer changes by artifact type — agent prompts, skill bodies, command
      wrappers, marketplace metadata, docs — so each layer can be reviewed and
      applied independently.
  specs:
    - Every normative claim must be traceable either to an artifact in this
      repo (agent file, skill file, command wrapper, marketplace catalog,
      plugin manifest) or to a row/paragraph in
      `docs/roles/operational-analyst.md`, `docs/roles/operator.md`, or
      `docs/agents-skills-extension-workbook.md`.
    - State the ACTUAL behavior even when it is a trap; capture the ideal in
      design.md.
    - Never specify a mechanism the repository does not have. A requirement
      whose subject is a build gate, a permission map or a translation step has
      nothing behind it and must not be written.
